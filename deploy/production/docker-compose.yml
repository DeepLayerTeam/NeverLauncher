services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launcher}
      POSTGRES_USER: ${POSTGRES_USER:-launcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - launcher_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [launcher]

  redis:
    profiles: [network-ha]
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - launcher_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [launcher]

  api-volume-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /storage/current /backups /coordinator
        chown 10001:10001 /storage /storage/current /backups /coordinator
        chmod 0750 /storage /storage/current /backups /coordinator
    volumes:
      - launcher_storage:/storage
      - launcher_backups:/backups
      - launcher_coordinator:/coordinator
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      args:
        LAUNCHER_VERSION: ${LAUNCHER_IMAGE_TAG}
    image: launcher-api:${LAUNCHER_IMAGE_TAG:?LAUNCHER_IMAGE_TAG must be set}
    restart: unless-stopped
    depends_on:
      api-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      LAUNCHER_ENV: production
      LAUNCHER_HTTP_ADDR: :8080
      LAUNCHER_DEPLOYMENT_MODE: standard
      LAUNCHER_SINGLE_NODE_COORDINATOR_SQLITE_PATH: /var/lib/launcher/coordinator/state.db
      LAUNCHER_REPOSITORY_DRIVER: postgres
      LAUNCHER_SQL_DRIVER: pgx
      LAUNCHER_DATABASE_AUTO_MIGRATE: ${LAUNCHER_DATABASE_AUTO_MIGRATE:-true}
      LAUNCHER_BOOTSTRAP_TOKEN: ${LAUNCHER_BOOTSTRAP_TOKEN:-}
      LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: ${LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY:?LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY is required}
      LAUNCHER_RUNTIME_VALIDATION_KEYS_JSON: ${LAUNCHER_RUNTIME_VALIDATION_KEYS_JSON:-}
      LAUNCHER_SERVERBRIDGE_CONTROL_SIGNING_PRIVATE_KEY: ${LAUNCHER_SERVERBRIDGE_CONTROL_SIGNING_PRIVATE_KEY:-}
      LAUNCHER_SERVERBRIDGE_CONTROL_PREVIOUS_SIGNING_PRIVATE_KEY: ${LAUNCHER_SERVERBRIDGE_CONTROL_PREVIOUS_SIGNING_PRIVATE_KEY:-}
      LAUNCHER_DATABASE_DSN: postgres://${POSTGRES_USER:-launcher}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-launcher}?sslmode=disable
      LAUNCHER_STORAGE_DRIVER: local
      LAUNCHER_TEXTURE_FETCH_HOST_ALLOWLIST: ${LAUNCHER_TEXTURE_FETCH_HOST_ALLOWLIST:-}
      LAUNCHER_STORAGE_LOCAL_PATH: /var/lib/launcher/storage/current
      LAUNCHER_BACKUP_ROOT: /var/lib/launcher/backups
      LAUNCHER_REDIS_URL: ""  # Redis is not used in Standard
      LAUNCHER_SERVERBRIDGE_HA_REQUIRED: "false"
      LAUNCHER_REPLICA_ID: ${LAUNCHER_REPLICA_ID:-}
      LAUNCHER_RATE_LIMIT_ENABLED: "true"
      LAUNCHER_RATE_LIMIT_GLOBAL_PER_MINUTE: ${LAUNCHER_RATE_LIMIT_GLOBAL_PER_MINUTE:-1200}
      LAUNCHER_RATE_LIMIT_AUTH_PER_MINUTE: ${LAUNCHER_RATE_LIMIT_AUTH_PER_MINUTE:-20}
      LAUNCHER_RATE_LIMIT_SERVERBRIDGE_PER_MINUTE: ${LAUNCHER_RATE_LIMIT_SERVERBRIDGE_PER_MINUTE:-6000}
      LAUNCHER_RATE_LIMIT_FAIL_CLOSED: "true"
      LAUNCHER_TRUSTED_PROXY_CIDRS: 172.30.10.0/24
      LAUNCHER_PUBLIC_URL: ${LAUNCHER_PUBLIC_URL:?LAUNCHER_PUBLIC_URL is required}
      LAUNCHER_AUTH_TOKEN_SECRET: ${LAUNCHER_AUTH_TOKEN_SECRET:?LAUNCHER_AUTH_TOKEN_SECRET is required}
      LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: ${LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON:?LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON is required}
      LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: ${LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON:?LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON is required}
      LAUNCHER_AUTH_SQL_PROVIDERS_JSON: ${LAUNCHER_AUTH_SQL_PROVIDERS_JSON:-}
      LAUNCHER_AUTH_SQL_PROVIDERS_FILE: ${LAUNCHER_AUTH_SQL_PROVIDERS_FILE:-}
      LAUNCHER_AUTH_FILE_PROVIDERS_JSON: ${LAUNCHER_AUTH_FILE_PROVIDERS_JSON:-}
      LAUNCHER_AUTH_FILE_PROVIDERS_FILE: ${LAUNCHER_AUTH_FILE_PROVIDERS_FILE:-}
      LAUNCHER_AUTH_HTTP_PROVIDERS_JSON: ${LAUNCHER_AUTH_HTTP_PROVIDERS_JSON:-}
      LAUNCHER_AUTH_HTTP_PROVIDERS_FILE: ${LAUNCHER_AUTH_HTTP_PROVIDERS_FILE:-}
      WEBSITE_AUTH_HTTP_HMAC_SECRET: ${WEBSITE_AUTH_HTTP_HMAC_SECRET:-}
      LAUNCHER_AUTH_OIDC_PROVIDERS_JSON: ${LAUNCHER_AUTH_OIDC_PROVIDERS_JSON:-}
      LAUNCHER_AUTH_OIDC_PROVIDERS_FILE: ${LAUNCHER_AUTH_OIDC_PROVIDERS_FILE:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      LAUNCHER_AUTH_MICROSOFT_PROVIDERS_JSON: ${LAUNCHER_AUTH_MICROSOFT_PROVIDERS_JSON:-}
      LAUNCHER_AUTH_MICROSOFT_PROVIDERS_FILE: ${LAUNCHER_AUTH_MICROSOFT_PROVIDERS_FILE:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      LAUNCHER_WEBAUTHN_RP_ID: ${LAUNCHER_WEBAUTHN_RP_ID:?LAUNCHER_WEBAUTHN_RP_ID is required}
      LAUNCHER_WEBAUTHN_RP_NAME: ${LAUNCHER_WEBAUTHN_RP_NAME:-Launcher}
      LAUNCHER_WEBAUTHN_ORIGINS: ${LAUNCHER_WEBAUTHN_ORIGINS:?LAUNCHER_WEBAUTHN_ORIGINS is required}
      LAUNCHER_CORS_ALLOWED_ORIGINS: ${LAUNCHER_CORS_ALLOWED_ORIGINS:?LAUNCHER_CORS_ALLOWED_ORIGINS is required}
    volumes:
      - launcher_storage:/var/lib/launcher/storage
      - launcher_backups:/var/lib/launcher/backups
      - launcher_factory:/var/lib/launcher/factory
      - launcher_coordinator:/var/lib/launcher/coordinator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    networks: [launcher]

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        LAUNCHER_VERSION: ${LAUNCHER_IMAGE_TAG}
    image: launcher-admin:${LAUNCHER_IMAGE_TAG:?LAUNCHER_IMAGE_TAG must be set}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [launcher]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "${LAUNCHER_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - launcher_storage:/var/lib/launcher/storage:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [launcher]

volumes:
  launcher_postgres:
  launcher_redis:
  launcher_storage:
  launcher_backups:
  launcher_factory:
  launcher_coordinator:

networks:
  launcher:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
