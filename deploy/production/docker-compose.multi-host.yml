# NeverLauncher 0.51.2. Разверните ЭТОТ ЖЕ файл независимо на каждом хосте Docker.
# НЕ объединяйте его с docker-compose.yml: тот файл запускает однохостовые
# PostgreSQL/Redis и не подходит для многохостового оверлея. Отдельный внешний
# балансировщик нагрузки с проверкой здоровья ОБЯЗАТЕЛЬНО должен направлять HTTPS на
# оба входных хоста. Оба хоста ОБЯЗАТЕЛЬНО должны использовать общие независимо
# обслуживаемые PostgreSQL, Redis и S3.
name: ${LAUNCHER_COMPOSE_PROJECT:-launcher}

x-backend-env: &backend-env
  LAUNCHER_ENV: production
  LAUNCHER_HTTP_ADDR: ':8080'
  LAUNCHER_DEPLOYMENT_MODE: network-ha
  LAUNCHER_REPOSITORY_DRIVER: postgres
  LAUNCHER_SQL_DRIVER: pgx
  LAUNCHER_DATABASE_AUTO_MIGRATE: 'false'
  LAUNCHER_SINGLE_NODE_COORDINATOR_SQLITE_PATH: ''
  LAUNCHER_DATABASE_DSN: ${LAUNCHER_DATABASE_DSN:?External PostgreSQL DSN is required}
  LAUNCHER_REDIS_URL: ${LAUNCHER_REDIS_URL:?External Redis URL is required}
  LAUNCHER_SERVERBRIDGE_HA_REQUIRED: 'true'
  LAUNCHER_RATE_LIMIT_ENABLED: 'true'
  LAUNCHER_RATE_LIMIT_FAIL_CLOSED: 'true'
  LAUNCHER_RATE_LIMIT_GLOBAL_PER_MINUTE: ${LAUNCHER_RATE_LIMIT_GLOBAL_PER_MINUTE:-1200}
  LAUNCHER_RATE_LIMIT_AUTH_PER_MINUTE: ${LAUNCHER_RATE_LIMIT_AUTH_PER_MINUTE:-20}
  LAUNCHER_RATE_LIMIT_SERVERBRIDGE_PER_MINUTE: ${LAUNCHER_RATE_LIMIT_SERVERBRIDGE_PER_MINUTE:-6000}
  LAUNCHER_TRUSTED_PROXY_CIDRS: '172.30.10.0/24'
  LAUNCHER_STORAGE_DRIVER: s3
  LAUNCHER_STORAGE_S3_ENDPOINT: ${LAUNCHER_STORAGE_S3_ENDPOINT:?требуется адрес конечной точки S3}
  LAUNCHER_STORAGE_S3_BUCKET: ${LAUNCHER_STORAGE_S3_BUCKET:?требуется имя бакета S3}
  LAUNCHER_STORAGE_S3_REGION: ${LAUNCHER_STORAGE_S3_REGION:?требуется регион S3}
  LAUNCHER_STORAGE_S3_ACCESS_KEY: ${LAUNCHER_STORAGE_S3_ACCESS_KEY:?S3 access key required}
  LAUNCHER_STORAGE_S3_SECRET_KEY: ${LAUNCHER_STORAGE_S3_SECRET_KEY:?S3 secret key required}
  LAUNCHER_STORAGE_S3_PATH_STYLE: ${LAUNCHER_STORAGE_S3_PATH_STYLE:-true}
  LAUNCHER_STORAGE_DELIVERY_MODE: reverse-proxy
  LAUNCHER_STORAGE_LOCAL_PATH: /var/lib/launcher/storage/current
  LAUNCHER_BACKUP_ROOT: /var/lib/launcher/backups
  LAUNCHER_EXTENSION_ROOT: /var/lib/launcher/extensions
  LAUNCHER_EXTENSION_BACKUP_RETENTION: ${LAUNCHER_EXTENSION_BACKUP_RETENTION:-10}
  LAUNCHER_PUBLIC_URL: ${LAUNCHER_PUBLIC_URL:?требуется публичный URL внешнего балансировщика нагрузки}
  LAUNCHER_AUTH_TOKEN_SECRET: ${LAUNCHER_AUTH_TOKEN_SECRET:?требуется общий секрет аутентификации}
  LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: ${LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY:?Signing key required}
  LAUNCHER_RUNTIME_VALIDATION_KEYS_JSON: ${LAUNCHER_RUNTIME_VALIDATION_KEYS_JSON:-}
  LAUNCHER_SERVERBRIDGE_CONTROL_SIGNING_PRIVATE_KEY: ${LAUNCHER_SERVERBRIDGE_CONTROL_SIGNING_PRIVATE_KEY:-}
  LAUNCHER_SERVERBRIDGE_CONTROL_PREVIOUS_SIGNING_PRIVATE_KEY: ${LAUNCHER_SERVERBRIDGE_CONTROL_PREVIOUS_SIGNING_PRIVATE_KEY:-}
  LAUNCHER_BOOTSTRAP_TOKEN: ${LAUNCHER_BOOTSTRAP_TOKEN:-}
  LAUNCHER_EXTENSION_SECRETS_KEY: ${LAUNCHER_EXTENSION_SECRETS_KEY:-}
  LAUNCHER_EXTENSION_EVENTS_ENABLED: ${LAUNCHER_EXTENSION_EVENTS_ENABLED:-true}
  LAUNCHER_EXTENSION_EVENTS_WORKER_INTERVAL_MS: ${LAUNCHER_EXTENSION_EVENTS_WORKER_INTERVAL_MS:-250}
  LAUNCHER_EXTENSION_EVENTS_LEASE_SECONDS: ${LAUNCHER_EXTENSION_EVENTS_LEASE_SECONDS:-30}
  LAUNCHER_EXTENSION_EVENTS_BATCH_SIZE: ${LAUNCHER_EXTENSION_EVENTS_BATCH_SIZE:-32}
  LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: ${LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON:?требуется список разрешённых выпусков Guard}
  LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: ${LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON:?требуется список разрешённых выпусков Bridge}
  LAUNCHER_TEXTURE_FETCH_HOST_ALLOWLIST: ${LAUNCHER_TEXTURE_FETCH_HOST_ALLOWLIST:-}
  LAUNCHER_AUTH_SQL_PROVIDERS_JSON: ${LAUNCHER_AUTH_SQL_PROVIDERS_JSON:-}
  LAUNCHER_AUTH_SQL_PROVIDERS_FILE: ${LAUNCHER_AUTH_SQL_PROVIDERS_FILE:-}
  LAUNCHER_AUTH_FILE_PROVIDERS_JSON: ${LAUNCHER_AUTH_FILE_PROVIDERS_JSON:-}
  LAUNCHER_AUTH_FILE_PROVIDERS_FILE: ${LAUNCHER_AUTH_FILE_PROVIDERS_FILE:-}
  LAUNCHER_AUTH_HTTP_PROVIDERS_JSON: ${LAUNCHER_AUTH_HTTP_PROVIDERS_JSON:-}
  LAUNCHER_AUTH_HTTP_PROVIDERS_FILE: ${LAUNCHER_AUTH_HTTP_PROVIDERS_FILE:-}
  WEBSITE_AUTH_HTTP_HMAC_SECRET: ${WEBSITE_AUTH_HTTP_HMAC_SECRET:-}
  LAUNCHER_AUTH_OIDC_PROVIDERS_JSON: ${LAUNCHER_AUTH_OIDC_PROVIDERS_JSON:-}
  LAUNCHER_AUTH_OIDC_PROVIDERS_FILE: ${LAUNCHER_AUTH_OIDC_PROVIDERS_FILE:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  LAUNCHER_AUTH_MICROSOFT_PROVIDERS_JSON: ${LAUNCHER_AUTH_MICROSOFT_PROVIDERS_JSON:-}
  LAUNCHER_AUTH_MICROSOFT_PROVIDERS_FILE: ${LAUNCHER_AUTH_MICROSOFT_PROVIDERS_FILE:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  LAUNCHER_WEBAUTHN_RP_ID: ${LAUNCHER_WEBAUTHN_RP_ID:?WebAuthn RP ID required}
  LAUNCHER_WEBAUTHN_RP_NAME: ${LAUNCHER_WEBAUTHN_RP_NAME:-Launcher}
  LAUNCHER_WEBAUTHN_ORIGINS: ${LAUNCHER_WEBAUTHN_ORIGINS:?требуется список разрешённых источников WebAuthn}
  LAUNCHER_CORS_ALLOWED_ORIGINS: ${LAUNCHER_CORS_ALLOWED_ORIGINS:?требуется список разрешённых источников}

x-backend: &backend
  image: ${LAUNCHER_API_IMAGE:?требуется закреплённый OCI-образ API}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ready']
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 45s
  networks: [launcher]

services:
  volume-init:
    image: ${LAUNCHER_INIT_IMAGE:?требуется закреплённый OCI-образ инициализации}
    restart: 'no'
    user: '0:0'
    command: ['sh', '-ec', 'for d in /a/storage /a/storage/current /a/backups /a/factory /a/coordinator /a/extensions /b/storage /b/storage/current /b/backups /b/factory /b/coordinator /b/extensions; do mkdir -p "$$d"; chown 10001:10001 "$$d"; chmod 0750 "$$d"; done']
    volumes:
      - api_storage:/a/storage
      - api_backups:/a/backups
      - api_factory:/a/factory
      - api_coordinator:/a/coordinator
      - api_extensions:/a/extensions
      - worker_storage:/b/storage
      - worker_backups:/b/backups
      - worker_factory:/b/factory
      - worker_coordinator:/b/coordinator
      - worker_extensions:/b/extensions
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'FOWNER']
    security_opt: ['no-new-privileges:true']
    networks: [launcher]

  api:
    <<: *backend
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      LAUNCHER_PROCESS_ROLE: api
      LAUNCHER_REPLICA_ID: ${LAUNCHER_NODE_ID:?требуется уникальный идентификатор узла}-api
    volumes:
      - api_storage:/var/lib/launcher/storage
      - api_backups:/var/lib/launcher/backups
      - api_factory:/var/lib/launcher/factory
      - api_coordinator:/var/lib/launcher/coordinator
      - api_extensions:/var/lib/launcher/extensions

  worker:
    <<: *backend
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      LAUNCHER_PROCESS_ROLE: worker
      LAUNCHER_REPLICA_ID: ${LAUNCHER_NODE_ID:?требуется уникальный идентификатор узла}-worker
    volumes:
      - worker_storage:/var/lib/launcher/storage
      - worker_backups:/var/lib/launcher/backups
      - worker_factory:/var/lib/launcher/factory
      - worker_coordinator:/var/lib/launcher/coordinator
      - worker_extensions:/var/lib/launcher/extensions

  admin:
    image: ${LAUNCHER_ADMIN_IMAGE:?требуется закреплённый OCI-образ Admin}
    restart: unless-stopped
    read_only: true
    tmpfs: ['/var/cache/nginx', '/var/run', '/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [launcher]

  ingress:
    image: ${LAUNCHER_NGINX_IMAGE:?требуется закреплённый OCI-образ Nginx}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - '${LAUNCHER_INGRESS_BIND_IP:?требуется явно указанный адрес входящего интерфейса}:443:443'
    volumes:
      - ./nginx.multi-host-0512.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LAUNCHER_TLS_CERT_PATH:?требуется путь к сертификату TLS}:/etc/launcher/tls/fullchain.pem:ro
      - ${LAUNCHER_TLS_KEY_PATH:?требуется путь к закрытому ключу TLS}:/etc/launcher/tls/privkey.pem:ro
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    read_only: true
    tmpfs: ['/var/cache/nginx', '/var/run', '/tmp']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [launcher]

volumes:
  api_storage:
  api_backups:
  api_factory:
  api_coordinator:
  api_extensions:
  worker_storage:
  worker_backups:
  worker_factory:
  worker_coordinator:
  worker_extensions:

networks:
  launcher:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
