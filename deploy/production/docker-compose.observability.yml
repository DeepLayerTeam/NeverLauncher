# Мониторинг только для оператора. Все порты остаются в частной сети лаунчера. Создайте
# alertmanager.json командой scripts/operations/observability.py configure.
services:
  monitor-volume-init:
    image: alpine:3.20
    user: '0:0'
    restart: 'no'
    command: ['sh', '-ec', 'chown 65534:65534 /prometheus /alertmanager']
    volumes:
      - launcher_prometheus:/prometheus
      - launcher_alertmanager:/alertmanager
    security_opt: ['no-new-privileges:true']
  prometheus:
    depends_on:
      monitor-volume-init:
        condition: service_completed_successfully
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    user: '65534:65534'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle=false
    volumes:
      - ${LAUNCHER_PROMETHEUS_CONFIG:-./monitoring/prometheus-standard.yml}:/etc/prometheus/prometheus.yml:ro
      - ${LAUNCHER_PROMETHEUS_ALERT_RULES:-./monitoring/alerts.yml}:/etc/prometheus/alerts.yml:ro
      - launcher_prometheus:/prometheus
    security_opt: ['no-new-privileges:true']
    networks: [launcher]
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    user: '65534:65534'
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    security_opt: ['no-new-privileges:true']
    networks: [launcher]
  alertmanager:
    depends_on:
      monitor-volume-init:
        condition: service_completed_successfully
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    user: '65534:${LAUNCHER_MONITOR_GID:-65534}'
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${LAUNCHER_ALERTMANAGER_CONFIG:?перед запуском создайте закрытый файл конфигурации Alertmanager}:/etc/alertmanager/alertmanager.yml:ro
      - launcher_alertmanager:/alertmanager
    security_opt: ['no-new-privileges:true']
    networks: [launcher]
volumes:
  launcher_prometheus:
  launcher_alertmanager:
