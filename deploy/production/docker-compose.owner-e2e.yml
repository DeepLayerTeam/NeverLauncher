# Включается промышленным CLI развёртывания только при наличии изолированного
# пространства приёмки и всех трёх внешних закрытых файлов. Владение
# монтированиями Docker: Backend работает с uid=10001 и ОБЯЗАТЕЛЬНО должен
# читать доверенные файлы с правами 0600. Не подходит как универсальное
# переопределение для промышленной среды.
services:
  api:
    environment:
      LAUNCHER_SERVER_BRIDGE_HOST_TARGETS_FILE: /run/owner0523/targets.json
    volumes:
      - ${LAUNCHER_0523_HOST_TARGETS_FILE:?}:/run/owner0523/targets.json:ro
      - ${LAUNCHER_0523_HOST_CA_FILE:?}:/run/owner0523/ca.pem:ro
      - ${LAUNCHER_0523_HOST_TOKEN_FILE:?}:/run/owner0523/token:ro
