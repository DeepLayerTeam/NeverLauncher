# ТОЛЬКО для изолированных лабораторных проектов nl-dr-*. Никогда не применяйте это
# переопределение в промышленной среде. Запускайте с существующим оверлеем Compose
# Network-HA и действительными изолированными секретами.
services:
  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LAUNCHER_STORAGE_S3_ACCESS_KEY:?isolated S3 lab access key}
      MINIO_ROOT_PASSWORD: ${LAUNCHER_STORAGE_S3_SECRET_KEY:?isolated S3 lab secret key}
    ports:
      - '127.0.0.1:${LAUNCHER_CHAOS_S3_PORT:-19000}:9000'
    volumes:
      - chaos_s3_data:/data
    networks: [launcher]
  nginx:
    # Конструкция !override в Compose 2.24.4+ полностью заменяет публичные
    # привязки портов 80/443. К лабораторной точке входа можно обращаться только
    # с этого хоста.
    ports: !override
      - '127.0.0.1:${LAUNCHER_CHAOS_HTTPS_PORT:-18443}:443'
  api:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
  api-b:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
  worker-a:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
  worker-b:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
volumes:
  chaos_s3_data:
