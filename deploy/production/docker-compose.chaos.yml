# ONLY for isolated nl-dr-* lab projects. Never attach this override to production.
# Bring up with the existing Network-HA Compose overlay and valid isolated secrets.
services:
  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LAUNCHER_STORAGE_S3_ACCESS_KEY:?isolated S3 lab access key}
      MINIO_ROOT_PASSWORD: ${LAUNCHER_STORAGE_S3_SECRET_KEY:?isolated S3 lab secret key}
    ports:
      - '127.0.0.1:${LAUNCHER_CHAOS_S3_PORT:-19000}:9000'
    volumes:
      - chaos_s3_data:/data
    networks: [launcher]
  nginx:
    # Compose 2.24.4+ !override replaces public 80/443 bindings entirely.
    # Lab ingress may only be accessed from this host.
    ports: !override
      - '127.0.0.1:${LAUNCHER_CHAOS_HTTPS_PORT:-18443}:443'
  api:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
  api-b:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
  worker-a:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
  worker-b:
    environment:
      LAUNCHER_STORAGE_S3_ENDPOINT: http://s3:9000
volumes:
  chaos_s3_data:
