# 0.45.9: metadata-only structured access logs (no URL, IP, token or query).
log_format launcher_json escape=json '{"timestamp":"$time_iso8601","event":"reverse_proxy_request","request_id":"$request_id","backend_correlation_id":"$upstream_http_x_correlation_id","method":"$request_method","status":$status,"request_time":$request_time,"upstream_status":"$upstream_status"}';
access_log /dev/stdout launcher_json;

# Nginx 1.27.3+ dynamic name resolution, Docker Compose service discovery.
# Note: backend requests that may have committed are never blindly replayed.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream launcher_ha_api {
    zone launcher_ha_api 64k;
    least_conn;
    server api:8080 resolve max_fails=1 fail_timeout=5s;
    server api-b:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}
server {
    listen 80;
    server_name _;
    location = /health { allow 127.0.0.1; deny all; proxy_pass http://launcher_ha_api/health; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_certificate /etc/launcher/tls/fullchain.pem;
    ssl_certificate_key /etc/launcher/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 2048m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /health {
        proxy_pass http://launcher_ha_api;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /ready {
        proxy_pass http://launcher_ha_api;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_pass http://launcher_ha_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        # Nginx does not retry POST/PATCH/PUT when they may have committed.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    # HA uses S3 through the authenticated API; never expose a node-local
    # volume that may differ between replicas.
    location /storage/ { return 404; }
    location / {
        proxy_pass http://admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
