# DEP09 Network/HA overlay. Invoke with docker compose --profile network-ha
# -f docker-compose.yml -f docker-compose.network-ha.yml. Do not scale `api` on
# one host without unique replica IDs and separate state directories.
services:
  api:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LAUNCHER_DEPLOYMENT_MODE: network-ha
      LAUNCHER_REDIS_URL: redis://:${REDIS_PASSWORD:?Redis password required}@redis:6379/0
      LAUNCHER_SINGLE_NODE_COORDINATOR_SQLITE_PATH: ""
      LAUNCHER_SERVERBRIDGE_HA_REQUIRED: "true"
      LAUNCHER_DATABASE_AUTO_MIGRATE: "false"
      LAUNCHER_STORAGE_DRIVER: s3
      LAUNCHER_STORAGE_S3_ENDPOINT: ${LAUNCHER_STORAGE_S3_ENDPOINT:?S3 endpoint required}
      LAUNCHER_STORAGE_S3_BUCKET: ${LAUNCHER_STORAGE_S3_BUCKET:?S3 bucket required}
      LAUNCHER_STORAGE_S3_REGION: ${LAUNCHER_STORAGE_S3_REGION:?S3 region required}
      LAUNCHER_STORAGE_S3_ACCESS_KEY: ${LAUNCHER_STORAGE_S3_ACCESS_KEY:?S3 key required}
      LAUNCHER_STORAGE_S3_SECRET_KEY: ${LAUNCHER_STORAGE_S3_SECRET_KEY:?S3 secret required}
      LAUNCHER_STORAGE_S3_PATH_STYLE: ${LAUNCHER_STORAGE_S3_PATH_STYLE:-true}
      LAUNCHER_REPLICA_ID: ${LAUNCHER_REPLICA_ID:?Stable distinct replica ID required}
