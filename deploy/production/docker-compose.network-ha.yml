# 0.45.5: two independently addressed APIs and two independent durable workers.
# Apply with: docker compose -f docker-compose.yml -f docker-compose.network-ha.yml --profile network-ha up -d --build
# PostgreSQL, Redis and S3 MUST be durable services, independently backed up.
services:
  ha-volume-init:
    image: alpine:3.20
    restart: 'no'
    user: '0:0'
    command: ['sh', '-ec', 'for d in /a/storage /a/backups /a/factory /a/coordinator /b/storage /b/backups /b/factory /b/coordinator /c/storage /c/backups /c/factory /c/coordinator /d/storage /d/backups /d/factory /d/coordinator; do mkdir -p "$$d"; chown 10001:10001 "$$d"; chmod 0750 "$$d"; done']
    volumes:
      - ha_a_storage:/a/storage
      - ha_a_backups:/a/backups
      - ha_a_factory:/a/factory
      - ha_a_coordinator:/a/coordinator
      - ha_b_storage:/b/storage
      - ha_b_backups:/b/backups
      - ha_b_factory:/b/factory
      - ha_b_coordinator:/b/coordinator
      - ha_c_storage:/c/storage
      - ha_c_backups:/c/backups
      - ha_c_factory:/c/factory
      - ha_c_coordinator:/c/coordinator
      - ha_d_storage:/d/storage
      - ha_d_backups:/d/backups
      - ha_d_factory:/d/factory
      - ha_d_coordinator:/d/coordinator
    security_opt: ['no-new-privileges:true']
    networks: [launcher]

  api:
    depends_on:
      redis:
        condition: service_healthy
      ha-volume-init:
        condition: service_completed_successfully
    environment:
      LAUNCHER_DEPLOYMENT_MODE: network-ha
      LAUNCHER_PROCESS_ROLE: api
      LAUNCHER_REPLICA_ID: api-a
      LAUNCHER_REDIS_URL: redis://:${REDIS_PASSWORD:?Redis password required}@redis:6379/0
      LAUNCHER_SINGLE_NODE_COORDINATOR_SQLITE_PATH: ''
      LAUNCHER_SERVERBRIDGE_HA_REQUIRED: 'true'
      LAUNCHER_DATABASE_AUTO_MIGRATE: 'false'
      LAUNCHER_STORAGE_DRIVER: s3
      LAUNCHER_STORAGE_S3_ENDPOINT: ${LAUNCHER_STORAGE_S3_ENDPOINT:?S3 endpoint required}
      LAUNCHER_STORAGE_S3_BUCKET: ${LAUNCHER_STORAGE_S3_BUCKET:?S3 bucket required}
      LAUNCHER_STORAGE_S3_REGION: ${LAUNCHER_STORAGE_S3_REGION:?S3 region required}
      LAUNCHER_STORAGE_S3_ACCESS_KEY: ${LAUNCHER_STORAGE_S3_ACCESS_KEY:?S3 key required}
      LAUNCHER_STORAGE_S3_SECRET_KEY: ${LAUNCHER_STORAGE_S3_SECRET_KEY:?S3 secret required}
      LAUNCHER_STORAGE_S3_PATH_STYLE: ${LAUNCHER_STORAGE_S3_PATH_STYLE:-true}
      LAUNCHER_STORAGE_DELIVERY_MODE: reverse-proxy
    volumes:
      - ha_a_storage:/var/lib/launcher/storage
      - ha_a_backups:/var/lib/launcher/backups
      - ha_a_factory:/var/lib/launcher/factory
      - ha_a_coordinator:/var/lib/launcher/coordinator

  api-b:
    extends:
      service: api
    environment:
      LAUNCHER_REPLICA_ID: api-b
    volumes:
      - ha_b_storage:/var/lib/launcher/storage
      - ha_b_backups:/var/lib/launcher/backups
      - ha_b_factory:/var/lib/launcher/factory
      - ha_b_coordinator:/var/lib/launcher/coordinator

  worker-a:
    extends:
      service: api
    environment:
      LAUNCHER_PROCESS_ROLE: worker
      LAUNCHER_REPLICA_ID: worker-a
    volumes:
      - ha_c_storage:/var/lib/launcher/storage
      - ha_c_backups:/var/lib/launcher/backups
      - ha_c_factory:/var/lib/launcher/factory
      - ha_c_coordinator:/var/lib/launcher/coordinator

  worker-b:
    extends:
      service: api
    environment:
      LAUNCHER_PROCESS_ROLE: worker
      LAUNCHER_REPLICA_ID: worker-b
    volumes:
      - ha_d_storage:/var/lib/launcher/storage
      - ha_d_backups:/var/lib/launcher/backups
      - ha_d_factory:/var/lib/launcher/factory
      - ha_d_coordinator:/var/lib/launcher/coordinator

  nginx:
    # 1.28 stable includes upstream dynamic DNS resolution (introduced 1.27.3).
    image: nginx:1.28-alpine
    # The HA-only config resolves both A records through Docker DNS and
    # retries only safe/non-idempotent-uncommitted requests.
    volumes:
      - ./nginx.network-ha.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ha_a_storage:
  ha_a_backups:
  ha_a_factory:
  ha_a_coordinator:
  ha_b_storage:
  ha_b_backups:
  ha_b_factory:
  ha_b_coordinator:
  ha_c_storage:
  ha_c_backups:
  ha_c_factory:
  ha_c_coordinator:
  ha_d_storage:
  ha_d_backups:
  ha_d_factory:
  ha_d_coordinator:
