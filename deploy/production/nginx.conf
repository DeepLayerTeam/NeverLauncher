# 0.45.9: metadata-only structured access logs (no URL, IP, token or query).
log_format launcher_json escape=json '{"timestamp":"$time_iso8601","event":"reverse_proxy_request","request_id":"$request_id","backend_correlation_id":"$upstream_http_x_correlation_id","method":"$request_method","status":$status,"request_time":$request_time,"upstream_status":"$upstream_status"}';
access_log /dev/stdout launcher_json;

# Plain HTTP only provides the container-local health probe; all public traffic is HTTPS.
server {
    listen 80;
    server_name _;
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api:8080/health;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_certificate /etc/launcher/tls/fullchain.pem;
    ssl_certificate_key /etc/launcher/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 2048m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ready {
        proxy_pass http://api:8080/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /storage/ {
        alias /var/lib/launcher/storage/current/;
        add_header X-Launcher-Storage local always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
