# Для каждого независимого Docker-хоста используется отдельная точка входа. ВНЕШНИЙ балансировщик L7
# распределяет клиентский TLS-трафик между хостами; прямое обращение к подсети соседнего Docker-хоста не допускается.
log_format launcher_json escape=json '{"timestamp":"$time_iso8601","event":"reverse_proxy_request","request_id":"$request_id","method":"$request_method","status":$status,"request_time":$request_time,"upstream_status":"$upstream_status"}';
access_log /dev/stdout launcher_json;
server {
    listen 8080;
    server_name _;
    location = /health { access_log off; allow 127.0.0.1; deny all; return 200 'alive\n'; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $api_backend http://api:8080;
    set $admin_backend http://admin:8080;
    ssl_certificate /etc/launcher/tls/fullchain.pem;
    ssl_certificate_key /etc/launcher/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    client_max_body_size 2048m;
    # /ready ОБЯЗАН учитывать локальный API этого хоста и общие зависимости,
    # а не только состояние процессов Nginx или Admin.
    location = /ready {
        proxy_pass $api_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
        proxy_set_header Host $host;
    }
    location = /health {
        proxy_pass $api_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_next_upstream off;
    }
    # Объекты выдаёт общий API с хранилищем S3; нереплицируемые файлы из /storage не используются.
    location /storage/ { return 404; }
    location / {
        proxy_pass $admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
