name: Idea / architectural proposal
description: Discuss an improvement before opening an implementation issue
labels: [idea]
body:
  - type: textarea
    id: context
    attributes:
      label: Problem and affected users
      description: Explain the scenario and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include trade-offs and possible alternatives.
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: Compatibility, security, and operations impact
      description: Platforms, API, Minecraft version, migrations and release evidence.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References or prototype
      description: Public links only; never share access tokens or personal data.
    validations:
      required: false
