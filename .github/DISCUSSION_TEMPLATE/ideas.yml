name: Идея или архитектурное предложение
description: Обсудите улучшение до создания задачи на реализацию
labels: [idea]
body:
  - type: textarea
    id: context
    attributes:
      label: Проблема и затронутые пользователи
      description: Опишите сценарий использования и текущее ограничение.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемый подход
      description: Укажите преимущества, недостатки и возможные альтернативы.
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: Влияние на совместимость, безопасность и эксплуатацию
      description: Учтите ОС, API, версии Minecraft, миграции и подтверждение готовности релиза.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Ссылки и прототипы
      description: Приводите только общедоступные ссылки. Не публикуйте токены доступа и персональные данные.
    validations:
      required: false
