name: Предложение новой возможности
description: Предложите новую функцию или улучшение существующей
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему пользователя и проверяемые критерии готовности.
        Ознакомьтесь с [дорожной картой](https://github.com/DeepLayerTeam/NeverLauncher/blob/main/ROADMAP.md). Она не устанавливает обязательных сроков выпуска.
  - type: dropdown
    id: area
    attributes:
      label: Область продукта
      options:
        - Серверный API
        - Панель администрирования
        - Настольный лаунчер
        - Совместимость Minecraft / NeverRuntime
        - Guard / безопасность
        - ServerBridge
        - Extensions / SDK
        - Установщик / CLI / выпуск релиза
        - Документация / инструменты разработчика
        - Другое
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Проблема и сценарий использования
      description: Кому поможет изменение, в каком сценарии и чего сейчас не хватает?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
      description: Опишите процесс использования или интерфейс, а не только название функции.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Критерии готовности
      placeholder: |
        - [ ] Описан и проверен сквозной пользовательский сценарий ...
        - [ ] Добавлены регрессионные тесты для затронутых платформ ...
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Совместимость, безопасность и миграции
      description: Укажите влияние на платформы, загрузчики Minecraft, API, разрешения и обратную совместимость.
    validations:
      required: false
