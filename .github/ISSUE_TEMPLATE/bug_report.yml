name: Сообщение об ошибке
description: Сообщите о воспроизводимой ошибке в NeverLauncher
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Перед отправкой ознакомьтесь с [руководством по диагностике](https://github.com/DeepLayerTeam/NeverLauncher/blob/main/docs/troubleshooting/common.md) и проверьте существующие задачи.
        **Не публикуйте пароли, закрытые ключи, токены доступа, персональные данные и подробности эксплуатации уязвимостей.**
        Об уязвимостях сообщайте конфиденциально согласно [политике безопасности](https://github.com/DeepLayerTeam/NeverLauncher/blob/main/SECURITY.md).
  - type: input
    id: component
    attributes:
      label: Компонент
      description: 'Например: Backend, Admin, Desktop, CLI, NeverRuntime, NeverGuard, ServerBridge, NeverExtensions или CI.'
      placeholder: 'Например: NeverRuntime / Fabric'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия и хеш коммита
      placeholder: 'Например: 0.21.5 / полный SHA коммита'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: 'Например: Windows 11 x64, Java 21, Fabric 1.20.1'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги для воспроизведения
      description: Укажите минимальную последовательность действий без секретных данных.
      placeholder: |
        1. Настроить ...
        2. Выполнить ...
        3. Проверить результат ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Обезличенные логи и ссылки на CI
      description: Удалите токены, адреса электронной почты, имена хостов, идентификаторы пользователей и закрытые настройки.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В сообщении нет секретов и сведений о нераскрытой уязвимости.
          required: true
        - label: Я проверил существующие задачи и документацию.
          required: true
