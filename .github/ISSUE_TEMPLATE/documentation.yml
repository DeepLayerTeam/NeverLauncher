name: Ошибка в документации
description: Сообщите о неточной, отсутствующей или устаревшей документации
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Документ или ссылка
      placeholder: 'Например: docs/getting-started/production.md'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что неверно или отсутствует?
      description: Опишите расхождение и укажите версию либо коммит, в котором оно обнаружено.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Предлагаемое исправление
      description: По возможности приведите проверенные команды или ссылки на исходный код.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Подтверждение
      options:
        - label: Я не включил учётные данные и конфиденциальную информацию.
          required: true
