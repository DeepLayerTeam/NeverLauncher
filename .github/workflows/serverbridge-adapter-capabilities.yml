name: ServerBridge 0.28.6 — возможности адаптеров
on:
  push:
    paths:
      - 'plugins/**'
      - 'services/api/internal/httpapi/server_bridge_adapter_capabilities*.go'
      - 'services/api/internal/httpapi/server_bridge_runtime.go'
      - 'services/api/internal/httpapi/server_bridge_control.go'
      - 'services/api/internal/httpapi/server_bridge_ga.go'
      - 'apps/admin/src/api/serverbridge.ts'
      - 'apps/admin/src/admin/ServerBridgeWorkspace.tsx'
      - 'apps/admin/tests/serverbridge-operations.test.mjs'
      - 'e2e/java/ru/launcher/bridge/common/ServerBridgeAdapterCapability0286Harness.java'
      - 'e2e/scripts/run-serverbridge-adapter-capabilities.sh'
      - 'serverbridge/certify_release.py'
      - '.github/workflows/serverbridge-adapter-capabilities.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'services/api/internal/httpapi/server_bridge_adapter_capabilities*.go'
      - 'services/api/internal/httpapi/server_bridge_runtime.go'
      - 'services/api/internal/httpapi/server_bridge_control.go'
      - 'services/api/internal/httpapi/server_bridge_ga.go'
      - 'apps/admin/src/api/serverbridge.ts'
      - 'apps/admin/src/admin/ServerBridgeWorkspace.tsx'
      - 'e2e/java/ru/launcher/bridge/common/ServerBridgeAdapterCapability0286Harness.java'
      - 'e2e/scripts/run-serverbridge-adapter-capabilities.sh'
      - '.github/workflows/serverbridge-adapter-capabilities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enforce-capabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить промышленные исходники Java и политики 14 адаптеров
        run: bash e2e/scripts/run-serverbridge-adapter-capabilities.sh
      - name: "Регрессионные проверки безопасности протокола Java v3 (без запуска Minecraft)"
        run: bash e2e/scripts/run-serverbridge-security-certification-e2e.sh
      - name: Проверить возможности и Runtime на Go
        working-directory: services/api
        run: go test ./internal/httpapi -run 'TestAdapter|TestServerBridgeRuntimeIdentity0192|TestServerBridgeControl' -count=1 -timeout=5m
      - name: Проверить ограничения оператора JavaScript
        working-directory: apps/admin
        run: npm test
