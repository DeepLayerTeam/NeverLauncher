name: Game World Backup 0.41.10
on:
  push:
    paths:
      - 'cli/**'
      - 'scripts/test/world-backup-host-e2e-02810.py'
      - 'scripts/test/world-backup-real-java-04110.py'
      - '.github/workflows/game-world-backup-02810.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'scripts/test/world-backup-host-e2e-02810.py'
      - 'scripts/test/world-backup-real-java-04110.py'
      - '.github/workflows/game-world-backup-02810.yml'
jobs:
  backup-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host supervisor and backup regression tests
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestWorldBackup|TestServerBridgeHostStopSupervisedProcess01910' -count=1
      - name: Build and exercise actual Host CLI
        working-directory: cli
        run: |
          go build -o "$RUNNER_TEMP/nl" ./cmd/launcher
          python3 ../scripts/test/world-backup-host-e2e-02810.py --cli "$RUNNER_TEMP/nl"
          python3 ../scripts/test/world-backup-real-java-04110.py --cli "$RUNNER_TEMP/nl"
  backup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Cross-platform backup tests
        working-directory: cli
        run: go test ./cmd/launcher -run TestWorldBackup -count=1
