name: Migration Center 0.45.0 — приёмка миграции GA

on:
  pull_request:
    paths:
      - 'tools/migration-ga/**'
      - 'services/api/internal/gravitreport/**'
      - 'services/api/internal/gravitplan/**'
      - 'services/api/internal/dbmigrate/sql/0114*'
      - 'services/api/internal/repository/migration_*'
      - 'services/api/internal/httpapi/migration_*'
      - 'services/api/internal/dbmigrate/sql/00[89]*'
      - 'services/api/internal/dbmigrate/sql/010*'
      - 'apps/admin/**'
      - 'apps/desktop/**'
      - '.github/workflows/gravit-migration-ga-0340.yml'
  push:
    tags: ['v0.45.0', '0.45.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U launcher_test -d launcher_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:test_only_not_production@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Полная сборка серверной части"
        working-directory: services/api
        run: go build ./...
      - name: "Запустить Go-тесты MIG01–MIG13, включая PostgreSQL"
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/gravitplan ./internal/gravitidentity ./internal/dbmigrate ./internal/migrationworkflow ./internal/gravitdetector ./internal/gravitinventory ./internal/gravitcredentials ./internal/gravitcontent ./internal/gravitmodules ./internal/gravitrehearsal ./internal/gravitcutover ./internal/gravitrollback ./internal/gravitreport
          go test -race -count=1 ./internal/repository -run '^TestMigration.*(Postgres|033|0442|0448)' 
          go test -run '^$' ./internal/httpapi
      - name: "Сборка и тесты CLI"
        working-directory: cli
        run: |
          go build ./cmd/launcher
          go test -race -count=1 ./cmd/launcher -run 'TestMigration.*(033|0447|0448)' 
      - name: "Схема, OpenAPI и версия"
        run: |
          python3 scripts/contracts/validate-openapi.py
          python3 scripts/version/manage.py check
      - name: Проверить исполняемый валидатор GA, подписи и защиту от подмены
        working-directory: tools/migration-ga
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build ./...

  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: "Тесты Admin и промышленная сборка"
        working-directory: apps/admin
        run: |
          npm ci
          npm test
          npm run build

  desktop:
    # Тестирование пакета и установки на всех поддерживаемых ОС отдельно от
    # подписанных проверок реального переноса пользователей, обязательных ниже.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: "Установить зависимости Tauri для Linux"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: "Промышленные ресурсы Desktop"
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: "Запустить тесты Rust и собрать Desktop"
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --locked
          cargo check --locked

  isolated-gravit-e2e:
    # Это задание НЕЛЬЗЯ заменять фикстурами, которые просто возвращают passed.
    # Реальные проекты Gravit 5.7.x, миры и серверы Minecraft, а также все три
    # платформы Desktop предоставляются изолированным агентом оператора.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [migrate-api, admin, desktop]
    runs-on: [self-hosted, linux, x64, migration-ga-isolated]
    environment: migration-ga-certification
    timeout-minutes: 180
    env:
      LAUNCHER_MIGRATION_GA_TOKEN: ${{ secrets.MIGRATION_GA_ADMIN_TOKEN }}
      MIGRATION_GA_FILEAUTH_PLAN_B64: ${{ secrets.MIGRATION_GA_FILEAUTH_PLAN_B64 }}
      MIGRATION_GA_SQL_PLAN_B64: ${{ secrets.MIGRATION_GA_SQL_PLAN_B64 }}
      MIGRATION_GA_NETWORK_PLAN_B64: ${{ secrets.MIGRATION_GA_NETWORK_PLAN_B64 }}
      MIGRATION_GA_EVIDENCE_ROOT: ${{ vars.MIGRATION_GA_EVIDENCE_ROOT }}
      MIGRATION_GA_SIGNING_KEY_B64: ${{ secrets.MIGRATION_GA_SIGNING_KEY_B64 }}
      MIGRATION_GA_TRUSTED_PUBLIC_KEY_B64: ${{ secrets.MIGRATION_GA_TRUSTED_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Требовать три изолированных эталонных проекта и защищённое хранилище свидетельств
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LAUNCHER_MIGRATION_GA_TOKEN"
          test -n "$MIGRATION_GA_FILEAUTH_PLAN_B64"
          test -n "$MIGRATION_GA_SQL_PLAN_B64"
          test -n "$MIGRATION_GA_NETWORK_PLAN_B64"
          test -n "$MIGRATION_GA_SIGNING_KEY_B64"
          test -n "$MIGRATION_GA_TRUSTED_PUBLIC_KEY_B64"
          test "${MIGRATION_GA_EVIDENCE_ROOT#/}" != "$MIGRATION_GA_EVIDENCE_ROOT"
          test -d "$MIGRATION_GA_EVIDENCE_ROOT"
          test "$(stat -c '%a' "$MIGRATION_GA_EVIDENCE_ROOT")" = 700
          umask 077
          mkdir -p "$RUNNER_TEMP/migration-ga"
          printf '%s' "$MIGRATION_GA_FILEAUTH_PLAN_B64" | base64 --decode > "$RUNNER_TEMP/migration-ga/fileauth-single.plan.json"
          printf '%s' "$MIGRATION_GA_SQL_PLAN_B64" | base64 --decode > "$RUNNER_TEMP/migration-ga/sql-modded.plan.json"
          printf '%s' "$MIGRATION_GA_NETWORK_PLAN_B64" | base64 --decode > "$RUNNER_TEMP/migration-ga/proxy-network.plan.json"
          printf '%s' "$MIGRATION_GA_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/migration-ga/signer.pem"
          printf '%s' "$MIGRATION_GA_TRUSTED_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/migration-ga/trusted.pem"
          # Свидетельства хранятся на защищённом собственном агенте и не
          # публикуются как потенциально открытый артефакт CI.
          base="$(mktemp -d "$MIGRATION_GA_EVIDENCE_ROOT/run-XXXXXXXX")"
          printf '%s\n' "$base" > "$RUNNER_TEMP/migration-ga/evidence-location"
      - name: Выполнить обязательные положительные и отрицательные сквозные проверки всех трёх классов
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat "$RUNNER_TEMP/migration-ga/evidence-location")"
          for kind in fileauth-single sql-modded proxy-network; do
            go -C tools/migration-ga run . manual-actions \
              --plan "$RUNNER_TEMP/migration-ga/$kind.plan.json" \
              --output "$base/$kind-manual-actions.md"
            go -C tools/migration-ga run . certify \
              --plan "$RUNNER_TEMP/migration-ga/$kind.plan.json" \
              --output "$base/$kind-certificate.json" \
              --evidence-dir "$base/$kind-evidence"
            go -C tools/migration-ga run . verify \
              --certificate "$base/$kind-certificate.json" \
              --public-key "$RUNNER_TEMP/migration-ga/trusted.pem" \
              --evidence-dir "$base/$kind-evidence"
          done
          go -C tools/migration-ga run . verify-cohort-live \
            --public-key "$RUNNER_TEMP/migration-ga/trusted.pem" \
            --fileauth-single-plan "$RUNNER_TEMP/migration-ga/fileauth-single.plan.json" \
            --sql-modded-plan "$RUNNER_TEMP/migration-ga/sql-modded.plan.json" \
            --proxy-network-plan "$RUNNER_TEMP/migration-ga/proxy-network.plan.json" \
            --fileauth-single "$base/fileauth-single-certificate.json" \
            --fileauth-single-evidence "$base/fileauth-single-evidence" \
            --sql-modded "$base/sql-modded-certificate.json" \
            --sql-modded-evidence "$base/sql-modded-evidence" \
            --proxy-network "$base/proxy-network-certificate.json" \
            --proxy-network-evidence "$base/proxy-network-evidence"
          cp "$base"/*-certificate.json "$RUNNER_TEMP/migration-ga/"
      - name: "Опубликовать только подписанные сводки сертификации (исходные свидетельства остаются закрытыми)"
        uses: actions/upload-artifact@v4
        with:
          name: migration-ga-0450-three-references
          path: ${{ runner.temp }}/migration-ga/*-certificate.json
          retention-days: 90
          if-no-files-found: error
      - name: "Удаление временного ключевого материала"
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/migration-ga/signer.pem" "$RUNNER_TEMP/migration-ga/"*.plan.json
          rm -f "$RUNNER_TEMP/migration-ga/evidence-location"
          # Закрытый архив свидетельств не удаляется автоматически — независимым
          # проверяющим нужны все квитанции и исходные результаты проверок.
