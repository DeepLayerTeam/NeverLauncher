name: macOS Production Delivery

on:
  workflow_call:
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64:
        required: true
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: true
      MACOS_DEVELOPER_ID_APPLICATION:
        required: true
      MACOS_TEAM_ID:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_PRIVATE_KEY_BASE64:
        required: true
      COMPONENT_SET_ED25519_SEED:
        required: true
      COMPONENT_SET_ED25519_PUBLIC_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  notarized-macos:
    name: Developer ID + notarized macOS x64/ARM64
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Validate required signing secrets
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in MACOS_DEVELOPER_ID_P12_BASE64 MACOS_DEVELOPER_ID_P12_PASSWORD MACOS_DEVELOPER_ID_APPLICATION MACOS_TEAM_ID APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_PRIVATE_KEY_BASE64; do
            test -n "${!name:-}" || { echo "missing required secret: ${name}" >&2; exit 2; }
          done

      - name: Import Developer ID certificate and configure notarytool
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/launcher-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/launcher-developer-id.p12"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/launcher-developer-id.p12" -k "$KEYCHAIN" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials launcher-ci-notary \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
          echo "LAUNCHER_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install component-set signing dependency
        run: python3 -m pip install 'cryptography>=43,<47'
      - name: Build, sign, notarize and staple x64 + ARM64 packages
        shell: bash
        env:
          LAUNCHER_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          LAUNCHER_MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          LAUNCHER_MACOS_NOTARY_PROFILE: launcher-ci-notary
          LAUNCHER_COMPONENT_SET_ED25519_SEED: ${{ secrets.COMPONENT_SET_ED25519_SEED }}
          LAUNCHER_COMPONENT_SET_ED25519_PUBLIC_KEY: ${{ secrets.COMPONENT_SET_ED25519_PUBLIC_KEY }}
        run: bash scripts/release/build-macos-production.sh

      - name: Verify production evidence and delivery binding
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          (cd cli && go build -trimpath -o /tmp/nl ./cmd/launcher)
          /tmp/nl delivery manifest --bundle "${DIR}" --version "${VERSION}"
          /tmp/nl delivery verify-macos --bundle "${DIR}" --version "${VERSION}" --production
          python3 scripts/release/secret-scan.py "${DIR}/launcher-desktop-${VERSION}-macos-x64.zip"
          python3 scripts/release/secret-scan.py "${DIR}/launcher-desktop-${VERSION}-macos-arm64.zip"

      - name: Remove imported signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/launcher-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${LAUNCHER_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$LAUNCHER_SIGNING_KEYCHAIN" || true
          fi

      - name: Upload notarized macOS delivery
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-notarized-${{ github.sha }}
          path: |
            dist/release-*/launcher-cli-macos-x64
            dist/release-*/launcher-cli-macos-arm64
            dist/release-*/launcher-desktop-macos-x64
            dist/release-*/launcher-desktop-macos-arm64
            dist/release-*/guard-macos-x64
            dist/release-*/guard-macos-arm64
            dist/release-*/runtime-macos-x64
            dist/release-*/runtime-macos-arm64
            dist/release-*/launcher-desktop-*-macos-x64.zip
            dist/release-*/launcher-desktop-*-macos-arm64.zip
            dist/release-*/MACOS_PACKAGE_MANIFEST_X64.json
            dist/release-*/MACOS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/MACOS_NOTARIZATION_EVIDENCE.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS_DELIVERY.json
            dist/release-*/DELIVERY_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
