name: Контракты безопасности

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-contracts:
    name: Проверка идентичности, аттестации и границ доверия ServerBridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Выполнить автономные регрессионные проверки границ доверия
        run: |
          python3 scripts/smoke/offline/device-key-storage.py
          python3 scripts/smoke/offline/hardware-bound-identity.py
          python3 scripts/smoke/offline/challenge-response-attestation.py
          python3 scripts/smoke/offline/serverbridge-crypto-node-identities-0142.py
          python3 scripts/smoke/offline/guard-integrity-evidence-0132.py
      - name: Проверить канонические контракты безопасности OpenAPI
        run: python3 scripts/contracts/validate-openapi.py
