name: Gravit Module & ServerWrapper Migration 0.33.8
on:
  push:
    paths:
      - 'services/api/internal/gravitmodules/**'
      - 'services/api/internal/repository/migration_modules_0338*'
      - 'services/api/internal/httpapi/migration_modules_0338*'
      - 'services/api/internal/dbmigrate/sql/0096*'
      - 'cli/cmd/neverlauncher/migration_modules_0338*'
      - 'apps/admin/src/admin/MigrationCenter0331.tsx'
      - 'schemas/openapi*'
      - '.github/workflows/gravit-modules-0338.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: neverlauncher_test
          POSTGRES_USER: neverlauncher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neverlauncher_test -d neverlauncher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEVERLAUNCHER_TEST_POSTGRES_DSN: postgres://neverlauncher_test:test_only_not_production@127.0.0.1:5432/neverlauncher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Full API compile and MIG08 race tests
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/gravitmodules
          go test -count=1 -timeout 5m ./internal/repository -run 'TestMigrationModuleReportImmutable0338'
          go test -count=1 ./internal/httpapi -run '^TestNonExistent$'
      - name: CLI migration tests
        working-directory: cli
        run: go test -count=1 ./cmd/neverlauncher -run 'TestMigrationModules0338|TestMigrationWorkflow0331'
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: |
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
          node --check services/api/internal/embeddedadmin/site/app.js
      - name: Build React Admin
        working-directory: apps/admin
        run: |
          npm ci --ignore-scripts
          npm run build
