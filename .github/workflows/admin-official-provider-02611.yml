name: Admin Official Provider 0.26.11
on:
  push:
    paths:
      - 'apps/admin/**'
      - 'services/api/**'
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/admin-official-provider-02611.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'services/api/**'
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/admin-official-provider-02611.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test -race ./internal/repository ./internal/httpapi ./internal/officialminecraft
        working-directory: services/api
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npm test
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
