name: ServerBridge Operator 0.28.12
on:
  push:
    paths:
      - 'cli/cmd/launcher/serverbridge_operator_02812*'
      - 'cli/cmd/launcher/serverbridge_provisioning_0199.go'
      - 'apps/admin/src/api/serverbridge.ts'
      - 'apps/admin/src/admin/ServerBridgeWorkspace.tsx'
      - 'apps/admin/src/admin/AdminApp.tsx'
      - 'apps/admin/tests/serverbridge-operator-02812.test.mjs'
      - '.github/workflows/serverbridge-operator-02812.yml'
  pull_request:
    paths:
      - 'cli/cmd/launcher/serverbridge_operator_02812*'
      - 'cli/cmd/launcher/serverbridge_provisioning_0199.go'
      - 'apps/admin/**'
      - '.github/workflows/serverbridge-operator-02812.yml'
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: cli/go.mod
      - run: go test ./cmd/launcher -run 'TestBridge|TestServerBridge(Detect|Install|Upgrade|DryRun)' -count=1
        working-directory: cli
      - run: go vet ./cmd/launcher
        working-directory: cli
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npm test
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
