name: Восстановление при сбое миграции SQLite → PostgreSQL 0.47.7
on:
  push:
    paths:
      - 'scripts/operations/sqlite_pg_cutover.py'
      - 'scripts/operations/test_sqlite_pg_cutover.py'
      - 'scripts/operations/test_sqlite_pg_recovery.py'
      - 'services/api/internal/sqlitepg/**'
      - '.github/workflows/sqlite-pg-recovery.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить резервные копии SQLite, WAL и внедрённые оператором сбои
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest \
            scripts.operations.test_sqlite_pg_cutover_0475 \
            scripts.operations.test_sqlite_pg_recovery_0477 \
            scripts.operations.test_legacy_upgrade_0476 -v
          python3 -m py_compile \
            scripts/operations/sqlite_pg_cutover.py \
            scripts/operations/test_sqlite_pg_recovery.py
          python3 scripts/version/manage.py check
  sqlrepository-import-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: launcher_live_0477
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launcher_test -d launcher_live_0477"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      LAUNCHER_PG_LIVE_TEST_DSN: postgres://launcher_test:isolated-test-only@127.0.0.1:5432/launcher_live_0477?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/api/go.sum
      - name: Скачать и Проверить locked модуль зависимости
        run: |
          go mod download
          go mod verify
      - name: Проверить миграцию SQLite в реальный SQLRepository и повреждение файлов
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=20m -v ./internal/sqlitepg
          go vet ./internal/sqlitepg
