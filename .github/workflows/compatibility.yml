name: Матрица совместимости Launcher

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-compatibility-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  matrix-plan:
    name: Validate compatibility targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Validate and generate immutable CI plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compatibility/matrix.py validate --targets compatibility/targets.json
          python3 e2e/scripts/test_prepare_vanilla_1171_void_world.py
          python3 e2e/scripts/test_vanilla_1171_resource_ready_proxy.py
          python3 e2e/scripts/test_live_join_0524.py
          full_matrix="$(python3 scripts/compatibility/matrix.py plan --targets compatibility/targets.json)"
          matrix="$(python3 -c 'import json,sys; d=json.load(sys.stdin); rows=d["include"]; mid=(len(rows)+1)//2; print(json.dumps({"include":rows[:mid]},separators=(",",":")))' <<<"$full_matrix")"
          matrix_b="$(python3 -c 'import json,sys; d=json.load(sys.stdin); rows=d["include"]; mid=(len(rows)+1)//2; print(json.dumps({"include":rows[mid:]},separators=(",",":")))' <<<"$full_matrix")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'matrix_b=%s\n' "$matrix_b" >> "$GITHUB_OUTPUT"

  compatibility-e2e:
    name: ${{ matrix.loader }} ${{ matrix.minecraft }} · ${{ matrix.os }}/${{ matrix.arch }}
    needs: matrix-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Установка целевой Java ${{ matrix.javaMajor }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.javaDistribution }}
          # Forge 1.16.3/1.16.4 содержит ModLauncher 8.0.x, который использует
          # однопараметрический конструктор ManifestEntryVerifier, удалённый в Java 8u321.
          # Только для этой проверки совместимости требуется исходное поддерживаемое
          # обновление Java 8; остальные цели используют актуальную исправленную Java.
          # Не применяйте устаревший JDK в производстве или при работе с аутентификацией.
          java-version: ${{ matrix.loader == 'forge' && (matrix.minecraft == '1.16.3' || matrix.minecraft == '1.16.4') && '8.0.312+7' || matrix.javaMajor }}
          architecture: ${{ matrix.arch == 'x86_64' && 'x64' || 'aarch64' }}
      - name: Закрепление исполняемого файла Java для клиента Minecraft
        shell: bash
        run: |
          set -euo pipefail
          java_path="$(command -v java)"
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            java_path="$(cygpath -m "$java_path")"
            [[ "${java_path,,}" == *.exe ]] || java_path="${java_path}.exe"
          fi
          printf 'LAUNCHER_E2E_JAVA=%s\n' "$java_path" >> "$GITHUB_ENV"
      - name: Восстановление Java 21 для инструментов загрузчика и Gradle
        # Сертификация Vanilla запускает только Go, Rust и уже закреплённую целевую
        # JVM; Gradle не используется. Повторная загрузка JDK приводит к сбоям
        # корректных ARM64-заданий при временных ошибках HTTP 5xx от Adoptium/GitHub.
        # Для загрузчиков и интеграционных проверок сохраняется Java 21.
        if: matrix.loader != 'vanilla' && matrix.javaMajor != 21
        id: java21_tooling
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          # Только для Gradle и инструментов; реальный клиент использует закреплённую JDK.
          # На публичных агентах Temurin обычно кэширован заранее, что по возможности избегает
          # сбоя извлечения ZIP Microsoft ARM64 внутри PowerShell CLR.
          distribution: temurin
          java-version: '21'
          check-latest: false
          architecture: ${{ matrix.arch == 'x86_64' && 'x64' || 'aarch64' }}
      # Публичный агент Windows ARM64 иногда завершается аварийно внутри PowerShell CLR
      # при извлечении корректного ZIP JDK 21. Повторить реальное действие настройки;
      # продолжить сертификацию клиента даже без работоспособной JDK.
      - name: Повторная установка инструментов Java 21 после временного сбоя распаковки
        if: matrix.loader != 'vanilla' && matrix.javaMajor != 21 && steps.java21_tooling.outcome == 'failure'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false
          architecture: ${{ matrix.arch == 'x86_64' && 'x64' || 'aarch64' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.scope == 'integration'
        with:
          gradle-version: '9.7.1'
      - name: Установка зависимостей для реальных сквозных тестов Minecraft
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq postgresql-client xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 \
            libvulkan1 mesa-vulkan-drivers \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 x11-xserver-utils libxcursor1 libxinerama1 libasound2t64
          # Minecraft 26.x может требовать Vulkan WSI наряду с OpenGL. Выбирайте настоящий
          # программный ICD Mesa вместо отсутствующего GPU на размещённом агенте.
          for icd in /usr/share/vulkan/icd.d/lvp_icd.*.json; do
            if [[ -f "$icd" ]] && [[ "$icd" == *"$(uname -m)"* ]]; then
              printf 'VK_DRIVER_FILES=%s\n' "$icd" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Проверка синтаксиса установщика Mesa для Windows
        if: runner.os == 'Windows' && matrix.scope == 'client'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/compatibility/install-windows-mesa.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Некорректный синтаксис установщика Mesa для Windows'
          }
      - name: Установка проверенной программной реализации OpenGL для сквозных тестов клиента Windows
        if: runner.os == 'Windows' && matrix.scope == 'client'
        shell: pwsh
        run: |
          ./scripts/compatibility/install-windows-mesa.ps1 `
            -Architecture '${{ matrix.arch }}' `
            -JavaExecutable "$env:LAUNCHER_E2E_JAVA"
      - name: Запуск проверки совместимости на настоящем клиенте
        env:
          LAUNCHER_COMPAT_TARGET_ID: ${{ matrix.id }}
          LAUNCHER_COMPAT_OS: ${{ matrix.os }}
          LAUNCHER_COMPAT_ARCH: ${{ matrix.arch }}
          LAUNCHER_COMPAT_SCOPE: ${{ matrix.scope }}
          LAUNCHER_COMPAT_MATCHING_SERVER: ${{ matrix.matchingServer }}
          LAUNCHER_E2E_MINECRAFT_VERSION: ${{ matrix.minecraft }}
          LAUNCHER_E2E_LOADER: ${{ matrix.loader }}
          LAUNCHER_E2E_LOADER_VERSION: ${{ matrix.loaderVersion }}
          # Подготовленные оператором ZIP соответствующего сервера с независимым закреплённым SHA-256.
          # Отсутствие дистрибутивов намеренно БЛОКИРУЕТ обязательные цели многопользовательской игры.
          LAUNCHER_E2E_SERVER_PINS: ${{ vars.LAUNCHER_E2E_SERVER_PINS_PATH }}
          LAUNCHER_E2E_SERVER_BUNDLE_DIR: ${{ vars.LAUNCHER_E2E_SERVER_BUNDLE_DIR }}
          LAUNCHER_E2E_JAVA_MAJOR: ${{ matrix.javaMajor }}
          LAUNCHER_E2E_CLIENT_RUNTIME_SECONDS: ${{ matrix.scope == 'client' && '120' || '90' }}
          # У агентов CI нет физического аудиоустройства — принудительно включается настоящий
          # нулевой Backend OpenAL Soft, а не ошибка открытия устройства по умолчанию.
          # Это влияет только на агентов сертификации, а не на релизы Launcher.
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: bash e2e/scripts/run-compatibility-case.sh
      - name: Экспорт ограниченных метаданных нативного сбоя Windows
        if: always() && runner.os == 'Windows' && matrix.scope == 'client'
        shell: pwsh
        run: |
          ./scripts/compatibility/export-windows-faults.ps1 `
            -OutputPath 'e2e/runtime/windows-fault-summary.txt'
      - name: Экспорт ограниченной и обезличенной диагностики сбоя Minecraft
        if: always()
        shell: bash
        run: |
          python3 scripts/compatibility/export-client-diagnostics.py \
            --runtime e2e/runtime \
            --output e2e/runtime/client-diagnostics.txt
      - name: Загрузка машиночитаемого результата проверки совместимости
        id: compatibility_evidence_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: &compatibility_evidence_a
          name: compatibility-${{ matrix.id }}
          path: |
            e2e/compatibility-result/compatibility-result.json
            e2e/compatibility-result/compatibility-execution.log
            e2e/compatibility-result/java-runtime.json
            e2e/compatibility-result/platform-runtime.json
            e2e/runtime/result.json
            e2e/runtime/client-package.json
            e2e/runtime/client-diagnostics.txt
            e2e/runtime/windows-fault-summary.txt
            e2e/runtime/certification-retry.json
            e2e/runtime/fabric-certification.first-attempt.json
            e2e/runtime/forge-certification.first-attempt.json
            e2e/runtime/vanilla-certification.first-attempt.json
            e2e/runtime/materialized-client-verify.json
            e2e/runtime/vanilla-install.json
            e2e/runtime/vanilla-server-install.json
            e2e/runtime/vanilla-certification.json
            e2e/runtime/resource-ready-proxy.json
            e2e/runtime/resource-ready-proxy.log
            e2e/runtime/fabric-install.json
            e2e/runtime/fabric-certification.json
            e2e/runtime/quilt-install.json
            e2e/runtime/quilt-certification.json
            e2e/runtime/forge-install.json
            e2e/runtime/forge-certification.json
            e2e/runtime/neoforge-install.json
            e2e/runtime/neoforge-certification.json
            e2e/runtime/loader-platform.json
            e2e/runtime/loader-hardening.json
            e2e/runtime/loader-hardening-package.json
            e2e/runtime/materialized-client/.launcher/installers/**/processor-journal.json
            e2e/runtime/fabric-resolution-lock.json
            e2e/runtime/quilt-resolution-lock.json
            e2e/runtime/forge-resolution-lock.json
            e2e/runtime/neoforge-resolution-lock.json
            e2e/runtime/loader-native-server.json
            e2e/runtime/loader-native-client.json
            e2e/runtime/loader-native-server.log
            e2e/runtime/loader-native-server-artifacts.txt
            e2e/runtime/loader-native-server-process.txt
            e2e/runtime/health-loader-native.json
            e2e/runtime/live-join.json
            e2e/runtime/live-server-ready.json
            e2e/runtime/live-server-witness.json
            e2e/runtime/live-server-stopped.json
            e2e/runtime/live-server-execution.log
            e2e/runtime/matching-server-install.json
            e2e/runtime/matching-server.json
            e2e/runtime/matching-server.log
            e2e/runtime/matching-server.initial.log
            e2e/runtime/manifest.json
            e2e/runtime/runtime-verify.json
            e2e/runtime/runtime-sync.json
            e2e/runtime/runtime-launch-minecraft.json
            e2e/runtime/health-paper.json
            e2e/runtime/bridge-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      # Сервис артефактов GitHub иногда выдаёт тайм-аут CreateArtifact даже после
      # успешной сертификации реального клиента Minecraft. Повторно отправляйте
      # те же машинно проверяемые свидетельства, никогда не подделывайте PASS.
      # Неудачная повторная попытка остаётся обязательным проваленным заданием.
      - name: Повторная загрузка подтверждений совместимости после временного сбоя
        if: always() && steps.compatibility_evidence_upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with: *compatibility_evidence_a

  compatibility-e2e-b:
    name: shard B · ${{ matrix.loader }} ${{ matrix.minecraft }} · ${{ matrix.os }}/${{ matrix.arch }}
    needs: matrix-plan
    strategy:
      fail-fast: false
