            e2e/runtime/loader-hardening.json
            e2e/runtime/loader-hardening-package.json
            e2e/runtime/materialized-client/.launcher/installers/**/processor-journal.json
            e2e/runtime/fabric-resolution-lock.json
            e2e/runtime/quilt-resolution-lock.json
            e2e/runtime/forge-resolution-lock.json
            e2e/runtime/neoforge-resolution-lock.json
            e2e/runtime/loader-native-server.json
            e2e/runtime/loader-native-client.json
            e2e/runtime/loader-native-server.log
            e2e/runtime/loader-native-server-artifacts.txt
            e2e/runtime/loader-native-server-process.txt
            e2e/runtime/health-loader-native.json
            e2e/runtime/live-join.json
            e2e/runtime/live-server-ready.json
            e2e/runtime/live-server-witness.json
            e2e/runtime/live-server-stopped.json
            e2e/runtime/live-server-execution.log
            e2e/runtime/matching-server-install.json
            e2e/runtime/matching-server.json
            e2e/runtime/matching-server.log
            e2e/runtime/matching-server.initial.log
            e2e/runtime/manifest.json
            e2e/runtime/runtime-verify.json
            e2e/runtime/runtime-sync.json
            e2e/runtime/runtime-launch-minecraft.json
            e2e/runtime/health-paper.json
            e2e/runtime/bridge-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      # Сервис артефактов GitHub иногда выдаёт тайм-аут CreateArtifact даже после
      # успешной сертификации реального клиента Minecraft. Повторно отправляйте
      # те же машинно проверяемые свидетельства, никогда не подделывайте PASS.
      # Неудачная повторная попытка остаётся обязательным проваленным заданием.
      - name: Повторная загрузка подтверждений совместимости после временного сбоя
        if: always() && steps.compatibility_evidence_upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with: *compatibility_evidence_b

  publish-matrix:
    name: Publish public compatibility matrix
    if: always() && needs.matrix-plan.result == 'success' && needs.compatibility-e2e.result != 'cancelled' && needs.compatibility-e2e-b.result != 'cancelled'
    needs: [matrix-plan, compatibility-e2e, compatibility-e2e-b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Скачать совместимость свидетельства
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: compatibility-*
          path: compatibility-results
      - name: Объединить и проверить матрицу
        shell: bash
        run: |
          set +e
          mkdir -p compatibility-public
          python3 scripts/compatibility/matrix.py aggregate \
            --targets compatibility/targets.json \
            --results-root compatibility-results \
            --output-dir compatibility-public \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            > compatibility-public/aggregate.log 2>&1
          rc=$?
          if [[ -s compatibility-public/matrix.md ]]; then
            cat compatibility-public/matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat compatibility-public/aggregate.log >> "$GITHUB_STEP_SUMMARY"
          fi
          cat compatibility-public/aggregate.log
          exit "$rc"
      - name: Опубликовать матрицу совместимости в JSON и Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-compatibility-matrix-${{ github.run_id }}
          path: |
            compatibility-public/matrix.json
            compatibility-public/matrix.md
            compatibility-public/aggregate.log
          if-no-files-found: error
          retention-days: 30

  acceptance-inventory-0521:
    name: Fail-closed 0.52.1 acceptance inventory (never GA)
    if: always()
    needs: [matrix-plan, compatibility-e2e, compatibility-e2e-b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Установить свидетельства подпись верификатор
        run: python3 -m pip install 'cryptography>=42,<47'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compatibility-*
          path: compatibility-results
      - name: Повторно воспроизвести исходные захешированные журналы
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p acceptance-0521
          python3 scripts/acceptance/inventory_0521.py inventory \
            --results-root compatibility-results \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --gate minecraft \
            --output "$PWD/acceptance-0521/inventory.json"
      - name: Повторить полную независимую проверку обязательных платформ для 0.52.11
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/acceptance/sweep_05211.py minecraft \
            --compat-results "$PWD/compatibility-results" \
            --commit "$GITHUB_SHA" --compat-run-id "$GITHUB_RUN_ID" \
            --compat-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$PWD/acceptance-0521/sweep-05211.json"
      - name: Загрузить перечень наблюдаемых результатов (не независимая приёмка GA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-acceptance-inventory-0521-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            acceptance-0521/inventory.json
            acceptance-0521/sweep-05211.json
          if-no-files-found: warn
          retention-days: 90
