            e2e/runtime/forge-certification.first-attempt.json
            e2e/runtime/materialized-client-verify.json
            e2e/runtime/vanilla-install.json
            e2e/runtime/vanilla-server-install.json
            e2e/runtime/vanilla-certification.json
            e2e/runtime/resource-ready-proxy.json
            e2e/runtime/resource-ready-proxy.log
