name: Совместимость N/N-1 для API, обработчика и PostgreSQL 0.51.6
on:
  push:
    paths:
      - 'services/api/internal/dbmigrate/**'
      - 'scripts/operations/nn1_compat_0516.py'
      - 'scripts/operations/test_nn1_compat_0516.py'
      - 'scripts/operations/ha_inventory_0511.py'
      - 'scripts/operations/multi_host_0512.py'
      - '.github/workflows/nn1-compatibility-0516.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-live-protocol-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить реального 0.51.5 SQL checksum блокировки и имитируемого mixed-version отказа путей
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest \
            scripts/operations/test_nn1_compat_0516.py \
            scripts/operations/test_multi_host_0512.py \
            scripts/operations/test_ha_inventory_0511.py -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Протестировать PostgreSQL схемы миграции checksum валидации
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -count=1 ./internal/dbmigrate
      - name: Проверить aligned продукта версий
        run: python3 scripts/version/manage.py check
