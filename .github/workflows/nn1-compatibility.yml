name: Совместимость N/N-1 для API, обработчика и PostgreSQL 0.51.6
on:
  push:
    paths:
      - 'services/api/internal/dbmigrate/**'
      - 'scripts/operations/nn1_compat.py'
      - 'scripts/operations/test_nn1_compat.py'
      - 'scripts/operations/ha_inventory.py'
      - 'scripts/operations/multi_host.py'
      - '.github/workflows/nn1-compatibility.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-live-protocol-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Проверка контроля сумм SQL версии 0.51.5 и отказов при смешении версий"
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest \
            scripts/operations/test_nn1_compat.py \
            scripts/operations/test_multi_host.py \
            scripts/operations/test_ha_inventory.py -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Проверка контрольных сумм миграций схемы PostgreSQL"
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -count=1 ./internal/dbmigrate
      - name: "Проверка согласованности версий продукта"
        run: python3 scripts/version/manage.py check
