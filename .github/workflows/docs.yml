name: Контракты документации

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'wiki/**'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'scripts/contracts/**'
      - 'scripts/operations/operator_accept_04513.py'
      - 'scripts/operations/test_operator_accept_04513.py'
      - 'scripts/operations/independent_accept_04514.py'
      - 'scripts/operations/test_independent_accept_04514.py'
      - 'scripts/operations/component_upgrade_0458.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'wiki/**'
      - 'ARCHITECTURE.md'
      - 'COMPATIBILITY.md'
      - 'scripts/contracts/**'
      - 'scripts/operations/operator_accept_04513.py'
      - 'scripts/operations/test_operator_accept_04513.py'
      - 'scripts/operations/independent_accept_04514.py'
      - 'scripts/operations/test_independent_accept_04514.py'
      - 'scripts/operations/component_upgrade_0458.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-contracts:
    name: Validate public API and version contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/contracts/validate-openapi.py
      - run: python3 scripts/version/manage.py check

      - name: Проверить реального оператора document links и исполняемого файла путей
        run: python3 scripts/operations/operator_accept_04513.py docs-check
      - name: Протестировать только для чтения оператора приёмки и отказа случаев
        run: python3 -m unittest scripts/operations/test_operator_accept_04513.py -v
      - name: Проверить работоспособность реальных эксплуатационных точек входа
        run: |
          python3 scripts/install/production-deploy.py compose --help
          python3 scripts/install/minimal-install.py --help
          python3 scripts/operations/dr_03512.py --help
          python3 scripts/operations/db_upgrade_0457.py --help
          python3 scripts/operations/component_upgrade_0458.py --help
          python3 scripts/operations/observability_0459.py --help
      - name: Независимые регрессионные проверки оркестрации реальных команд оператора (без ложного прохождения Docker)
        run: |
          PYTHONPATH=scripts/operations python3 -m unittest scripts/operations/test_independent_accept_04514.py -v
          python3 scripts/operations/independent_accept_04514.py --help
          python3 scripts/operations/independent_accept_04514.py upgrade-standard --help
          python3 scripts/operations/independent_accept_04514.py restore-standard --help
          python3 scripts/operations/independent_accept_04514.py failover-network-ha --help
