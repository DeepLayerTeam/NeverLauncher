name: Java SDK Core 0.30.3 — compile, unit and live protocol tests
on:
  push:
    paths:
      - 'sdk/java/core/**'
      - 'examples/extensions/java-lifecycle/**'
      - '.github/workflows/java-sdk-core-0302.yml'
  pull_request:
    paths:
      - 'sdk/java/core/**'
      - 'examples/extensions/java-lifecycle/**'
      - '.github/workflows/java-sdk-core-0302.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-sdk-core:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile SDK and run Java HTTP-host integration tests
        shell: bash
        run: bash sdk/java/core/build.sh test
      - name: Compile real example
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/java-example"
          javac --release 17 -cp sdk/java/core/build/classes -d "$RUNNER_TEMP/java-example" examples/extensions/java-lifecycle/src/ru/example/neverlauncher/LifecycleExample.java
      - name: Check manifest matches shipping Extensions schema
        shell: bash
        run: python3 -m json.tool examples/extensions/java-lifecycle/neverlauncher-extension.json >/dev/null
      - name: Verify produced SDK artifact
        shell: bash
        run: jar tf sdk/java/core/build/launcher-java-sdk-core.jar | grep -q 'ru/launcher/sdk/core/ExtensionRunner.class'
  java-process-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Build signable payload and exercise running Java extension process
        run: |
          sh examples/extensions/java-lifecycle/build.sh
          python3 examples/extensions/java-lifecycle/test-runner.py
      - name: Real CLI pack, Ed25519 signature and verification
        run: |
          (cd cli && go build -o "$RUNNER_TEMP/nl" ./cmd/neverlauncher)
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/extension-key.pem"
          openssl pkey -in "$RUNNER_TEMP/extension-key.pem" -pubout -out "$RUNNER_TEMP/extension-pub.pem"
          "$RUNNER_TEMP/nl" extension pack examples/extensions/java-lifecycle/build/package --output "$RUNNER_TEMP/java-extension.nlext" --private-key "$RUNNER_TEMP/extension-key.pem"
          "$RUNNER_TEMP/nl" extension verify "$RUNNER_TEMP/java-extension.nlext" --public-key "$RUNNER_TEMP/extension-pub.pem"
