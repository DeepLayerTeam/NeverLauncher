name: Java Extension Manager 0.30.5 — signed packages, lifecycle, diagnostics
on:
  push:
    paths:
      - 'services/api/internal/extensionjava/**'
      - 'services/api/internal/extensionlifecycle/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/httpapi/extension_lifecycle_0204.go'
      - 'cli/cmd/neverlauncher/extension*'
      - 'examples/extensions/java-host/**'
      - '.github/workflows/java-extension-manager-0305.yml'
  pull_request:
    paths:
      - 'services/api/internal/extensionjava/**'
      - 'services/api/internal/extensionlifecycle/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/httpapi/extension_lifecycle_0204.go'
      - 'cli/cmd/neverlauncher/extension*'
      - 'examples/extensions/java-host/**'
      - '.github/workflows/java-extension-manager-0305.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-java-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Compile actual Java extension and SDK
        run: sh examples/extensions/java-host/build.sh
      - name: Test Java archive/runtime compatibility with actual host classes
        working-directory: services/api
        env:
          NEVERLAUNCHER_TEST_JAVA_HOST_JAR: ${{ github.workspace }}/examples/extensions/java-host/build/package/backend/java-host.jar
        run: go test -race -count=1 ./internal/extensionjava
      - name: Live repository dependency and lifecycle transaction tests
        working-directory: services/api
        run: go test -race -count=1 -timeout 5m ./internal/extensionlifecycle ./internal/extensionresolver ./internal/extensionupdates
      - name: Real supervisor with JAR and regression
        working-directory: services/api
        env:
          NEVERLAUNCHER_TEST_JAVA_HOST_JAR: ${{ github.workspace }}/examples/extensions/java-host/build/package/backend/java-host.jar
        run: go test -race -count=1 -timeout 4m ./internal/extensionhost
      - name: Verify HTTP API compiles with new diagnostics integration
        working-directory: services/api
        run: go test -run '^TestDoesNotExist$' ./internal/httpapi
      - name: Test CLI diagnostics and signature verification
        run: |
          (cd cli && go test -count=1 -run '^TestJavaManagerDiagnoseCLI0305$' ./cmd/neverlauncher)
          (cd cli && go build -o "$RUNNER_TEMP/nl" ./cmd/neverlauncher)
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          "$RUNNER_TEMP/nl" extension pack examples/extensions/java-host/build/package --output "$RUNNER_TEMP/test.nlext" --private-key "$RUNNER_TEMP/private.pem"
          "$RUNNER_TEMP/nl" extension verify "$RUNNER_TEMP/test.nlext" --public-key "$RUNNER_TEMP/public.pem"
      - name: Check version metadata
        run: python3 scripts/version/manage.py check
