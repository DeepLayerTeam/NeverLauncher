name: Guard 0.50.6 — непрерывное наблюдение за игрой
on:
  push:
    paths:
      - 'runtime/runtime/src/continuous_game_protection_0506.rs'
      - 'runtime/runtime/src/supervisor.rs'
      - 'runtime/runtime/src/lib.rs'
      - 'sdk/java/trusted-agent/src/main/java/ru/launcher/trusted/RuntimeIntegrity0505.java'
      - 'scripts/tests/continuous_game_protection_0506.py'
      - '.github/workflows/continuous-game-protection-0506.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-guard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: windows-2022, platform: windows-x64}
          - {runner: windows-11-arm, platform: windows-arm64}
          - {runner: macos-15-intel, platform: macos-x64}
          - {runner: macos-15, platform: macos-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    name: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Проверить реальную активность JVM, её жизненный цикл и целостность исполняемого кода
        run: python scripts/tests/continuous_game_protection_0506.py
      - name: Запустить предыдущие регрессионные проверки целостности работающей JVM
        run: python scripts/tests/guard_runtime_integrity_0505.py
      - name: Скомпилировать и проверить нативный сторожевой процесс родительского процесса
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --lib continuous_game_protection_0506
      - name: "Скомпилировать полный Runtime и управляемый Launcher"
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --lib --no-run
      - name: Проверить согласованность версий
        run: python scripts/version/manage.py check
