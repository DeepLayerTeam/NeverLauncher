name: NeverLauncher 0.43.11 — нативное подписанное применение изоляции macOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/sandbox-helper/**'
      - 'services/api/internal/macossandbox/**'
      - 'scripts/security/build-macos-sandbox-helper-03112.sh'
      - 'scripts/security/testdata/macos_extension_probe_04311.c'
      - '.github/workflows/macos-sandbox-native-04311.yml'
  pull_request:
    paths:
      - 'macos/sandbox-helper/**'
      - 'services/api/internal/macossandbox/**'
      - '.github/workflows/macos-sandbox-native-04311.yml'

permissions:
  contents: read
jobs:
  macos-signed-native:
    # Отсутствие рабочего узла ARM64 не превращается в PASS на x64. Требуются обе
    # задачи.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: [self-hosted, macOS, ARM64, launcher-sandbox]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить подписания входных данных (без ad-hoc промышленной substitute)
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$SIGN_IDENTITY" && test -n "$TEAM_ID"
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$SIGN_IDENTITY" == 'Developer ID Application:'* ]]
      - name: Импортировать Developer ID подписания идентичности
        shell: bash
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sandbox-04311.keychain-db"
          PASS="$(openssl rand -hex 24)"
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/sandbox-signing.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sandbox-signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: Собрать подписанных helper и нативного extension тестовых данных
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$(test '${{ matrix.arch }}' = 'amd64' && echo x86_64 || echo arm64)"
          # Вспомогательный исполняемый файл должен находиться в доверенном дереве
          # каталогов, недоступном для записи группе и другим пользователям.
          DEST="$HOME/Library/Application Support/NeverLauncher/SandboxHelpers/NeverExtensionSandbox"
          LAUNCHER_MACOS_SANDBOX_TEAM_ID="$TEAM_ID" LAUNCHER_MACOS_SANDBOX_SIGN_IDENTITY="$SIGN_IDENTITY" \
            bash scripts/security/build-macos-sandbox-helper-03112.sh "$DEST"
          echo "LAUNCHER_MACOS_SANDBOX_HELPER=$DEST" >> "$GITHUB_ENV"
          echo "LAUNCHER_MACOS_SANDBOX_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/nl-mac-fixture"
          clang -O2 scripts/security/testdata/macos_extension_probe_04311.c -o "$RUNNER_TEMP/nl-mac-fixture/probe"
          codesign --force --sign - "$RUNNER_TEMP/nl-mac-fixture/probe"
          codesign --verify --strict "$RUNNER_TEMP/nl-mac-fixture/probe"
          echo "LAUNCHER_MACOS_SANDBOX_LIVE_FIXTURE=$RUNNER_TEMP/nl-mac-fixture/probe" >> "$GITHUB_ENV"
          echo "LAUNCHER_MACOS_SANDBOX_LIVE_ROOT=$RUNNER_TEMP/nl-mac-fixture" >> "$GITHUB_ENV"
      - name: Запустить реальные тесты подписанной песочницы, дочерних процессов и сторожевого процесса
        env:
          LAUNCHER_MACOS_SANDBOX_LIVE: '1'
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -count=1 -timeout 90s -v ./internal/macossandbox
          go test -count=1 ./internal/extensionhost ./internal/extensionpolicy
      - name: Уничтожить импортированные материалы подписи
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sandbox-signing.p12"
          security delete-keychain "$RUNNER_TEMP/sandbox-04311.keychain-db" || true
