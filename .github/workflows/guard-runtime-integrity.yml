name: Guard 0.43.7 — целостность Runtime
on:
  push:
    paths:
      - 'runtime/runtime/**'
      - '.github/workflows/guard-runtime-integrity-0437.yml'
  pull_request:
    paths:
      - 'runtime/runtime/**'
      - '.github/workflows/guard-runtime-integrity-0437.yml'
jobs:
  guard-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Запустить регрессионные проверки целостности исполняемого Guard"
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --lib integrity_0437_tests
      - name: "Собрать механизм изоляции процессов Guard"
        run: cargo check --manifest-path runtime/runtime/Cargo.toml --bin guard
      - name: Установить зависимость для тестирования подписей
        if: runner.os == 'Linux'
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: "Проверить реальную подпись пакетов Linux и доставку архивов tar"
        if: runner.os == 'Linux'
        run: python3 scripts/release/test_guard_manifest_sign_0437.py -q
