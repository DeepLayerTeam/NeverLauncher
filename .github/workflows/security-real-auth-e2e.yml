name: Безопасность и настоящая авторизация — E2E 0.29.12
on:
  push:
    paths:
      - 'services/api/**'
      - 'cli/**'
      - '.github/workflows/security-real-auth-e2e.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'cli/**'
      - '.github/workflows/security-real-auth-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth -d auth" --health-interval 5s --health-timeout 5s --health-retries 25
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: auth
          MYSQL_USER: auth
          MYSQL_PASSWORD: integration-only
          MYSQL_ROOT_PASSWORD: integration-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: auth
          MARIADB_USER: auth
          MARIADB_PASSWORD: integration-only
          MARIADB_ROOT_PASSWORD: integration-root-only
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: services/api
    env:
      LAUNCHER_SECURITY_E2E_POSTGRES_DSN: postgres://auth:integration-only@localhost:5432/auth?sslmode=disable
      LAUNCHER_SQL_TEST_POSTGRES_DSN: postgres://auth:integration-only@localhost:5432/auth?sslmode=disable
      LAUNCHER_SQL_TEST_MYSQL_DSN: auth:integration-only@tcp(localhost:3306)/auth?tls=false
      LAUNCHER_SQL_TEST_MARIADB_DSN: auth:integration-only@tcp(localhost:3307)/auth?tls=false
      LAUNCHER_SQL_REQUIRE_ALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Проверить форматирование и собрать промышленный Backend"
        run: |
          test -z "$(gofmt -l internal/authrequest internal/httpapi/auth_accounts.go internal/httpapi/admin_handlers.go internal/httpapi/auth.go internal/httpapi/security_real_auth_e2e_test.go internal/httpapi/security_real_auth_postgres_test.go internal/httpapi/security_session_signing_test.go)"
          go build ./cmd/...
          go vet ./internal/authrequest ./internal/httpapi ./internal/federation ./internal/repository
      - name: Проверить изоляцию источника HTTP, вредоносный JSON, MFA и повтор запросов обновления
        run: |
          go test -race -count=1 -timeout=8m ./internal/authrequest ./internal/httpapi -run '02912|0296|TestProtectionBanUnbanLiveHTTP0298|TestRoleUpdateRevokesLiveLauncherToken0297' -v
      - name: "Проверить две независимые реплики API, реальные транзакции PostgreSQL и отзыв прав между репликами"
        run: |
          go test -count=1 -timeout=10m ./internal/httpapi -run '^TestSecurityRealAuthPostgresTwoReplicas02912$' -v
          go test -count=1 -timeout=10m ./internal/repository -run 'TestGlobalSessionRevocationPostgres0297|TestProtectionPostgres0298' -v
      - name: "Проверить настоящую аутентификацию PostgreSQL, MySQL и MariaDB и отказ при неверном пароле"
        run: go test -count=1 -timeout=8m ./internal/sqlconnector -run '^TestLiveSQLLegacyAuthentication0294$' -v
      - name: Проверить OIDC, HTTP, Microsoft и соответствие SDK подписанному поведению провайдеров
        run: go test -race -count=1 -timeout=8m ./pkg/authconnector/... ./internal/httpconnector ./internal/oidcconnector ./internal/microsoftconnector ./internal/federation
      - name: "Проверить каталоги миграций Backend/CLI и реальные предпосылки обновления"
        run: |
          go test -count=1 ./internal/dbmigrate
          python3 ../../scripts/build/embedded_cli_assets.py --check
          (cd ../../cli && go test ./internal/dbmigrate ./internal/authupgrade && go build ./cmd/launcher)
