name: Provider Runtime Parity 0.29.6
on:
  push:
    paths:
      - 'services/api/pkg/authconnector/**'
      - 'services/api/internal/httpapi/**'
      - 'services/api/internal/federation/**'
      - 'services/api/internal/sqlconnector/**'
      - 'services/api/internal/httpconnector/**'
      - 'services/api/internal/oidcconnector/**'
      - 'services/api/internal/microsoftconnector/**'
      - 'services/api/go.mod'
      - 'services/api/go.sum'
      - '.github/workflows/provider-runtime-parity-0296.yml'
  pull_request:
    paths:
      - 'services/api/pkg/authconnector/**'
      - 'services/api/internal/httpapi/**'
      - 'services/api/internal/federation/**'
      - 'services/api/internal/sqlconnector/**'
      - 'services/api/internal/httpconnector/**'
      - 'services/api/internal/oidcconnector/**'
      - 'services/api/internal/microsoftconnector/**'
      - 'services/api/go.mod'
      - 'services/api/go.sum'
      - '.github/workflows/provider-runtime-parity-0296.yml'
permissions:
  contents: read
jobs:
  runtime-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth -d auth" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: auth
          MYSQL_USER: auth
          MYSQL_PASSWORD: integration-only
          MYSQL_ROOT_PASSWORD: integration-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: auth
          MARIADB_USER: auth
          MARIADB_PASSWORD: integration-only
          MARIADB_ROOT_PASSWORD: integration-root-only
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Verify production Go formatting
        run: test -z "$(gofmt -l pkg/authconnector internal/httpapi/mfa_login_117.go internal/httpapi/oidc_flow_115.go internal/httpapi/admin_handlers.go internal/httpapi/*0296*.go)"
      - name: Build real Backend and CLI
        run: go build ./cmd/...
      - name: Run signed HTTP/OIDC/Microsoft and runtime API authentication regressions
        run: go test -count=1 -timeout=8m ./pkg/authconnector/... ./internal/httpconnector ./internal/oidcconnector ./internal/microsoftconnector ./internal/federation ./internal/httpapi ./internal/repository
      - name: Check provider assurance and credential lifecycle with race detector
        run: go test -race -count=1 -timeout=8m ./pkg/authconnector/... ./internal/httpapi ./internal/federation -run '0296|TestOIDCBeginCompleteCreatesCanonicalNeverSession|TestHTTPLoginUsesRegisteredExternalConnector112|TestFederationE2E01110CanonicalSessionMatrix'
      - name: Live SQL/PostgreSQL MySQL MariaDB legacy mapping login
        env:
          LAUNCHER_SQL_TEST_POSTGRES_DSN: postgres://auth:integration-only@localhost:5432/auth?sslmode=disable
          LAUNCHER_SQL_TEST_MYSQL_DSN: auth:integration-only@tcp(localhost:3306)/auth?tls=false
          LAUNCHER_SQL_TEST_MARIADB_DSN: auth:integration-only@tcp(localhost:3307)/auth?tls=false
          LAUNCHER_SQL_REQUIRE_ALL: '1'
        run: go test -count=1 -timeout=8m ./internal/sqlconnector -run '^TestLiveSQLLegacyAuthentication0294$' -v
