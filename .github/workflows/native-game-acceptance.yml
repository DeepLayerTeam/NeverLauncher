name: Настоящий Minecraft — позитивные и атакующие сценарии на шести нативных платформах 0.43.14
on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Immutable staged and signed package to execute on all six GUI hosts
        required: true
        type: string
  workflow_call:
    inputs:
      package_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-game-04314-${{ inputs.package_id }}
  cancel-in-progress: false
jobs:
  # Отсутствие аппаратных средств для нативного GUI — БЛОКИРУЮЩЕЕ условие, а не
  # повод подставить VM x64 или незаметно исключить платформу из матрицы.
  # Переиспользуемый рабочий процесс уже проверяет настоящую ОС и архитектуру
  # хоста и требует соответствующий сервер Minecraft и живую авторизацию.
  live-native-game:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: macos, arch: amd64}
          - {os: macos, arch: arm64}
    uses: ./.github/workflows/native-runtime-v10-03410.yml
    with:
      package_id: ${{ inputs.package_id }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      mode: gui
    secrets: inherit
  all-native-passed:
    name: Требуются шесть отдельных нативных запусков GUI и их реальные отчёты
    needs: [live-native-game]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Отклонение неуспешной матрицы нативного GUI
        env:
          MATRIX_RESULT: ${{ needs.live-native-game.result }}
        run: |
          test "$MATRIX_RESULT" = success || { echo 'BLOCKED: incomplete native game matrix'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v10-native-*-gui-${{ github.run_id }}
          path: ${{ runner.temp }}/native-observations
          merge-multiple: false
      - name: Проверка шести соответствующих реальных позитивных и атакующих сценариев
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ga/verify_six_native_game_0440.py \
            --artifacts "$RUNNER_TEMP/native-observations" \
            --package-id "$PACKAGE_ID" --version "$(cat VERSION)" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/native-game-0440.json"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-six-native-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-game-0440.json
          if-no-files-found: error
          retention-days: 90
