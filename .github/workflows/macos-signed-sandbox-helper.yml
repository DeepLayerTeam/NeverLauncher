name: Подписанный помощник изоляции macOS 0.31.12
on:
  push:
    paths:
      - 'macos/sandbox-helper/**'
      - 'services/api/internal/macossandbox/**'
      - 'services/api/internal/extensionhost/**'
      - 'scripts/security/build-macos-sandbox-helper.sh'
      - '.github/workflows/macos-signed-sandbox-helper.yml'
  pull_request:
    paths:
      - 'macos/sandbox-helper/**'
      - 'services/api/internal/macossandbox/**'
      - 'services/api/internal/extensionhost/**'
      - '.github/workflows/macos-signed-sandbox-helper.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Собрать Swift и проверить plist разрешений
        run: |
          xcrun swiftc -O ../../macos/sandbox-helper/ExtensionSandbox.swift -o /tmp/LauncherExtensionSandbox -lsandbox -lproc
          plutil -lint ../../macos/sandbox-helper/ExtensionSandbox.entitlements
      - name: "Проверить и выполнить кросс-компиляцию основных пакетов Go"
        run: |
          go test -race ./internal/macossandbox ./internal/extensionhost ./internal/extensionpolicy ./internal/extensionbroker
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./internal/macossandbox ./internal/extensionhost
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./internal/macossandbox ./internal/extensionhost
      - name: Darwin SDK компиляция
        run: |
          (cd ../../sdk/backend/go && GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...)
          (cd ../../sdk/cli/go && GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...)
      - name: Проверить наличие сертификата релиза для подписанного артефакта
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SIGN_IDENTITY: ${{ vars.LAUNCHER_MACOS_SANDBOX_SIGN_IDENTITY }}
          TEAM_ID: ${{ vars.LAUNCHER_MACOS_SANDBOX_TEAM_ID }}
        run: |
          test -n "$SIGN_IDENTITY" && test -n "$TEAM_ID" || { echo 'Сертификат релиза отсутствует: изолированный артефакт отклонён' >&2; exit 1; }
          LAUNCHER_MACOS_SANDBOX_TEAM_ID="$TEAM_ID" LAUNCHER_MACOS_SANDBOX_SIGN_IDENTITY="$SIGN_IDENTITY" \
            ../../scripts/security/build-macos-sandbox-helper.sh /tmp/LauncherExtensionSandbox-signed
