name: Основной репозиторий SQLite DEP01 (0.32.2)
on:
  push:
    paths:
      - 'services/api/internal/sqlitecore/**'
      - 'services/api/internal/sqlitedurable/**'
      - 'services/api/cmd/launcher-sqlite/**'
      - 'services/api/go.mod'
      - 'services/api/go.sum'
      - '.github/workflows/sqlite-core.yml'
  pull_request:
  workflow_dispatch:
jobs:
  core-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/api/go.sum
      - name: Проверить зависимости модулей и форматирование исходников
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          test -z "$(gofmt -l internal/sqlitecore cmd/launcher-sqlite/main.go)"
      - name: Подготовить поддерживаемую реальную локальную файловую систему
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sqlite-core"
          chmod 0700 "$RUNNER_TEMP/sqlite-core"
          stat -f -c '%T' "$RUNNER_TEMP/sqlite-core"
      - name: "Проверить реальную интеграцию SQLite WAL, CAS, доверенные манифесты и перезапуск"
        env:
          LAUNCHER_SQLITE_TEST_ROOT: ${{ runner.temp }}/sqlite-core
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: go test -race -count=1 -v ./internal/sqlitecore ./internal/sqlitedurable ./cmd/launcher-sqlite
      - name: Собрать эксплуатационный CLI и проверить реальную устойчивую инициализацию ядра
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/launcher-sqlite" ./cmd/launcher-sqlite
          db="$RUNNER_TEMP/sqlite-core/live-core.sqlite"
          "$RUNNER_TEMP/launcher-sqlite" core-init --db "$db" > "$RUNNER_TEMP/sqlite-core-init.json"
          "$RUNNER_TEMP/launcher-sqlite" core-status --db "$db" > "$RUNNER_TEMP/sqlite-core-status.json"
          printf '%s\n' '{"id":"ci-project","name":"CI Project"}' > "$RUNNER_TEMP/sqlite-core/project.json"
          chmod 0600 "$RUNNER_TEMP/sqlite-core/project.json"
          "$RUNNER_TEMP/launcher-sqlite" core-put --db "$db" --kind project --actor ci --input "$RUNNER_TEMP/sqlite-core/project.json" > "$RUNNER_TEMP/sqlite-core-written.json"
          "$RUNNER_TEMP/launcher-sqlite" core-get --db "$db" --kind project --project ci-project > "$RUNNER_TEMP/sqlite-core-read.json"
          python3 - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP']
          with open(root+'/sqlite-core-status.json') as f:
              payload=json.load(f)
          assert payload['status']=='ok'
          assert payload['schemaVersion']==327
          assert payload['counts']['roles']==8
          with open(root+'/sqlite-core-read.json') as f:
              project=json.load(f)
          assert project['id']=='ci-project' and project['name']=='CI Project'
          PY
          if "$RUNNER_TEMP/launcher-sqlite" core-status --db "$RUNNER_TEMP/sqlite-core/nonexistent.sqlite"; then
            echo 'Команда core-status ошибочно инициализировала несуществующую базу данных' >&2
            exit 1
          fi
