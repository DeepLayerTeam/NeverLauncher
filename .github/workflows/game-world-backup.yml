name: Резервное копирование игрового мира 0.41.10
on:
  push:
    paths:
      - 'cli/**'
      - 'scripts/test/world-backup-host-e2e.py'
      - 'scripts/test/world-backup-real-java.py'
      - '.github/workflows/game-world-backup.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'scripts/test/world-backup-host-e2e.py'
      - 'scripts/test/world-backup-real-java.py'
      - '.github/workflows/game-world-backup.yml'
env:
  PYTHONUTF8: "1"

jobs:
  backup-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Выполнить регрессионные тесты супервизора хоста и резервного копирования
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestWorldBackup|TestServerBridgeHostStopSupervisedProcess01910' -count=1
      - name: Собрать CLI и проверить реальный хост на практике
        working-directory: cli
        run: |
          go build -o "$RUNNER_TEMP/nl" ./cmd/launcher
          python3 ../scripts/test/world-backup-host-e2e.py --cli "$RUNNER_TEMP/nl"
          python3 ../scripts/test/world-backup-real-java.py --cli "$RUNNER_TEMP/nl"
  backup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Выполнить кроссплатформенные тесты резервного копирования
        working-directory: cli
        run: go test ./cmd/launcher -run TestWorldBackup -count=1
