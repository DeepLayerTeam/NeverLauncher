name: Guard 0.50.12 — реальные атаки на JVM и подтверждения теневого режима
on:
  push:
    paths:
      - 'scripts/guard_ci/adversarial_pilot_05012.py'
      - 'scripts/guard_ci/test_adversarial_pilot_05012.py'
      - 'services/api/internal/httpapi/guard_shadow_05012*'
      - 'services/api/internal/httpapi/server_bound_guard_0507.go'
      - 'sdk/java/trusted-agent/**'
      - '.github/workflows/guard-adversarial-shadow-05012.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-event-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Регрессионные тесты реальной валидации и враждебных свидетельств"
        run: python3 scripts/guard_ci/test_adversarial_pilot_05012.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: "Сборка и проверка теневого журнала сервера"
        working-directory: services/api/internal/httpapi
        run: go test guard_shadow_05012.go guard_shadow_05012_test.go -count=1 -v
      - name: Собрать сервер и проверить сигналы активности через полный пакет API
        working-directory: services/api
        run: go test ./internal/httpapi -run 'TestGuardShadow05012|TestServerBoundGuard0507' -count=1 -timeout=15m
  actual-jvm-adversarial:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, os: ubuntu-24.04}
          - {target: linux-arm64, os: ubuntu-24.04-arm}
          - {target: windows-x64, os: windows-2022}
          - {target: windows-arm64, os: windows-11-arm}
          - {target: macos-x64, os: macos-15-intel}
          - {target: macos-arm64, os: macos-15}
    name: '${{ matrix.target }} — real JVM hostile/legitimate processes'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Установка нативных библиотек для тестов Linux"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Запустить поддерживаемые JVM проверки на обход наборы тестов с собранные свидетельства
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python3 scripts/guard_ci/adversarial_pilot_05012.py run-jvm --output guard-05012-result.json
          else
            python3 scripts/guard_ci/adversarial_pilot_05012.py run-jvm \
              --only loader-transformations --only continuous-watchdog \
              --output guard-05012-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-adversarial-${{ matrix.target }}
          path: |
            guard-05012-result.json
            logs/*.log
          if-no-files-found: warn
