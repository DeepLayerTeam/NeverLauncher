name: Java SDK Runtime API 0.30.3 — настоящие процессы, Go Broker и подписанные пакеты
on:
  push:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/eventbus/**'
      - 'services/api/internal/repository/extension_events.go'
      - 'services/api/internal/repository/extension_events_test.go'
      - 'examples/extensions/java-runtime/**'
      - 'examples/extensions/java-lifecycle/**'
      - '.github/workflows/java-sdk-runtime.yml'
  pull_request:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/eventbus/**'
      - 'services/api/internal/repository/extension_events.go'
      - 'services/api/internal/repository/extension_events_test.go'
      - 'examples/extensions/java-runtime/**'
      - 'examples/extensions/java-lifecycle/**'
      - '.github/workflows/java-sdk-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"

jobs:
  java-runtime:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Проверить ядро и реальные локальные HTTP-сценарии Runtime
        shell: bash
        run: sh sdk/java/core/build.sh test
      - name: Скомпилировать исполняемый Backend/CLI пример
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-example"
          javac -encoding UTF-8 --release 17 -cp sdk/java/core/build/classes -d "$RUNNER_TEMP/runtime-example" examples/extensions/java-runtime/src/ru/example/launcher/RuntimeExample.java
      - name: Проверить фактические jar артефакт
        shell: bash
        run: jar tf sdk/java/core/build/launcher-java-sdk-core.jar | grep -q 'ru/launcher/sdk/core/RuntimeCallbackServer.class'
  java-two-process-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: "Собрать и проверить реальные дочерние процессы Java Backend и CLI"
        run: |
          sh examples/extensions/java-runtime/build.sh
          python3 examples/extensions/java-runtime/test-runner.py
          sh examples/extensions/java-lifecycle/build.sh
          python3 examples/extensions/java-lifecycle/test-runner.py
      - name: "Упаковать подписанные Java-расширения Backend/CLI и проверить Ed25519"
        run: |
          (cd cli && go build -o "$RUNNER_TEMP/nl" ./cmd/launcher)
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/extension-key.pem"
          openssl pkey -in "$RUNNER_TEMP/extension-key.pem" -pubout -out "$RUNNER_TEMP/extension-pub.pem"
          "$RUNNER_TEMP/nl" extension pack examples/extensions/java-runtime/build/package --output "$RUNNER_TEMP/java-runtime.nlext" --private-key "$RUNNER_TEMP/extension-key.pem"
          "$RUNNER_TEMP/nl" extension verify "$RUNNER_TEMP/java-runtime.nlext" --public-key "$RUNNER_TEMP/extension-pub.pem"
  go-runtime-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: "Проверить реальный HTTP-брокер Go, постоянное хранение, разрешения, отзыв и безопасность"
        working-directory: services/api
        run: go test -race -count=1 -run 'TestRuntime.*0303' ./internal/extensionhost
      - name: Выполнить регрессионные тесты хоста Go
        working-directory: services/api
        run: go test -count=1 ./internal/extensionhost
      - name: Проверить устойчивость EventBus, повторы, аренду задач очереди и целостность JSON
        working-directory: services/api
        run: go test -race -count=1 -run 'Test.*(0206|0423)' ./internal/eventbus ./internal/repository
      - name: Проверить сохранение документов брокером между перезапусками супервизоров
        working-directory: services/api
        run: go test -race -count=1 -run '^TestRuntimeBrokerDocumentsSurviveSupervisorRestart0423$' ./internal/extensionhost
