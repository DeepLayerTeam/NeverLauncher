name: Миграции состояния Java и долговременное обновление 0.48.10
on:
  push:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionupdates/**'
      - 'services/api/internal/extensionhost/state_checkpoint*'
      - 'services/api/internal/extensionhost/java_host.go'
      - 'services/api/internal/model/extension_updates.go'
      - '.github/workflows/java-state-upgrades.yml'
  pull_request:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionupdates/**'
      - 'services/api/internal/extensionhost/state_checkpoint*'
      - 'services/api/internal/extensionhost/java_host.go'
      - 'services/api/internal/model/extension_updates.go'
      - '.github/workflows/java-state-upgrades.yml'
  workflow_dispatch:

jobs:
  java:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: sh sdk/java/core/build.sh test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/api/go.sum
      - run: go test -race -count=1 ./internal/extensionhost ./internal/extensionupdates ./internal/extensionlifecycle ./internal/repository
        working-directory: services/api
