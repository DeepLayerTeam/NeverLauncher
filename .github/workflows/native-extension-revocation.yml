name: Launcher 0.43.12 — отзыв нативных расширений в ходе работы
on:
  push:
    paths:
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionsecurity/**'
      - 'services/api/internal/extensionpolicy/**'
      - '.github/workflows/native-extension-revocation-04312.yml'
  pull_request:
    paths:
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionsecurity/**'
      - 'services/api/internal/extensionpolicy/**'
      - '.github/workflows/native-extension-revocation-04312.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-process-revocation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: linux
            runner: ubuntu-24.04
          - arch: arm64
            os: linux
            runner: [self-hosted, linux, ARM64, launcher-sandbox]
          - arch: amd64
            os: windows
            runner: windows-2025
          - arch: arm64
            os: windows
            runner: [self-hosted, windows, ARM64, launcher-appcontainer]
          - arch: amd64
            os: darwin
            runner: macos-15-intel
          - arch: arm64
            os: darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Проверка реальной архитектуры и ОС"
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.os }}'
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
      - name: Отозвать доступ действующего нативного процесса CLI и брокера
        shell: bash
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -count=1 -timeout 5m -v ./internal/extensionhost \
            -run 'TestNativeCLIRevocationStopsRunningProcess04312|TestCLIAuthorityPreflightRejectsRevocation04312|TestBrokerResponseRevocation04312'
      - name: "Регрессионные тесты хоста расширений и авторизации"
        shell: bash
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -count=1 -timeout 8m ./internal/extensionhost ./internal/extensionpolicy ./internal/extensionsecurity
  # Изоляция ядра с нативными непривилегированными пространствами имён пользователей и cgroup,
  # подписанным помощником macOS и Windows AppContainer/Job отдельно требуется
  # реальными платформенными процессами и проверкой свидетельств релиза.
  # Проверка супервизора отзыва сама по себе не является сертификацией песочницы.
