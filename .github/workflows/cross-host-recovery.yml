name: Аварийное восстановление между узлами 0.51.9
on:
  push:
    paths:
      - 'scripts/operations/cross_host_recovery.py'
      - 'scripts/operations/test_cross_host_recovery.py'
      - 'scripts/operations/consistent_backup.py'
      - 'scripts/operations/dr.py'
      - 'docs/deployment/cross-host-disaster-recovery.md'
      - '.github/workflows/cross-host-recovery.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-safety-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить восстановленные данные мира, допуск устаревшего узла и безопасность восстановления
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest -v \
            scripts/operations/test_cross_host_recovery.py \
            scripts/operations/test_consistent_backup.py \
            scripts/operations/test_dr.py \
            scripts/operations/test_multi_host.py \
            scripts/operations/test_nn1_compat.py
      - name: "Проверка синтаксиса Python и метаданных релиза"
        run: |
          python3 -m py_compile scripts/operations/cross_host_recovery.py
          python3 scripts/version/manage.py check
