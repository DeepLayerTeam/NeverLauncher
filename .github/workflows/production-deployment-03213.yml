name: DEP09 production deployment 0.32.13
on:
  push:
    paths:
      - 'scripts/install/production-deploy.py'
      - 'scripts/install/test_production_deploy.py'
      - 'deploy/production/**'
      - 'installer/**'
      - '.github/workflows/production-deployment-03213.yml'
  pull_request:
    paths:
      - 'scripts/install/production-deploy.py'
      - 'scripts/install/test_production_deploy.py'
      - 'deploy/production/**'
      - 'installer/**'
      - '.github/workflows/production-deployment-03213.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python deployment tests
        run: |
          python3 -m py_compile scripts/install/production-deploy.py
          python3 -m unittest discover -s scripts/install -p test_production_deploy.py -v
      - uses: actions/setup-go@v7
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.mod
      - name: Signed installer tests
        working-directory: installer
        run: |
          go test -race ./...
          go vet ./...
          go build -o /tmp/launcher-install ./cmd/launcher-install
      - name: Validate compose Standard and Network/HA overlays
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/production/env.production.example /tmp/launcher-dep09.env
          chmod 600 /tmp/launcher-dep09.env
          cat >> /tmp/launcher-dep09.env <<'EOF'
          POSTGRES_PASSWORD=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REDIS_PASSWORD=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON={"ci":"not-production"}
          LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON={"ci":"not-production"}
          LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          LAUNCHER_AUTH_TOKEN_SECRET=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          LAUNCHER_STORAGE_S3_ENDPOINT=https://s3.example.invalid
          LAUNCHER_STORAGE_S3_BUCKET=ci-only
          LAUNCHER_STORAGE_S3_REGION=us-east-1
          LAUNCHER_STORAGE_S3_ACCESS_KEY=ci-access
          LAUNCHER_STORAGE_S3_SECRET_KEY=ci-secret
          LAUNCHER_REPLICA_ID=api-ci
          EOF
          # The compose CLI validates resolved service definitions, not application secrets.
          docker compose --project-name launcher --env-file /tmp/launcher-dep09.env \
            -f deploy/production/docker-compose.yml config --quiet
          docker compose --project-name launcher --env-file /tmp/launcher-dep09.env \
            -f deploy/production/docker-compose.yml \
            -f deploy/production/docker-compose.network-ha.yml \
            --profile network-ha config --quiet
