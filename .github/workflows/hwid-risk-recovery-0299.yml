name: HWID Risk and Recovery 0.29.9
on:
  push:
    paths:
      - 'services/api/internal/httpapi/**'
      - 'services/api/internal/repository/**'
      - 'services/api/internal/dbmigrate/**'
      - 'cli/internal/dbmigrate/**'
      - 'apps/desktop/**'
      - '.github/workflows/hwid-risk-recovery-0299.yml'
  pull_request:
    paths:
      - 'services/api/internal/httpapi/**'
      - 'services/api/internal/repository/**'
      - 'services/api/internal/dbmigrate/**'
      - 'cli/internal/dbmigrate/**'
      - 'apps/desktop/**'
      - '.github/workflows/hwid-risk-recovery-0299.yml'
permissions:
  contents: read
jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: launcher
          POSTGRES_USER: launcher
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U launcher -d launcher' --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEVERLAUNCHER_TEST_POSTGRES_DSN: postgres://launcher:test-only@localhost:5432/launcher?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Build production API
        working-directory: services/api
        run: go build ./cmd/...
      - name: Test HWID risk and actual Postgres cross-replica recovery
        working-directory: services/api
        run: go test -race -count=1 -timeout=12m ./internal/repository ./internal/httpapi ./internal/dbmigrate -run 'TestHWID|TestEvaluateAppliedSealedCatalog'
      - name: Verify CLI migrations and build
        working-directory: cli
        run: go test ./internal/dbmigrate && go build ./cmd/...
      - name: Go vet
        working-directory: services/api
        run: go vet ./internal/httpapi ./internal/repository ./cmd/launcher-api
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri/Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - name: Native hardware continuity hint unit test
        working-directory: apps/desktop/src-tauri
        run: cargo test hwid_risk_0299 -- --nocapture
