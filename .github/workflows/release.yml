name: Manual Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: Verify release inputs without publishing unsigned artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify canonical version and certificates
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/release/test_fetch_exact_certifications.py
          python3 scripts/contracts/validate-openapi.py
      - name: Enforce repository release policy
        run: python3 scripts/smoke/offline/repository-policy.py
