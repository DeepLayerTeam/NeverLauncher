name: Миграция Gravit TextureProvider 0.25.10
on:
  push:
    paths:
      - 'services/api/internal/texturegravit/**'
      - 'services/api/internal/repository/textures_gravit.go'
      - 'services/api/internal/repository/textures_variant2.go'
      - 'services/api/internal/storage/gravit_source.go'
      - 'services/api/cmd/gravit-textures-import/**'
      - 'services/api/internal/dbmigrate/sql/0073_texture_gravit_import.sql'
      - '.github/workflows/gravit-textures.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texture-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Собрать CLI миграции и запустить регрессионные тесты текстур"
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/texturegravit ./cmd/gravit-textures-import ./internal/texturepng ./internal/storage ./internal/dbmigrate ./internal/repository
          go vet ./internal/texturegravit ./cmd/gravit-textures-import ./internal/repository
          go build ./cmd/gravit-textures-import
