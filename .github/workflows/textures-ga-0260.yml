name: Textures & Personalization 0.26.0 GA — externally signed release gate

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        type: string
        required: true
        description: "Run ID holding six independent signed texture/gameplay platform attestations and exact installers"

permissions:
  contents: read
  actions: read

concurrency:
  group: textures-0260-ga-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies, not release signing keys
        run: python3 -m pip install 'cryptography>=43,<47'
      - name: Check exact GA source version and contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.26.0'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
      - name: Attack-test independently signed evidence verifier
        run: python3 -m unittest discover -s scripts/textures -p 'test_*.py' -v

  texture-integration:
    uses: ./.github/workflows/texture-certification-02512.yml

  verify-production-evidence:
    needs: [source-validation, texture-integration]
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'cryptography>=43,<47'
      - name: Download independent six-platform signed execution evidence
        uses: actions/download-artifact@v8
        with:
          pattern: textures-ga-0260-*
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/textures-ga-0260-raw
          merge-multiple: false
      - name: Arrange platform folders — fail if any target missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/textures-ga-0260-evidence
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            source="dist/textures-ga-0260-raw/textures-ga-0260-${target}"
            test -d "$source" || { echo "Missing independent platform evidence: ${target}" >&2; exit 1; }
            mv "$source" "dist/textures-ga-0260-evidence/${target}"
          done
      - name: Verify actual execution, signatures, installer hashes and source binding
        shell: bash
        env:
          TRUSTED_TEXTURE_GA_KEY: ${{ vars.NEVERLAUNCHER_TEXTURE_GA_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "${#TRUSTED_TEXTURE_GA_KEY}" -eq 64
          python3 scripts/textures/ga_gate_0260.py \
            --evidence dist/textures-ga-0260-evidence \
            --trusted-public-key "$TRUSTED_TEXTURE_GA_KEY" \
            --commit "$GITHUB_SHA" \
            --output dist/textures-ga-0260-verdict.json
      - name: Archive approval verdict, including refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textures-ga-0260-verdict-${{ github.sha }}
          path: dist/textures-ga-0260-verdict.json
          if-no-files-found: warn
          retention-days: 90

# Deliberately no automatic signing/publishing job. Successful unit tests and
# dispatch permissions cannot self-create native game evidence. An authorized
# release operator must verify attestations and publish signed installers.
