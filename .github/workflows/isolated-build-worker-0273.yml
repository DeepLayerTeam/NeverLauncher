name: Isolated Build Worker 0.27.3
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/isolated-build-worker-0273.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/isolated-build-worker-0273.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  worker-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Go format
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cli/cmd/launcher/isolated_build_worker_0273*.go cli/cmd/launcher/forge_runtime.go cli/cmd/launcher/forge_processor_recovery.go cli/cmd/launcher/client_factory_0271.go)"
      - name: Worker, recovery and real materializer fixtures
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestProcessorWorker0273|TestForgeProcessorRecovery0273|TestForgeAndNeoForgeProcessorMaterializers|TestClientFactory0271|TestForgeLegacy|TestFabricAndQuiltMaterializersProduceConsumableClientTree'
          -count=1 -timeout=5m
      - name: Go vet
        working-directory: cli
        run: go vet ./cmd/launcher
      - name: CLI build
        working-directory: cli
        run: go build ./cmd/launcher
      - name: Linux worker race tests
        if: runner.os == 'Linux'
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestProcessorWorker0273|TestForgeProcessorRecovery0273' -count=1 -timeout=5m
