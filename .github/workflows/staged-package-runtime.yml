# ТОЛЬКО НАБЛЮДЕНИЕ. Нельзя публиковать, подписывать или повышать статус результата CI
# до ValidationEvidence. Требуется доверенный независимый аттестатор хоста 0.34.5.
name: Подготовленный пакет, настоящая авторизация и игровой процесс (только наблюдение)
on:
  workflow_call:
    inputs:
      package_id:
        required: true
        type: string
      runtime_seconds:
        required: false
        type: number
        default: 180
  workflow_dispatch:
    inputs:
      package_id:
        description: ID существующего подписанного подготовленного пакета Backend, прошедшего проверку целостности
        required: true
        type: string
      runtime_seconds:
        description: Максимальное время реального запуска Minecraft с GUI (15–3600 секунд)
        required: true
        type: number
        default: 180
permissions:
  contents: read
jobs:
  actual-staged-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: runtime-validation-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - name: Установить графические библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libvulkan1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxcursor1 libxinerama1 libasound2t64 x11-utils mesa-utils scrot imagemagick tesseract-ocr tesseract-ocr-eng xdotool
      - name: Отклонить ложные доказательства запуска и проверить операции агента
        run: |
          python3 e2e/scripts/test_staged_readiness.py
          python3 e2e/scripts/test_run_staged_package.py
          python3 e2e/scripts/test_staged_matching.py
          python3 e2e/scripts/test_staged_auth.py
          python3 e2e/scripts/test_staged_lifecycle.py
      - name: Собрать исполняемые файлы CLI и Runtime без сборки клиента Minecraft
        run: |
          cd cli && go build -o ../nl ./cmd/launcher
          cd ..
          cargo build --release --manifest-path runtime/runtime/Cargo.toml --bin runtime
      - name: Установить точное подготовленное содержимое через транзакционный установщик и Runtime
        env:
          STAGED_BACKEND: ${{ vars.NL_STAGED_BACKEND_URL }}
          STAGED_OPERATOR: ${{ secrets.NL_STAGED_RUNNER_OPERATOR_TOKEN }}
          STAGED_PACKAGE_ID: ${{ inputs.package_id }}
          STAGED_DURATION: ${{ inputs.runtime_seconds }}
          STAGED_MANIFEST_KEY: ${{ vars.NL_STAGED_MANIFEST_PUBLIC_KEY }}
          PREVIOUS_BUNDLE_URL: ${{ vars.NL_VALIDATION_PREVIOUS_BUNDLE_URL }}
          PREVIOUS_BUNDLE_SHA256: ${{ vars.NL_VALIDATION_PREVIOUS_BUNDLE_SHA256 }}
          REPLACEMENT_JAVA: ${{ vars.NL_VALIDATION_REPLACEMENT_JAVA }}
          MANAGED_JRE_BUNDLE_URL: ${{ vars.NL_VALIDATION_MANAGED_JRE_BUNDLE_URL }}
          MANAGED_JRE_BUNDLE_SHA256: ${{ vars.NL_VALIDATION_MANAGED_JRE_BUNDLE_SHA256 }}
          MANAGED_JRE_MANIFEST_SHA256: ${{ vars.NL_VALIDATION_MANAGED_JRE_MANIFEST_SHA256 }}
          SERVER_BUNDLE_URL: ${{ vars.NL_MATCHING_SERVER_BUNDLE_URL }}
          SERVER_BUNDLE_SHA256: ${{ vars.NL_MATCHING_SERVER_BUNDLE_SHA256 }}
          SERVER_ENTRY: ${{ vars.NL_MATCHING_SERVER_ENTRY }}
          BRIDGE_PATH: ${{ vars.NL_MATCHING_BRIDGE_PATH }}
          BRIDGE_SHA256: ${{ vars.NL_MATCHING_BRIDGE_SHA256 }}
          BRIDGE_VERSION: ${{ vars.NL_MATCHING_BRIDGE_VERSION }}
          AUTH_MODE: ${{ vars.NL_VALIDATION_AUTH_MODE }}
          AUTH_CREDENTIAL: ${{ secrets.NL_VALIDATION_TEST_CREDENTIALS_JSON }}
          AUTH_NEGATIVE: ${{ secrets.NL_VALIDATION_NEGATIVE_CREDENTIALS_JSON }}
          AUTH_GUARD_DENIED: ${{ secrets.NL_VALIDATION_GUARD_DENIED_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          test -n "$STAGED_BACKEND" && test -n "$STAGED_OPERATOR" && test -n "$STAGED_PACKAGE_ID" && test -n "$STAGED_MANIFEST_KEY"
          export LIBGL_ALWAYS_SOFTWARE=1
          # Только диагностика CI: временные данные промежуточной среды; доверенную официальную
          # цепочку OAuth выполняет независимый аттестатор.
          [[ "$AUTH_MODE" == official || "$AUTH_MODE" == custom ]] || { echo 'Отсутствует реальный режим провайдера V07' >&2; exit 2; }
          [[ -n "$AUTH_CREDENTIAL" ]] || { echo 'Отсутствуют учётные данные реального промежуточного стенда; имитация запрещена' >&2; exit 2; }
          umask 077
          AUTH_DIR="$(mktemp -d "$RUNNER_TEMP/nl-auth.XXXXXXXX")"
          trap 'rm -rf "$AUTH_DIR"' EXIT
          printf '%s' "$AUTH_CREDENTIAL" > "$AUTH_DIR/credentials.json"
          NEGATIVE_ARG=()
          GUARD_ARG=()
          if [[ "$AUTH_MODE" == custom ]]; then
            [[ -n "$AUTH_NEGATIVE" && -n "$AUTH_GUARD_DENIED" ]] || { echo 'Отсутствуют негативные сценарии сеансов пользовательской авторизации' >&2; exit 2; }
            printf '%s' "$AUTH_NEGATIVE" > "$AUTH_DIR/negative.json"
            printf '%s' "$AUTH_GUARD_DENIED" > "$AUTH_DIR/guard-denied.json"
            NEGATIVE_ARG=(--negative-credentials-file "$AUTH_DIR/negative.json")
            GUARD_ARG=(--guard-denied-credentials-file "$AUTH_DIR/guard-denied.json")
          fi
          # Предыдущий релиз должен быть утверждённым, независимо подписанным и
          # неизменяемым пакетом. Установка только текущей версии не проходит V09.
          [[ "$PREVIOUS_BUNDLE_URL" == https://* ]] || { echo 'Отсутствует HTTPS-адрес предыдущего подписанного релиза V09' >&2; exit 2; }
          [[ "$PREVIOUS_BUNDLE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Отсутствует SHA-256 предыдущего релиза V09' >&2; exit 2; }
          [[ -n "$REPLACEMENT_JAVA" && -x "$REPLACEMENT_JAVA" ]] || { echo 'Отсутствует отдельный исполняемый файл Java для V09' >&2; exit 2; }
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 600 --output "$RUNNER_TEMP/previous-signed-release.zip" "$PREVIOUS_BUNDLE_URL"
          echo "$PREVIOUS_BUNDLE_SHA256  $RUNNER_TEMP/previous-signed-release.zip" | sha256sum -c - >/dev/null
          # Тот же промышленный установщик управляемой Java в Runtime должен
          # поместить в карантин и переустановить намеренно повреждённый подписанный бинарный файл Java.
          [[ "$MANAGED_JRE_BUNDLE_URL" == https://* ]] || { echo 'Отсутствует URL закреплённого пакета управляемой JRE V09' >&2; exit 2; }
          [[ "$MANAGED_JRE_BUNDLE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Отсутствует SHA-256 пакета управляемой JRE V09' >&2; exit 2; }
          [[ "$MANAGED_JRE_MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Отсутствует SHA-256 манифеста управляемой JRE V09' >&2; exit 2; }
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 600 --output "$RUNNER_TEMP/managed-jre-bundle.zip" "$MANAGED_JRE_BUNDLE_URL"
          echo "$MANAGED_JRE_BUNDLE_SHA256  $RUNNER_TEMP/managed-jre-bundle.zip" | sha256sum -c - >/dev/null
          mkdir -m 0700 "$RUNNER_TEMP/managed-jre-bundle"
          unzip -q "$RUNNER_TEMP/managed-jre-bundle.zip" -d "$RUNNER_TEMP/managed-jre-bundle"
          test -f "$RUNNER_TEMP/managed-jre-bundle/MANAGED_JRE_MANIFEST.json" || exit 2
          echo "$MANAGED_JRE_MANIFEST_SHA256  $RUNNER_TEMP/managed-jre-bundle/MANAGED_JRE_MANIFEST.json" | sha256sum -c - >/dev/null
          # Серверы, отличные от Vanilla, должны использовать полный внешний
          # закреплённый серверный дистрибутив. Нельзя подменять его клиентом.
          SERVER_BUNDLE=""
          if [[ -n "$SERVER_BUNDLE_URL" ]]; then
            [[ "$SERVER_BUNDLE_URL" == https://* ]] || { echo 'URL серверного пакета должен использовать HTTPS' >&2; exit 1; }
            [[ "$SERVER_BUNDLE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Отсутствует SHA-256 серверного пакета' >&2; exit 1; }
            SERVER_BUNDLE="$RUNNER_TEMP/staged-matching-server.zip"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-time 300 --output "$SERVER_BUNDLE" "$SERVER_BUNDLE_URL"
            echo "$SERVER_BUNDLE_SHA256  $SERVER_BUNDLE" | sha256sum -c - >/dev/null
          fi
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            python3 e2e/scripts/run-staged-package.py \
              --backend "$STAGED_BACKEND" --admin-token "$STAGED_OPERATOR" \
              --package-id "$STAGED_PACKAGE_ID" --output "$RUNNER_TEMP/staged-execution" \
              --cli "$GITHUB_WORKSPACE/nl" \
              --runtime "$GITHUB_WORKSPACE/runtime/runtime/target/release/runtime" \
              --java auto --pinned-public-key "$STAGED_MANIFEST_KEY" --runtime-seconds "$STAGED_DURATION" \
              --auth-mode "$AUTH_MODE" --credentials-file "$AUTH_DIR/credentials.json" \
              --previous-bundle "$RUNNER_TEMP/previous-signed-release.zip" \
              --previous-sha256 "$PREVIOUS_BUNDLE_SHA256" --replacement-java "$REPLACEMENT_JAVA" \
              --managed-java-manifest "$RUNNER_TEMP/managed-jre-bundle/MANAGED_JRE_MANIFEST.json" \
              --managed-java-sha256 "$MANAGED_JRE_MANIFEST_SHA256" \
              "${NEGATIVE_ARG[@]}" "${GUARD_ARG[@]}" \
              --server-bundle "$SERVER_BUNDLE" --server-sha256 "$SERVER_BUNDLE_SHA256" \
              --server-entry "$SERVER_ENTRY" --bridge-path "$BRIDGE_PATH" --bridge-sha256 "$BRIDGE_SHA256" --bridge-version "$BRIDGE_VERSION"
      - name: Загрузить обезличенные наблюдения без выдачи прав и закрытого ключа
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-runtime-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/staged-execution/staged-execution.json
            ${{ runner.temp }}/staged-execution/verified.json
            ${{ runner.temp }}/staged-execution/runtime-launch.json
            ${{ runner.temp }}/staged-execution/startup-readiness.json
            ${{ runner.temp }}/staged-execution/startup-diagnostics/menu-frame-*.png
            ${{ runner.temp }}/staged-execution/authentication.json
            ${{ runner.temp }}/staged-execution/server-readiness.json
            ${{ runner.temp }}/staged-execution/matching-server.log
            ${{ runner.temp }}/staged-execution/gameplay-smoke.json
            ${{ runner.temp }}/staged-execution/gameplay-diagnostics/world-*.png
            ${{ runner.temp }}/staged-execution/runtime-gameplay-launch.json
            ${{ runner.temp }}/staged-execution/update-recovery.json
            ${{ runner.temp }}/staged-execution/lifecycle-validation/rollback-launch.json
            ${{ runner.temp }}/staged-execution/lifecycle-validation/java-replacement-launch.json
            ${{ runner.temp }}/staged-execution/lifecycle-validation/managed-java-repair-launch.json
