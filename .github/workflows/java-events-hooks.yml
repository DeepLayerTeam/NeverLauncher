name: Расширенные события Java 0.48.7
on:
  push:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/eventbus/**'
      - 'services/api/internal/extensionhost/**'
      - '.github/workflows/java-events-hooks.yml'
  pull_request:
  workflow_dispatch:
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17','21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Запустить реальные тесты Java SDK и обратных вызовов
        run: sh sdk/java/core/build.sh test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: services/api/go.sum
      - name: Проверить гонки EventBus и процесса наблюдения
        working-directory: services/api
        run: go test -race ./internal/eventbus ./internal/extensionhost
