name: Guard 0.51.0 — независимые регрессии допуска окончательных файлов GA
on:
  push:
    paths:
      - 'scripts/guard_ci/guard_ga.py'
      - 'scripts/guard_ci/native_signed.py'
      - 'scripts/guard_ci/reviewer_sign.py'
      - 'scripts/guard_ci/test_guard_ga.py'
      - 'scripts/release/check_payload.py'
      - 'scripts/release/delivery_verify.py'
      - 'reproducibility/primary-payload.json'
      - '.github/workflows/guard-final-ga.yml'
      - '.github/workflows/production-release-candidate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-regressions:
    name: Автономные проверки враждебных свидетельств и поставки с привязкой к версии (не сертификация GA)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить закреплённые независимые подпись верификатор
        run: python3 -m pip install cryptography==46.0.4
      - name: Проверить изменение подписей, устаревшие или повторные разрешения и заблокированные платформы
        run: PYTHONPATH=scripts/guard_ci python3 -m unittest scripts/guard_ci/test_guard_ga.py -v
      - name: Проверить инвентаризацию фактически выпускаемых пакетов конкретной версии
        run: python3 -m unittest discover -s scripts/release -p 'test_check_payload.py' -v
      - name: "Проверить отклонение существующих теневых свидетельств Guard и свидетельств кадров"
        run: python3 scripts/guard_ci/test_adversarial_pilot.py
      - name: Проверить существующие свидетельства испытаний на шести нативных игровых платформах
        run: python3 -m unittest discover -s scripts/ga -p 'test_verify_six_native_game.py' -v
