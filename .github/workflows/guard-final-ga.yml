name: Guard 0.51.0 — независимые регрессии допуска окончательных файлов GA
on:
  push:
    paths:
      - 'scripts/guard_ci/guard_ga_0510.py'
      - 'scripts/guard_ci/native_signed_0510.py'
      - 'scripts/guard_ci/reviewer_sign_0510.py'
      - 'scripts/guard_ci/test_guard_ga_0510.py'
      - 'scripts/release/check_payload_0461.py'
      - 'scripts/release/delivery_verify_0462.py'
      - 'reproducibility/primary-payload.json'
      - '.github/workflows/guard-final-ga-0510.yml'
      - '.github/workflows/production-release-candidate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-regressions:
    name: Offline hostile-evidence and version-bound delivery checks (NOT GA certification)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить закреплённых независимая подписи верификатора
        run: python3 -m pip install cryptography==46.0.4
      - name: тестировать подписи tampering, устаревших/replayed approvals, blocked платформы результатов
        run: PYTHONPATH=scripts/guard_ci python3 -m unittest scripts/guard_ci/test_guard_ga_0510.py -v
      - name: Проверить инвентаризацию реальных пакетов конкретных версий
        run: python3 -m unittest discover -s scripts/release -p 'test_check_payload_0461.py' -v
      - name: тестировать существующих Guard shadow и кадра подтверждений отклонения
        run: python3 scripts/guard_ci/test_adversarial_pilot_05012.py
      - name: Проверить существующий верификатор подтверждений для шести нативных игровых платформ
        run: python3 -m unittest discover -s scripts/ga -p 'test_verify_six_native_game_0440.py' -v
