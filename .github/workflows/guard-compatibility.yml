name: Guard 0.50.2 — подписанная политика совместимости
on:
  push:
    paths:
      - 'cli/cmd/launcher/guard_compat_policy*'
      - 'cli/cmd/launcher/trusted_jvm.go'
      - 'cli/cmd/launcher/legacy_client_adapters.go'
      - 'cli/cmd/guard-policy-sign/**'
      - 'sdk/java/trusted-agent/**'
      - 'runtime/runtime/**'
      - '.github/workflows/guard-compatibility.yml'
  pull_request:
    paths:
      - 'cli/cmd/launcher/guard_compat_policy*'
      - 'cli/cmd/launcher/trusted_jvm.go'
      - 'cli/cmd/launcher/legacy_client_adapters.go'
      - 'cli/cmd/guard-policy-sign/**'
      - 'sdk/java/trusted-agent/**'
      - 'runtime/runtime/**'
      - '.github/workflows/guard-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-policy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2022, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
          - { runner: macos-15-intel, target: macos-x64 }
          - { runner: macos-15, target: macos-arm64 }
    name: '${{ matrix.target }} — проверка подписанной среды выполнения'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Проверить регрессии реальной интеграции политик и агента
        working-directory: cli
        run: go test ./cmd/launcher -run '^(TestGuardCompatibility0502|TestTrustedJVM0306)' -count=1
      - name: "Автономные тесты подписи и генерации ключей"
        working-directory: cli
        run: go test ./cmd/guard-policy-sign -count=1
      - name: "Испытать нативную политику Guard на Rust и интеграцию с доверенной JVM"
        run: |
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib guard_compatibility_0502
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib guarded_trusted_launch_0503
