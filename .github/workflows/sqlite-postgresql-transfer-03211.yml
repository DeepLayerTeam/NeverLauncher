name: SQLite to PostgreSQL verified staging transfer 0.32.11
on:
  push:
    paths:
      - 'services/api/internal/sqlitepg/**'
      - 'services/api/internal/sqlitecore/**'
      - 'services/api/internal/sqlitedurable/**'
      - 'services/api/cmd/neverlauncher-sqlite/**'
      - 'services/api/go.mod'
      - 'services/api/go.sum'
      - '.github/workflows/sqlite-postgresql-transfer-03211.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neverlauncher_migration_test
          POSTGRES_USER: neverlauncher_test
          POSTGRES_PASSWORD: test-only-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neverlauncher_test -d neverlauncher_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      NEVERLAUNCHER_PG_TEST_DSN: postgres://neverlauncher_test:test-only-secret@127.0.0.1:5432/neverlauncher_migration_test?sslmode=disable
      NEVERLAUNCHER_POSTGRES_DSN: postgres://neverlauncher_test:test-only-secret@127.0.0.1:5432/neverlauncher_migration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Ensure supported local filesystem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nl-03211"
          chmod 0700 "$RUNNER_TEMP/nl-03211"
          fstype=$(stat -f -c '%T' "$RUNNER_TEMP/nl-03211")
          case "$fstype" in ext2/ext3|ext4|xfs|btrfs) ;; *) echo "Unsupported filesystem $fstype"; exit 1;; esac
          echo "TMPDIR=$RUNNER_TEMP/nl-03211" >> "$GITHUB_ENV"
      - name: Static checks and full native dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          test -z "$(gofmt -l internal/sqlitepg cmd/neverlauncher-sqlite)"
          go vet ./internal/sqlitepg ./cmd/neverlauncher-sqlite
      - name: Native SQLite to PostgreSQL roundtrip and negative tests
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=20m -v ./internal/sqlitepg
      - name: CLI end to end and mandatory second-run rejection
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/nl-sqlite" ./cmd/neverlauncher-sqlite
          mkdir -p "$TMPDIR/cli" && chmod 0700 "$TMPDIR/cli"
          "$RUNNER_TEMP/nl-sqlite" core-init --db "$TMPDIR/cli/core.db"
          "$RUNNER_TEMP/nl-sqlite" backup --db "$TMPDIR/cli/core.db" --backup "$TMPDIR/cli/backup.db"
          "$RUNNER_TEMP/nl-sqlite" sqlite-to-postgres --backup "$TMPDIR/cli/backup.db" --ack-staging-only > "$TMPDIR/report.json"
          python3 - "$TMPDIR/report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['sqliteSchema']==326
          assert r['readyForBackendCutover'] is False
          assert len(r['tables']) >= 30
          PY
          if "$RUNNER_TEMP/nl-sqlite" sqlite-to-postgres --backup "$TMPDIR/cli/backup.db" --ack-staging-only; then
             echo 'ERROR: existing staging schema was overwritten'; exit 1
          fi
