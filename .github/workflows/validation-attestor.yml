name: V04 V06 V07 V08 V09 — доверенная аттестация, настоящая авторизация и опциональная матрица
on:
  push:
    paths:
      - 'tools/validation-attestor/**'
      - 'e2e/scripts/**'
      - 'services/api/internal/httpapi/validation_attestation*'
      - 'services/api/internal/httpapi/validation_component_matrix*'
      - 'runtime/runtime/src/bin/runtime.rs'
      - 'runtime/runtime/src/transactional_release.rs'
      - 'tools/validation-attestor/official_chain.py'
      - 'services/api/internal/httpapi/validation_*0346*'
      - 'services/api/internal/repository/validation_*0346*'
      - 'services/api/internal/dbmigrate/sql/0104*'
      - 'services/api/internal/dbmigrate/sql/0106*'
      - 'services/api/internal/httpapi/*03412*'
      - 'services/api/internal/repository/*03412*'
      - 'cli/internal/dbmigrate/catalog.zip'
      - '.github/workflows/validation-attestor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Проверить независимый аттестатор, подмену данных и игровой процесс
        run: |
          python3 -m pip install --break-system-packages 'cryptography>=44,<47'
          python3 tools/validation-attestor/test_attestor.py
          python3 tools/validation-attestor/test_diagnostics.py
          python3 tools/validation-attestor/test_component_matrix.py
          python3 tools/validation-attestor/test_official_chain.py
          python3 e2e/scripts/test_staged_auth.py
          python3 e2e/scripts/test_run_staged_package.py
          python3 e2e/scripts/test_staged_negative.py
          python3 e2e/scripts/test_staged_readiness.py
          python3 e2e/scripts/test_staged_matching.py
          python3 e2e/scripts/test_staged_lifecycle.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Запустить реальные тесты обновления и восстановления CLI, включая SIGKILL
        run: |
          cd cli && go build -o "$RUNNER_TEMP/launcher" ./cmd/launcher
          cd ..
          NL349_CLI="$RUNNER_TEMP/launcher" python3 e2e/scripts/test_staged_lifecycle.py
      - name: Проверить автономный импорт Runtime, контроль хеш-сумм и откат файлов
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --lib offline_staged_adoption
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: "Проверить закрепление ключей Ed25519 в Backend и неизменяемость аттестаций"
        run: |
          cd services/api
          go test ./internal/httpapi ./internal/repository -run 'TestV05|TestV08|TestV11|TestV12|TestTrustedAttestation|TestAttestationRepositoryImmutable|TestStagedGrantRejectsStale' -count=1
  # В сборках и тестах CI НИКОГДА нет ключа подписи аттестации хоста.
  # Изолированный закреплённый OCI-образ собирается и утверждается в отдельном
  # контролируемом оператором конвейере; аттестовать разрешено только его хеш.
