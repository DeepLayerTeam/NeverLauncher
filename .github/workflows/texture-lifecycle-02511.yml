name: Texture Lifecycle & Recovery 0.25.11
on:
  push:
    paths:
      - 'services/api/internal/storage/texture*'
      - 'services/api/internal/repository/textures_lifecycle_02511*'
      - 'services/api/cmd/texture-maintenance-0253/**'
      - 'services/api/internal/dbmigrate/sql/0074_texture_lifecycle_recovery_02511.sql'
      - '.github/workflows/texture-lifecycle-02511.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texture-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: texture_test
          POSTGRES_USER: texture_test
          POSTGRES_DB: texture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U texture_test -d texture_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - name: Compile maintenance and run real PostgreSQL + storage tests
        working-directory: services/api
        env:
          TEST_PG_DSN_02511: postgres://texture_test:texture_test@localhost:5432/texture_test?sslmode=disable
        run: |
          go test -race -count=1 ./internal/storage ./internal/dbmigrate ./internal/repository
          go vet ./internal/storage ./internal/dbmigrate ./internal/repository ./cmd/texture-maintenance-0253
          go build -o /tmp/texture-maintenance-02511 ./cmd/texture-maintenance-0253
