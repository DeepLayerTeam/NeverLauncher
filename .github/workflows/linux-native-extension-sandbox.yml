name: Нативная изоляция расширений Linux 0.31.9
on:
  push:
    paths:
      - 'services/api/internal/linuxsandbox/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionpolicy/**'
      - '.github/workflows/linux-native-extension-sandbox-0319.yml'
  pull_request:
    paths:
      - 'services/api/internal/linuxsandbox/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionpolicy/**'
      - '.github/workflows/linux-native-extension-sandbox-0319.yml'
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: песочницы и Extension хоста модульные тесты
        working-directory: services/api
        run: go test -race -count=1 ./internal/linuxsandbox ./internal/extensionpolicy ./internal/extensionhost ./internal/extensionlifecycle
      - name: Проверить сборку и безопасности политики
        working-directory: services/api
        run: go vet ./internal/linuxsandbox ./internal/extensionpolicy ./internal/extensionhost
# Приёмка аппаратных средств и ядра требует отдельного собственного раннера с
# выделенной непривилегированной служебной учётной записью и заранее
# делегированными cgroups v2. На раннерах GitHub параметр
# NL_RUN_LIVE_LINUX_SANDBOX=1 не задаётся.
