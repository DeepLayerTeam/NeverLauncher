name: Жизненный цикл нескольких официальных учётных записей Minecraft 0.26.7
on:
  push:
    paths:
      - 'apps/desktop/src-tauri/src/official_identity.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/desktop/src/official_minecraft.ts'
      - 'apps/desktop/src/OfficialMinecraftPanel.tsx'
      - 'apps/desktop/tests/official_minecraft.test.mjs'
      - '.github/workflows/multi-account-lifecycle.yml'
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/tests/**'
      - '.github/workflows/multi-account-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-account:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Установить нативные зависимости Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Проверить нативный каталог учётных записей, миграции и безопасность
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_identity_0262::tests
      - name: Проверить нативное обновление провайдера и идентификацию
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_exchange_0265::tests
      - name: Скомпилировать Rust/Tauri
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Установить Desktop зависимости
        working-directory: apps/desktop
        run: npm ci
      - name: Проверить интерфейс выбора и выхода из учётных записей
        working-directory: apps/desktop
        run: npm run test:official
      - name: Запустить регрессионные проверки интеграции текстур
        working-directory: apps/desktop
        run: npm run test:textures
      - name: Собрать пакет Desktop
        working-directory: apps/desktop
        run: npm run build
