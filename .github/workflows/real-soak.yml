name: 0.53.0 — реальные часовые испытания Minecraft и HTTPS
on:
  push:
    paths:
      - 'scripts/acceptance/soak_05211.py'
      - 'scripts/acceptance/sweep_05211.py'
      - 'scripts/acceptance/test_soak_05211.py'
      - 'scripts/acceptance/test_sweep_05211.py'
      - '.github/workflows/real-soak-05211.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-soak-05212-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'cryptography>=42,<47'
          python -m unittest -v scripts/acceptance/test_soak_05211.py scripts/acceptance/test_sweep_05211.py scripts/release/test_independent_current_05211.py
          python scripts/version/manage.py check

  real-game-soak:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: regression
    environment: compatibility-soak-lab
    runs-on: [self-hosted, linux, x64, gameplay-soak]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [vanilla-26.3-linux-x64, fabric-26.3-linux-x64, quilt-26.3-linux-x64, forge-26.3-linux-x64, neoforge-26.2-linux-x64]
    env:
      LAUNCHER_ACCEPTANCE_DISPOSABLE: '1'
      LAUNCHER_E2E_JAVA: ${{ vars.LAUNCHER_SOAK_JAVA25 }}
      LAUNCHER_E2E_SERVER_PINS: ${{ vars.LAUNCHER_E2E_SERVER_PINS_PATH }}
      LAUNCHER_E2E_SERVER_BUNDLE_DIR: ${{ vars.LAUNCHER_E2E_SERVER_BUNDLE_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - name: Запустить 8+ реального Minecraft клиент/сервер сеансы на протяжении не менее одного часа
        env:
          TARGET_ID: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LAUNCHER_E2E_JAVA" && test -x "$LAUNCHER_E2E_JAVA"
          python scripts/acceptance/soak_05211.py game \
            --target-id "$TARGET_ID" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --min-seconds 3600 --min-sessions 8 --max-sessions 100 \
            --output "$RUNNER_TEMP/soak-$TARGET_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: game-soak-05212-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soak-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  real-https-soak:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: regression
    environment: compatibility-soak-lab
    runs-on: [self-hosted, linux, x64, load-soak]
    timeout-minutes: 160
    env:
      LAB_HTTPS_URL: ${{ vars.LAUNCHER_SOAK_HTTPS_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Выполнить параллельные фактические HTTPS Backend запросы для не менее одного часа
        run: |
          set -euo pipefail
          test -n "$LAB_HTTPS_URL"
          python scripts/acceptance/soak_05211.py http \
            --url "$LAB_HTTPS_URL" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --min-seconds 3600 --concurrency 8 --min-requests 10000 \
            --max-p95-ms 1500 --output "$RUNNER_TEMP/soak-https"
      - uses: actions/upload-artifact@v4
        with:
          name: https-soak-05212-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soak-https/
          if-no-files-found: error
          retention-days: 30

  independent-review:
    if: always() && github.event_name == 'workflow_dispatch' && needs.real-game-soak.result == 'success' && needs.real-https-soak.result == 'success'
    needs: [real-game-soak, real-https-soak]
    environment: independent-soak-review
    runs-on: [self-hosted, linux, x64, independent-review]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - uses: actions/download-artifact@v4
        with:
          pattern: game-soak-05212-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw-game-soaks
      - uses: actions/download-artifact@v4
        with:
          name: https-soak-05212-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw-https-soak
      - name: независимо Повторить и Подписать каждый исходные Запустить
        env:
          REVIEW_PRIVATE_PEM: ${{ secrets.LAUNCHER_SOAK_REVIEW_PRIVATE_PEM }}
          REVIEW_PUBLIC_PEM: ${{ vars.LAUNCHER_SOAK_REVIEW_PUBLIC_PEM }}
          REVIEW_PUBLIC_SHA: ${{ vars.LAUNCHER_SOAK_REVIEW_PUBLIC_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REVIEW_PRIVATE_PEM" && test -n "$REVIEW_PUBLIC_PEM" && test -n "$REVIEW_PUBLIC_SHA"
          umask 077
          printf '%s\n' "$REVIEW_PRIVATE_PEM" > "$RUNNER_TEMP/soak-secret.pem"
          printf '%s\n' "$REVIEW_PUBLIC_PEM" > "$RUNNER_TEMP/soak-public.pem"
          trap 'rm -f "$RUNNER_TEMP/soak-secret.pem" "$RUNNER_TEMP/soak-public.pem"' EXIT
          mkdir -p "$RUNNER_TEMP/signed-soaks"
          shopt -s nullglob
          samples=("$RUNNER_TEMP"/raw-game-soaks/game-soak-05212-*-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT")
          test "${#samples[@]}" -eq 5
          for source in "${samples[@]}"; do
            target="$(basename "$source")"
            target="${target#game-soak-05212-}"
            target="${target%-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
            case "$target" in
              vanilla-26.3-linux-x64|fabric-26.3-linux-x64|quilt-26.3-linux-x64|forge-26.3-linux-x64|neoforge-26.2-linux-x64) ;;
              *) exit 3 ;;
            esac
            cp -a "$source" "$RUNNER_TEMP/signed-soaks/$target"
            python scripts/acceptance/soak_review_05211.py \
              --report-dir "$RUNNER_TEMP/signed-soaks/$target" \
              --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
              --mode game --private-key "$RUNNER_TEMP/soak-secret.pem" \
              --public-key "$RUNNER_TEMP/soak-public.pem" --pin "$REVIEW_PUBLIC_SHA"
          done
          cp -a "$RUNNER_TEMP/raw-https-soak" "$RUNNER_TEMP/signed-soaks/https"
          python scripts/acceptance/soak_review_05211.py \
            --report-dir "$RUNNER_TEMP/signed-soaks/https" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --mode https --private-key "$RUNNER_TEMP/soak-secret.pem" \
            --public-key "$RUNNER_TEMP/soak-public.pem" --pin "$REVIEW_PUBLIC_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: independently-signed-soaks-05212-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-soaks/
          if-no-files-found: error
          retention-days: 90
