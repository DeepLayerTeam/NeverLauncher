name: Gravit Migration Reports and RC Review 0.33.13
on:
  push:
    paths:
      - 'services/api/internal/gravitreport/**'
      - 'services/api/internal/repository/migration_report_03313*'
      - 'services/api/internal/httpapi/migration_report_03313.go'
      - 'services/api/internal/httpapi/handler.go'
      - 'services/api/internal/dbmigrate/sql/0100*'
      - 'cli/cmd/launcher/migration_report_03313*'
      - 'apps/admin/src/admin/MigrationCenter0331.tsx'
      - 'services/api/internal/embeddedadmin/site/**'
      - 'schemas/openapi*'
      - '.github/workflows/gravit-migration-reports-03313.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-rc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U launcher_test -d launcher_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEVERLAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:test_only_not_production@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Deterministic report unit/race tests and PostgreSQL integration
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/gravitreport
          go test -race -count=1 ./internal/repository -run '^TestMigrationReportPostgres03313$'
          go test -run '^$' ./internal/httpapi
      - name: Full backend build
        working-directory: services/api
        run: go build ./...
      - name: CLI build and HTTP tests
        working-directory: cli
        run: |
          go test -count=1 ./cmd/launcher -run '^TestMigrationReportCLI03313$'
          go build ./cmd/launcher
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Admin production build
        working-directory: apps/admin
        run: |
          npm ci
          npm run build
      - name: Contract and canonical version
        run: |
          python3 scripts/contracts/validate-openapi.py
          python3 scripts/version/manage.py check
      - name: Explicit RC limitation
        run: echo 'CI unit/integration success is not evidence of a real isolated Gravit/Minecraft E2E or production certification.'
