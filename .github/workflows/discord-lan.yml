name: Расширенный статус Discord и обнаружение локальной сети 0.30.8
on:
  push:
    paths:
      - 'cli/internal/discordrpc/**'
      - 'cli/internal/lanmdns/**'
      - 'cli/cmd/launcher/lan_discord*'
      - 'cli/cmd/launcher/main.go'
      - 'apps/desktop/src-tauri/src/discord_presence.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/desktop/src/main.tsx'
      - '.github/workflows/discord-lan.yml'
  pull_request:
    paths:
      - 'cli/internal/discordrpc/**'
      - 'cli/internal/lanmdns/**'
      - 'cli/cmd/launcher/lan_discord*'
      - 'cli/cmd/launcher/main.go'
      - 'apps/desktop/src-tauri/src/discord_presence.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/desktop/src/main.tsx'
      - '.github/workflows/discord-lan.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"

jobs:
  cli-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Проверить Discord IPC и закрепление доверия DNS-SD/TLS
        working-directory: cli
        run: go test -race -count=1 -timeout 3m ./internal/discordrpc ./internal/lanmdns
      - name: "Проверить и собрать CLI"
        working-directory: cli
        run: |
          go test -run 'TestLAN0308|TestDiscord0308' ./cmd/launcher
          go build ./cmd/launcher
      - name: Проверка метаданных выпуска
        run: python3 scripts/version/manage.py check
  desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Собрать приложение TypeScript
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Установить нативные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Скомпилировать мост Discord IPC для Desktop и провести модульные тесты
        working-directory: apps/desktop/src-tauri
        run: cargo test discord_presence_0308
