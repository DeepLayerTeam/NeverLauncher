name: Shared Libraries Assets Natives 0.27.7
on:
  push:
    paths:
      - 'cli/cmd/neverlauncher/**'
      - '.github/workflows/shared-libraries-assets-natives-0277.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/neverlauncher/**'
      - '.github/workflows/shared-libraries-assets-natives-0277.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  materializers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Format verification
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cli/cmd/neverlauncher/shared_artifacts_0277*.go cli/cmd/neverlauncher/vanilla_runtime.go cli/cmd/neverlauncher/loader_runtime.go cli/cmd/neverlauncher/forge_runtime.go)"
      - name: Shared storage, native target and compatibility integration tests
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/neverlauncher
          -run 'TestSharedAssets0277|TestSharedArtifacts0277|TestNativeExtraction0277|TestNativeClassifier0277|TestVanillaLibraries0277|TestClientFactory0271|TestModernLoader0272|TestMirrorHelper0274|TestModpack0275|TestManualGates0276|TestForgeAndNeoForgeProcessorMaterializers'
          -count=1 -timeout=6m
      - name: Static analysis
        working-directory: cli
        run: go vet ./cmd/neverlauncher
      - name: CLI build
        working-directory: cli
        run: go build ./cmd/neverlauncher
      - name: Race detector
        if: runner.os == 'Linux'
        working-directory: cli
        shell: bash
        run: go test -race ./cmd/neverlauncher -run 'TestSharedAssets0277|TestSharedArtifacts0277|TestClientFactory0271' -count=1 -timeout=6m
