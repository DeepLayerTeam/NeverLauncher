name: NeverLauncher 0.46.1 integration integrity
on:
  push:
    paths:
      - 'VERSION'
      - 'reproducibility/**'
      - 'scripts/release/**'
      - 'scripts/operations/**'
      - 'sdk/api/typescript/**'
      - 'apps/desktop/**'
      - 'apps/admin/**'
      - 'services/api/**'
      - '.github/workflows/integration-0461.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'reproducibility/**'
      - 'scripts/release/**'
      - 'scripts/operations/**'
      - 'sdk/api/typescript/**'
      - 'apps/desktop/**'
      - 'apps/admin/**'
      - 'services/api/**'
      - '.github/workflows/integration-0461.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-and-release-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify input baseline and synchronized version
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/release/inputs_guard_0461.py verify
      - name: Run actual release format and drift tests
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*0461.py' -v
          python3 scripts/release/inputs_guard_0461.py verify
      - name: Production first-run TLS and ownership regression
        run: python3 -m unittest discover -s scripts/install -p test_production_first_run_0451.py -v
      - name: Verify no source input drift after tests
        if: always()
        run: python3 scripts/release/inputs_guard_0461.py verify
  api-sdk-and-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen Desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile real TypeScript SDK and run HTTP binary/streaming contract tests
        run: |
          ./apps/desktop/node_modules/.bin/tsc -p sdk/api/typescript/tsconfig.json
          node --test sdk/api/typescript/test/*.test.mjs
      - name: Run Desktop production build and component regressions
        working-directory: apps/desktop
        run: |
          npm run build
          npm run test:components
          npm run test:textures
      - name: Verify npm locks were not changed
        if: always()
        run: python3 scripts/release/inputs_guard_0461.py verify
  go-release-modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache: false
      - name: Build and test backend with readonly dependency policy
        working-directory: services/api
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test -tags launcher_nopgx ./internal/httpapi ./internal/repository ./internal/dbmigrate
          go build -tags launcher_nopgx -trimpath ./cmd/launcher-api
      - name: Verify locked inputs after Go compilation
        if: always()
        run: python3 scripts/release/inputs_guard_0461.py verify
