name: Промышленная поставка управляемой JRE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-java-II-and-temurin21:
    name: Управляемая Java II 8/16/17/21/25 и Temurin 21 для Windows/Linux/macOS x64+ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: cli/go.sum
      - uses: dtolnay/rust-toolchain@stable

      - name: "Собрать Runtime для управляемой Java II"
        run: cargo build --release --manifest-path runtime/runtime/Cargo.toml --bin runtime

      - name: "Провести промышленные сквозные тесты управляемой Java II на Java 8, 16, 17, 21 и 25"
        shell: bash
        run: |
          set -euo pipefail
          bash e2e/scripts/run-managed-java-II-e2e.sh

      - name: Сборка дистрибутива управляемая JRE с закреплённым поставщиком
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="dist/managed-jre-${VERSION}"
          python3 scripts/release/managed-jre-distribution.py \
            --out "${OUT}" \
            --version "${VERSION}" \
            --major 21
          cp e2e/runtime/managed-java-II/MANAGED_JAVA_II_EVIDENCE.json "${OUT}/MANAGED_JAVA_II_EVIDENCE.json"

      - name: Проверить шесть цели и доставка привязка
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="dist/managed-jre-${VERSION}"
          (cd cli && go build -trimpath -o /tmp/nl ./cmd/launcher)
          /tmp/nl delivery manifest --bundle "${OUT}" --version "${VERSION}"
          /tmp/nl delivery verify-jre --bundle "${OUT}" --version "${VERSION}"
          python3 scripts/smoke/offline/managed-jre-distribution.py

      - name: Загрузить управляемая JRE промышленные ресурсы
        uses: actions/upload-artifact@v4
        with:
          name: launcher-managed-jre-${{ github.sha }}
          path: |
            dist/managed-jre-*/MANAGED_JRE_MANIFEST.json
            dist/managed-jre-*/MANAGED_JRE_EVIDENCE.json
            dist/managed-jre-*/MANAGED_JAVA_II_EVIDENCE.json
            dist/managed-jre-*/DELIVERY_MANIFEST.json
            dist/managed-jre-*/launcher-jre-temurin21-windows-x64-*.zip
            dist/managed-jre-*/launcher-jre-temurin21-windows-arm64-*.zip
            dist/managed-jre-*/launcher-jre-temurin21-linux-x64-*.tar.gz
            dist/managed-jre-*/launcher-jre-temurin21-linux-arm64-*.tar.gz
            dist/managed-jre-*/launcher-jre-temurin21-macos-x64-*.tar.gz
            dist/managed-jre-*/launcher-jre-temurin21-macos-arm64-*.tar.gz
          if-no-files-found: error
          retention-days: 30
