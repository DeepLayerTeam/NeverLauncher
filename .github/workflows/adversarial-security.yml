name: Launcher 0.31.14 — контроль защиты от атак
on:
  push:
    paths:
      - 'services/api/internal/**'
      - 'scripts/security/certify_03114.py'
      - '.github/workflows/adversarial-security-03114.yml'
  pull_request:
    paths:
      - 'services/api/internal/**'
      - 'scripts/security/**'
  workflow_dispatch:
    inputs:
      live_linux:
        type: boolean
        default: false
        description: 'Запустить тест песочницы Linux на заранее подготовленном агенте с делегированным cgroup v2'
      live_windows:
        type: boolean
        default: false
        description: 'Запустить проверку AppContainer/Job на подготовленном агенте Windows'

permissions:
  contents: read

jobs:
  offline-adversarial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: обязательные threat-focused тесты (детектор гонок, пропуски тестов запрещены)
        run: python3 scripts/security/certify_03114.py --tier offline --output "$RUNNER_TEMP/03114-offline.json"
      - name: Проверить Runtime Guard и ServerBridge на атакующие сценарии сессий
        run: python3 scripts/security/certify_03114.py --tier backend-security --output "$RUNNER_TEMP/03114-backend-security.json"
      - name: полные промышленной зависимости Собрать
        working-directory: services/api
        run: |
          go vet ./internal/attestverify ./internal/extensionhost ./internal/extensionpolicy ./internal/extensionbroker ./internal/linuxsandbox
          go build ./...
      - name: Загрузить артефакты подтверждений regardless outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-03114-offline-evidence
          path: |
            ${{ runner.temp }}/03114-offline.json
            ${{ runner.temp }}/03114-backend-security.json
          if-no-files-found: error
  windows-compile:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Windows песочницы и хоста Protocol компиляции
        working-directory: services/api
        run: go test ./internal/windowssandbox ./internal/extensionhost ./internal/extensionpolicy
      - name: Промышленная сборка API
        working-directory: services/api
        run: go build ./...
  darwin-cross-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: macOS Скомпилировать НЕ сертификация изоляции ОС
        working-directory: services/api
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./internal/macossandbox ./internal/extensionhost
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./internal/macossandbox ./internal/extensionhost
  live-linux-boundary:
    if: github.event_name == 'workflow_dispatch' && inputs.live_linux
    runs-on: [self-hosted, linux, x64, launcher-sandbox]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: реального пространств имён, cgroup и дочерних процессов изоляции (SKIP отказа)
        run: python3 scripts/security/certify_03114.py --tier linux-live --output "$RUNNER_TEMP/03114-linux-live.json"
      - name: Опубликовать kernel подтверждений
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-03114-linux-live-evidence
          path: ${{ runner.temp }}/03114-linux-live.json
          if-no-files-found: error
  live-windows-boundary:
    if: github.event_name == 'workflow_dispatch' && inputs.live_windows
    runs-on: [self-hosted, windows, x64, launcher-appcontainer]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: реального AppContainer, ACL, Job и дочернего процесса тесты (SKIP отказа)
        shell: pwsh
        run: python scripts/security/certify_03114.py --tier windows-live --output "$env:RUNNER_TEMP/03114-windows-live.json"
      - name: Опубликовать Windows подтверждений
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-03114-windows-live-evidence
          path: ${{ runner.temp }}/03114-windows-live.json
          if-no-files-found: error
