name: Device Code Fallback 0.26.4
on:
  push:
    paths:
      - 'apps/desktop/src/official_minecraft_0257.ts'
      - 'apps/desktop/src/OfficialMinecraftPanel0257.tsx'
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/tests/official_minecraft_0257.test.mjs'
      - '.github/workflows/device-code-fallback-0264.yml'
      - 'services/api/internal/httpapi/minecraft_official_0257.go'
      - 'services/api/internal/httpapi/minecraft_official_0257_test.go'
  pull_request:
    paths:
      - 'apps/desktop/src/official_minecraft_0257.ts'
      - 'apps/desktop/src/OfficialMinecraftPanel0257.tsx'
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/tests/official_minecraft_0257.test.mjs'
      - 'services/api/internal/httpapi/minecraft_official_0257.go'
      - 'services/api/internal/httpapi/minecraft_official_0257_test.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-device-code:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Renderer tests and production build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:official
          npm run build
      - name: Native Device Code tests and Rust compile
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_identity_0262::tests
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
  backend-device-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - name: Device Code and official backend tests
        working-directory: services/api
        run: go test ./internal/httpapi ./internal/officialminecraft -run 'TestOfficial|TestRedeemedDevice|TestDeviceTransient' -count=1
