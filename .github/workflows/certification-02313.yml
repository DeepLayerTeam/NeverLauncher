name: NeverLauncher 0.24.0 executable certification
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'prestarter/**'
      - 'cli/**'
      - 'scripts/certification/**'
      - '.github/workflows/certification-0240.yml'
  workflow_dispatch:
  push:
    tags: ['v0.24.0']
permissions:
  contents: read
jobs:
  executable-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: prestarter/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certification tooling tests
        shell: bash
        run: python3 -m unittest discover -s scripts/certification -p 'test_*.py' -v
      - name: Python and Go/Rust executable certification
        shell: bash
        run: |
          python3 scripts/certification/certify.py --mode local --output dist/certification-0240/evidence.json
      - name: Publish evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-0240-${{ runner.os }}-${{ runner.arch }}
          path: dist/certification-0240/
          if-no-files-found: warn
          retention-days: 30
  # Full GA certification is intentionally NOT auto-passed by this matrix:
  # real clean-machine signed installer, JVM, power-loss and baseline 0.23.0
  # evidence are separate mandatory gates in certify.py --mode full.
  evidence-aggregation:
    if: always()
    needs: [executable-matrix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: certification-0240-*
          path: dist/platform-evidence
          merge-multiple: false
      - name: Verify platform evidence same commit and all mandatory gates
        run: |
          python3 scripts/certification/merge_evidence.py \
            --output dist/certification-0240/aggregate.json \
            dist/platform-evidence/*/evidence.json
      - name: Upload final evidence even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-0240-aggregate
          path: dist/certification-0240/aggregate.json
          if-no-files-found: warn
