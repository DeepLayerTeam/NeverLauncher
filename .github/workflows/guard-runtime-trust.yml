name: Guard 0.31.7 — принудительная проверка доверия Runtime
on:
  push:
    paths:
      - 'services/api/internal/httpapi/guard_attestation.go'
      - 'services/api/internal/httpapi/guard_attestation_v2_.go'
      - 'services/api/internal/httpapi/guard_attestation_v2__test.go'
      - 'services/api/internal/httpapi/guard_runtime_policy*'
      - '.github/workflows/guard-runtime-trust.yml'
  pull_request:
    paths:
      - 'services/api/internal/httpapi/guard_attestation.go'
      - 'services/api/internal/httpapi/guard_attestation_v2_.go'
      - 'services/api/internal/httpapi/guard_attestation_v2__test.go'
      - 'services/api/internal/httpapi/guard_runtime_policy*'
      - '.github/workflows/guard-runtime-trust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-trust-policy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Проверить политику доверия Guard Runtime и безопасность HTTP"
        working-directory: services/api
        run: go test -count=1 ./internal/httpapi ./internal/trustbaseline ./internal/attestverify
      - name: "Полная сборка Backend"
        working-directory: services/api
        run: go build ./cmd/launcher-api
      - name: Статический анализ Go (vet)
        working-directory: services/api
        run: go vet ./internal/httpapi
      - name: Проверить гонки, повторные операции и отзыв политик
        if: matrix.os == 'ubuntu-24.04'
        working-directory: services/api
        run: go test -race -count=1 -run 'TestRuntimePolicy0317|TestGuardProcessID0317|TestGuardAttestationV2EndpointIssuesOneTimeContinuousTicket01810' ./internal/httpapi
