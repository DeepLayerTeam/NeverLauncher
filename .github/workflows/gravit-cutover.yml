name: Поэтапное переключение с Gravit 0.33.11
on:
  push:
    paths:
      - 'services/api/internal/gravitcutover/**'
      - 'services/api/internal/repository/migration_cutover*'
      - 'services/api/internal/httpapi/migration_cutover*'
      - 'services/api/internal/dbmigrate/sql/0098*'
      - 'cli/cmd/launcher/migration_cutover*'
      - 'cli/cmd/launcher/migration_fence*'
      - 'docs/migration/gravit-cutover-rollback.md'
      - 'apps/admin/src/admin/MigrationCenter.tsx'
      - 'schemas/openapi*'
      - '.github/workflows/gravit-cutover.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutover:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher_test -d launcher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:test_only_not_production@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить переключение, маршрутизацию PostgreSQL и защиту от конфликтов
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/gravitcutover
          go test -race -count=1 ./internal/repository -run '^TestMigrationCutoverPostgres03311$'
          go test -run '^$' ./internal/httpapi
      - name: Собрать CLI и запустить тесты
        working-directory: cli
        run: go test -count=1 ./cmd/launcher -run 'TestMigrationCutover03311|TestMigrationWorkflow0331|TestFence|TestRollbackBoundSnapshot0448'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Выполнить промышленную сборку React
        working-directory: apps/admin
        run: |
          npm ci
          npm run build
      - name: Проверить версию и API
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
