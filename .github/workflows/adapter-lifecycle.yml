name: Жизненный цикл адаптера 0.27.11
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/adapter-lifecycle.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/adapter-lifecycle.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  adapter-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Проверка форматирования
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cli/cmd/launcher/{adapter_lifecycle,adapter_lifecycle_cli,adapter_lifecycle_test,client_factory,manual_artifact_gates,mirror_helper_parity}.go)"
      - name: Проверить реальную интеграцию фабрики клиента и фикстуры совместимости
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher -run
          'TestAdapterLifecycle02711|TestClientFactory0271|TestModernLoader0272|TestMirrorHelper0274|TestAuthlibClassloader0279|TestLegacyClientAdapters0278'
          -count=1 -timeout=5m
      - name: Собрать CLI
        working-directory: cli
        run: go build ./cmd/launcher
      - name: Статический анализ
        working-directory: cli
        run: go vet ./cmd/launcher
      - name: Проверить гонки данных
        if: runner.os == 'Linux'
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestAdapterLifecycle02711|TestClientFactory0271VanillaTransactionReplayAndTampering' -count=1 -timeout=5m
