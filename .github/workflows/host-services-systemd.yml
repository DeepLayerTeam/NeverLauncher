name: Установщики служб хостов и наблюдатель 0.28.11
on:
  push:
    paths:
      - 'cli/**'
      - 'scripts/test/host-systemd-e2e.py'
      - '.github/workflows/host-services-systemd.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'scripts/test/host-systemd-e2e.py'
      - '.github/workflows/host-services-systemd.yml'
env:
  PYTHONUTF8: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Выполнить регрессионные тесты и проверки гонок
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestHostSystemd|TestHostService|TestServerBridgeHost|TestWorldBackup|TestRemoteGracefulStop|TestRemoteSystemdGivesDrain|TestReleaseSigningRejects|TestReleaseDetached' -count=1
      - name: Проверить нативные сертификаты TLS и границы ключей релиза
        working-directory: cli
        run: go test -race ./internal/remotetls ./internal/releasekeypaths -count=1
      - name: "Проверить CLI, sd_notify и корректное завершение по SIGTERM (E2E)"
        run: |
          cd cli
          go build -o "$RUNNER_TEMP/nl" ./cmd/launcher
          cd ..
          python3 scripts/test/host-systemd-e2e.py --cli "$RUNNER_TEMP/nl"
      - name: Статический анализ
        working-directory: cli
        run: go vet ./cmd/launcher
  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: "Собрать CLI для Windows и выполнить регрессионные проверки хоста"
        working-directory: cli
        run: go test ./cmd/launcher -run 'TestWorldBackup|TestServerBridgeHost' -count=1
