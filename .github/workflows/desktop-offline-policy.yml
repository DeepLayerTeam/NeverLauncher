name: Подписанная автономная политика Desktop 0.35.8
on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'runtime/runtime/**'
      - '.github/workflows/desktop-offline-policy-0358.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'runtime/runtime/**'
      - '.github/workflows/desktop-offline-policy-0358.yml'
jobs:
  offline-renderer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:offline
      - run: npm run test:launch-modes
      - run: npm run build
  offline-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Установить зависимости Tauri для Linux"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: "Проверка нативной подписанной привязки для автономного режима"
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml offline_policy_0358 --no-default-features
      - name: "Проверка существующего нативного разделения областей доверия"
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml launch_realm_0269_tests --no-default-features
