name: NeverLauncher CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neverlauncher-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  go-contracts:
    name: Go, migrations and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - name: Repository policy and version alignment
        run: |
          python3 scripts/smoke/offline/repository-policy.py
          python3 scripts/smoke/offline/device-key-storage.py
          python3 scripts/smoke/offline/hardware-bound-identity.py
          python3 scripts/smoke/offline/challenge-response-attestation.py
          python3 scripts/smoke/offline/device-management-revocation.py
          python3 scripts/smoke/offline/session-device-risk-0126.py
          python3 scripts/smoke/offline/minecraft-serverbridge-trust-0127.py
          python3 scripts/smoke/offline/cross-platform-key-recovery-0128.py
          python3 scripts/smoke/offline/device-trust-e2e-matrix-0129.py
          python3 scripts/smoke/offline/device-trust-migration-stabilization-01210.py
          python3 scripts/smoke/offline/device-trust-release-0130.py
          python3 scripts/smoke/offline/neverguard-windows-0131.py
          python3 scripts/smoke/offline/neverguard-integrity-evidence-0132.py
          python3 scripts/smoke/offline/neverguard-process-policy-0133.py
          python3 scripts/smoke/offline/neverguard-guard-attestation-0134.py
          python3 scripts/smoke/offline/minecraft-serverbridge-integrity-0135.py
          python3 scripts/smoke/offline/windows-production-hardening-0136.py
          bash scripts/smoke/offline/version-alignment.sh
      - name: Validate canonical OpenAPI
        run: python3 scripts/contracts/validate-openapi.py
      - name: Validate public compatibility target definition
        run: |
          python3 scripts/compatibility/matrix.py validate --targets compatibility/targets.json
          python3 scripts/compatibility/test_matrix.py
          python3 scripts/device_trust/matrix.py validate --targets device-trust/targets.json
          python3 scripts/device_trust/test_matrix.py
          python3 e2e/scripts/test_publish_client_package.py
      - name: CLI test, race, vet and build
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath -o /tmp/nl ./cmd/neverlauncher
      - name: Release doctor
        run: /tmp/nl release doctor
      - name: Backend test, race, vet and pgx build
        working-directory: services/api
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/neverlauncher-api
      - name: Federation E2E release matrix
        run: python3 scripts/test/federation-e2e.py

  web:
    name: Admin and Desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/desktop/package-lock.json
      - name: Build Admin
        working-directory: apps/admin
        run: npm ci && npm run build
      - name: Build Desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build

  rust-desktop:
    name: NeverRuntime and Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Rust format
        run: |
          cargo fmt --manifest-path runtime/neverruntime/Cargo.toml -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: NeverRuntime test and clippy
        run: |
          cargo test --manifest-path runtime/neverruntime/Cargo.toml
          cargo clippy --manifest-path runtime/neverruntime/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path runtime/neverruntime/Cargo.toml
      - name: Build Desktop Tauri
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path src-tauri/Cargo.toml

  neverguard-windows:
    name: NeverGuard Windows hardened production boundary
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: NeverGuard Windows integration test
        run: |
          cargo fmt --manifest-path runtime/neverruntime/Cargo.toml -- --check
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib windows_policy::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --test neverguard_windows -- --nocapture
          cargo clippy --manifest-path runtime/neverruntime/Cargo.toml --all-targets -- -D warnings
      - name: Build side-by-side Desktop + NeverGuard package
        shell: pwsh
        run: ./scripts/release/build-windows-desktop.ps1 -AllowUnsignedDevelopmentPackage
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-windows-neverguard-${{ github.sha }}
          path: dist/release-*/neverlauncher-desktop-*-windows-amd64.zip
          if-no-files-found: error

  bridge:
    name: ServerBridge plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Build real Velocity/Paper/Purpur bridges
        run: bash scripts/build/bridge-plugins.sh

  containers:
    name: Production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: 0123456789abcdef0123456789abcdef
          NEVERLAUNCHER_PUBLIC_URL: https://neverlauncher.invalid
          NEVERLAUNCHER_AUTH_TOKEN_SECRET: ci-auth-token-secret-0123456789abcdef
          NEVERLAUNCHER_CORS_ALLOWED_ORIGINS: https://launcher.invalid
          NEVERLAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          NEVERLAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: '{"0.13.4":{"guardSha256":["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"],"launcherSha256":["bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"],"requireAuthenticode":false}}'
          NEVERLAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: '{"0.13.5":{"velocitySha256":["cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"],"paperSha256":["dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"],"purpurSha256":["eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"]}}'
          NEVERLAUNCHER_IMAGE_TAG: 0.0.0-ci
        run: docker compose -f deploy/production/docker-compose.yml config >/dev/null
      - name: Build API and Admin production images
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          docker build --build-arg NEVERLAUNCHER_VERSION="$VERSION" -f services/api/Dockerfile -t neverlauncher-api:ci .
          docker build --build-arg NEVERLAUNCHER_VERSION="$VERSION" -f apps/admin/Dockerfile -t neverlauncher-admin:ci .

  release-bundle:
    name: Release candidate bundle
    needs: [go-contracts, web, rust-desktop, neverguard-windows, bridge, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev openssl
      - name: Generate ephemeral CI release signing key
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out /tmp/neverlauncher-release-private.pem
          openssl pkey -in /tmp/neverlauncher-release-private.pem -pubout -out /tmp/neverlauncher-release-public.pem
      - name: Build and cryptographically verify complete release bundle
        env:
          NEVERLAUNCHER_RELEASE_SIGNING_PRIVATE_KEY_FILE: /tmp/neverlauncher-release-private.pem
          NEVERLAUNCHER_RELEASE_SIGNING_PUBLIC_KEY_FILE: /tmp/neverlauncher-release-public.pem
        run: bash scripts/release/build-release.sh
      - name: Assert required production artifacts
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          test -s "${DIR}/SHA256SUMS.sig"
          test -s "${DIR}/PROVENANCE.json.sig"
          test -s "${DIR}/neverlauncher-desktop-linux-amd64"
          test -s "${DIR}/neverlauncher-desktop-package-${VERSION}.zip"
          test -s "${DIR}/neverruntime-linux-amd64"
          test -s "${DIR}/neverlauncher-velocity-bridge-${VERSION}.jar"
          test -s "${DIR}/neverlauncher-paper-bridge-${VERSION}.jar"
          test -s "${DIR}/neverlauncher-purpur-bridge-${VERSION}.jar"

  production-e2e:
    name: PostgreSQL + Redis + actual Minecraft Client E2E
    needs: [go-contracts, web, rust-desktop, bridge, containers, release-bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Install E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq postgresql-client xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxcursor1 libxinerama1 libasound2t64
      - name: Federation PostgreSQL migration + restart + multi-instance E2E
        run: bash e2e/scripts/run-federation-postgres-e2e.sh
      - name: Device Trust 0.12.9 to 0.12.10 migration E2E
        run: bash e2e/scripts/run-device-trust-migration-e2e.sh
      - name: Device Trust PostgreSQL lifecycle E2E
        env:
          NEVERLAUNCHER_DEVICE_TRUST_TARGET_ID: postgres-protocol-linux-x64
          NEVERLAUNCHER_DEVICE_TRUST_COMMIT: ${{ github.sha }}
          NEVERLAUNCHER_DEVICE_TRUST_RUN_ID: ${{ github.run_id }}
        run: bash e2e/scripts/run-device-trust-e2e.sh
      - name: Materialize -> publish -> sync -> launch actual Minecraft -> join -> revoke -> deny
        run: bash e2e/scripts/run-minecraft-e2e.sh
      - name: Verify Minecraft health evidence
        run: |
          jq -e '.status == "passed" and .minecraft.client == "actual-mojang-client" and .minecraft.paperJoin == "passed" and .health.velocity == "healthy" and .health.paper == "healthy" and .health.purpur == "healthy"' e2e/runtime/result.json >/dev/null
          for service in velocity paper purpur; do
            jq -e '.Status == "healthy" and .FailingStreak == 0 and (.Log | length) > 0 and .Log[-1].ExitCode == 0' "e2e/runtime/health-${service}.json" >/dev/null
          done
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-minecraft-client-e2e-evidence
          path: |
            e2e/runtime/result.json
            e2e/runtime/client-package.json
            e2e/runtime/materialized-client-verify.json
            e2e/runtime/published-client-package.json
            e2e/runtime/manifest.json
            e2e/runtime/runtime-verify.json
            e2e/runtime/runtime-sync.json
            e2e/runtime/runtime-launch-minecraft.json
            e2e/runtime/health-*.json
            e2e/runtime/bridge-diagnostics.json
            e2e/runtime/validate-*.json
            e2e/runtime/join-*.json
            e2e/runtime/revoke-*.json
            e2e/runtime/probe-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Device Trust protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-device-trust-protocol-e2e-evidence
          path: |
            e2e/device-trust-result/
            e2e/device-trust-migration-result/
          if-no-files-found: ignore
          retention-days: 14
