  managed-jre-production:
    name: Managed Java II Java 8/16/17/21/25 production E2E + Temurin 21 delivery
    needs: [go-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
