  guard-windows-adversarial:
    name: Guard Windows adversarial Java ${{ matrix.java }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [8, 16, 17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc
      - name: Build Guard Sensor and adversarial fixtures
        shell: pwsh
        run: |
          cargo build --manifest-path runtime/guard-sensor/Cargo.toml
          cargo build --manifest-path runtime/guard-memory-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-thread-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-debug-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-jvm-probe/Cargo.toml
          cargo build --manifest-path runtime/runtime/Cargo.toml --tests
      - name: Execute live Windows attack simulation and compatibility certification
        shell: pwsh
        run: |
          $out = "guard-ci-result/windows-adversarial/java-${{ matrix.java }}/windows-adversarial-result.json"
          python scripts/guard_ci/windows_adversarial.py run `
            --java-major "${{ matrix.java }}" `
            --sensor (Resolve-Path "runtime/guard-sensor/target/debug/guard_sensor.dll").Path `
            --memory-probe (Resolve-Path "runtime/guard-memory-probe/target/debug/guard_memory_probe.dll").Path `
            --thread-probe (Resolve-Path "runtime/guard-thread-probe/target/debug/guard_thread_probe.dll").Path `
            --debug-probe (Resolve-Path "runtime/guard-debug-probe/target/debug/guard-debug-probe.exe").Path `
            --jvm-probe (Resolve-Path "runtime/guard-jvm-probe/target/debug/guard_jvm_probe.dll").Path `
            --repository "$env:GITHUB_REPOSITORY" `
            --commit "$env:GITHUB_SHA" `
            --run-id "$env:GITHUB_RUN_ID" `
            --output $out
      - name: Validate 0.18.11 adversarial CI production gate
        shell: pwsh
        run: |
          python scripts/smoke/offline/guard-windows-adversarial-ci-01811.py
          python scripts/guard_ci/test_windows_adversarial.py
      - name: Upload per-Java adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-windows-adversarial-java-${{ matrix.java }}-${{ github.sha }}
          path: guard-ci-result/windows-adversarial/java-${{ matrix.java }}/windows-adversarial-result.json
          if-no-files-found: error
          retention-days: 30

  guard-windows-adversarial-certificate:
    name: Guard Windows adversarial certification
    if: always()
    needs: [guard-windows-adversarial]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download per-Java adversarial evidence
        uses: actions/download-artifact@v4
        with:
          pattern: guard-windows-adversarial-java-*
          path: guard-ci-result/windows-adversarial/results
      - name: Aggregate and certify Windows adversarial matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/guard_ci/windows_adversarial.py aggregate \
            --results-root guard-ci-result/windows-adversarial/results \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output-dir guard-ci-result/windows-adversarial/certificate
          if [[ -s guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md ]]; then
            cat guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - name: Validate 0.18.12 Windows Protection RC production gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke/offline/guard-windows-protection-rc-01812.py
          (cd cli && go test ./cmd/launcher -run 'TestWindowsProtection' -count=1)
      - name: Validate 0.19.0 Windows Protection GA production gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke/offline/guard-windows-protection-ga-0190.py
          (cd cli && go test ./cmd/launcher -run 'TestWindowsProtectionGA' -count=1)
      - name: Upload Windows adversarial certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-windows-adversarial-certificate-${{ github.sha }}
          path: |
            guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.json
            guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md
          if-no-files-found: error
          retention-days: 30

  release-ga-policy:
    name: Fail-closed versioned GA and historical signing regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent Ed25519 verifier dependency
        run: python3 -m pip install cryptography==46.0.4
      - name: Verify historic 0.36.0 and current/future exact-byte signed gates
        run: |
          python3 scripts/version/manage.py check
          python3 -m unittest discover -s scripts/ga -p 'test_verified_targets*.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_player_final_0400.py' -v
          python3 -m unittest discover -s scripts/rc -p 'test_*.py' -v
          python3 scripts/release/test_certify_profiles_ga_0230.py
          python3 scripts/release/test_certification_run_0362.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/release/test_fetch_exact_certifications.py
          python3 -m unittest discover -s scripts/release -p 'test_rehearsal_0365.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_final_update_delivery_0410.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_publish_0370.py' -v
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - name: Verify CLI cannot sign 0.36.1 or later without new operator approval
        working-directory: cli
        run: go test ./cmd/launcher -run '^(TestGA0361|TestRehearsal0365)' -count=1 -timeout=2m

  storage-parity-0371:
    name: Storage inventory and real SQLite/PostgreSQL parity 0.37.1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: launcher_storage_parity
          POSTGRES_USER: launcher_parity
          POSTGRES_PASSWORD: parity-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launcher_parity -d launcher_storage_parity"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Verify complete source-derived dependency inventory
        run: |
          set -euo pipefail
          GO111MODULE=off go test ./scripts/storageparity -count=1
          GO111MODULE=off go run ./scripts/storageparity -root . -check
      - name: Verify supported SQLite filesystem (no in-memory fallback)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-parity-0371"
          chmod 0700 "$RUNNER_TEMP/storage-parity-0371"
          case "$(stat -f -c '%T' "$RUNNER_TEMP/storage-parity-0371")" in
            ext2/ext3|ext4|xfs|btrfs) ;;
            *) echo 'Storage parity requires ext4/xfs/btrfs; BLOCKED' >&2; exit 1 ;;
          esac
      - name: Run identical real-database contracts against both backends
        working-directory: services/api
        env:
          LAUNCHER_PARITY_POSTGRES_DSN: postgres://launcher_parity:parity-ephemeral-only@127.0.0.1:5432/launcher_storage_parity?sslmode=disable
          LAUNCHER_STORAGE_PARITY_REQUIRED: '1'
          LAUNCHER_SQLITE_TEST_ROOT: ${{ runner.temp }}/storage-parity-0371
        run: |
          set -euo pipefail
          go mod verify
          test -z "$(gofmt -l internal/storageparity internal/repository/postgres.go)"
          go test -race -count=1 -timeout=20m -v ./internal/storageparity
      - name: Verify durable SQLite HTTP repository and restart behavior
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/repository/sqlite_http*_0372.go)"
          go test -race -count=1 -timeout=10m -run '^TestSQLiteHTTP' ./internal/repository
          go test -race -count=1 -timeout=10m -run '^TestSQLiteHTTPRepositoryBootstrap0372$' ./cmd/launcher-api
      - name: Verify SQLite 0.37.3 auth, passkeys, sessions and Bridge durability
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/httpapi/sqlite_runtime_0373*.go internal/repository/sqlite_http_runtime_0373*.go)"
          go test -race -count=1 -timeout=10m -run '^TestSQLiteHTTPDevicesJobsExtensionsRestart0373$' ./internal/repository
          go test -race -count=1 -timeout=12m -run '^TestSQLiteRuntime.*0373$' ./internal/httpapi
          go vet ./internal/httpapi ./internal/repository

      - name: Verify SQLite stable publication 0.37.4 and local coordinator (real WAL)
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/repository/sqlite_http_stable_0374*.go internal/httpapi/rate_limit.go)"
          go test -race -count=1 -timeout=15m -run '^TestSQLiteStablePublish.*0374$' ./internal/repository
          go test -race -count=1 -timeout=12m -run '^(TestRateLimitAtomicAndRestart|TestLeaseFencingAndRestart|TestProductionRCConcurrentRateLimitStress)$' ./internal/sqlitecoord
          go test -race -count=1 -timeout=5m -run '^TestSQLiteCoordinatorFailClosed0374$' ./internal/httpapi
          go vet ./internal/repository ./internal/sqlitecoord ./internal/httpapi

      - name: Verify native SQLite minimal installation, bootstrap and process fencing (0.37.5)
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/repository/sqlite_http_install_0375*.go internal/deployment/minimal_0375*.go)"
          go test -race -count=1 -timeout=8m -run '^TestMinimalInstallationSQLite0375$' ./internal/repository
          go test -race -count=1 -timeout=8m -run '^TestMinimalDeployment0375$' ./internal/deployment
          go test -race -count=1 -timeout=5m -run '^TestProductionMinimalSQLiteAccepted0375$' ./internal/config
          go vet ./internal/repository ./internal/deployment ./internal/httpapi ./internal/config
      - name: Verify SQLite/PostgreSQL bidirectional transfer of Core and full minimal bundle (0.37.7)
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
          LAUNCHER_PG_TEST_DSN: postgres://launcher_parity:parity-ephemeral-only@127.0.0.1:5432/launcher_storage_parity?sslmode=disable
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/sqlitepg cmd/launcher-sqlite)"
          go test -race -count=1 -timeout=25m ./internal/sqlitepg ./cmd/launcher-sqlite
          go vet ./internal/sqlitepg ./cmd/launcher-sqlite
          go build -trimpath -o "$RUNNER_TEMP/launcher-sqlite-0377" ./cmd/launcher-sqlite
      - name: Verify minimal offline SQLite plus project files backup and restore (0.37.6)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/install/minimal_backup.py scripts/install/minimal-install.py
          python3 -m unittest discover -s scripts/install -p 'test_minimal_backup.py' -v

      - name: Validate executable native installer (0.37.5)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/install -p 'test_minimal_install.py' -v
          python3 -m py_compile scripts/install/minimal-install.py

  minimal-live-e2e-0378:
    name: REQUIRED live minimal SQLite process, crash and restore (current version)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner tests (not live E2E evidence)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/acceptance -p 'test_minimal_live_e2e_0378.py' -v
          python3 -m unittest discover -s scripts/acceptance -p 'test_final_bundle_e2e_0380.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_minimal_backup.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_minimal_install.py' -v
      - name: Build real Backend and verify local filesystem
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/nl-live-0378" "$RUNNER_TEMP/nl-0378-policies"
          case "$(stat -f -c '%T' "$RUNNER_TEMP/nl-live-0378")" in
            ext2/ext3|ext4|xfs|btrfs) ;;
            *) echo 'BLOCKED: unsupported SQLite filesystem' >&2; exit 1 ;;
          esac
          cd services/api
          go mod verify
          go build -trimpath -ldflags "-X main.version=$(cat ../../VERSION) -X main.commit=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/nl-live-api-0378" ./cmd/launcher-api
      - name: Create isolated test-only configuration policies (no signing evidence)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'nl-0378-policies'
          fingerprint=hashlib.sha256(b'Launcher E2E NON-RELEASE fixture no signing').hexdigest()
          guard={'schemaVersion':'2.0','releases':{'0.1.0':{'protocolVersion':4,
            'platforms':{'linux':{'signingMode':'integrity-only','artifacts':[
              {'guardSha256':fingerprint,'launcherSha256':fingerprint}]}}}}}
          bridge={'0.1.0':{'velocitySha256':[fingerprint],
            'paperSha256':[fingerprint],'purpurSha256':[fingerprint]}}
          for name,document in [('guard.json',guard),('bridge.json',bridge)]:
              path=directory/name
              fd=os.open(path,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
              with os.fdopen(fd,'w') as stream: json.dump(document,stream)
          PYCODE
      - name: Real API install, HTTP, SIGTERM, SIGKILL, backup, restore, corruption refusal
        shell: bash
        env:
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: |
          set -euo pipefail
          python3 scripts/acceptance/minimal_live_e2e_0378.py \
            --binary "$RUNNER_TEMP/nl-live-api-0378" \
            --guard-policy "$RUNNER_TEMP/nl-0378-policies/guard.json" \
            --bridge-policy "$RUNNER_TEMP/nl-0378-policies/bridge.json" \
            --work-root "$RUNNER_TEMP/nl-live-0378" \
            --expected-version "$(cat VERSION)" \
            --report "$RUNNER_TEMP/nl-live-evidence-0378.json"
          python3 - "$RUNNER_TEMP/nl-live-evidence-0378.json" "$GITHUB_SHA" <<'PYCODE'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['status']=='passed',report['status']
          assert report['sourceCommit']==sys.argv[2]
          assert len(report['checks'])>=20
          assert all(row['status']=='passed' for row in report['checks'])
          PYCODE
      - name: Publish machine evidence (fail closed if missing)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: minimal-live-e2e-0378-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nl-live-evidence-0378.json
          if-no-files-found: error
          retention-days: 30

  required-ci:
    name: REQUIRED CI — all jobs SUCCESS for exact commit
    if: ${{ always() }}
    needs: [minimal-live-e2e-0378, storage-parity-0371, go-contracts, web, rust-desktop, linux-production, guard-windows, guard-macos, macos-production, guard-certification, bridge, containers, managed-jre-production, production-e2e, guard-windows-adversarial, guard-windows-adversarial-certificate, release-ga-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict job conclusions and exact SHA (fail closed)
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CI_NEEDS_JSON" > "$RUNNER_TEMP/required-ci-needs.json"
          python3 scripts/ci/required_jobs_0363.py \
            --workflow .github/workflows/ci.yml --gate required-ci \
            --needs-json "$RUNNER_TEMP/required-ci-needs.json" \
            --source-sha "$GITHUB_SHA" --version-file VERSION --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output required-ci-evidence.json
      - name: Publish required CI result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: launcher-required-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 90
