name: Непрерывная интеграция Launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: launcher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  CI: "true"

jobs:
  go-contracts:
    name: Go, миграции и контракты
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить совпадение встроенных ресурсов CLI с каноническими исходниками
        run: python3 scripts/build/embedded_cli_assets.py --check
      - name: Проверить политику репозитория и согласованность версий
        run: |
          python3 scripts/smoke/offline/repository-policy.py
          python3 scripts/release/test_fetch_exact_certifications.py
          python3 scripts/smoke/offline/device-key-storage.py
          python3 scripts/smoke/offline/hardware-bound-identity.py
          python3 scripts/smoke/offline/challenge-response-attestation.py
          python3 scripts/smoke/offline/device-management-revocation.py
          python3 scripts/smoke/offline/session-device-risk.py
          python3 scripts/smoke/offline/minecraft-serverbridge-trust.py
          python3 scripts/smoke/offline/cross-platform-key-recovery.py
          python3 scripts/smoke/offline/device-trust-e2e-matrix.py
          python3 scripts/smoke/offline/device-trust-migration-stabilization.py
          python3 scripts/smoke/offline/device-trust-release.py
          python3 scripts/smoke/offline/guard-windows.py
          python3 scripts/smoke/offline/guard-integrity-evidence.py
          python3 scripts/smoke/offline/guard-process-policy.py
          python3 scripts/smoke/offline/guard-guard-attestation.py
          python3 scripts/smoke/offline/minecraft-serverbridge-integrity.py
          python3 scripts/smoke/offline/windows-production-hardening.py
          python3 scripts/smoke/offline/linux-production-implementation.py
          python3 scripts/smoke/offline/macos-production-implementation.py
          python3 scripts/smoke/offline/guard-ci-release-certification.py
          python3 scripts/smoke/offline/guard-migration-compatibility-stabilization.py
          python3 scripts/smoke/offline/guard-release.py
          python3 scripts/smoke/offline/serverbridge-protocol-v2-.py
          python3 scripts/smoke/offline/serverbridge-crypto-node-identities.py
          python3 scripts/smoke/offline/serverbridge-one-time-join-tickets.py
          python3 scripts/smoke/offline/serverbridge-bukkit-family.py
          python3 scripts/smoke/offline/serverbridge-proxy-family.py
          python3 scripts/smoke/offline/serverbridge-fabric.py
          python3 scripts/smoke/offline/serverbridge-forge-neoforge.py
          python3 scripts/smoke/offline/serverbridge-zero-patch-topology-handoff.py
          python3 scripts/smoke/offline/serverbridge-public-matrix-ha-hardening.py
          python3 scripts/smoke/offline/serverbridge-migration-stabilization.py
          python3 scripts/smoke/offline/delivery-manifest-platform-architecture.py
          python3 scripts/smoke/offline/signed-windows-x64-arm64-.py
          python3 scripts/smoke/offline/linux-x64-arm64-production-packages.py
          python3 scripts/smoke/offline/notarized-macos-x64-arm64-.py
          python3 scripts/smoke/offline/managed-jre-distribution.py
          python3 scripts/smoke/offline/managed-java-II.py
          python3 scripts/smoke/offline/unified-transactional-updater-core.py
          python3 scripts/smoke/offline/desktop-guard-runtime-transactional-update.py
          python3 scripts/smoke/offline/release-verification-v2-trust-lifecycle.py
          python3 scripts/smoke/offline/public-production-delivery-matrix-e2e.py
          python3 scripts/smoke/offline/migration-stabilization.py
          python3 scripts/smoke/offline/production-release-candidate.py
          python3 scripts/smoke/offline/production-delivery-release.py
          python3 scripts/guard_ci/matrix.py validate --targets guard-ci/targets.json
          python3 scripts/guard_ci/test_matrix.py
          bash scripts/smoke/offline/version-alignment.sh
      - name: Проверить каноническую схему OpenAPI
        run: python3 scripts/contracts/validate-openapi.py
      - name: Проверить определения публичных целей совместимости
        run: |
          python3 scripts/compatibility/matrix.py validate --targets compatibility/targets.json
          python3 scripts/compatibility/test_matrix.py
          python3 scripts/compatibility/test_certify_jre.py
          python3 scripts/compatibility/test_retry_macos_sdl3.py
          python3 scripts/compatibility/test_vanilla_sdl3_retry_wiring.py
          python3 scripts/smoke/offline/minecraft-compatibility-II-ga.py
          python3 scripts/smoke/offline/fabric-compatibility-II.py
          python3 scripts/smoke/offline/quilt-compatibility-II.py
          python3 scripts/smoke/offline/forge-modern.py
          python3 scripts/smoke/offline/forge-legacy-1122-.py
          python3 scripts/smoke/offline/forge-legacy-1710-.py
          python3 scripts/smoke/offline/neoforge-compatibility-II.py
          python3 scripts/smoke/offline/loader-resolution-pinning.py
          python3 scripts/smoke/offline/loader-native-e2e.py
          python3 scripts/smoke/offline/cross-platform-loaders.py
          python3 scripts/smoke/offline/loader-hardening.py
          python3 scripts/smoke/offline/loader-compatibility-rc.py
          python3 scripts/smoke/offline/loader-compatibility-ga.py
          python3 scripts/smoke/offline/windows-protection-core-II.py
          python3 scripts/smoke/offline/guard-sensor.py
          python3 scripts/device_trust/matrix.py validate --targets device-trust/targets.json
          python3 scripts/device_trust/test_matrix.py
          python3 scripts/serverbridge/matrix.py validate --targets serverbridge/targets.json
          python3 scripts/serverbridge/test_matrix.py
          python3 e2e/scripts/test_publish_client_package.py
      - name: Проверить CLI — тесты, гонки данных, go vet и сборка
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath -o /tmp/nl ./cmd/launcher
          /tmp/nl update self-test
          /tmp/nl update component-self-test
          /tmp/nl update stabilization-self-test
      - name: Провести диагностику релиза
        run: /tmp/nl release doctor
      - name: Проверить Backend — тесты, гонки данных, go vet и сборка с pgx
        working-directory: services/api
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/launcher-api
      - name: Проверить матрицу сквозных тестов федерации для релиза
        run: python3 scripts/test/federation-e2e.py

  web:
    name: Веб-интерфейсы Admin и Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/desktop/package-lock.json
      - name: Собрать панель администрирования
        working-directory: apps/admin
        run: npm ci && npm run build
      - name: Сборка интерфейса Desktop
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Проверить операции с текстурами Desktop и изоляцию официальных аккаунтов
        working-directory: apps/desktop
        run: npm run test:textures
      - name: Проверить регрессии компонентов игрок 0.39.x, официальных аккаунтов, подключений, обновления и запуска
        working-directory: apps/desktop
        run: |
          npm run test:components
          npm run test:official
          npm run test:server-join
          npm run test:auth-experience
          npm run test:update-migration
          npm run test:launch-modes
      - name: Проверить типы TypeScript SDK для расширений
        run: |
          apps/admin/node_modules/.bin/tsc --ignoreConfig --noEmit --strict --target ES2020 --module ESNext --moduleResolution Bundler --lib ES2020,DOM sdk/admin/typescript/generated.ts sdk/admin/typescript/openapi-generated.ts sdk/admin/typescript/api-types-generated.ts sdk/admin/typescript/api-requests-generated.ts sdk/admin/typescript/launcher-admin.ts sdk/desktop/typescript/generated.ts sdk/desktop/typescript/openapi-generated.ts sdk/desktop/typescript/api-types-generated.ts sdk/desktop/typescript/api-requests-generated.ts sdk/desktop/typescript/launcher-desktop.ts

  rust-desktop:
    name: Среда выполнения и Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Установка зависимостей рабочего стола Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Нормализовать форматирование исходников Rust
        run: |
          cargo fmt --manifest-path runtime/runtime/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Проверить Runtime и Guard под Linux, выполнить clippy
        run: |
          python3 scripts/smoke/offline/linux-production-implementation.py
          python3 scripts/smoke/offline/guard-ci-release-certification.py
          cargo test --manifest-path runtime/runtime/Cargo.toml
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_linux -- --nocapture
          cargo clippy --manifest-path runtime/runtime/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path runtime/runtime/Cargo.toml
      - name: Собрать приложение Desktop Tauri
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Собрать промышленный пакет Desktop и Guard для Linux
        run: bash scripts/release/build-linux-desktop.sh
      - name: Сформировать свидетельства CI для Guard Linux
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          python3 scripts/guard_ci/matrix.py result \
            --targets guard-ci/targets.json \
            --target-id guard-linux-amd64 \
            --package "${DIR}/launcher-desktop-${VERSION}-linux-amd64.zip" \
            --launcher "${DIR}/launcher-desktop-linux-amd64" \
            --guard "${DIR}/guard-linux-amd64" \
            --manifest "${DIR}/LINUX_PACKAGE_MANIFEST.json" \
            --allowlist "${DIR}/GUARD_RELEASE_ALLOWLIST_LINUX.json" \
            --signing-mode none-linux-integrity \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --output guard-ci-result/linux/guard-ci-result.json
      - name: Загрузить пакет Guard Linux
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-guard-${{ github.sha }}
          path: |
            dist/release-*/launcher-desktop-*-linux-amd64.zip
            dist/release-*/launcher-desktop-linux-amd64
            dist/release-*/guard-linux-amd64
            dist/release-*/LINUX_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_LINUX.json
          if-no-files-found: error
      - name: Загрузить результат CI для Guard Linux
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-linux-amd64-${{ github.sha }}
          path: guard-ci-result/linux/guard-ci-result.json
          if-no-files-found: error

  linux-production:
    name: Промышленная сборка Linux ${{ matrix.arch }}
    needs: [go-contracts, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Установка зависимостей рабочего стола Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Создать временные ключи доверия для подписи компонентов только в CI
        run: |
          python3 -m pip install 'cryptography>=43,<47'
          python3 - <<'PY_SIGN'
          import os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
          seed = key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption()).hex()
          pub = key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw).hex()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LAUNCHER_COMPONENT_SET_ED25519_SEED='+seed+'\n')
              env.write('LAUNCHER_COMPONENT_SET_ED25519_PUBLIC_KEY='+pub+'\n')
          PY_SIGN
      - name: Собрать промышленный нативный пакет Linux
        run: bash scripts/release/build-linux-production.sh "$(pwd)/dist/release-$(tr -d '[:space:]' < VERSION)" --expected-arch "${{ matrix.arch }}"
      - name: Локально проверить пакет
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          test -s "${DIR}/launcher-cli-linux-${{ matrix.arch }}"
          test -s "${DIR}/launcher-api-linux-${{ matrix.arch }}"
          test -s "${DIR}/launcher-desktop-linux-${{ matrix.arch }}"
          test -s "${DIR}/guard-linux-${{ matrix.arch }}"
          test -s "${DIR}/runtime-linux-${{ matrix.arch }}"
          test -s "${DIR}/launcher-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          python3 scripts/release/secret-scan.py "${DIR}/launcher-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          "${DIR}/launcher-cli-linux-${{ matrix.arch }}" update self-test
          "${DIR}/launcher-cli-linux-${{ matrix.arch }}" update component-self-test
          "${DIR}/launcher-cli-linux-${{ matrix.arch }}" update stabilization-self-test
      - name: Загрузить промышленные нативные артефакты Linux
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-production-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/release-*/launcher-cli-linux-${{ matrix.arch }}
            dist/release-*/launcher-api-linux-${{ matrix.arch }}
            dist/release-*/launcher-desktop-linux-${{ matrix.arch }}
            dist/release-*/guard-linux-${{ matrix.arch }}
            dist/release-*/runtime-linux-${{ matrix.arch }}
            dist/release-*/launcher-linux-${{ matrix.arch }}-*.tar.gz
            dist/release-*/LINUX_PACKAGE_MANIFEST_*.json
          if-no-files-found: error
          retention-days: 14

  guard-windows:
    name: Guard для Windows x64 и ARM64 — проверка поставки
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Запустить интеграционные тесты Guard для Windows
        run: |
          python scripts/smoke/offline/windows-production-hardening.py
          python scripts/smoke/offline/windows-protection-core-II.py
          python scripts/smoke/offline/guard-sensor.py
          python scripts/smoke/offline/guard-module-guard.py
          python scripts/smoke/offline/guard-aggressive-hook-engine.py
          python scripts/smoke/offline/guard-memory-integrity.py
          python scripts/smoke/offline/guard-thread-process-integrity.py
          python scripts/smoke/offline/guard-debug-instrumentation.py
          python scripts/smoke/offline/guard-jvm-aware-protection.py
          python scripts/smoke/offline/guard-continuous-guard.py
          python scripts/smoke/offline/guard-attestation-v2-.py
          cd services/api
          go test ./internal/httpapi -run 'TestGuardAttestationV2' -count=1
          go test ./internal/dbmigrate -run 'TestGuardAttestationV2Migration01810' -count=1
          cd ../..
          python scripts/smoke/offline/guard-ci-release-certification.py
          cargo fmt --manifest-path runtime/runtime/Cargo.toml
          cargo fmt --manifest-path runtime/guard-sensor/Cargo.toml
          cargo fmt --manifest-path runtime/guard-memory-probe/Cargo.toml
          cargo fmt --manifest-path runtime/guard-thread-probe/Cargo.toml
          cargo fmt --manifest-path runtime/guard-debug-probe/Cargo.toml
          cargo fmt --manifest-path runtime/guard-jvm-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-sensor/Cargo.toml
          cargo build --manifest-path runtime/guard-memory-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-thread-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-debug-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-jvm-probe/Cargo.toml
          $env:GUARD_SENSOR_TEST_DLL = (Resolve-Path "runtime/guard-sensor/target/debug/guard_sensor.dll").Path
          $env:GUARD_MEMORY_PROBE_DLL = (Resolve-Path "runtime/guard-memory-probe/target/debug/guard_memory_probe.dll").Path
          $env:GUARD_THREAD_PROBE_DLL = (Resolve-Path "runtime/guard-thread-probe/target/debug/guard_thread_probe.dll").Path
          $env:GUARD_DEBUG_PROBE_EXE = (Resolve-Path "runtime/guard-debug-probe/target/debug/guard-debug-probe.exe").Path
          $env:GUARD_JVM_PROBE_DLL = (Resolve-Path "runtime/guard-jvm-probe/target/debug/guard_jvm_probe.dll").Path
          $env:GUARD_EXPECTED_JAVA_MAJOR = "21"
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib windows_policy::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_windows -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_sensor_windows guard_continuous_guard_cross_checks_sensor_and_guard_heartbeat -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_sensor_windows -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib windows_attestation_v2::tests -- --nocapture
          cargo clippy --manifest-path runtime/runtime/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-sensor/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-memory-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-thread-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-debug-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-jvm-probe/Cargo.toml --all-targets -- -D warnings
      - name: Проверить транзакционное ядро обновлений
        shell: pwsh
        run: |
          Push-Location cli
          go build -trimpath -o "$env:RUNNER_TEMP\nl-updater-selftest.exe" ./cmd/launcher
          Pop-Location
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update self-test
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update component-self-test
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update stabilization-self-test
      - name: Собрать неподписанные кандидаты пакетов для x64 и ARM64
        shell: pwsh
        run: ./scripts/release/build-windows-desktop.ps1 -AllowUnsignedDevelopmentPackage
      - name: Сформировать свидетельства CI для Guard Windows
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Dir = "dist/release-$Version"
          python scripts/guard_ci/matrix.py result --targets guard-ci/targets.json --target-id guard-windows-amd64 --package "$Dir/launcher-desktop-$Version-windows-amd64.zip" --launcher "$Dir/launcher-desktop-windows-amd64.exe" --guard "$Dir/guard-windows-amd64.exe" --manifest "$Dir/WINDOWS_PACKAGE_MANIFEST.json" --allowlist "$Dir/GUARD_RELEASE_ALLOWLIST_WINDOWS.json" --signing-mode unsigned-development-ci --commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --repository "$env:GITHUB_REPOSITORY" --output guard-ci-result/windows/guard-ci-result.json
      - name: Загрузить пакет Windows
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-guard-${{ github.sha }}
          path: |
            dist/release-*/launcher-desktop-*-windows-amd64.zip
            dist/release-*/launcher-desktop-windows-amd64.exe
            dist/release-*/guard-windows-amd64.exe
            dist/release-*/WINDOWS_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS_DELIVERY.json
            dist/release-*/launcher-cli-windows-x64.exe
            dist/release-*/launcher-cli-windows-arm64.exe
            dist/release-*/launcher-desktop-windows-x64.exe
            dist/release-*/launcher-desktop-windows-arm64.exe
            dist/release-*/guard-windows-x64.exe
            dist/release-*/guard-windows-arm64.exe
            dist/release-*/guard-sensor-windows-x64.dll
            dist/release-*/guard-sensor-windows-arm64.dll
            dist/release-*/runtime-windows-x64.exe
            dist/release-*/runtime-windows-arm64.exe
            dist/release-*/launcher-desktop-*-windows-x64.zip
            dist/release-*/launcher-desktop-*-windows-arm64.zip
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_X64.json
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/WINDOWS_SIGNING_EVIDENCE.json
          if-no-files-found: error
      - name: Загрузить результат CI для Guard Windows
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-windows-amd64-${{ github.sha }}
          path: guard-ci-result/windows/guard-ci-result.json
          if-no-files-found: error

  guard-macos:
    name: Guard для macOS — промышленная реализация
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Проверить готовность macOS к релизу и нативные тесты Rust
        shell: bash
        run: |
          python3 scripts/smoke/offline/macos-production-implementation.py
          python3 scripts/smoke/offline/guard-ci-release-certification.py
          cargo fmt --manifest-path runtime/runtime/Cargo.toml
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo clippy --manifest-path runtime/runtime/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path runtime/runtime/Cargo.toml --bin guard
      - name: Проверить интеграцию Guard macOS с подписями
        shell: bash
        run: |
          TEST_BIN="$(cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_macos --no-run --message-format=json | python3 -c 'import json,sys; xs=[]; [xs.append(x.get("executable")) for line in sys.stdin for x in [json.loads(line)] if x.get("reason")=="compiler-artifact" and x.get("target",{}).get("name")=="guard_macos" and x.get("executable")]; print(xs[-1])')"
          test -n "${TEST_BIN}"
          codesign --force --sign - --options runtime --timestamp=none runtime/runtime/target/debug/guard
          codesign --force --sign - --options runtime --timestamp=none "${TEST_BIN}"
          "${TEST_BIN}" --nocapture
      - name: Сборка интерфейса Desktop
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Собрать временно подписанный универсальный пакет macOS
        shell: bash
        run: bash scripts/release/build-macos-desktop.sh "$(pwd)/dist/release-$(tr -d '[:space:]' < VERSION)" --allow-ad-hoc
      - name: Сформировать свидетельства CI для Guard macOS
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          python3 scripts/guard_ci/matrix.py result \
            --targets guard-ci/targets.json \
            --target-id guard-macos-universal \
            --package "${DIR}/launcher-desktop-${VERSION}-macos-universal.zip" \
            --launcher "${DIR}/launcher-desktop-macos-universal" \
            --guard "${DIR}/guard-macos-universal" \
            --manifest "${DIR}/MACOS_PACKAGE_MANIFEST.json" \
            --allowlist "${DIR}/GUARD_RELEASE_ALLOWLIST_MACOS.json" \
            --signing-mode adhoc-ci \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --output guard-ci-result/macos/guard-ci-result.json
      - name: Загрузить пакет macOS
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-guard-${{ github.sha }}
          path: |
            dist/release-*/launcher-desktop-*-macos-universal.zip
            dist/release-*/launcher-desktop-macos-universal
            dist/release-*/guard-macos-universal
            dist/release-*/MACOS_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS.json
          if-no-files-found: error
      - name: Загрузить результат CI для Guard macOS
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-macos-universal-${{ github.sha }}
          path: guard-ci-result/macos/guard-ci-result.json
          if-no-files-found: error

  macos-production:
    name: macOS x64 и ARM64 — проверка поставки
    needs: [go-contracts, web]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Проверить ядро обновления до упаковки
        shell: bash
        run: |
          set -euo pipefail
          (cd cli && go build -trimpath -o /tmp/nl ./cmd/launcher)
          /tmp/nl update self-test
          /tmp/nl update component-self-test
          /tmp/nl update stabilization-self-test
      - name: Собрать и проверить временно подписанные облегчённые пакеты для x64 и ARM64
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          bash scripts/release/build-macos-production.sh --allow-ad-hoc
          echo "Инвентаризация промышленной сборки macOS перед проверкой поставки:"
          find "${DIR}" -maxdepth 1 -type f -print | sort
          test -x /tmp/nl
          /tmp/nl delivery manifest --bundle "${DIR}" --version "${VERSION}"
          /tmp/nl delivery verify-macos --bundle "${DIR}" --version "${VERSION}"
      - name: Загрузить кандидаты пакетов macOS для x64 и ARM64
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-production-${{ github.sha }}
          path: |
            dist/release-*/launcher-cli-macos-x64
            dist/release-*/launcher-cli-macos-arm64
            dist/release-*/launcher-desktop-macos-x64
            dist/release-*/launcher-desktop-macos-arm64
            dist/release-*/guard-macos-x64
            dist/release-*/guard-macos-arm64
            dist/release-*/runtime-macos-x64
            dist/release-*/runtime-macos-arm64
            dist/release-*/launcher-desktop-*-macos-x64.zip
            dist/release-*/launcher-desktop-*-macos-arm64.zip
            dist/release-*/MACOS_PACKAGE_MANIFEST_X64.json
            dist/release-*/MACOS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/MACOS_NOTARIZATION_EVIDENCE.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS_DELIVERY.json
          if-no-files-found: error
          retention-days: 14

  guard-certification:
    name: Сертификация межплатформенной матрицы Guard CI
    needs: [rust-desktop, guard-windows, guard-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Скачать свидетельства Guard для целевых платформ
        uses: actions/download-artifact@v4
        with:
          pattern: guard-ci-*-${{ github.sha }}
          path: guard-ci-results
      - name: Собрать матрицу Guard для точного коммита
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guard-ci-public
          python3 scripts/guard_ci/matrix.py aggregate \
            --targets guard-ci/targets.json \
            --results-root guard-ci-results \
            --output-dir guard-ci-public \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"
          cp guard-ci/targets.json guard-ci-public/targets.json
          if [[ -s guard-ci-public/matrix.md ]]; then
            cat guard-ci-public/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Загрузить свидетельства сертификации Guard
        uses: actions/upload-artifact@v4
        with:
          name: launcher-guard-ci-matrix-${{ github.run_id }}
          path: |
            guard-ci-public/matrix.json
            guard-ci-public/matrix.md
            guard-ci-public/targets.json
          if-no-files-found: error
          retention-days: 30

  bridge:
    name: Плагины ServerBridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Собрать реальные мосты Velocity и семейства Bukkit
        run: bash scripts/build/bridge-plugins.sh
      - name: Проверить семантику подтверждения Runtime 0.42.0 и негативные регрессионные тесты пакетов релиза
        run: |
          python3 -m unittest discover -s serverbridge/tests -p 'test_live_matrix.py' -v
          python3 -m unittest discover -s e2e/scripts -p 'test_record_serverbridge_runtime.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_accept_network_release.py' -v

  containers:
    name: Контейнеры промышленного окружения
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Проверить промышленную конфигурацию Docker Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: 0123456789abcdef0123456789abcdef
          LAUNCHER_PUBLIC_URL: https://launcher.invalid
          LAUNCHER_AUTH_TOKEN_SECRET: ci-auth-token-secret-0123456789abcdef
          LAUNCHER_CORS_ALLOWED_ORIGINS: https://launcher.invalid
          LAUNCHER_WEBAUTHN_RP_ID: launcher.invalid
          LAUNCHER_WEBAUTHN_ORIGINS: https://launcher.invalid
          LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: '{"schemaVersion":"2.0","releases":{"0.14.0":{"protocolVersion":4,"platforms":{"windows":{"signingMode":"authenticode","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","requireAuthenticode":true}]},"linux":{"signingMode":"integrity-only","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]},"macos":{"signingMode":"developer-id-notarized","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]}}}}}'
          LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: '{"0.13.5":{"velocitySha256":["cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"],"paperSha256":["dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"],"purpurSha256":["eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"]}}'
          LAUNCHER_IMAGE_TAG: 0.0.0-ci
          LAUNCHER_TLS_CERT_PATH: ./tls/fullchain.pem
          LAUNCHER_TLS_KEY_PATH: ./tls/privkey.pem
        run: docker compose -f deploy/production/docker-compose.yml config >/dev/null
      - name: Собрать промышленные контейнерные образы API и Admin
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          docker build --build-arg LAUNCHER_VERSION="$VERSION" --build-arg LAUNCHER_SOURCE_COMMIT="$GITHUB_SHA" -f services/api/Dockerfile -t launcher-api:ci .
          docker build --build-arg LAUNCHER_VERSION="$VERSION" --build-arg LAUNCHER_SOURCE_COMMIT="$GITHUB_SHA" -f apps/admin/Dockerfile -t launcher-admin:ci .

  managed-jre-production:
    name: Управляемая Java II — сквозные проверки Java 8/16/17/21/25 и поставка Temurin 21
    needs: [go-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: "Собрать Runtime для управляемой Java II"
        run: cargo build --release --manifest-path runtime/runtime/Cargo.toml --bin runtime
      - name: "Провести промышленные сквозные тесты управляемой Java II на Java 8, 16, 17, 21 и 25"
        shell: bash
        run: |
          set -euo pipefail
          bash e2e/scripts/run-managed-java-II-e2e.sh
          mkdir -p managed-jre-artifacts
          cp e2e/runtime/managed-java-II/MANAGED_JAVA_II_EVIDENCE.json managed-jre-artifacts/MANAGED_JAVA_II_EVIDENCE.json
      - name: Сборка дистрибутива управляемая JRE с закреплённым поставщиком
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="managed-jre-artifacts"
          python3 scripts/release/managed-jre-distribution.py \
            --out "${OUT}" \
            --version "${VERSION}" \
            --major 21
      - name: Проверить привязку поставки управляемой JRE к шести платформам
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="managed-jre-artifacts"
          (cd cli && go build -trimpath -o /tmp/nl-managed-jre ./cmd/launcher)
          /tmp/nl-managed-jre delivery manifest --bundle "${OUT}" --version "${VERSION}"
          /tmp/nl-managed-jre delivery verify-jre --bundle "${OUT}" --version "${VERSION}"
          python3 scripts/smoke/offline/managed-jre-distribution.py
      - name: Загрузить промышленные артефакты управляемой JRE для точного коммита
        uses: actions/upload-artifact@v4
        with:
          name: launcher-managed-jre-${{ github.sha }}
          path: managed-jre-artifacts/
          if-no-files-found: error
          retention-days: 30

