name: Launcher CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: launcher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  go-contracts:
    name: Go, migrations and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Repository policy and version alignment
        run: |
          python3 scripts/smoke/offline/repository-policy.py
          python3 scripts/release/test_fetch_exact_certifications.py
          python3 scripts/smoke/offline/device-key-storage.py
          python3 scripts/smoke/offline/hardware-bound-identity.py
          python3 scripts/smoke/offline/challenge-response-attestation.py
          python3 scripts/smoke/offline/device-management-revocation.py
          python3 scripts/smoke/offline/session-device-risk-0126.py
          python3 scripts/smoke/offline/minecraft-serverbridge-trust-0127.py
          python3 scripts/smoke/offline/cross-platform-key-recovery-0128.py
          python3 scripts/smoke/offline/device-trust-e2e-matrix-0129.py
          python3 scripts/smoke/offline/device-trust-migration-stabilization-01210.py
          python3 scripts/smoke/offline/device-trust-release-0130.py
          python3 scripts/smoke/offline/guard-windows-0131.py
          python3 scripts/smoke/offline/guard-integrity-evidence-0132.py
          python3 scripts/smoke/offline/guard-process-policy-0133.py
          python3 scripts/smoke/offline/guard-guard-attestation-0134.py
          python3 scripts/smoke/offline/minecraft-serverbridge-integrity-0135.py
          python3 scripts/smoke/offline/windows-production-hardening-0136.py
          python3 scripts/smoke/offline/linux-production-implementation-0137.py
          python3 scripts/smoke/offline/macos-production-implementation-0138.py
          python3 scripts/smoke/offline/guard-ci-release-certification-0139.py
          python3 scripts/smoke/offline/guard-migration-compatibility-stabilization-01310.py
          python3 scripts/smoke/offline/guard-release-0140.py
          python3 scripts/smoke/offline/serverbridge-protocol-v2-0141.py
          python3 scripts/smoke/offline/serverbridge-crypto-node-identities-0142.py
          python3 scripts/smoke/offline/serverbridge-one-time-join-tickets-0143.py
          python3 scripts/smoke/offline/serverbridge-bukkit-family-0144.py
          python3 scripts/smoke/offline/serverbridge-proxy-family-0145.py
          python3 scripts/smoke/offline/serverbridge-fabric-0146.py
          python3 scripts/smoke/offline/serverbridge-forge-neoforge-0147.py
          python3 scripts/smoke/offline/serverbridge-zero-patch-topology-handoff-0148.py
          python3 scripts/smoke/offline/serverbridge-public-matrix-ha-hardening-0149.py
          python3 scripts/smoke/offline/serverbridge-migration-stabilization-01410.py
          python3 scripts/smoke/offline/delivery-manifest-platform-architecture-0151.py
          python3 scripts/smoke/offline/signed-windows-x64-arm64-0152.py
          python3 scripts/smoke/offline/linux-x64-arm64-production-packages-0153.py
          python3 scripts/smoke/offline/notarized-macos-x64-arm64-0154.py
          python3 scripts/smoke/offline/managed-jre-distribution-0155.py
          python3 scripts/smoke/offline/managed-java-II-0165.py
          python3 scripts/smoke/offline/unified-transactional-updater-core-0156.py
          python3 scripts/smoke/offline/desktop-guard-runtime-transactional-update-0157.py
          python3 scripts/smoke/offline/release-verification-v2-trust-lifecycle-0158.py
          python3 scripts/smoke/offline/public-production-delivery-matrix-e2e-0159.py
          python3 scripts/smoke/offline/migration-stabilization-01510.py
          python3 scripts/smoke/offline/production-release-candidate-01511.py
          python3 scripts/smoke/offline/production-delivery-release-0160.py
          python3 scripts/guard_ci/matrix.py validate --targets guard-ci/targets.json
          python3 scripts/guard_ci/test_matrix.py
          bash scripts/smoke/offline/version-alignment.sh
      - name: Validate canonical OpenAPI
        run: python3 scripts/contracts/validate-openapi.py
      - name: Validate public compatibility target definition
        run: |
          python3 scripts/compatibility/matrix.py validate --targets compatibility/targets.json
          python3 scripts/compatibility/test_matrix.py
          python3 scripts/compatibility/test_certify_jre.py
          python3 scripts/compatibility/test_retry_macos_sdl3.py
          python3 scripts/compatibility/test_vanilla_sdl3_retry_wiring.py
          python3 scripts/smoke/offline/minecraft-compatibility-II-ga-0170.py
          python3 scripts/smoke/offline/fabric-compatibility-II-0171.py
          python3 scripts/smoke/offline/quilt-compatibility-II-0172.py
          python3 scripts/smoke/offline/forge-modern-0173.py
          python3 scripts/smoke/offline/forge-legacy-1122-0174.py
          python3 scripts/smoke/offline/forge-legacy-1710-0175.py
          python3 scripts/smoke/offline/neoforge-compatibility-II-0176.py
          python3 scripts/smoke/offline/loader-resolution-pinning-0177.py
          python3 scripts/smoke/offline/loader-native-e2e-0178.py
          python3 scripts/smoke/offline/cross-platform-loaders-0179.py
          python3 scripts/smoke/offline/loader-hardening-01710.py
          python3 scripts/smoke/offline/loader-compatibility-rc-01711.py
          python3 scripts/smoke/offline/loader-compatibility-ga-0180.py
          python3 scripts/smoke/offline/windows-protection-core-II-0181.py
          python3 scripts/smoke/offline/guard-sensor-0182.py
          python3 scripts/device_trust/matrix.py validate --targets device-trust/targets.json
          python3 scripts/device_trust/test_matrix.py
          python3 scripts/serverbridge/matrix.py validate --targets serverbridge/targets.json
          python3 scripts/serverbridge/test_matrix.py
          python3 e2e/scripts/test_publish_client_package.py
      - name: CLI test, race, vet and build
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath -o /tmp/nl ./cmd/launcher
          /tmp/nl update self-test
          /tmp/nl update component-self-test
          /tmp/nl update stabilization-self-test
      - name: Release doctor
        run: /tmp/nl release doctor
      - name: Backend test, race, vet and pgx build
        working-directory: services/api
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/launcher-api
      - name: Federation E2E release matrix
        run: python3 scripts/test/federation-e2e.py

  web:
    name: Admin and Desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/desktop/package-lock.json
      - name: Build Admin
        working-directory: apps/admin
        run: npm ci && npm run build
      - name: Build Desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Desktop texture operations and official-account isolation tests
        working-directory: apps/desktop
        run: npm run test:textures
      - name: Player 0.39.x components, official, join, update and launch regressions
        working-directory: apps/desktop
        run: |
          npm run test:components
          npm run test:official
          npm run test:server-join
          npm run test:auth-experience
          npm run test:update-migration
          npm run test:launch-modes
      - name: Type-check Extensions TypeScript SDKs
        run: |
          apps/admin/node_modules/.bin/tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution Bundler --lib ES2020,DOM sdk/admin/typescript/generated.ts sdk/admin/typescript/openapi-generated.ts sdk/admin/typescript/api-types-generated.ts sdk/admin/typescript/api-requests-generated.ts sdk/admin/typescript/launcher-admin.ts sdk/desktop/typescript/generated.ts sdk/desktop/typescript/openapi-generated.ts sdk/desktop/typescript/api-types-generated.ts sdk/desktop/typescript/api-requests-generated.ts sdk/desktop/typescript/launcher-desktop.ts

  rust-desktop:
    name: Runtime and Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Normalize Rust source formatting
        run: |
          cargo fmt --manifest-path runtime/runtime/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Runtime + Guard Linux test and clippy
        run: |
          python3 scripts/smoke/offline/linux-production-implementation-0137.py
          python3 scripts/smoke/offline/guard-ci-release-certification-0139.py
          cargo test --manifest-path runtime/runtime/Cargo.toml
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_linux -- --nocapture
          cargo clippy --manifest-path runtime/runtime/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path runtime/runtime/Cargo.toml
      - name: Build Desktop Tauri
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build Linux Desktop + Guard production package
        run: bash scripts/release/build-linux-desktop.sh
      - name: Emit Linux Guard CI evidence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          python3 scripts/guard_ci/matrix.py result \
            --targets guard-ci/targets.json \
            --target-id guard-linux-amd64 \
            --package "${DIR}/launcher-desktop-${VERSION}-linux-amd64.zip" \
            --launcher "${DIR}/launcher-desktop-linux-amd64" \
            --guard "${DIR}/guard-linux-amd64" \
            --manifest "${DIR}/LINUX_PACKAGE_MANIFEST.json" \
            --allowlist "${DIR}/GUARD_RELEASE_ALLOWLIST_LINUX.json" \
            --signing-mode none-linux-integrity \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --output guard-ci-result/linux/guard-ci-result.json
      - name: Upload Linux Guard package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-guard-${{ github.sha }}
          path: |
            dist/release-*/launcher-desktop-*-linux-amd64.zip
            dist/release-*/launcher-desktop-linux-amd64
            dist/release-*/guard-linux-amd64
            dist/release-*/LINUX_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_LINUX.json
          if-no-files-found: error
      - name: Upload Linux Guard CI result
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-linux-amd64-${{ github.sha }}
          path: guard-ci-result/linux/guard-ci-result.json
          if-no-files-found: error

  linux-production:
    name: Linux production ${{ matrix.arch }}
    needs: [go-contracts, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Generate ephemeral component signing trust for CI only
        run: |
          python3 -m pip install 'cryptography>=43,<47'
          python3 - <<'PY_SIGN'
          import os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
          seed = key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption()).hex()
          pub = key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw).hex()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LAUNCHER_COMPONENT_SET_ED25519_SEED='+seed+'\n')
              env.write('LAUNCHER_COMPONENT_SET_ED25519_PUBLIC_KEY='+pub+'\n')
          PY_SIGN
      - name: Build native Linux production package
        run: bash scripts/release/build-linux-production.sh "$(pwd)/dist/release-$(tr -d '[:space:]' < VERSION)" --expected-arch "${{ matrix.arch }}"
      - name: Verify package locally
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          test -s "${DIR}/launcher-cli-linux-${{ matrix.arch }}"
          test -s "${DIR}/launcher-api-linux-${{ matrix.arch }}"
          test -s "${DIR}/launcher-desktop-linux-${{ matrix.arch }}"
          test -s "${DIR}/guard-linux-${{ matrix.arch }}"
          test -s "${DIR}/runtime-linux-${{ matrix.arch }}"
          test -s "${DIR}/launcher-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          python3 scripts/release/secret-scan.py "${DIR}/launcher-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          "${DIR}/launcher-cli-linux-${{ matrix.arch }}" update self-test
          "${DIR}/launcher-cli-linux-${{ matrix.arch }}" update component-self-test
          "${DIR}/launcher-cli-linux-${{ matrix.arch }}" update stabilization-self-test
      - name: Upload native Linux production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-production-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/release-*/launcher-cli-linux-${{ matrix.arch }}
            dist/release-*/launcher-api-linux-${{ matrix.arch }}
            dist/release-*/launcher-desktop-linux-${{ matrix.arch }}
            dist/release-*/guard-linux-${{ matrix.arch }}
            dist/release-*/runtime-linux-${{ matrix.arch }}
            dist/release-*/launcher-linux-${{ matrix.arch }}-*.tar.gz
            dist/release-*/LINUX_PACKAGE_MANIFEST_*.json
          if-no-files-found: error
          retention-days: 14

  guard-windows:
    name: Guard Windows x64 + ARM64 delivery boundary
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Guard Windows integration test
        run: |
          python scripts/smoke/offline/windows-production-hardening-0136.py
          python scripts/smoke/offline/windows-protection-core-II-0181.py
          python scripts/smoke/offline/guard-sensor-0182.py
          python scripts/smoke/offline/guard-module-guard-0183.py
          python scripts/smoke/offline/guard-aggressive-hook-engine-0184.py
          python scripts/smoke/offline/guard-memory-integrity-0185.py
          python scripts/smoke/offline/guard-thread-process-integrity-0186.py
          python scripts/smoke/offline/guard-debug-instrumentation-0187.py
          python scripts/smoke/offline/guard-jvm-aware-protection-0188.py
          python scripts/smoke/offline/guard-continuous-guard-0189.py
          python scripts/smoke/offline/guard-attestation-v2-01810.py
          cd services/api
          go test ./internal/httpapi -run 'TestGuardAttestationV2' -count=1
          go test ./internal/dbmigrate -run 'TestGuardAttestationV2Migration01810' -count=1
          cd ../..
          python scripts/smoke/offline/guard-ci-release-certification-0139.py
          cargo fmt --manifest-path runtime/runtime/Cargo.toml
          cargo fmt --manifest-path runtime/guard-sensor/Cargo.toml
          cargo fmt --manifest-path runtime/guard-memory-probe/Cargo.toml
          cargo fmt --manifest-path runtime/guard-thread-probe/Cargo.toml
          cargo fmt --manifest-path runtime/guard-debug-probe/Cargo.toml
          cargo fmt --manifest-path runtime/guard-jvm-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-sensor/Cargo.toml
          cargo build --manifest-path runtime/guard-memory-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-thread-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-debug-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-jvm-probe/Cargo.toml
          $env:GUARD_SENSOR_TEST_DLL = (Resolve-Path "runtime/guard-sensor/target/debug/guard_sensor.dll").Path
          $env:GUARD_MEMORY_PROBE_DLL = (Resolve-Path "runtime/guard-memory-probe/target/debug/guard_memory_probe.dll").Path
          $env:GUARD_THREAD_PROBE_DLL = (Resolve-Path "runtime/guard-thread-probe/target/debug/guard_thread_probe.dll").Path
          $env:GUARD_DEBUG_PROBE_EXE = (Resolve-Path "runtime/guard-debug-probe/target/debug/guard-debug-probe.exe").Path
          $env:GUARD_JVM_PROBE_DLL = (Resolve-Path "runtime/guard-jvm-probe/target/debug/guard_jvm_probe.dll").Path
          $env:GUARD_EXPECTED_JAVA_MAJOR = "21"
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib windows_policy::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_windows -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_sensor_windows guard_continuous_guard_cross_checks_sensor_and_guard_heartbeat -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_sensor_windows -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib windows_attestation_v2::tests -- --nocapture
          cargo clippy --manifest-path runtime/runtime/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-sensor/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-memory-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-thread-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-debug-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/guard-jvm-probe/Cargo.toml --all-targets -- -D warnings
      - name: Unified transactional updater self-test
        shell: pwsh
        run: |
          Push-Location cli
          go build -trimpath -o "$env:RUNNER_TEMP\nl-updater-selftest.exe" ./cmd/launcher
          Pop-Location
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update self-test
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update component-self-test
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update stabilization-self-test
      - name: Build unsigned CI x64 + ARM64 delivery candidates
        shell: pwsh
        run: ./scripts/release/build-windows-desktop.ps1 -AllowUnsignedDevelopmentPackage
      - name: Emit Windows Guard CI evidence
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Dir = "dist/release-$Version"
          python scripts/guard_ci/matrix.py result --targets guard-ci/targets.json --target-id guard-windows-amd64 --package "$Dir/launcher-desktop-$Version-windows-amd64.zip" --launcher "$Dir/launcher-desktop-windows-amd64.exe" --guard "$Dir/guard-windows-amd64.exe" --manifest "$Dir/WINDOWS_PACKAGE_MANIFEST.json" --allowlist "$Dir/GUARD_RELEASE_ALLOWLIST_WINDOWS.json" --signing-mode unsigned-development-ci --commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --repository "$env:GITHUB_REPOSITORY" --output guard-ci-result/windows/guard-ci-result.json
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-guard-${{ github.sha }}
          path: |
            dist/release-*/launcher-desktop-*-windows-amd64.zip
            dist/release-*/launcher-desktop-windows-amd64.exe
            dist/release-*/guard-windows-amd64.exe
            dist/release-*/WINDOWS_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS_DELIVERY.json
            dist/release-*/launcher-cli-windows-x64.exe
            dist/release-*/launcher-cli-windows-arm64.exe
            dist/release-*/launcher-desktop-windows-x64.exe
            dist/release-*/launcher-desktop-windows-arm64.exe
            dist/release-*/guard-windows-x64.exe
            dist/release-*/guard-windows-arm64.exe
            dist/release-*/guard-sensor-windows-x64.dll
            dist/release-*/guard-sensor-windows-arm64.dll
            dist/release-*/runtime-windows-x64.exe
            dist/release-*/runtime-windows-arm64.exe
            dist/release-*/launcher-desktop-*-windows-x64.zip
            dist/release-*/launcher-desktop-*-windows-arm64.zip
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_X64.json
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/WINDOWS_SIGNING_EVIDENCE.json
          if-no-files-found: error
      - name: Upload Windows Guard CI result
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-windows-amd64-${{ github.sha }}
          path: guard-ci-result/windows/guard-ci-result.json
          if-no-files-found: error

  guard-macos:
    name: Guard macOS production implementation
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: macOS production gate and native Rust checks
        shell: bash
        run: |
          python3 scripts/smoke/offline/macos-production-implementation-0138.py
          python3 scripts/smoke/offline/guard-ci-release-certification-0139.py
          cargo fmt --manifest-path runtime/runtime/Cargo.toml
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo clippy --manifest-path runtime/runtime/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path runtime/runtime/Cargo.toml --bin guard
      - name: Signed macOS Guard integration test
        shell: bash
        run: |
          TEST_BIN="$(cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_macos --no-run --message-format=json | python3 -c 'import json,sys; xs=[]; [xs.append(x.get("executable")) for line in sys.stdin for x in [json.loads(line)] if x.get("reason")=="compiler-artifact" and x.get("target",{}).get("name")=="guard_macos" and x.get("executable")]; print(xs[-1])')"
          test -n "${TEST_BIN}"
          codesign --force --sign - --options runtime --timestamp=none runtime/runtime/target/debug/guard
          codesign --force --sign - --options runtime --timestamp=none "${TEST_BIN}"
          "${TEST_BIN}" --nocapture
      - name: Build Desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Build ad-hoc universal macOS package
        shell: bash
        run: bash scripts/release/build-macos-desktop.sh "$(pwd)/dist/release-$(tr -d '[:space:]' < VERSION)" --allow-ad-hoc
      - name: Emit macOS Guard CI evidence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          python3 scripts/guard_ci/matrix.py result \
            --targets guard-ci/targets.json \
            --target-id guard-macos-universal \
            --package "${DIR}/launcher-desktop-${VERSION}-macos-universal.zip" \
            --launcher "${DIR}/launcher-desktop-macos-universal" \
            --guard "${DIR}/guard-macos-universal" \
            --manifest "${DIR}/MACOS_PACKAGE_MANIFEST.json" \
            --allowlist "${DIR}/GUARD_RELEASE_ALLOWLIST_MACOS.json" \
            --signing-mode adhoc-ci \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --output guard-ci-result/macos/guard-ci-result.json
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-guard-${{ github.sha }}
          path: |
            dist/release-*/launcher-desktop-*-macos-universal.zip
            dist/release-*/launcher-desktop-macos-universal
            dist/release-*/guard-macos-universal
            dist/release-*/MACOS_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS.json
          if-no-files-found: error
      - name: Upload macOS Guard CI result
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-macos-universal-${{ github.sha }}
          path: guard-ci-result/macos/guard-ci-result.json
          if-no-files-found: error

  macos-production:
    name: macOS x64 + ARM64 delivery boundary
    needs: [go-contracts, web]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Verify updater core before packaging
        shell: bash
        run: |
          set -euo pipefail
          (cd cli && go build -trimpath -o /tmp/nl ./cmd/launcher)
          /tmp/nl update self-test
          /tmp/nl update component-self-test
          /tmp/nl update stabilization-self-test
      - name: Build and verify ad-hoc thin x64 + ARM64 delivery candidates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          bash scripts/release/build-macos-production.sh --allow-ad-hoc
          echo "macOS production inventory before delivery verification:"
          find "${DIR}" -maxdepth 1 -type f -print | sort
          test -x /tmp/nl
          /tmp/nl delivery manifest --bundle "${DIR}" --version "${VERSION}"
          /tmp/nl delivery verify-macos --bundle "${DIR}" --version "${VERSION}"
      - name: Upload macOS x64 + ARM64 delivery candidates
        uses: actions/upload-artifact@v4
        with:
          name: launcher-macos-production-${{ github.sha }}
          path: |
            dist/release-*/launcher-cli-macos-x64
            dist/release-*/launcher-cli-macos-arm64
            dist/release-*/launcher-desktop-macos-x64
            dist/release-*/launcher-desktop-macos-arm64
            dist/release-*/guard-macos-x64
            dist/release-*/guard-macos-arm64
            dist/release-*/runtime-macos-x64
            dist/release-*/runtime-macos-arm64
            dist/release-*/launcher-desktop-*-macos-x64.zip
            dist/release-*/launcher-desktop-*-macos-arm64.zip
            dist/release-*/MACOS_PACKAGE_MANIFEST_X64.json
            dist/release-*/MACOS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/MACOS_NOTARIZATION_EVIDENCE.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS_DELIVERY.json
          if-no-files-found: error
          retention-days: 14

  guard-certification:
    name: Cross-platform Guard CI matrix certification
    needs: [rust-desktop, guard-windows, guard-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Guard target evidence
        uses: actions/download-artifact@v4
        with:
          pattern: guard-ci-*-${{ github.sha }}
          path: guard-ci-results
      - name: Aggregate exact-commit Guard matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guard-ci-public
          python3 scripts/guard_ci/matrix.py aggregate \
            --targets guard-ci/targets.json \
            --results-root guard-ci-results \
            --output-dir guard-ci-public \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"
          cp guard-ci/targets.json guard-ci-public/targets.json
          if [[ -s guard-ci-public/matrix.md ]]; then
            cat guard-ci-public/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Guard certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: launcher-guard-ci-matrix-${{ github.run_id }}
          path: |
            guard-ci-public/matrix.json
            guard-ci-public/matrix.md
            guard-ci-public/targets.json
          if-no-files-found: error
          retention-days: 30

  bridge:
    name: ServerBridge plugins
    runs-on: ubuntu-24.04
