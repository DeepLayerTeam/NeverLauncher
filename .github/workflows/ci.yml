      - name: Проверить реальные данные жизненного цикла игры с отказом по умолчанию и счётчики издателя
        run: |
          python3 -m unittest discover -s e2e/scripts -p 'test_game_cycle.py' -v
          python3 -m unittest discover -s e2e/scripts -p 'test_publish_client_package.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_verify_game_cycle.py' -v
