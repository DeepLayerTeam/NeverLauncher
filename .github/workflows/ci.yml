name: NeverLauncher CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: neverlauncher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  go-contracts:
    name: Go, migrations and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - name: Repository policy and version alignment
        run: |
          python3 scripts/smoke/offline/repository-policy.py
          python3 scripts/release/test_fetch_exact_certifications.py
          python3 scripts/smoke/offline/device-key-storage.py
          python3 scripts/smoke/offline/hardware-bound-identity.py
          python3 scripts/smoke/offline/challenge-response-attestation.py
          python3 scripts/smoke/offline/device-management-revocation.py
          python3 scripts/smoke/offline/session-device-risk-0126.py
          python3 scripts/smoke/offline/minecraft-serverbridge-trust-0127.py
          python3 scripts/smoke/offline/cross-platform-key-recovery-0128.py
          python3 scripts/smoke/offline/device-trust-e2e-matrix-0129.py
          python3 scripts/smoke/offline/device-trust-migration-stabilization-01210.py
          python3 scripts/smoke/offline/device-trust-release-0130.py
          python3 scripts/smoke/offline/neverguard-windows-0131.py
          python3 scripts/smoke/offline/neverguard-integrity-evidence-0132.py
          python3 scripts/smoke/offline/neverguard-process-policy-0133.py
          python3 scripts/smoke/offline/neverguard-guard-attestation-0134.py
          python3 scripts/smoke/offline/minecraft-serverbridge-integrity-0135.py
          python3 scripts/smoke/offline/windows-production-hardening-0136.py
          python3 scripts/smoke/offline/linux-production-implementation-0137.py
          python3 scripts/smoke/offline/macos-production-implementation-0138.py
          python3 scripts/smoke/offline/guard-ci-release-certification-0139.py
          python3 scripts/smoke/offline/guard-migration-compatibility-stabilization-01310.py
          python3 scripts/smoke/offline/neverguard-release-0140.py
          python3 scripts/smoke/offline/serverbridge-protocol-v2-0141.py
          python3 scripts/smoke/offline/serverbridge-crypto-node-identities-0142.py
          python3 scripts/smoke/offline/serverbridge-one-time-join-tickets-0143.py
          python3 scripts/smoke/offline/serverbridge-bukkit-family-0144.py
          python3 scripts/smoke/offline/serverbridge-proxy-family-0145.py
          python3 scripts/smoke/offline/serverbridge-fabric-0146.py
          python3 scripts/smoke/offline/serverbridge-forge-neoforge-0147.py
          python3 scripts/smoke/offline/serverbridge-zero-patch-topology-handoff-0148.py
          python3 scripts/smoke/offline/serverbridge-public-matrix-ha-hardening-0149.py
          python3 scripts/smoke/offline/serverbridge-migration-stabilization-01410.py
          python3 scripts/smoke/offline/delivery-manifest-platform-architecture-0151.py
          python3 scripts/smoke/offline/signed-windows-x64-arm64-0152.py
          python3 scripts/smoke/offline/linux-x64-arm64-production-packages-0153.py
          python3 scripts/smoke/offline/notarized-macos-x64-arm64-0154.py
          python3 scripts/smoke/offline/managed-jre-distribution-0155.py
          python3 scripts/smoke/offline/managed-java-II-0165.py
          python3 scripts/smoke/offline/unified-transactional-updater-core-0156.py
          python3 scripts/smoke/offline/desktop-guard-runtime-transactional-update-0157.py
          python3 scripts/smoke/offline/release-verification-v2-trust-lifecycle-0158.py
          python3 scripts/smoke/offline/public-production-delivery-matrix-e2e-0159.py
          python3 scripts/smoke/offline/migration-stabilization-01510.py
          python3 scripts/smoke/offline/production-release-candidate-01511.py
          python3 scripts/smoke/offline/production-delivery-release-0160.py
          python3 scripts/guard_ci/matrix.py validate --targets guard-ci/targets.json
          python3 scripts/guard_ci/test_matrix.py
          bash scripts/smoke/offline/version-alignment.sh
      - name: Validate canonical OpenAPI
        run: python3 scripts/contracts/validate-openapi.py
      - name: Validate public compatibility target definition
        run: |
          python3 scripts/compatibility/matrix.py validate --targets compatibility/targets.json
          python3 scripts/compatibility/test_matrix.py
          python3 scripts/compatibility/test_certify_jre.py
          python3 scripts/smoke/offline/minecraft-compatibility-II-ga-0170.py
          python3 scripts/smoke/offline/fabric-compatibility-II-0171.py
          python3 scripts/smoke/offline/quilt-compatibility-II-0172.py
          python3 scripts/smoke/offline/forge-modern-0173.py
          python3 scripts/smoke/offline/forge-legacy-1122-0174.py
          python3 scripts/smoke/offline/forge-legacy-1710-0175.py
          python3 scripts/smoke/offline/neoforge-compatibility-II-0176.py
          python3 scripts/smoke/offline/loader-resolution-pinning-0177.py
          python3 scripts/smoke/offline/loader-native-e2e-0178.py
          python3 scripts/smoke/offline/cross-platform-loaders-0179.py
          python3 scripts/smoke/offline/loader-hardening-01710.py
          python3 scripts/smoke/offline/loader-compatibility-rc-01711.py
          python3 scripts/smoke/offline/loader-compatibility-ga-0180.py
          python3 scripts/smoke/offline/windows-protection-core-II-0181.py
          python3 scripts/smoke/offline/neverguard-sensor-0182.py
          python3 scripts/device_trust/matrix.py validate --targets device-trust/targets.json
          python3 scripts/device_trust/test_matrix.py
          python3 scripts/serverbridge/matrix.py validate --targets serverbridge/targets.json
          python3 scripts/serverbridge/test_matrix.py
          python3 e2e/scripts/test_publish_client_package.py
      - name: CLI test, race, vet and build
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath -o /tmp/nl ./cmd/neverlauncher
          /tmp/nl update self-test
          /tmp/nl update component-self-test
          /tmp/nl update stabilization-self-test
      - name: Release doctor
        run: /tmp/nl release doctor
      - name: Backend test, race, vet and pgx build
        working-directory: services/api
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./cmd/neverlauncher-api
      - name: Federation E2E release matrix
        run: python3 scripts/test/federation-e2e.py

  web:
    name: Admin and Desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/desktop/package-lock.json
      - name: Build Admin
        working-directory: apps/admin
        run: npm ci && npm run build
      - name: Build Desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Type-check NeverExtensions TypeScript SDKs
        run: |
          apps/admin/node_modules/.bin/tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution Bundler --lib ES2020,DOM sdk/admin/typescript/generated.ts sdk/admin/typescript/openapi-generated.ts sdk/admin/typescript/api-types-generated.ts sdk/admin/typescript/api-requests-generated.ts sdk/admin/typescript/neverlauncher-admin.ts sdk/desktop/typescript/generated.ts sdk/desktop/typescript/openapi-generated.ts sdk/desktop/typescript/api-types-generated.ts sdk/desktop/typescript/api-requests-generated.ts sdk/desktop/typescript/neverlauncher-desktop.ts

  rust-desktop:
    name: NeverRuntime and Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Normalize Rust source formatting
        run: |
          cargo fmt --manifest-path runtime/neverruntime/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: NeverRuntime + NeverGuard Linux test and clippy
        run: |
          python3 scripts/smoke/offline/linux-production-implementation-0137.py
          python3 scripts/smoke/offline/guard-ci-release-certification-0139.py
          cargo test --manifest-path runtime/neverruntime/Cargo.toml
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --test neverguard_linux -- --nocapture
          cargo clippy --manifest-path runtime/neverruntime/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path runtime/neverruntime/Cargo.toml
      - name: Build Desktop Tauri
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Build Linux Desktop + NeverGuard production package
        run: bash scripts/release/build-linux-desktop.sh
      - name: Emit Linux Guard CI evidence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          python3 scripts/guard_ci/matrix.py result \
            --targets guard-ci/targets.json \
            --target-id guard-linux-amd64 \
            --package "${DIR}/neverlauncher-desktop-${VERSION}-linux-amd64.zip" \
            --launcher "${DIR}/neverlauncher-desktop-linux-amd64" \
            --guard "${DIR}/neverguard-linux-amd64" \
            --manifest "${DIR}/LINUX_PACKAGE_MANIFEST.json" \
            --allowlist "${DIR}/GUARD_RELEASE_ALLOWLIST_LINUX.json" \
            --signing-mode none-linux-integrity \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --output guard-ci-result/linux/guard-ci-result.json
      - name: Upload Linux NeverGuard package
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-linux-neverguard-${{ github.sha }}
          path: |
            dist/release-*/neverlauncher-desktop-*-linux-amd64.zip
            dist/release-*/neverlauncher-desktop-linux-amd64
            dist/release-*/neverguard-linux-amd64
            dist/release-*/LINUX_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_LINUX.json
          if-no-files-found: error
      - name: Upload Linux Guard CI result
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-linux-amd64-${{ github.sha }}
          path: guard-ci-result/linux/guard-ci-result.json
          if-no-files-found: error

  linux-production:
    name: Linux production ${{ matrix.arch }}
    needs: [go-contracts, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - name: Build native Linux production package
        run: bash scripts/release/build-linux-production.sh "$(pwd)/dist/release-$(tr -d '[:space:]' < VERSION)" --expected-arch "${{ matrix.arch }}"
      - name: Verify package locally
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          test -s "${DIR}/neverlauncher-cli-linux-${{ matrix.arch }}"
          test -s "${DIR}/neverlauncher-api-linux-${{ matrix.arch }}"
          test -s "${DIR}/neverlauncher-desktop-linux-${{ matrix.arch }}"
          test -s "${DIR}/neverguard-linux-${{ matrix.arch }}"
          test -s "${DIR}/neverruntime-linux-${{ matrix.arch }}"
          test -s "${DIR}/neverlauncher-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          python3 scripts/release/secret-scan.py "${DIR}/neverlauncher-linux-${{ matrix.arch }}-${VERSION}.tar.gz"
          "${DIR}/neverlauncher-cli-linux-${{ matrix.arch }}" update self-test
          "${DIR}/neverlauncher-cli-linux-${{ matrix.arch }}" update component-self-test
          "${DIR}/neverlauncher-cli-linux-${{ matrix.arch }}" update stabilization-self-test
      - name: Upload native Linux production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-linux-production-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/release-*/neverlauncher-cli-linux-${{ matrix.arch }}
            dist/release-*/neverlauncher-api-linux-${{ matrix.arch }}
            dist/release-*/neverlauncher-desktop-linux-${{ matrix.arch }}
            dist/release-*/neverguard-linux-${{ matrix.arch }}
            dist/release-*/neverruntime-linux-${{ matrix.arch }}
            dist/release-*/neverlauncher-linux-${{ matrix.arch }}-*.tar.gz
            dist/release-*/LINUX_PACKAGE_MANIFEST_*.json
          if-no-files-found: error
          retention-days: 14

  neverguard-windows:
    name: NeverGuard Windows x64 + ARM64 delivery boundary
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: NeverGuard Windows integration test
        run: |
          python scripts/smoke/offline/windows-production-hardening-0136.py
          python scripts/smoke/offline/windows-protection-core-II-0181.py
          python scripts/smoke/offline/neverguard-sensor-0182.py
          python scripts/smoke/offline/neverguard-module-guard-0183.py
          python scripts/smoke/offline/neverguard-aggressive-hook-engine-0184.py
          python scripts/smoke/offline/neverguard-memory-integrity-0185.py
          python scripts/smoke/offline/neverguard-thread-process-integrity-0186.py
          python scripts/smoke/offline/neverguard-debug-instrumentation-0187.py
          python scripts/smoke/offline/neverguard-jvm-aware-protection-0188.py
          python scripts/smoke/offline/neverguard-continuous-guard-0189.py
          python scripts/smoke/offline/neverguard-attestation-v2-01810.py
          cd services/api
          go test ./internal/httpapi -run 'TestGuardAttestationV2' -count=1
          go test ./internal/dbmigrate -run 'TestGuardAttestationV2Migration01810' -count=1
          cd ../..
          python scripts/smoke/offline/guard-ci-release-certification-0139.py
          cargo fmt --manifest-path runtime/neverruntime/Cargo.toml
          cargo fmt --manifest-path runtime/neverguard-sensor/Cargo.toml
          cargo fmt --manifest-path runtime/neverguard-memory-probe/Cargo.toml
          cargo fmt --manifest-path runtime/neverguard-thread-probe/Cargo.toml
          cargo fmt --manifest-path runtime/neverguard-debug-probe/Cargo.toml
          cargo fmt --manifest-path runtime/neverguard-jvm-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-sensor/Cargo.toml
          cargo build --manifest-path runtime/neverguard-memory-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-thread-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-debug-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-jvm-probe/Cargo.toml
          $env:NEVERGUARD_SENSOR_TEST_DLL = (Resolve-Path "runtime/neverguard-sensor/target/debug/neverguard_sensor.dll").Path
          $env:NEVERGUARD_MEMORY_PROBE_DLL = (Resolve-Path "runtime/neverguard-memory-probe/target/debug/neverguard_memory_probe.dll").Path
          $env:NEVERGUARD_THREAD_PROBE_DLL = (Resolve-Path "runtime/neverguard-thread-probe/target/debug/neverguard_thread_probe.dll").Path
          $env:NEVERGUARD_DEBUG_PROBE_EXE = (Resolve-Path "runtime/neverguard-debug-probe/target/debug/neverguard-debug-probe.exe").Path
          $env:NEVERGUARD_JVM_PROBE_DLL = (Resolve-Path "runtime/neverguard-jvm-probe/target/debug/neverguard_jvm_probe.dll").Path
          $env:NEVERGUARD_EXPECTED_JAVA_MAJOR = "21"
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib windows_policy::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --test neverguard_windows -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --test neverguard_sensor_windows neverguard_continuous_guard_cross_checks_sensor_and_guard_heartbeat -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --test neverguard_sensor_windows -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib windows_attestation_v2::tests -- --nocapture
          cargo clippy --manifest-path runtime/neverruntime/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/neverguard-sensor/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/neverguard-memory-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/neverguard-thread-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/neverguard-debug-probe/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path runtime/neverguard-jvm-probe/Cargo.toml --all-targets -- -D warnings
      - name: Unified transactional updater self-test
        shell: pwsh
        run: |
          Push-Location cli
          go build -trimpath -o "$env:RUNNER_TEMP\nl-updater-selftest.exe" ./cmd/neverlauncher
          Pop-Location
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update self-test
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update component-self-test
          & "$env:RUNNER_TEMP\nl-updater-selftest.exe" update stabilization-self-test
      - name: Build unsigned CI x64 + ARM64 delivery candidates
        shell: pwsh
        run: ./scripts/release/build-windows-desktop.ps1 -AllowUnsignedDevelopmentPackage
      - name: Emit Windows Guard CI evidence
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Dir = "dist/release-$Version"
          python scripts/guard_ci/matrix.py result --targets guard-ci/targets.json --target-id guard-windows-amd64 --package "$Dir/neverlauncher-desktop-$Version-windows-amd64.zip" --launcher "$Dir/neverlauncher-desktop-windows-amd64.exe" --guard "$Dir/neverguard-windows-amd64.exe" --manifest "$Dir/WINDOWS_PACKAGE_MANIFEST.json" --allowlist "$Dir/GUARD_RELEASE_ALLOWLIST_WINDOWS.json" --signing-mode unsigned-development-ci --commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --repository "$env:GITHUB_REPOSITORY" --output guard-ci-result/windows/guard-ci-result.json
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-windows-neverguard-${{ github.sha }}
          path: |
            dist/release-*/neverlauncher-desktop-*-windows-amd64.zip
            dist/release-*/neverlauncher-desktop-windows-amd64.exe
            dist/release-*/neverguard-windows-amd64.exe
            dist/release-*/WINDOWS_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS_DELIVERY.json
            dist/release-*/neverlauncher-cli-windows-x64.exe
            dist/release-*/neverlauncher-cli-windows-arm64.exe
            dist/release-*/neverlauncher-desktop-windows-x64.exe
            dist/release-*/neverlauncher-desktop-windows-arm64.exe
            dist/release-*/neverguard-windows-x64.exe
            dist/release-*/neverguard-windows-arm64.exe
            dist/release-*/neverguard-sensor-windows-x64.dll
            dist/release-*/neverguard-sensor-windows-arm64.dll
            dist/release-*/neverruntime-windows-x64.exe
            dist/release-*/neverruntime-windows-arm64.exe
            dist/release-*/neverlauncher-desktop-*-windows-x64.zip
            dist/release-*/neverlauncher-desktop-*-windows-arm64.zip
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_X64.json
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/WINDOWS_SIGNING_EVIDENCE.json
          if-no-files-found: error
      - name: Upload Windows Guard CI result
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-windows-amd64-${{ github.sha }}
          path: guard-ci-result/windows/guard-ci-result.json
          if-no-files-found: error

  neverguard-macos:
    name: NeverGuard macOS production implementation
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: macOS production gate and native Rust checks
        shell: bash
        run: |
          python3 scripts/smoke/offline/macos-production-implementation-0138.py
          python3 scripts/smoke/offline/guard-ci-release-certification-0139.py
          cargo fmt --manifest-path runtime/neverruntime/Cargo.toml
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib integrity::tests -- --nocapture
          cargo test --manifest-path runtime/neverruntime/Cargo.toml --lib attestation::tests -- --nocapture
          cargo clippy --manifest-path runtime/neverruntime/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path runtime/neverruntime/Cargo.toml --bin neverguard
      - name: Signed macOS NeverGuard integration test
        shell: bash
        run: |
          TEST_BIN="$(cargo test --manifest-path runtime/neverruntime/Cargo.toml --test neverguard_macos --no-run --message-format=json | python3 -c 'import json,sys; xs=[]; [xs.append(x.get("executable")) for line in sys.stdin for x in [json.loads(line)] if x.get("reason")=="compiler-artifact" and x.get("target",{}).get("name")=="neverguard_macos" and x.get("executable")]; print(xs[-1])')"
          test -n "${TEST_BIN}"
          codesign --force --sign - --options runtime --timestamp=none runtime/neverruntime/target/debug/neverguard
          codesign --force --sign - --options runtime --timestamp=none "${TEST_BIN}"
          "${TEST_BIN}" --nocapture
      - name: Build Desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Build ad-hoc universal macOS package
        shell: bash
        run: bash scripts/release/build-macos-desktop.sh "$(pwd)/dist/release-$(tr -d '[:space:]' < VERSION)" --allow-ad-hoc
      - name: Emit macOS Guard CI evidence
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          python3 scripts/guard_ci/matrix.py result \
            --targets guard-ci/targets.json \
            --target-id guard-macos-universal \
            --package "${DIR}/neverlauncher-desktop-${VERSION}-macos-universal.zip" \
            --launcher "${DIR}/neverlauncher-desktop-macos-universal" \
            --guard "${DIR}/neverguard-macos-universal" \
            --manifest "${DIR}/MACOS_PACKAGE_MANIFEST.json" \
            --allowlist "${DIR}/GUARD_RELEASE_ALLOWLIST_MACOS.json" \
            --signing-mode adhoc-ci \
            --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --output guard-ci-result/macos/guard-ci-result.json
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-macos-neverguard-${{ github.sha }}
          path: |
            dist/release-*/neverlauncher-desktop-*-macos-universal.zip
            dist/release-*/neverlauncher-desktop-macos-universal
            dist/release-*/neverguard-macos-universal
            dist/release-*/MACOS_PACKAGE_MANIFEST.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS.json
          if-no-files-found: error
      - name: Upload macOS Guard CI result
        uses: actions/upload-artifact@v4
        with:
          name: guard-ci-macos-universal-${{ github.sha }}
          path: guard-ci-result/macos/guard-ci-result.json
          if-no-files-found: error

  macos-production:
    name: macOS x64 + ARM64 delivery boundary
    needs: [go-contracts, web]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Verify updater core before packaging
        shell: bash
        run: |
          set -euo pipefail
          (cd cli && go build -trimpath -o /tmp/nl ./cmd/neverlauncher)
          /tmp/nl update self-test
          /tmp/nl update component-self-test
          /tmp/nl update stabilization-self-test
      - name: Build and verify ad-hoc thin x64 + ARM64 delivery candidates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          bash scripts/release/build-macos-production.sh --allow-ad-hoc
          echo "macOS production inventory before delivery verification:"
          find "${DIR}" -maxdepth 1 -type f -print | sort
          test -x /tmp/nl
          /tmp/nl delivery manifest --bundle "${DIR}" --version "${VERSION}"
          /tmp/nl delivery verify-macos --bundle "${DIR}" --version "${VERSION}"
      - name: Upload macOS x64 + ARM64 delivery candidates
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-macos-production-${{ github.sha }}
          path: |
            dist/release-*/neverlauncher-cli-macos-x64
            dist/release-*/neverlauncher-cli-macos-arm64
            dist/release-*/neverlauncher-desktop-macos-x64
            dist/release-*/neverlauncher-desktop-macos-arm64
            dist/release-*/neverguard-macos-x64
            dist/release-*/neverguard-macos-arm64
            dist/release-*/neverruntime-macos-x64
            dist/release-*/neverruntime-macos-arm64
            dist/release-*/neverlauncher-desktop-*-macos-x64.zip
            dist/release-*/neverlauncher-desktop-*-macos-arm64.zip
            dist/release-*/MACOS_PACKAGE_MANIFEST_X64.json
            dist/release-*/MACOS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/MACOS_NOTARIZATION_EVIDENCE.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_MACOS_DELIVERY.json
          if-no-files-found: error
          retention-days: 14

  guard-certification:
    name: Cross-platform Guard CI matrix certification
    needs: [rust-desktop, neverguard-windows, neverguard-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Guard target evidence
        uses: actions/download-artifact@v4
        with:
          pattern: guard-ci-*-${{ github.sha }}
          path: guard-ci-results
      - name: Aggregate exact-commit Guard matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guard-ci-public
          python3 scripts/guard_ci/matrix.py aggregate \
            --targets guard-ci/targets.json \
            --results-root guard-ci-results \
            --output-dir guard-ci-public \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"
          cp guard-ci/targets.json guard-ci-public/targets.json
          cat guard-ci-public/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Guard certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-guard-ci-matrix-${{ github.run_id }}
          path: |
            guard-ci-public/matrix.json
            guard-ci-public/matrix.md
            guard-ci-public/targets.json
          if-no-files-found: error
          retention-days: 30

