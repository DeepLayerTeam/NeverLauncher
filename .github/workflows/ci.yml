  guard-windows-adversarial:
    name: Guard для Windows — проверки на противодействие, Java ${{ matrix.java }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [8, 16, 17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc
      - name: Собрать Guard датчик и тестовые сценарии обходов
        shell: pwsh
        run: |
          cargo build --manifest-path runtime/guard-sensor/Cargo.toml
          cargo build --manifest-path runtime/guard-memory-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-thread-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-debug-probe/Cargo.toml
          cargo build --manifest-path runtime/guard-jvm-probe/Cargo.toml
          cargo build --manifest-path runtime/runtime/Cargo.toml --tests
      - name: Выполнить реальную симуляцию атак Windows и сертификацию совместимости
        shell: pwsh
        run: |
          $out = "guard-ci-result/windows-adversarial/java-${{ matrix.java }}/windows-adversarial-result.json"
          python scripts/guard_ci/windows_adversarial.py run `
            --java-major "${{ matrix.java }}" `
            --sensor (Resolve-Path "runtime/guard-sensor/target/debug/guard_sensor.dll").Path `
            --memory-probe (Resolve-Path "runtime/guard-memory-probe/target/debug/guard_memory_probe.dll").Path `
            --thread-probe (Resolve-Path "runtime/guard-thread-probe/target/debug/guard_thread_probe.dll").Path `
            --debug-probe (Resolve-Path "runtime/guard-debug-probe/target/debug/guard-debug-probe.exe").Path `
            --jvm-probe (Resolve-Path "runtime/guard-jvm-probe/target/debug/guard_jvm_probe.dll").Path `
            --repository "$env:GITHUB_REPOSITORY" `
            --commit "$env:GITHUB_SHA" `
            --run-id "$env:GITHUB_RUN_ID" `
            --output $out
      - name: Проверить промышленный критерий приёмки обходных тестов CI 0.18.11
        shell: pwsh
        run: |
          python scripts/smoke/offline/guard-windows-adversarial-ci.py
          python scripts/guard_ci/test_windows_adversarial.py
      - name: Загрузить свидетельства проверок обходов для каждой версии Java
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-windows-adversarial-java-${{ matrix.java }}-${{ github.sha }}
          path: guard-ci-result/windows-adversarial/java-${{ matrix.java }}/windows-adversarial-result.json
          if-no-files-found: error
          retention-days: 30

  guard-windows-adversarial-certificate:
    name: Guard для Windows — сертификация устойчивости к обходам
    if: always()
    needs: [guard-windows-adversarial]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Скачать свидетельства проверок обходов для каждой версии Java
        uses: actions/download-artifact@v4
        with:
          pattern: guard-windows-adversarial-java-*
          path: guard-ci-result/windows-adversarial/results
      - name: Собрать и сертифицировать матрицу проверок обходов Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/guard_ci/windows_adversarial.py aggregate \
            --results-root guard-ci-result/windows-adversarial/results \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output-dir guard-ci-result/windows-adversarial/certificate
          if [[ -s guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md ]]; then
            cat guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - name: Проверить промышленный критерий готовности Windows Protection RC 0.18.12
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke/offline/guard-windows-protection-rc.py
          (cd cli && go test ./cmd/launcher -run 'TestWindowsProtection' -count=1)
      - name: Проверить промышленный критерий готовности Windows Protection GA 0.19.0
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke/offline/guard-windows-protection-ga.py
          (cd cli && go test ./cmd/launcher -run 'TestWindowsProtectionGA' -count=1)
      - name: Загрузить сертификат проверок обходов Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-windows-adversarial-certificate-${{ github.sha }}
          path: |
            guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.json
            guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md
          if-no-files-found: error
          retention-days: 30

  release-ga-policy:
    name: Регрессии версионированного выпуска GA, отказ по умолчанию и исторических подписей
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить независимый компонент проверки подписей Ed25519
        run: python3 -m pip install cryptography==46.0.4
      - name: Проверить исторические и текущие требования к подписанию точных байтов (0.36.0 и новее)
        run: |
          python3 scripts/version/manage.py check
          python3 -m unittest discover -s scripts/ga -p 'test_verified_targets*.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_verify_six_native_game.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_verified_support.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_player_final.py' -v
          python3 -m unittest discover -s scripts/rc -p 'test_*.py' -v
          python3 scripts/release/test_certify_profiles_ga.py
          python3 scripts/release/test_certification_run.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/release/test_fetch_exact_certifications.py
          python3 -m unittest discover -s scripts/release -p 'test_rehearsal.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_final_update_delivery.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_publish.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: cli/go.sum
      - name: Проверить запрет подписи CLI для 0.36.1+ без нового утверждения оператора
        working-directory: cli
        run: go test ./cmd/launcher -run '^(TestGA0361|TestRehearsal0365)' -count=1 -timeout=2m

  storage-parity-0371:
    name: Инвентаризация хранилищ и реальная эквивалентность SQLite/PostgreSQL 0.37.1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: launcher_storage_parity
          POSTGRES_USER: launcher_parity
          POSTGRES_PASSWORD: parity-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launcher_parity -d launcher_storage_parity"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить полный список зависимостей, полученный из исходников
        run: |
          set -euo pipefail
          GO111MODULE=off go test ./scripts/storageparity -count=1
          GO111MODULE=off go run ./scripts/storageparity -root . -check
      - name: Проверить поддерживаемую файловую систему SQLite без перехода в память
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-parity-0371"
          chmod 0700 "$RUNNER_TEMP/storage-parity-0371"
          case "$(stat -f -c '%T' "$RUNNER_TEMP/storage-parity-0371")" in
            ext2/ext3|ext4|xfs|btrfs) ;;
            *) echo 'Для проверки согласованности хранилищ требуется ext4/xfs/btrfs; ПРОВЕРКА ЗАБЛОКИРОВАНА' >&2; exit 1 ;;
          esac
      - name: Выполнить одинаковые контракты на реальных базах обоих типов
        working-directory: services/api
        env:
          LAUNCHER_PARITY_POSTGRES_DSN: postgres://launcher_parity:parity-ephemeral-only@127.0.0.1:5432/launcher_storage_parity?sslmode=disable
          LAUNCHER_STORAGE_PARITY_REQUIRED: '1'
          LAUNCHER_SQLITE_TEST_ROOT: ${{ runner.temp }}/storage-parity-0371
        run: |
          set -euo pipefail
          go mod verify
          test -z "$(gofmt -l internal/storageparity internal/repository/postgres.go)"
          go test -race -count=1 -timeout=20m -v ./internal/storageparity
      - name: Проверить устойчивый HTTP-репозиторий SQLite и поведение после перезапуска
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/repository/sqlite_http.go internal/repository/sqlite_http_methods.go internal/repository/sqlite_http_state.go)"
          go test -race -count=1 -timeout=10m -run '^TestSQLiteHTTP' ./internal/repository
          go test -race -count=1 -timeout=10m -run '^TestSQLiteHTTPRepositoryBootstrap0372$' ./cmd/launcher-api
      - name: Проверить SQLite 0.37.3 — авторизацию, passkeys, сеансы и надёжность Bridge
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/httpapi/sqlite_runtime*.go internal/repository/sqlite_http_runtime*.go)"
          go test -race -count=1 -timeout=10m -run '^TestSQLiteHTTPDevicesJobsExtensionsRestart0373$' ./internal/repository
          go test -race -count=1 -timeout=12m -run '^TestSQLiteRuntime.*0373$' ./internal/httpapi
          go vet ./internal/httpapi ./internal/repository

      - name: Проверить стабильную публикацию SQLite 0.37.4 и локальный координатор с реальным WAL
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/repository/sqlite_http_stable*.go internal/httpapi/rate_limit.go)"
          go test -race -count=1 -timeout=15m -run '^TestSQLiteStablePublish.*0374$' ./internal/repository
          go test -race -count=1 -timeout=12m -run '^(TestRateLimitAtomicAndRestart|TestLeaseFencingAndRestart|TestProductionRCConcurrentRateLimitStress)$' ./internal/sqlitecoord
          go test -race -count=1 -timeout=5m -run '^TestSQLiteCoordinatorFailClosed0374$' ./internal/httpapi
          go vet ./internal/repository ./internal/sqlitecoord ./internal/httpapi

      - name: Проверить нативную установку SQLite, начальную настройку и защиту от повторного запуска процесса (0.37.5)
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/repository/sqlite_http_install*.go internal/deployment/minimal*.go)"
          go test -race -count=1 -timeout=8m -run '^TestMinimalInstallationSQLite0375$' ./internal/repository
          go test -race -count=1 -timeout=8m -run '^TestMinimalDeployment0375$' ./internal/deployment
          go test -race -count=1 -timeout=5m -run '^TestProductionMinimalSQLiteAccepted0375$' ./internal/config
          go vet ./internal/repository ./internal/deployment ./internal/httpapi ./internal/config
      - name: Проверить двусторонний перенос Core и полного минимального пакета между SQLite и PostgreSQL (0.37.7)
        working-directory: services/api
        env:
          TMPDIR: ${{ runner.temp }}/storage-parity-0371
          LAUNCHER_PG_TEST_DSN: postgres://launcher_parity:parity-ephemeral-only@127.0.0.1:5432/launcher_storage_parity?sslmode=disable
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/sqlitepg cmd/launcher-sqlite)"
          go test -race -count=1 -timeout=25m ./internal/sqlitepg ./cmd/launcher-sqlite
          go vet ./internal/sqlitepg ./cmd/launcher-sqlite
          go build -trimpath -o "$RUNNER_TEMP/launcher-sqlite-0377" ./cmd/launcher-sqlite
      - name: Проверить автономное и аутентифицированное резервное копирование и восстановление (0.45.2)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/install/requirements-portable.txt
          python3 -m py_compile scripts/install/minimal_backup.py scripts/install/minimal_portable.py scripts/install/minimal-install.py
          python3 -m unittest discover -s scripts/install -p 'test_minimal_backup.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_minimal_portable.py' -v

      - name: Проверить исполняемый нативный установщик (0.37.5)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/install -p 'test_minimal_install.py' -v
          python3 -m py_compile scripts/install/minimal-install.py

  minimal-live-e2e-0378:
    name: 'ОБЯЗАТЕЛЬНО: реальный процесс SQLite, сбой и восстановление (текущая версия)'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Провести тесты агента (не свидетельства реальных сквозных испытаний)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/install/requirements-portable.txt
          python3 -m unittest discover -s scripts/acceptance -p 'test_minimal_live_e2e.py' -v
          python3 -m unittest discover -s scripts/acceptance -p 'test_final_bundle_e2e.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_minimal_backup.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_minimal_portable.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_minimal_install.py' -v
      - name: Собрать настоящий Backend и проверить локальную файловую систему
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/nl-live-0378" "$RUNNER_TEMP/nl-0378-policies"
          case "$(stat -f -c '%T' "$RUNNER_TEMP/nl-live-0378")" in
            ext2/ext3|ext4|xfs|btrfs) ;;
            *) echo 'ЗАБЛОКИРОВАНО: файловая система для SQLite не поддерживается' >&2; exit 1 ;;
          esac
          cd services/api
          go mod verify
          go build -trimpath -ldflags "-X main.version=$(cat ../../VERSION) -X main.commit=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/nl-live-api-0378" ./cmd/launcher-api
      - name: Создать изолированные конфигурационные политики для тестов без свидетельств подписания
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'nl-0378-policies'
          fingerprint=hashlib.sha256(b'Launcher E2E NON-RELEASE fixture no signing').hexdigest()
          guard={'schemaVersion':'2.0','releases':{'0.1.0':{'protocolVersion':4,
            'platforms':{'linux':{'signingMode':'integrity-only','artifacts':[
              {'guardSha256':fingerprint,'launcherSha256':fingerprint}]}}}}}
          bridge={'0.1.0':{'velocitySha256':[fingerprint],
            'paperSha256':[fingerprint],'purpurSha256':[fingerprint]}}
          for name,document in [('guard.json',guard),('bridge.json',bridge)]:
              path=directory/name
              fd=os.open(path,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
              with os.fdopen(fd,'w') as stream: json.dump(document,stream)
          PYCODE
      - name: Проверить реальный API, установку, HTTP, SIGTERM, SIGKILL, резервное копирование, восстановление и отказ при повреждении данных
        shell: bash
        env:
          LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
        run: |
          set -euo pipefail
          python3 scripts/acceptance/minimal_live_e2e.py \
            --binary "$RUNNER_TEMP/nl-live-api-0378" \
            --guard-policy "$RUNNER_TEMP/nl-0378-policies/guard.json" \
            --bridge-policy "$RUNNER_TEMP/nl-0378-policies/bridge.json" \
            --work-root "$RUNNER_TEMP/nl-live-0378" \
            --expected-version "$(cat VERSION)" \
            --report "$RUNNER_TEMP/nl-live-evidence-0378.json"
          python3 - "$RUNNER_TEMP/nl-live-evidence-0378.json" "$GITHUB_SHA" <<'PYCODE'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report['status']=='passed',report['status']
          assert report['sourceCommit']==sys.argv[2]
          assert len(report['checks'])>=20
          assert all(row['status']=='passed' for row in report['checks'])
          PYCODE
      - name: Опубликовать машинные свидетельства; при отсутствии завершить с ошибкой
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: minimal-live-e2e-0378-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nl-live-evidence-0378.json
          if-no-files-found: error
          retention-days: 30

  sdk-http-contracts:
    name: HTTP SDK v1 — JSON, двоичные данные, потоки и исходники точного коммита
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Запустить реальные регрессионные проверки потоковой передачи и перенаправлений с детектором гонок Go
        working-directory: sdk/api/go
        env:
          GOFLAGS: -mod=readonly
        run: go test -race ./...
      - name: Установить закреплённую версию компилятора TypeScript без изменений lockfile
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить типы и реальные регрессионные тесты HTTP-клиента
        run: |
          ./apps/desktop/node_modules/.bin/tsc -p sdk/api/typescript/tsconfig.json
          node --test sdk/api/typescript/test/*.test.mjs
      - name: Проверить целостность исходников и lockfile
        if: always()
        run: |
          python3 scripts/release/inputs_guard.py verify
          git diff --exit-code -- apps/admin/package-lock.json apps/desktop/package-lock.json sdk/api/go/go.mod sdk/api/typescript

  reproducibility-tools-0470:
    name: Регрессии детерминированной упаковки и независимой проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить закреплённые входные данные и воспроизводимость с отказом при ошибке
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography>=43,<47'
          python3 scripts/release/inputs_guard.py verify
          python3 -m unittest discover -s scripts/release -p 'test_inputs_guard.py'
          python3 -m unittest discover -s scripts/release -p 'test_check_payload.py'
          python3 -m unittest discover -s scripts/release -p 'test_reproducible.py'
          python3 -m unittest discover -s scripts/release -p 'test_canonical_zip.py'
          python3 -m unittest discover -s scripts/release -p 'test_unsigned_package.py'
          python3 -m unittest discover -s scripts/release -p 'test_native_verify.py'
          python3 scripts/release/check_go_repro.py
          python3 scripts/version/manage.py check

  required-ci:
    name: ОБЯЗАТЕЛЬНЫЙ CI — успешность всех заданий для точного коммита
    if: ${{ always() }}
    needs: [reproducibility-tools-0470, sdk-http-contracts, minimal-live-e2e-0378, storage-parity-0371, go-contracts, web, rust-desktop, linux-production, guard-windows, guard-macos, macos-production, guard-certification, bridge, containers, managed-jre-production, production-e2e, guard-windows-adversarial, guard-windows-adversarial-certificate, release-ga-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить строгие итоги заданий и точный SHA с отказом при нарушении
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CI_NEEDS_JSON" > "$RUNNER_TEMP/required-ci-needs.json"
          python3 scripts/ci/required_jobs.py \
            --workflow .github/workflows/ci.yml --gate required-ci \
            --needs-json "$RUNNER_TEMP/required-ci-needs.json" \
            --source-sha "$GITHUB_SHA" --version-file VERSION --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output required-ci-evidence.json
      - name: Опубликовать результат обязательного CI
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: launcher-required-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 90
