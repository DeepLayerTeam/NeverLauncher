            e2e/runtime/folia-runtime.json
            e2e/runtime/spark-paper-build.json
            e2e/runtime/bytesocks-build.json
            e2e/runtime/bridge-diagnostics.json
            e2e/runtime/live-*-04113.json
            e2e/runtime/live-*-04113.log
