          cp e2e/runtime/managed-java-II/MANAGED_JAVA_II_EVIDENCE.json managed-jre-artifacts/MANAGED_JAVA_II_EVIDENCE.json
      - name: Build exact-vendor Managed JRE Distribution
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="managed-jre-artifacts"
          python3 scripts/release/managed-jre-distribution.py \
            --out "${OUT}" \
            --version "${VERSION}" \
