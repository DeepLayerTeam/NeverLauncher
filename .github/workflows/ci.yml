  neverguard-windows-adversarial:
    name: NeverGuard Windows атакующий Java ${{ matrix.java }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [8, 16, 17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc
      - name: Сборка NeverGuard Sensor и атакующий фикстура
        shell: pwsh
        run: |
          cargo build --manifest-path runtime/neverguard-sensor/Cargo.toml
          cargo build --manifest-path runtime/neverguard-memory-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-thread-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-debug-probe/Cargo.toml
          cargo build --manifest-path runtime/neverguard-jvm-probe/Cargo.toml
          cargo build --manifest-path runtime/neverruntime/Cargo.toml --tests
      - name: Execute актуальный Windows attack simulation и совместимость сертификация
        shell: pwsh
        run: |
          $out = "guard-ci-result/windows-adversarial/java-${{ matrix.java }}/windows-adversarial-result.json"
          python scripts/guard_ci/windows_adversarial.py run `
            --java-major "${{ matrix.java }}" `
            --sensor (Resolve-Path "runtime/neverguard-sensor/target/debug/neverguard_sensor.dll").Path `
            --memory-probe (Resolve-Path "runtime/neverguard-memory-probe/target/debug/neverguard_memory_probe.dll").Path `
            --thread-probe (Resolve-Path "runtime/neverguard-thread-probe/target/debug/neverguard_thread_probe.dll").Path `
            --debug-probe (Resolve-Path "runtime/neverguard-debug-probe/target/debug/neverguard-debug-probe.exe").Path `
            --jvm-probe (Resolve-Path "runtime/neverguard-jvm-probe/target/debug/neverguard_jvm_probe.dll").Path `
            --repository "$env:GITHUB_REPOSITORY" `
            --commit "$env:GITHUB_SHA" `
            --run-id "$env:GITHUB_RUN_ID" `
            --output $out
      - name: Проверять 0.18.11 атакующий CI рабочий контроль
        shell: pwsh
        run: |
          python scripts/smoke/offline/neverguard-windows-adversarial-ci-01811.py
          python scripts/guard_ci/test_windows_adversarial.py
      - name: Загрузка на-Java атакующий свидетельство
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neverguard-Windows-атакующий-Java-${{ matrix.java }}-${{ github.sha }}
          path: guard-ci-result/windows-adversarial/java-${{ matrix.java }}/windows-adversarial-result.json
          if-no-files-found: error
          retention-days: 30

  neverguard-windows-adversarial-certificate:
    name: NeverGuard Windows атакующий сертификация
    if: always()
    needs: [neverguard-windows-adversarial]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Загрузка на-Java атакующий свидетельство
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: neverguard-windows-adversarial-java-*
          path: guard-ci-result/windows-adversarial/results
      - name: Агрегат и certify Windows атакующий матрица
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/guard_ci/windows_adversarial.py aggregate \
            --results-root guard-ci-result/windows-adversarial/results \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output-dir guard-ci-result/windows-adversarial/certificate
          cat guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: cli/go.sum
      - name: Проверять 0.18.12 Windows Защита RC рабочий контроль
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke/offline/neverguard-windows-protection-rc-01812.py
          (cd cli && go test ./cmd/neverlauncher -run 'TestWindowsProtection' -count=1)
      - name: Проверять 0.19.0 Windows Защита GA рабочий контроль
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke/offline/neverguard-windows-protection-ga-0190.py
          (cd cli && go test ./cmd/neverlauncher -run 'TestWindowsProtectionGA' -count=1)
      - name: Загрузка Windows атакующий сертификат
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neverguard-Windows-атакующий-сертификат-${{ github.sha }}
          path: |
            guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.json
            guard-ci-result/windows-adversarial/certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.md
          if-no-files-found: error
          retention-days: 30
