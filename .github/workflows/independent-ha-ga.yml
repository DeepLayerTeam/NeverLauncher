name: Независимая приёмка HA 0.52.0 — проверки кода
on:
  push:
    paths:
      - 'scripts/operations/independent_ha_ga_0520.py'
      - 'scripts/operations/test_independent_ha_ga_0520.py'
      - 'scripts/operations/rolling_update_0520.py'
      - 'scripts/operations/test_rolling_update_0520.py'
      - 'docs/operations/independent-ha-ga.md'
      - '.github/workflows/independent-ha-ga-0520.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Запустить приёмки code и earlier HA регрессии (не GA-сертификация)
        run: |
          set -euo pipefail
          python3 -m pip install 'PyYAML==6.0.3'
          PYTHONPATH=scripts/operations python3 -m unittest -v \
            scripts/operations/test_independent_ha_ga_0520.py \
            scripts/operations/test_rolling_update_0520.py \
            scripts/operations/test_rolling_update_0517.py \
            scripts/operations/test_multi_host_chaos_05110.py \
            scripts/operations/test_cross_host_recovery_0519.py
          python3 -m py_compile scripts/operations/independent_ha_ga_0520.py scripts/operations/rolling_update_0520.py
          python3 scripts/version/manage.py check
      - name: Убедиться, что тестовые данные CI не могут выдать ложный статус GA PASS
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=scripts/operations python3 scripts/operations/independent_ha_ga_0520.py gate \
            --publisher primary --commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > "$RUNNER_TEMP/ha-gate.json" 2>/dev/null
          status=$?
          set -e
          test "$status" -eq 3
          ! grep -q '"status": "PASS"' "$RUNNER_TEMP/ha-gate.json"
