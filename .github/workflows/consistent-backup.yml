name: Согласованное резервное копирование и PITR 0.51.8
on:
  push:
    paths:
      - 'scripts/operations/consistent_backup.py'
      - 'scripts/operations/test_consistent_backup.py'
      - 'scripts/operations/dr.py'
      - 'scripts/operations/multi_host.py'
      - 'scripts/operations/nn1_compat.py'
      - 'docs/deployment/consistent-backup-pitr.md'
      - '.github/workflows/consistent-backup.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistent-backup-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить реальные байты архива, резервное копирование и обработку ошибок
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest -v \
            scripts/operations/test_consistent_backup.py \
            scripts/operations/test_dr.py \
            scripts/operations/test_standard_backup.py \
            scripts/operations/test_multi_host.py
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: cli/go.sum
      - name: Проверить атомарные операции Supervisor с миром, резервными копиями и выпусками с детектором гонок
        working-directory: cli
        run: |
          go test -race -count=1 ./cmd/launcher -run 'Test(WorldBackupCommandRetainsCohortGate0518|WorldCohortGate0518HeldAcrossWorldBackupProcess|WorldBackupGateBlocksStartAndSecondBackup04110|WorldBackupGateFailsClosedAndRecoversOffline04110)$'
      - name: Проверить схему, каталог и согласованность выпуска
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -c 'import nn1_compat_0516 as n; c,h=n.migration_catalog(); assert len(c)>=100; print(h)'
          python3 scripts/version/manage.py check
