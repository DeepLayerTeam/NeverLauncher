name: Deep Java Platform 0.49.0 — local-runtime conformance (not GA certification)
on:
  push:
    paths:
      - 'sdk/java/**'
      - 'scripts/java/**'
      - 'examples/extensions/java-ui/**'
      - 'examples/extensions/java-spi/**'
      - 'examples/extensions/java-content-spi/**'
      - 'examples/extensions/java-developer-04812/**'
      - '.github/workflows/deep-java-platform-0490.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'sdk/java/**'
      - 'scripts/java/**'
      - 'examples/extensions/java-ui/**'
      - 'examples/extensions/java-spi/**'
      - 'examples/extensions/java-content-spi/**'
      - 'examples/extensions/java-developer-04812/**'
      - '.github/workflows/deep-java-platform-0490.yml'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-java-extensions:
    name: published SDK / JDK ${{ matrix.java }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile SDK and exercise real Java callbacks
        shell: bash
        run: |
          sh sdk/java/core/build.sh test
          sh sdk/java/gravit-compat/build.sh test
          sh sdk/java/http-client/build.sh test
      - name: Publish public binary SDK artifacts
        shell: bash
        run: python3 scripts/ga/java_sdk_ga_0310.py --skip-build --output dist/java-sdk
      - name: Adversarial published-artifact checks
        shell: bash
        run: python3 scripts/java/test_developer_e2e_04812.py
      - name: Three independent published-SDK Java extensions and real JVM subprocesses
        shell: bash
        run: |
          python3 scripts/java/deep_java_e2e_0490.py \
            --sdk-repo dist/java-sdk/maven --report deep-java-0490-report.json
          python3 scripts/version/manage.py check
      - name: Publish evidence explicitly labeled simulated-Host
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deep-java-${{ matrix.java }}-local-runtime
          path: deep-java-0490-report.json
          if-no-files-found: warn
  # Production GA is NOT inferred from this workflow. A real signed deployment,
  # update/rollback, Go Broker/PG storage, native sandbox and six-platform
  # release attestation are mandatory independent requirements.
