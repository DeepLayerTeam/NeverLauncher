name: Проверка TPM Certify 0.31.2
on:
  push:
    paths:
      - 'services/api/**'
      - 'cli/internal/dbmigrate/**'
      - '.github/workflows/tpm-certify-verifier.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'cli/internal/dbmigrate/**'
      - '.github/workflows/tpm-certify-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: TPM сертифицировать отрицательные тестовые фикстуры и репозиторий/сеанс политика
        run: go test -race -count=1 ./internal/attestverify ./internal/model ./internal/trustbaseline ./internal/repository ./internal/httpapi
      - name: "Сборка серверной части"
        run: go build ./cmd/launcher-api
