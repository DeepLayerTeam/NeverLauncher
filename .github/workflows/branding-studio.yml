name: 0.35.5 — студия оформления и нативное доверие
on:
  push:
    paths:
      - 'apps/admin/**'
      - 'apps/desktop/**'
      - 'prestarter/**'
      - '.github/workflows/branding-studio-0355.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/desktop/**'
      - 'prestarter/**'
      - '.github/workflows/branding-studio-0355.yml'
permissions:
  contents: read
jobs:
  signed-branding-and-admin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: prestarter/go.mod
      - run: npm ci
        working-directory: apps/admin
      - name: Проверить браузерный компонент подписи, v1/v2 и межъязыковую проверку Go
        run: npm test
        working-directory: apps/admin
      - name: Admin промышленные пакет
        run: npm run build
        working-directory: apps/admin
      - name: Prestarter полные промышленные регрессионная проверка
        run: go test ./... -count=1
        working-directory: prestarter
  desktop-branding-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: нативные Linux предпосылки для Tauri 2
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: apps/desktop
      - name: Desktop промышленные ресурсы и React компиляция
        run: npm run build
        working-directory: apps/desktop
      - name: нативные Ed25519 первый запуск и branding validator модульные тесты
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml signed_first_run_0352 -- --nocapture
