name: Интеграция и совместимость с официальным Minecraft 0.26.12

# Этот процесс выполняет настоящие нативные сборки и автономные тесты внедрения
# ошибок на всех целевых ОС. Для РЕАЛЬНОГО входа через провайдеров и подключения к игре
# нужны принадлежащие оператору учётная запись и серверы; процесс НЕ ДОЛЖЕН помечать
# внешние проверки успешными только на основании прохождения этих заданий.
on:
  pull_request:
    paths:
      - 'services/api/internal/officialminecraft/**'
      - 'services/api/cmd/official-provider-poc/**'
      - 'apps/desktop/**'
      - 'runtime/runtime/**'
      - 'scripts/certification/official-game-join-02612.py'
      - 'scripts/certification/test_official_game_join_02612.py'
      - 'scripts/ga/official_minecraft_0270.py'
      - 'scripts/ga/test_official_minecraft_0270.py'
      - 'scripts/ga/verify_official_artifacts_0270.py'
      - 'scripts/ga/test_official_artifacts_0270.py'
      - '.github/workflows/official-compatibility-02612.yml'
      - 'VERSION'
  push:
    paths:
      - 'services/api/internal/officialminecraft/**'
      - 'services/api/cmd/official-provider-poc/**'
      - 'apps/desktop/**'
      - 'runtime/runtime/**'
      - 'scripts/certification/official-game-join-02612.py'
      - 'scripts/certification/test_official_game_join_02612.py'
      - 'scripts/ga/official_minecraft_0270.py'
      - 'scripts/ga/test_official_minecraft_0270.py'
      - 'scripts/ga/verify_official_artifacts_0270.py'
      - 'scripts/ga/test_official_artifacts_0270.py'
      - '.github/workflows/official-compatibility-02612.yml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-chain-and-sessionserver:
    name: Go provider chain, sessionserver, security / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить Ed25519 проверка проверка library
        run: python -m pip install 'cryptography>=43,<47'
      - name: Проверить цепочки провайдеров и sessionserver только с внедрением ошибок
        run: go test -count=1 ./internal/officialminecraft ./cmd/official-provider-poc
      - name: Go детектор гонок (поддерживаемые агент)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./internal/officialminecraft ./cmd/official-provider-poc
      - name: Vet фактические POC implementation
        run: go vet ./internal/officialminecraft ./cmd/official-provider-poc
      - name: Скомпилировать interactive реальные провайдер E2E исполняемый файл
        run: go build -o "$RUNNER_TEMP/official-provider-poc${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/official-provider-poc
        shell: bash
      - name: Проверить парсер свидетельств журналов оператора без подмены реальными свидетельствами
        run: python ../../scripts/certification/test_official_game_join_02612.py
      - name: официальные 0.27.0 подписанные GA проверка негативные тесты (тестовая фикстура data только)
        run: python ../../scripts/ga/test_official_minecraft_0270.py
      - name: точные нативные установщик привязка негативные тесты (тестовая фикстура data только)
        run: python ../../scripts/ga/test_official_artifacts_0270.py

  native-runtime-and-desktop:
    name: Native launcher, OS credential boundary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Нативные зависимости Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Проверить реальные нативные официальные идентичность пути
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_
      - name: Проверить Запустить mode изоляция и Runtime
        run: cargo test --manifest-path runtime/runtime/Cargo.toml launch_identity_0269
      - name: Rust компиляция (нативные платформа)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Установить закреплённые Desktop зависимости
        working-directory: apps/desktop
        run: npm ci
      - name: официальные / текстуры / Запустить / сеанс жизненный цикл регрессионные проверки
        working-directory: apps/desktop
        shell: bash
        run: |
          npm run test:auth-experience
          npm run test:official
          npm run test:textures
          npm run test:launch-modes
          npm run test:components
          node --experimental-strip-types --test tests/startup_screen_0427.test.mjs
      - name: промышленные интерфейс сборка
        working-directory: apps/desktop
        run: npm run build

  certification-preflight:
    name: All automated checks (LIVE E2E remains external blocker)
    if: always()
    needs: [provider-chain-and-sessionserver, native-runtime-and-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: ошибка если любые реальные компиляция или Проверить ОШИБКА
        env:
          GO_RESULT: ${{ needs.provider-chain-and-sessionserver.result }}
          NATIVE_RESULT: ${{ needs.native-runtime-and-desktop.result }}
        run: |
          test "$GO_RESULT" = success
          test "$NATIVE_RESULT" = success
      - name: явно сохранить реальные релиз blocker
        run: |
          echo 'Automated preflight only: live own-app Microsoft/Xbox/Minecraft proof,'
          echo 'real vanilla and modded game joins, OS vault behavior and provider'
          echo 'до выпуска 0.27.0 GA одобрение НЕОБХОДИМО проверить отдельно.'
