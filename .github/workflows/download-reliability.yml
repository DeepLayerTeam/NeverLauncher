name: Надёжность загрузок 0.35.4
on:
  pull_request:
    paths:
      - 'runtime/runtime/**'
      - 'apps/desktop/**'
      - '.github/workflows/download-reliability-0354.yml'
  push:
    paths:
      - 'runtime/runtime/**'
      - 'apps/desktop/**'
      - '.github/workflows/download-reliability-0354.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Проверить реальный HTTP, кеширование, паузу и возобновление, прогресс и ограниченный параллелизм
        run: |
          cargo test --manifest-path runtime/runtime/Cargo.toml download_scheduler -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml durable_downloads -- --nocapture
  desktop-download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Установить и Скомпилировать Desktop
        working-directory: apps/desktop
        run: npm ci --ignore-scripts && npm run build
      - name: Проверить удобство загрузок и рекомендации по безопасности
        working-directory: apps/desktop
        run: npm run test:downloads
