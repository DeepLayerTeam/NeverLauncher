name: Guard 0.50.10 — совместимость нативного ПО и JVM
on:
  push:
    paths:
      - 'runtime/runtime/src/guard_compatibility_0502.rs'
      - 'runtime/runtime/src/runtime_integrity_0505.rs'
      - 'runtime/runtime/src/linux_runtime_guard_0508.rs'
      - 'runtime/runtime/src/continuous_game_protection_0506.rs'
      - 'runtime/guard-sensor/src/hook_engine.rs'
      - 'sdk/java/trusted-agent/**'
      - 'cli/cmd/launcher/guard_compat*'
      - 'scripts/tests/guard_runtime_integrity_0505.py'
      - '.github/workflows/mod-software-compatibility-05010.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2022, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
          - { runner: macos-15-intel, target: macos-x64 }
          - { runner: macos-15, target: macos-arm64 }
    name: '${{ matrix.target }} — native Guard & mod compatibility'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Скомпилировать реальный Runtime и Guard
        run: cargo check --manifest-path runtime/runtime/Cargo.toml --all-targets
      - name: нативные игра процесс, политика, и внешние наложение регрессионная проверка
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --lib
      - name: "Собрать и протестировать датчик Guard и механизм перехвата для Windows"
        if: runner.os == 'Windows'
        run: cargo test --manifest-path runtime/guard-sensor/Cargo.toml --lib external_overlay_scope_05010_tests
      - name: фактические Java процесс/JNI/модуль/JAR положительные и отрицательные тесты
        run: python scripts/tests/guard_runtime_integrity_0505.py
      - name: подписанную политику, отзыв и Linux наложение тесты
        working-directory: cli
        run: go test ./cmd/launcher -run '^(TestExternalNativeCompatibility05010|TestSignedExternalModulePolicy05010|TestGuardCompatibility0502)' -count=1 -timeout 12m
      - name: Согласованность версий
        run: python scripts/version/manage.py check
