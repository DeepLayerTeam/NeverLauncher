name: Launcher 0.45.6 — регрессия отказов и аварийного восстановления
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/operations/**'
      - 'docs/releases/0.45.3-standard-backup-restore.md'
      - 'docs/releases/0.45.4-network-ha-recovery.md'
      - 'docs/releases/0.45.6-chaos-disaster-recovery.md'
      - 'deploy/production/docker-compose.chaos.yml'
      - 'services/api/internal/httpapi/operations_backup.go'
      - 'services/api/internal/httpapi/operations_backup_test.go'
      - '.github/workflows/chaos-dr.yml'
  pull_request:
    paths:
      - 'scripts/operations/**'
      - 'docs/releases/0.45.3-standard-backup-restore.md'
      - 'docs/releases/0.45.4-network-ha-recovery.md'
      - 'docs/releases/0.45.6-chaos-disaster-recovery.md'
      - 'deploy/production/docker-compose.chaos.yml'
      - 'services/api/internal/httpapi/operations_backup.go'
      - 'services/api/internal/httpapi/operations_backup_test.go'
      - '.github/workflows/chaos-dr.yml'
permissions:
  contents: read
jobs:
  dr-runner-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Выполнить негативные проверки безопасности и целостности архивов
        run: |
          python -m unittest discover -s scripts/operations -p 'test_dr.py' -v
          python -m unittest discover -s scripts/operations -p 'test_standard_backup.py' -v
          python -m unittest discover -s scripts/operations -p 'test_network_ha_recovery.py' -v
          python -m unittest discover -s scripts/operations -p 'test_chaos.py' -v
          python -m unittest discover -s scripts/operations -p 'test_restore_accept.py' -v
      - name: Проверить агент CLI и синтаксис исходников
        run: |
          python -m py_compile scripts/operations/dr.py scripts/operations/chaos.py scripts/operations/restore_accept.py
          python scripts/operations/chaos.py --help
          python scripts/operations/restore_accept.py --help
          python scripts/operations/dr.py --help
  world-backup-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Собрать CLI и проверить снимок мира и восстановление с SHA-256"
        run: |
          cd cli
          go build -o "$RUNNER_TEMP/nl" ./cmd/launcher
          go test -count=1 ./cmd/launcher -run '^TestWorldBackup'
          cd ..
          NL_WORLD_CLI="$RUNNER_TEMP/nl" python -m unittest discover -s scripts/operations -p 'test_network_ha_recovery.py' -v
  api-storage-restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить Go синтаксис и фактические резервная копия/Восстановить регрессионная проверка
        working-directory: services/api
        run: |
          test -z "$(gofmt -l internal/httpapi/operations_backup.go)"
          go test -count=1 -timeout=8m ./internal/httpapi -run 'TestCanonicalOperationsBackupFlow|TestBackupRestoreRestoresStorageObject'
          go build ./cmd/launcher-api
