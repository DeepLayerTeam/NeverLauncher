name: Миграция авторизации Gravit 0.33.5
on:
  push:
    paths:
      - 'services/api/internal/gravitcredentials/**'
      - 'services/api/internal/repository/migration_auth_0335*'
      - 'services/api/internal/httpapi/migration_auth_0335*'
      - 'services/api/internal/httpapi/federation_112.go'
      - 'services/api/internal/dbmigrate/sql/0093*'
      - 'cli/cmd/launcher/migration_auth_0335*'
      - 'apps/admin/src/admin/MigrationCenter0331.tsx'
      - 'schemas/openapi-migration-center.json'
      - '.github/workflows/gravit-auth-migration-0335.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher_test -d launcher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:test_only_not_production@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить интеграцию Backend, гонки данных и реальный модуль авторизации
        working-directory: services/api
        run: |
          go test -race -count=1 -timeout 5m ./internal/gravitcredentials ./internal/gravitidentity ./internal/gravitinventory ./internal/fileauth ./internal/localpassword
          go test -race -count=1 -timeout 5m ./internal/repository -run 'TestMigrationAuthAtomicIdempotent0335|TestMigrationIdentityTransactional0334|TestMigrationDurability0331|TestMigratedSQLUserIDDoesNotCollideAcrossSources0444'
          go test -count=1 -timeout 5m ./internal/httpapi -run 'TestImportedFileAuthLocalLoginAndAtomicRehash0295|TestMigrationTargetSteps0331'
      - name: CLI сборки и тесты
        working-directory: cli
        run: go test -count=1 ./cmd/launcher
  contract-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenAPI и product версия
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
      - name: Собрать Admin
        working-directory: apps/admin
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Проверить синтаксис встроенного Admin
        run: node --check services/api/internal/embeddedadmin/site/app.js
