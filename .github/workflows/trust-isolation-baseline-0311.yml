name: Trust and isolation baseline 0.31.1
on:
  push:
    paths:
      - 'services/api/**'
      - '.github/workflows/trust-isolation-baseline-0311.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/trust-isolation-baseline-0311.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    name: ${{ matrix.os }} trust policy, extension capabilities and diagnostics
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - name: Run security boundary tests (no skips)
        run: go test -count=1 ./internal/model ./internal/trustbaseline ./internal/repository ./internal/extensionhost ./internal/httpapi
      - name: Compile actual backend
        run: go build -o launcher-api-diag.exe ./cmd/launcher-api
      - name: Verify both diagnostics and fail-closed flags
        shell: bash
        run: |
          set -euo pipefail
          bin=./launcher-api-diag.exe
          "$bin" diagnose device-trust > device.json
          "$bin" diagnose extension-sandbox > extension.json
          python -c 'import json; d=json.load(open("device.json")); x=json.load(open("extension.json")); assert d["remoteProvenanceVerifier"]["state"] == "unsupported"; assert d["measuredBootVerifier"]["state"] == "unsupported"; assert x["enforced"] is False; assert x["isolationStatus"] == "unsupported"'
          if "$bin" diagnose device-trust --require-strict >/dev/null; then echo 'strict falsely passed' >&2; exit 1; fi
          if "$bin" diagnose extension-sandbox --require-isolation >/dev/null; then echo 'isolation falsely passed' >&2; exit 1; fi
