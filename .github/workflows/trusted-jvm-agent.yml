name: Доверенный JVM Agent Minecraft 0.30.6 — подписанный пакет и настоящие хуки JVM
on:
  push:
    paths:
      - 'cli/cmd/launcher/trusted_jvm*'
      - 'cli/cmd/launcher/client_factory.go'
      - 'cli/cmd/launcher/legacy_client_adapters.go'
      - 'sdk/java/trusted-agent/**'
      - 'examples/extensions/trusted-jvm/**'
      - '.github/workflows/trusted-jvm-agent.yml'
  pull_request:
    paths:
      - 'cli/cmd/launcher/trusted_jvm*'
      - 'cli/cmd/launcher/client_factory.go'
      - 'cli/cmd/launcher/legacy_client_adapters.go'
      - 'sdk/java/trusted-agent/**'
      - 'examples/extensions/trusted-jvm/**'
      - '.github/workflows/trusted-jvm-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"

jobs:
  trusted-jvm-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: "Скомпилировать агент premain для Java 8 и настоящий подключаемый модуль перехвата"
        shell: bash
        run: sh examples/extensions/trusted-jvm/build.sh
      - name: "Проверить цикл: подпись пакета, установка, запуск JVM, преобразование, выполнение main и обнаружение подмены"
        working-directory: cli
        shell: bash
        run: go test -count=1 -timeout 4m -run '^TestTrustedJVM0306' ./cmd/launcher
      - name: Выполнить регрессионные проверки прежних интеграций authlib и загрузчиков классов
        working-directory: cli
        shell: bash
        run: go test -count=1 -timeout 4m -run '^TestAuthlibClassloader0279' ./cmd/launcher
      - name: "Промышленная сборка CLI"
        working-directory: cli
        shell: bash
        run: go build ./cmd/launcher
      - name: "Проверка метаданных канонической версии"
        shell: bash
        run: python3 scripts/version/manage.py check
