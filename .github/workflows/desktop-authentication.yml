name: Сценарии аутентификации Desktop 1.0.3
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'VERSION'
      - '.github/workflows/desktop-authentication.yml'
  push:
    paths:
      - 'apps/desktop/**'
      - 'VERSION'
      - '.github/workflows/desktop-authentication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:auth-experience
      - run: npm run test:official
      - run: npm run test:textures
      - run: npm run test:launch-modes
      - run: npm run test:components
      - run: npm run build

  desktop-native-session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Установить зависимости Tauri для Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libtss2-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml desktop_auth --no-default-features
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml skif4er_login --no-default-features
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_browser_0263 --no-default-features
