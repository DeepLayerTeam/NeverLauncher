name: HA зависимостей 0.51.3 — регрессии Runtime и синтаксиса
on:
  push:
    paths:
      - 'scripts/operations/dependency_ha.py'
      - 'scripts/operations/test_dependency_ha.py'
      - 'deploy/production/dependency-ha.example.env'
      - '.github/workflows/dependency-ha.yml'
  pull_request:
    paths:
      - 'scripts/operations/dependency_ha.py'
      - 'scripts/operations/test_dependency_ha.py'
      - 'deploy/production/dependency-ha.example.env'
      - '.github/workflows/dependency-ha.yml'
jobs:
  validate-proxy-and-vrrp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Запустить реальные модульные тесты и создать настройки в рабочем формате
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/operations -p 'test_dependency_ha.py' -v
          sudo apt-get update -qq
          sudo apt-get install -y -qq haproxy keepalived
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' 'ci-health-only-password-no-access' > "$d/redis-health"
          chmod 600 "$d/redis-health"
          python - "$d" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path
          d = Path(sys.argv[1])
          # Production intentionally uses eth1. A hosted runner has a different
          # interface, and keepalived --config-test verifies that it exists.
          routes = subprocess.check_output(['ip', '-o', '-4', 'route', 'show', 'default'], text=True)
          found = re.search(r'\bdev ([a-zA-Z][a-zA-Z0-9_.:-]{0,20})\b', routes)
          if not found:
              raise SystemExit('No usable default IPv4 interface for keepalived config test')
          iface = found.group(1)
          text = Path('deploy/production/dependency-ha.example.env').read_text()
          assert 'HA_INTERFACE=eth1\n' in text
          text = text.replace('HA_INTERFACE=eth1\n', f'HA_INTERFACE={iface}\n', 1)
          text = text.replace('/etc/launcher/secrets/redis-ha-health-password', str(d / 'redis-health'))
          (d / 'ha.env').write_text(text)
          (d / 'ha.env').chmod(0o600)
          PY
          mkdir "$d/out"
          python scripts/operations/dependency_ha.py render --env-file "$d/ha.env" --output-dir "$d/out"
          sudo haproxy -c -f "$d/out/haproxy.launcher-0513.cfg"
          # Проверка конфигурации не меняет сеть системы и не запускает VRRP.
          sudo keepalived --config-test --use-file="$d/out/keepalived.launcher-0513.conf"
