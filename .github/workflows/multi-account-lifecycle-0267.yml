name: Official Minecraft Multi-Account Lifecycle 0.26.7
on:
  push:
    paths:
      - 'apps/desktop/src-tauri/src/official_identity_0262.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/desktop/src/official_minecraft_0257.ts'
      - 'apps/desktop/src/OfficialMinecraftPanel0257.tsx'
      - 'apps/desktop/tests/official_minecraft_0257.test.mjs'
      - '.github/workflows/multi-account-lifecycle-0267.yml'
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/tests/**'
      - '.github/workflows/multi-account-lifecycle-0267.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-account:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v7
      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Native account directory, migration, security tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_identity_0262::tests
      - name: Native provider refresh and identity tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_exchange_0265::tests
      - name: Compile Rust/Tauri
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Install Desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Account selection and logout renderer tests
        working-directory: apps/desktop
        run: npm run test:official
      - name: Textures integration regressions
        working-directory: apps/desktop
        run: npm run test:textures
      - name: Bundle Desktop
        working-directory: apps/desktop
        run: npm run build
