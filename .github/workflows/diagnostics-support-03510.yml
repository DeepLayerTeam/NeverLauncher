name: Player and Operator Diagnostics 0.35.10
on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'apps/admin/**'
      - 'services/api/internal/httpapi/**'
      - '.github/workflows/diagnostics-support-03510.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/admin/**'
      - 'services/api/internal/httpapi/**'
      - '.github/workflows/diagnostics-support-03510.yml'
jobs:
  player-renderer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:diagnostics-support
      - run: npm run test:sentry
      - run: npm run build
  operator-admin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test ./internal/httpapi -run 'Test(SupportReport|OperatorDiagnostics)' -count=1
      - run: go test ./internal/httpapi -run 'TestCanonicalOperationsBackupFlow' -count=1
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri requirements
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev build-essential
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml diagnostics_bundle_03510 --no-default-features
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
