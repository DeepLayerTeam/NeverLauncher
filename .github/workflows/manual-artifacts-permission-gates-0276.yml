name: Manual Artifacts and Permission Gates 0.27.6
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - '.github/workflows/manual-artifacts-permission-gates-0276.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - '.github/workflows/manual-artifacts-permission-gates-0276.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  manual-artifacts-and-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cli/cmd/launcher/manual_artifact_gates_0276*.go cli/cmd/launcher/modpack_import_0275.go cli/cmd/launcher/client_factory_0271.go)"
      - name: Functional and regression tests
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestManualGates0276|TestModpack0275|TestClientFactory0271|TestMirrorHelper0274|TestModernLoader0272|TestProcessorWorker0273'
          -count=1 -timeout=5m
      - name: Static analysis
        working-directory: cli
        run: go vet ./cmd/launcher
      - name: Build Go CLI
        working-directory: cli
        run: go build -o launcher-test ./cmd/launcher
      - name: Race tests
        if: runner.os == 'Linux'
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestManualGates0276|TestModpack0275|TestClientFactory0271' -count=1 -timeout=5m
