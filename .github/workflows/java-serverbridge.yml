name: Java ServerBridge 0.48.8 — аутентифицированная интеграция хоста
on:
  push:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionsecurity/**'
      - 'docs/extensions/java-serverbridge.md'
      - '.github/workflows/java-serverbridge-0488.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    name: SDK / Host Java ${{ matrix.java }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Проверить реальные аутентифицированные Java SDK
        run: sh sdk/java/core/build.sh test
  go-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAUNCHER_SERVERBRIDGE_HA_DSN: ${{ secrets.LAUNCHER_SERVERBRIDGE_HA_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: ServerBridge хост / разрешение / отзыв / проверки гонок
        working-directory: services/api
        run: go test -race -count=1 ./internal/extensionhost ./internal/extensionsecurity -run 'TestJavaBridge|TestJavaBridgeControlValidation0488|TestJavaBridgeRuntimeFencing0488'
      - name: Проверить интеграцию управления ServerBridge с PostgreSQL и защитой от конфликтов
        if: ${{ env.LAUNCHER_SERVERBRIDGE_HA_DSN != '' }}
        working-directory: services/api
        run: go test -count=1 ./internal/repository -run 'TestServerBridgeControl0195Postgres'
