name: NeverLauncher 0.43.10 — нативная приёмка Windows AppContainer и Job Objects

on:
  push:
    paths:
      - 'services/api/internal/windowssandbox/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionbroker/**'
      - 'sdk/backend/go/**'
      - 'sdk/cli/go/**'
      - '.github/workflows/windows-extension-sandbox-03111.yml'
  pull_request:
    paths:
      - 'services/api/internal/windowssandbox/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionbroker/**'
      - '.github/workflows/windows-extension-sandbox-03111.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-isolation:
    # ARM64 намеренно использует настоящий нативный хост, а не кросс-сборку x64
    # или эмулятор. Недоступность агента блокирует задание без запасного пути.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: [self-hosted, windows, ARM64, launcher-appcontainer]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Потребовать нативную архитектуру Windows без эмуляции
        run: |
          $goArch = (go env GOARCH).Trim()
          if ($goArch -ne '${{ matrix.arch }}') { throw "Ожидалась нативная архитектура Go ${{ matrix.arch }}, получена $goArch" }
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 'Arm64' } else { 'X64' }
          if ($osArchitecture -ne $expected) { throw "Ожидалась архитектура хоста $expected, получена $osArchitecture" }
      - name: Собрать SDK расширений для Windows
        run: |
          Push-Location sdk/backend/go
          try { go test -count=1 ./...; if ($LASTEXITCODE -ne 0) { throw 'Тесты Backend SDK завершились ошибкой' } } finally { Pop-Location }
          Push-Location sdk/cli/go
          try { go test -count=1 ./...; if ($LASTEXITCODE -ne 0) { throw 'Тесты CLI SDK завершились ошибкой' } } finally { Pop-Location }
      - name: "Проверить настоящую изоляцию AppContainer, заданий и файловой системы Windows"
        working-directory: services/api
        env:
          NL_RUN_LIVE_WIN_SANDBOX: '1'
        run: |
          go test -tags launcher_nopgx -count=1 -timeout 10m -v ./internal/windowssandbox
          if ($LASTEXITCODE -ne 0) { throw 'Тесты нативной границы изоляции Windows завершились ошибкой' }
          go test -tags launcher_nopgx -count=1 ./internal/extensionpolicy ./internal/extensionhost
          if ($LASTEXITCODE -ne 0) { throw 'Проверки политики расширений и хоста Windows завершились ошибкой' }
      - name: Собрать настоящий Backend для Windows
        working-directory: services/api
        run: |
          go build -o "$env:RUNNER_TEMP/launcher-api-${{ matrix.arch }}.exe" ./cmd/launcher-api
          if ($LASTEXITCODE -ne 0) { throw 'Сборка Backend для Windows завершилась ошибкой' }
      - name: Нативные тесты не являются сертификацией релиза
        run: |
          Write-Output 'Это задание проверяет изоляцию Windows, а не итоговые подписанные установщики или релизный контроль для шести платформ.'
