name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-go:
    name: CodeQL Go security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          # Go requires an instrumented build. This repository has two modules,
          # neither of which lives at the repository root.
          build-mode: manual
          queries: security-and-quality
      - name: Build both Go modules for CodeQL extraction
        shell: bash
        run: |
          set -euo pipefail
          (cd cli && go build ./...)
          (cd services/api && go build ./...)
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
