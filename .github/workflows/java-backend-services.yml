name: Службы Java Backend 0.48.4 — типизированный брокер и E2E разрешений
on:
  push:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionsecurity/**'
      - '.github/workflows/java-backend-services.yml'
  pull_request:
    paths:
      - 'sdk/java/core/**'
      - 'services/api/internal/extensionhost/**'
      - 'services/api/internal/extensionsecurity/**'
      - '.github/workflows/java-backend-services.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-services:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: "Скомпилировать и проверить настоящие службы Java Backend с аутентификацией"
        run: sh sdk/java/core/build.sh test
  host-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Проверить брокер настоящего хоста, границы репозитория, отзыв прав и скрытие данных в заданиях
        working-directory: services/api
        run: go test -race -count=1 ./internal/extensionhost -run 'TestJavaBackendServicesBroker0484'
      - name: Выполнить регрессионные проверки существующего брокера и безопасности
        working-directory: services/api
        run: go test -race -count=1 ./internal/extensionhost ./internal/extensionsecurity
      - name: Проверить каноническую версию продукта
        run: python3 scripts/version/manage.py check
