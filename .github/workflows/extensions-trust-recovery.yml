name: Восстановление доверия к расширениям 0.20.12

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
            os: linux
          - target: windows
            runner: windows-latest
            os: windows
          - target: macos
            runner: macos-latest
            os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Проверить сертификации целевой платформы definition
        shell: bash
        run: python3 scripts/compatibility/extensions_trust_02012.py validate
      - name: Сквозные тесты доверия, вредоносных пакетов и циклических аварийных остановок
        shell: bash
        run: |
          (cd services/api && go test ./internal/extensiontrust ./internal/extensionpackage ./internal/extensionlifecycle ./internal/extensionhost ./internal/repository ./internal/dbmigrate ./cmd/launcher-api)
          (cd cli && go test ./internal/dbmigrate && go test ./cmd/launcher -run '^$')
      - name: Собрать промышленной бинарных файлов
        shell: bash
        run: |
          (cd services/api && go build ./cmd/launcher-api)
          (cd cli && go build ./cmd/launcher)
          python3 scripts/contracts/validate-openapi.py
      - name: записи signed-by-run подтверждений input
        shell: bash
        run: |
          mkdir -p evidence
          GOOS_ACTUAL="$(go env GOOS)" GOARCH_ACTUAL="$(go env GOARCH)" GOVERSION="$(go version | awk '{print $3}')" python3 - <<'PY'
          import json,os
          checks={k:True for k in ["malicious-package-tests","trust-policy-tests","crash-loop-kill-switch-tests","safe-mode-build","cli-build","backend-build","openapi-contract"]}
          doc={"schemaVersion":"1.0","targetId":"${{ matrix.target }}","os":{"darwin":"macos"}.get(os.environ['GOOS_ACTUAL'], os.environ['GOOS_ACTUAL']),"arch":os.environ['GOARCH_ACTUAL'],"goVersion":os.environ['GOVERSION'],"status":"pass","checks":checks,"commit":"${{ github.sha }}","runId":"${{ github.run_id }}"}
          open("evidence/${{ matrix.target }}.json","w",encoding="utf-8").write(json.dumps(doc,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-trust-evidence-${{ matrix.target }}
          path: evidence/${{ matrix.target }}.json

  public-matrix:
    needs: cross-platform-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: extensions-trust-evidence-*
          path: evidence-raw
          merge-multiple: true
      - name: Объединить блокировка при ошибке публичной матрицы
        run: |
          python3 scripts/compatibility/extensions_trust_02012.py aggregate --evidence-dir evidence-raw --out-json EXTENSIONS_TRUST_COMPATIBILITY.json --out-md EXTENSIONS_TRUST_COMPATIBILITY.md
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-0.20.12-public-compatibility-matrix
          path: |
            EXTENSIONS_TRUST_COMPATIBILITY.json
            EXTENSIONS_TRUST_COMPATIBILITY.md
