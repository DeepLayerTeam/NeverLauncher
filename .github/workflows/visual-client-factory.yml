name: Визуальный конструктор фабрики клиентов 0.27.10
on:
  push:
    paths:
      - 'apps/admin/**'
      - 'services/api/**'
      - 'cli/**'
      - 'deploy/production/docker-compose.yml'
      - '.github/workflows/visual-client-factory.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'services/api/**'
      - 'cli/**'
      - 'deploy/production/docker-compose.yml'
      - '.github/workflows/visual-client-factory.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить форматирование Go
        run: test -z "$(gofmt -l services/api/internal/httpapi/client_factory_builder*.go)"
      - name: Проверить API на реальных пакетах
        working-directory: services/api
        run: go test ./internal/httpapi -run 'TestFactoryBuilder.*02710|TestBuildWorkspaceDirectoryStageAndMaterialize0226' -count=1 -timeout=8m
      - name: Запустить детектор гонок
        working-directory: services/api
        run: go test -race ./internal/httpapi -run 'TestFactoryBuilder.*02710' -count=1 -timeout=8m
      - name: Статический анализ
        working-directory: services/api
        run: go vet ./internal/httpapi
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Запустить регрессионные проверки фабрики клиента и адаптеров
        working-directory: cli
        run: go test ./cmd/launcher -run 'TestClientFactory0271|TestModernLoaderAdapters0272|TestForge.*|TestModpack.*' -count=1 -timeout=8m
      - name: "Собрать работающий API для использования клиентом"
        working-directory: cli
        run: go build ./cmd/launcher
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Установить закреплённые зависимости
        working-directory: apps/admin
        run: npm ci
      - name: Проверить типы и собрать проект
        working-directory: apps/admin
        run: npm run build
      - name: Запустить тесты панели Admin
        working-directory: apps/admin
        run: npm test
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать в образе исполняемые API и CLI фабрики клиентов
        run: docker build -f services/api/Dockerfile -t launcher-factory-ci .
