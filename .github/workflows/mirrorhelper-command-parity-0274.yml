name: MirrorHelper Command Parity 0.27.4
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/mirrorhelper-command-parity-0274.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/mirrorhelper-command-parity-0274.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  verified-commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cli/cmd/launcher/mirror_helper_parity_0274*.go cli/cmd/launcher/client_factory_0271.go cli/cmd/launcher/forge_runtime.go cli/cmd/launcher/main.go)"
      - name: MirrorHelper-equivalent real command fixtures
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestMirrorHelper0274|TestClientFactory0271|TestModernLoader0272|TestProcessorWorker0273|TestForgeProcessorRecovery0273'
          -count=1 -timeout=5m
      - name: Go vet
        working-directory: cli
        run: go vet ./cmd/launcher
      - name: Build CLI
        working-directory: cli
        run: go build ./cmd/launcher
      - name: Race detector on Linux
        if: runner.os == 'Linux'
        working-directory: cli
        run: >-
          go test -race ./cmd/launcher
          -run 'TestMirrorHelper0274|TestClientFactory0271'
          -count=1 -timeout=5m
