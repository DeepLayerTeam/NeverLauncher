name: API-SDK Freeze Candidate 0.45.12
on:
  push:
    paths:
      - 'schemas/openapi.yaml'
      - 'scripts/contracts/**'
      - 'scripts/sdk/generate-http-operations.py'
      - 'sdk/api/**'
      - 'sdk/java/http-client/**'
      - 'services/api/internal/httpapi/api_contract_04512*'
      - '.github/workflows/api-sdk-freeze-04512.yml'
  pull_request:
    paths:
      - 'schemas/openapi.yaml'
      - 'scripts/contracts/**'
      - 'scripts/sdk/generate-http-operations.py'
      - 'sdk/api/**'
      - 'sdk/java/http-client/**'
      - 'services/api/internal/httpapi/api_contract_04512*'
      - '.github/workflows/api-sdk-freeze-04512.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/contracts/validate-openapi.py
      - run: python3 scripts/contracts/compatibility_04512.py
      - run: python3 -m unittest discover -s scripts/contracts -p 'test_compatibility_04512.py'
      - run: python3 scripts/sdk/generate-http-operations.py --check
  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: cd sdk/api/go && go test -race ./...
  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd sdk/api/typescript && npm install --no-audit --no-fund && npm test
  java-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: sh sdk/java/http-client/build.sh test
