name: Промышленная поставка Windows

on:
  workflow_call:
    secrets:
      WINDOWS_CODESIGN_PFX_BASE64:
        required: true
      WINDOWS_CODESIGN_PFX_PASSWORD:
        required: true
      COMPONENT_SET_ED25519_SEED:
        required: true
      COMPONENT_SET_ED25519_PUBLIC_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-windows:
    name: Authenticode Windows x64 + ARM64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Подготовить code-signing сертификат
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { throw "Необходим секрет WINDOWS_CODESIGN_PFX_BASE64" }
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\launcher-codesign.pfx", $bytes)
      - name: Установка зависимости для подписи набора компонентов
        shell: pwsh
        run: python -m pip install 'cryptography>=43,<47'
      - name: Собрать пакет и подписать обе архитектуры через Authenticode
        shell: pwsh
        env:
          LAUNCHER_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          LAUNCHER_COMPONENT_SET_ED25519_SEED: ${{ secrets.COMPONENT_SET_ED25519_SEED }}
          LAUNCHER_COMPONENT_SET_ED25519_PUBLIC_KEY: ${{ secrets.COMPONENT_SET_ED25519_PUBLIC_KEY }}
          LAUNCHER_WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          ./scripts/release/build-windows-desktop.ps1 `
            -RequireCodeSigning `
            -CodeSigningCertificatePath "$env:RUNNER_TEMP\launcher-codesign.pfx"
      - name: Сгенерировать доставка манифест и Проверить промышленные подписание свидетельства
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Dir = "dist/release-$Version"
          Push-Location cli
          try {
            go build -trimpath -ldflags "-s -w -X main.version=$Version" -o "$env:RUNNER_TEMP\nl.exe" .\cmd\launcher
          } finally {
            Pop-Location
          }
          & "$env:RUNNER_TEMP\nl.exe" delivery manifest --bundle $Dir --version $Version
          & "$env:RUNNER_TEMP\nl.exe" delivery verify-windows --bundle $Dir --version $Version --production
      - name: Проверить настоящую системную подпись Authenticode для упакованных файлов Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = (Get-Content VERSION -Raw).Trim()
          $Dir = "dist/release-$Version"
          foreach ($Arch in @('x64','arm64')) {
            $Zip = Join-Path $Dir "launcher-desktop-$Version-windows-$Arch.zip"
            if (-not (Test-Path -PathType Leaf $Zip)) { throw "missing final $Arch package" }
            $Extract = Join-Path $env:RUNNER_TEMP "nl-verified-$Arch"
            if (Test-Path $Extract) { Remove-Item $Extract -Recurse -Force }
            Expand-Archive -LiteralPath $Zip -DestinationPath $Extract -Force
            $Executable = @(Get-ChildItem -LiteralPath $Extract -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') })
            if (@($Executable | Where-Object Name -eq 'launcher-desktop.exe').Count -ne 1) { throw "missing final signed Desktop PE inside $Zip" }
            if ($Executable.Count -lt 4) { throw "missing signed installer components inside $Zip" }
            foreach ($Exe in $Executable) {
              $Signature = Get-AuthenticodeSignature -LiteralPath $Exe.FullName
              if ($Signature.Status -ne 'Valid' -or -not $Signature.SignerCertificate) {
                throw "invalid Authenticode chain for $($Exe.FullName): $($Signature.Status)"
              }
              Write-Host "Проверен исполняемый файл окончательного подписанного пакета: $($Exe.Name) $Arch"
            }
          }
      - name: Удалить подписание учётные данные файл
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\launcher-codesign.pfx" -Force -ErrorAction SilentlyContinue
      - name: Загрузить подписанные Windows доставка артефакты
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-production-${{ github.sha }}
          path: |
            dist/release-*/launcher-cli-windows-x64.exe
            dist/release-*/launcher-cli-windows-arm64.exe
            dist/release-*/launcher-desktop-windows-x64.exe
            dist/release-*/launcher-desktop-windows-arm64.exe
            dist/release-*/guard-windows-x64.exe
            dist/release-*/guard-windows-arm64.exe
            dist/release-*/guard-sensor-windows-x64.dll
            dist/release-*/guard-sensor-windows-arm64.dll
            dist/release-*/runtime-windows-x64.exe
            dist/release-*/runtime-windows-arm64.exe
            dist/release-*/launcher-desktop-*-windows-x64.zip
            dist/release-*/launcher-desktop-*-windows-arm64.zip
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_X64.json
            dist/release-*/WINDOWS_PACKAGE_MANIFEST_ARM64.json
            dist/release-*/GUARD_RELEASE_ALLOWLIST_WINDOWS_DELIVERY.json
            dist/release-*/WINDOWS_SIGNING_EVIDENCE.json
            dist/release-*/DELIVERY_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
