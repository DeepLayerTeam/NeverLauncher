name: Ёмкость и диагностика 0.32.15
on:
  push:
    paths:
      - 'services/api/internal/capacity/**'
      - 'services/api/cmd/launcher-capacity-bench/**'
      - 'services/api/cmd/launcher-api/main.go'
      - 'services/api/internal/httpapi/**'
      - 'VERSION'
      - '.github/workflows/capacity-03215.yml'
  pull_request:
    paths:
      - 'services/api/internal/capacity/**'
      - 'services/api/cmd/launcher-capacity-bench/**'
      - 'services/api/cmd/launcher-api/main.go'
      - 'services/api/internal/httpapi/**'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - name: версии метаданных
        run: python3 scripts/version/manage.py check
      - name: производительности metrics и bounded бенчмарка тесты на состояние гонки
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/capacity ./cmd/launcher-capacity-bench
          go vet ./internal/capacity ./cmd/launcher-capacity-bench
      - name: полные API компиляцию и HTTP интеграции (реального зафиксированных зависимостей)
        working-directory: services/api
        run: |
          go test -run '^TestCanonicalStatusReadyAndMetrics$' -count=1 ./internal/httpapi
          go test -run '^$' ./cmd/launcher-api
          go build -o /tmp/launcher-capacity-bench ./cmd/launcher-capacity-bench
          go build -o /tmp/launcher-api ./cmd/launcher-api
      - name: Только для чтения бенчмарка rejects unconfirmed выполнения
        run: |
          if /tmp/launcher-capacity-bench --url http://127.0.0.1:8080/api/v1/status; then
            echo 'FAIL: benchmark ran without --confirm' >&2
            exit 1
          fi
