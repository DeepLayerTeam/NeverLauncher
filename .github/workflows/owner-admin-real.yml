name: Launcher 0.52.3 — реальная приёмка владельца и администратора
on:
  push:
    paths:
      - 'VERSION'
      - 'scripts/acceptance/**'
      - 'scripts/install/production-deploy.py'
      - 'deploy/production/docker-compose*.yml'
      - '.github/workflows/owner-admin-real-0523.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'scripts/acceptance/**'
      - 'scripts/install/production-deploy.py'
      - 'deploy/production/docker-compose*.yml'
      - '.github/workflows/owner-admin-real-0523.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-and-minimal-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить текущей версии и оба реальные E2E агент контракты
        run: |
          set -euo pipefail
          python3 scripts/version/manage.py check
          python3 -m py_compile scripts/acceptance/minimal_live_e2e_0378.py scripts/acceptance/owner_admin_real_0523.py scripts/install/production-deploy.py
          python3 -m unittest discover -s scripts/acceptance -p 'test_owner_admin_real_0523.py' -v
          python3 -m unittest discover -s scripts/acceptance -p 'test_minimal_live_e2e_0378.py' -v
          python3 -m unittest discover -s scripts/acceptance -p 'test_final_bundle_e2e_0380.py' -v
          python3 -m unittest discover -s scripts/install -p 'test_production_deploy.py' -v
      - name: Убедиться, что отсутствие реального промышленного хоста никогда не даёт результат успех
        run: |
          set -euo pipefail
          if python3 scripts/acceptance/owner_admin_real_0523.py \
            --env "$RUNNER_TEMP/missing.env" --email owner@example.invalid \
            --password-file "$RUNNER_TEMP/missing.password" \
            --server-id missing-host --bridge-registration-file "$RUNNER_TEMP/missing-reg.json" \
            --world-marker "$RUNNER_TEMP/missing-world.dat" \
            --report "$RUNNER_TEMP/owner-0523-blocked.json" \
            --isolated-destructive-acceptance; then
              echo 'ОШИБКА: отсутствие физического узла Minecraft признано успешной проверкой' >&2
              exit 1
          fi
          python3 - "$RUNNER_TEMP/owner-0523-blocked.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['status']=='blocked' and not data['gaCertified']
          PY
  isolated-standard-physical:
    # Разрушающий сценарий: включайте только на изолированном защищённом собственном
    # хосте с выделенной настоящей JVM Minecraft и доверенным публичным TLS.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, launcher-0523-dedicated]
    environment: owner-admin-physical-acceptance
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Проверить установленный стандартный API, PostgreSQL и приёмку настоящего Minecraft-хоста"
        env:
          NL_0523_ENV: ${{ vars.NL_0523_ENV }}
          NL_0523_PASSWORD_FILE: ${{ vars.NL_0523_PASSWORD_FILE }}
          NL_0523_REGISTRATION_FILE: ${{ vars.NL_0523_REGISTRATION_FILE }}
          NL_0523_WORLD_MARKER: ${{ vars.NL_0523_WORLD_MARKER }}
          NL_0523_SERVER_ID: ${{ vars.NL_0523_SERVER_ID }}
          NL_0523_OWNER_EMAIL: ${{ vars.NL_0523_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          : "${NL_0523_ENV:?требуется отдельный неизменяемый файл .env для стандартного режима}"
          : "${NL_0523_PASSWORD_FILE:?Требуется отдельный файл пароля владельца}"
          : "${NL_0523_REGISTRATION_FILE:?требуется настоящий публичный идентификатор узла Bridge}"
          : "${NL_0523_WORLD_MARKER:?требуется маркер сохранённых данных игрока на реальном игровом сервере}"
          : "${NL_0523_SERVER_ID:?требуется отдельный сервер Minecraft}"
          : "${NL_0523_OWNER_EMAIL:?требуется отдельный адрес электронной почты владельца}"
          umask 077
          python3 scripts/acceptance/owner_admin_real_0523.py \
            --env "$NL_0523_ENV" --email "$NL_0523_OWNER_EMAIL" \
            --password-file "$NL_0523_PASSWORD_FILE" \
            --server-id "$NL_0523_SERVER_ID" \
            --bridge-registration-file "$NL_0523_REGISTRATION_FILE" \
            --world-marker "$NL_0523_WORLD_MARKER" \
            --report "$RUNNER_TEMP/nl-owner-real-0523.json" \
            --isolated-destructive-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-admin-standard-physical-0523-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nl-owner-real-0523.json
          retention-days: 30
          if-no-files-found: error
