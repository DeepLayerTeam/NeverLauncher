name: Production RC 0.32.16 live security disaster load

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'services/api/internal/sqlitecore/**'
      - 'services/api/internal/sqlitedurable/**'
      - 'services/api/internal/sqlitecoord/**'
      - 'services/api/internal/sqlitepg/**'
      - 'services/api/internal/deployment/**'
      - 'services/api/internal/httpapi/**'
      - 'services/api/cmd/launcher-capacity-bench/**'
      - 'scripts/rc/**'
      - 'VERSION'
      - '.github/workflows/production-rc-03216.yml'
  pull_request:
    paths:
      - 'services/api/internal/sqlitecore/**'
      - 'services/api/internal/sqlitedurable/**'
      - 'services/api/internal/sqlitecoord/**'
      - 'services/api/internal/sqlitepg/**'
      - 'services/api/internal/deployment/**'
      - 'services/api/internal/httpapi/**'
      - 'services/api/cmd/launcher-capacity-bench/**'
      - 'scripts/rc/**'
      - 'VERSION'
      - '.github/workflows/production-rc-03216.yml'

permissions:
  contents: read

jobs:
  live-rc-gate:
    name: PostgreSQL Redis S3 SQLite WAL crash replay auth load
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: launcher_rc
          POSTGRES_PASSWORD: rc-temporary-password
          POSTGRES_DB: launcher_rc
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U launcher_rc -d launcher_rc'
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping | grep -q PONG'
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      LAUNCHER_SQLITE_REQUIRE_SUPPORTED_FS: '1'
      LAUNCHER_SQLITE_TEST_ROOT: ${{ runner.temp }}/launcher-rc-sqlite
      LAUNCHER_PG_TEST_DSN: postgres://launcher_rc:rc-temporary-password@127.0.0.1:5432/launcher_rc?sslmode=disable
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_rc:rc-temporary-password@127.0.0.1:5432/launcher_rc?sslmode=disable
      LAUNCHER_GROWTH_TEST_PG_DSN: postgres://launcher_rc:rc-temporary-password@127.0.0.1:5432/launcher_rc?sslmode=disable
      LAUNCHER_GROWTH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      LAUNCHER_RC_S3_ENDPOINT: http://127.0.0.1:9000
      LAUNCHER_RC_S3_BUCKET: launcher-rc
      LAUNCHER_RC_S3_REGION: us-east-1
      LAUNCHER_RC_S3_ACCESS_KEY: launcher-rc-user
      LAUNCHER_RC_S3_SECRET_KEY: launcher-rc-temporary-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache: true
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify RC scripts and canonical version
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/rc -p 'test_*.py' -v
          python3 scripts/version/manage.py check
          ( cd services/api && go mod download && go mod verify )
      - name: Require a verified local SQLite filesystem
        run: |
          set -euo pipefail
          install -d -m 0700 "$LAUNCHER_SQLITE_TEST_ROOT"
          case "$(stat -f -c '%T' "$LAUNCHER_SQLITE_TEST_ROOT")" in
            ext2/ext3|ext4|xfs|btrfs) ;;
            *) echo 'RC BLOCKED: only a supported native ext4/xfs/btrfs volume is allowed' >&2; exit 2;;
          esac
      - name: Start a real isolated MinIO S3 service
        run: |
          set -euo pipefail
          docker run -d --name launcher-rc-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$LAUNCHER_RC_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$LAUNCHER_RC_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-02-07T23-21-09Z \
            server /data --address ':9000'
          python3 -m pip install 'boto3==1.35.99'
          python3 - <<'PY'
          import os, time, urllib.request
          import boto3
          endpoint = os.environ['LAUNCHER_RC_S3_ENDPOINT']
          for _ in range(60):
              try:
                  with urllib.request.urlopen(endpoint+'/minio/health/live', timeout=2) as response:
                      if response.status == 200: break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('RC BLOCKED: MinIO did not become healthy')
          s3 = boto3.client('s3', endpoint_url=endpoint,
                           aws_access_key_id=os.environ['LAUNCHER_RC_S3_ACCESS_KEY'],
                           aws_secret_access_key=os.environ['LAUNCHER_RC_S3_SECRET_KEY'],
                           region_name=os.environ['LAUNCHER_RC_S3_REGION'])
          s3.create_bucket(Bucket=os.environ['LAUNCHER_RC_S3_BUCKET'])
          PY
      - name: Execute strictly verified live release candidate tests
        run: |
          set -euo pipefail
          python3 scripts/rc/production_rc.py --output "$RUNNER_TEMP/launcher-03216-rc.json"
      - name: Upload actual passing RC test receipt only
        uses: actions/upload-artifact@v4
        with:
          name: launcher-03216-rc-${{ github.sha }}
          path: ${{ runner.temp }}/launcher-03216-rc.json
          if-no-files-found: error
          retention-days: 30
