name: Modern Loader Adapters 0.27.2
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/modern-loader-adapters-0272.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/modern-loader-adapters-0272.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  modern-adapter-fixtures:
    name: Loader resolution, pinning, materialization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Check modified Go source formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cli/cmd/launcher/modern_loader_adapters_0272*.go cli/cmd/launcher/{client_factory_0271,loader_runtime,forge_runtime,vanilla_runtime,compatibility_hardening}.go)"
      - name: Client Factory and modern adapter integration fixtures
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestModernLoader0272|TestClientFactory0271|TestForgeAndNeoForgeProcessorMaterializers|TestForgeNeoForgeMavenVersionSelection|TestForgeLatestStableChoosesNumericMaximumIndependentOfMetadataOrder|TestNeoForgePrereleaseOnlyMetadataDoesNotPassAsStable|TestFabricAndQuiltMaterializersProduceConsumableClientTree|TestVanillaMetadataRecoveryExactVersionOnly|TestLoaderResolution'
          -count=1 -timeout=5m
      - name: Build CLI
        working-directory: cli
        run: go build ./cmd/launcher
      - name: Vet CLI
        working-directory: cli
        run: go vet ./cmd/launcher
