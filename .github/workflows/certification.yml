name: Launcher 0.24.13 — сертификация интеграции компонентов
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'services/api/**'
      - 'cli/**'
      - 'scripts/certification/**'
      - '.github/workflows/certification-02413.yml'
  workflow_dispatch:
    inputs:
      actual_minecraft:
        description: 'Выполнять и фиксировать реальные запуски JVM Minecraft от Mojang (загружает артефакты Mojang)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  component-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: aarch64 }
          - { runner: windows-2025, os: windows, arch: x86_64 }
          - { runner: windows-11-arm, os: windows, arch: aarch64 }
          - { runner: macos-15-intel, os: macos, arch: x86_64 }
          - { runner: macos-15, os: macos, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch' && inputs.actual_minecraft
        with:
          distribution: temurin
          java-version: '21'
      - name: Проверить канонические версия и идентичность исходников
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 0.24.13
          python3 scripts/version/manage.py check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Проверить тестовые данные и модульные тесты допуска к выпуску
        shell: bash
        run: python3 -m unittest discover -s scripts/certification -p 'test_*.py' -v
      - name: Проверить реальный разрешитель Go и политику подписанных планов
        shell: bash
        run: |
          set -euo pipefail
          (cd services/api && go test -count=1 ./internal/model ./internal/planpolicy02412)
          (cd services/api && go test -count=1 ./internal/httpapi -run '^TestVerifiedPlanHardwareDeviceSignatureAndBinding02412$')
          (cd cli && go test -count=1 ./cmd/launcher -run 'Test.*Components.*0249|TestComponent.*02310')
      - name: Проверить Runtime на Rust, транзакции и защиту от обходов
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib
          cargo build --manifest-path runtime/runtime/Cargo.toml --bin runtime --example cert_sign_fixture
      - name: Запустить подписанный жизненный цикл компонентов v3 с имитацией HTTP-сбоев через loopback
        shell: bash
        run: |
          set -euo pipefail
          suffix=""; if [[ '${{ matrix.os }}' == windows ]]; then suffix=.exe; fi
          python3 scripts/certification/components_02413.py \
            --runtime "runtime/runtime/target/debug/runtime${suffix}" \
            --signer "runtime/runtime/target/debug/examples/cert_sign_fixture${suffix}" \
            --output "dist/02413/component-${{ matrix.os }}-${{ matrix.arch }}.json"
      - name: Установить графические зависимости для реального Minecraft в Linux
        if: github.event_name == 'workflow_dispatch' && inputs.actual_minecraft && matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libvulkan1 mesa-vulkan-drivers libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 libxcursor1 libxinerama1 libasound2t64
      - name: Установить программный OpenGL для запуска реального клиента в Windows
        if: github.event_name == 'workflow_dispatch' && inputs.actual_minecraft && matrix.os == 'windows'
        shell: pwsh
        run: |
          ./scripts/compatibility/install-windows-mesa.ps1 -Architecture '${{ matrix.arch == 'x86_64' && 'x64' || 'aarch64' }}' -JavaExecutable "$env:JAVA_HOME/bin/java.exe"
      - name: Запустить настоящий клиент Minecraft от Mojang (без имитации успеха)
        if: github.event_name == 'workflow_dispatch' && inputs.actual_minecraft
        shell: bash
        env:
          LAUNCHER_E2E_MINECRAFT_VERSION: '1.21.1'
          LAUNCHER_E2E_JAVA_MAJOR: '21'
          LAUNCHER_COMPAT_OS: ${{ matrix.os }}
          LAUNCHER_COMPAT_ARCH: ${{ matrix.arch }}
          LAUNCHER_COMPAT_TARGET_ID: certification-02413-vanilla
          LAUNCHER_E2E_CLIENT_RUNTIME_SECONDS: '45'
        run: |
          set -euo pipefail
          if [[ '${{ matrix.os }}' == windows ]]; then export LAUNCHER_E2E_JAVA="$JAVA_HOME/bin/java.exe";
          else export LAUNCHER_E2E_JAVA="$JAVA_HOME/bin/java"; fi
          bash e2e/scripts/run-vanilla-certification-case.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('e2e/runtime/result.json')
          report=json.loads(p.read_text())
          assert report['status']=='passed' and report['checks']['actualClient'] is True, 'Minecraft фактически не запустился'
          PY
      - name: Собрать отчёт, привязанный к происхождению сборки (отмечает отсутствующие Guard/Bridge как пройденные)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/certification/record_02413.py \
            --component "dist/02413/component-${{ matrix.os }}-${{ matrix.arch }}.json" \
            --minecraft e2e/runtime/result.json \
            --guard "dist/02413/guard-${{ matrix.os }}-${{ matrix.arch }}.json" \
            --bridge "dist/02413/bridge-${{ matrix.os }}-${{ matrix.arch }}.json" \
            --commit "$GITHUB_SHA" --target '${{ matrix.os }}-${{ matrix.arch }}' \
            --output "dist/02413/report-${{ matrix.os }}-${{ matrix.arch }}.json"
      - name: Загрузить результаты реальных запусков, включая частичные отказы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: components-02413-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/02413/
            e2e/runtime/result.json
            e2e/runtime/vanilla-certification.json
            e2e/runtime/vanilla-install.json
          if-no-files-found: warn
          retention-days: 45
  # Это исполняемая матрица тестов по платформам, но не полномочие
  # утверждать выпуск 0.25.0. Полная сертификация требует шесть независимо полученных
  # наборов свидетельств, реальный запуск Minecraft на каждой целевой платформе,
  # живую интеграцию Guard/ServerBridge и отдельную подписанную GA на чистой машине.

  aggregate-certification:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [component-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Скачать результаты, предоставленные всеми платформами, без подмены отсутствующих
        uses: actions/download-artifact@v4
        with:
          pattern: components-02413-*
          path: dist/platform-evidence-02413
          merge-multiple: false
      - name: Потребовать результаты реальных проверок Minecraft и Guard/Bridge для всех шести платформ
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' reports < <(find dist/platform-evidence-02413 -type f -name 'report-*.json' -print0)
          python3 scripts/certification/gate_02413.py --commit "$GITHUB_SHA" \
            --output dist/certification-02413-aggregate.json "${reports[@]}"
      - name: Сохранить итоговый вердикт ошибки или неполного выполнения для аудита
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-02413-aggregate
          path: dist/certification-02413-aggregate.json
          if-no-files-found: warn
          retention-days: 90
