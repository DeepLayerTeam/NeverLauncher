name: Launcher 0.45.7 — обновление базы данных
on:
  push:
    paths:
      - 'scripts/operations/db_upgrade.py'
      - 'scripts/operations/dr.py'
      - 'scripts/operations/test_db_upgrade.py'
      - 'docs/releases/0.45.7-database-upgrade.md'
      - '.github/workflows/database-upgrade.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-and-dr-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Реальное восстановление SQLite и тесты сценариев отказа"
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest scripts/operations/test_db_upgrade.py -v
          python3 -m unittest scripts/install/test_minimal_backup.py -v
          PYTHONPATH=scripts/operations python3 -m unittest scripts/operations/test_standard_backup.py -v
          PYTHONPATH=scripts/operations python3 -m unittest scripts/operations/test_dr.py -v
          python3 -m py_compile scripts/operations/db_upgrade.py scripts/operations/dr.py
          python3 scripts/operations/db_upgrade.py --help
          python3 scripts/version/manage.py check
  actual-backend-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Сборка роли миграций и выполнение тестов миграции схемы"
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/dbmigrate ./internal/sqlitecore ./internal/sqlitedurable ./cmd/launcher-api
          go build -trimpath -o "$RUNNER_TEMP/launcher-api" ./cmd/launcher-api
      - name: "Проверка согласованности версий исходного кода"
        run: python3 scripts/version/manage.py check
