name: Контроллер поэтапного обновления 0.51.7
on:
  push:
    paths:
      - 'scripts/operations/rolling_update_0517.py'
      - 'scripts/operations/test_rolling_update_0517.py'
      - 'scripts/operations/nn1_compat_0516.py'
      - 'scripts/operations/multi_host_0512.py'
      - 'scripts/operations/ha_inventory_0511.py'
      - 'services/api/internal/dbmigrate/**'
      - 'docs/deployment/rolling-update.md'
      - '.github/workflows/rolling-update-0517.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rolling-update-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить обновление и восстановление, разные версии и регрессии HA-зависимостей
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest \
            scripts/operations/test_rolling_update_0517.py \
            scripts/operations/test_nn1_compat_0516.py \
            scripts/operations/test_multi_host_0512.py \
            scripts/operations/test_ha_inventory_0511.py \
            scripts/operations/test_dependency_ha_0513.py -v
      - name: Проверить unchanged PostgreSQL миграция каталог и релиз версия
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -c 'import nn1_compat_0516 as n; c, d=n.migration_catalog(); assert len(c) >= 100; print("pinned SQL SHA-256:",d)'
          python3 scripts/version/manage.py check
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Запустить промышленные миграция checker регрессионные проверки
        working-directory: services/api
        run: go test -count=1 ./internal/dbmigrate
