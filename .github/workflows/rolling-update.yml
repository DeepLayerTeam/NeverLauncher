name: Контроллер поэтапного обновления 0.51.7
on:
  push:
    paths:
      - 'scripts/operations/rolling_update.py'
      - 'scripts/operations/test_rolling_update.py'
      - 'scripts/operations/nn1_compat.py'
      - 'scripts/operations/multi_host.py'
      - 'scripts/operations/ha_inventory.py'
      - 'services/api/internal/dbmigrate/**'
      - 'docs/deployment/rolling-update.md'
      - '.github/workflows/rolling-update.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rolling-update-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить обновление и восстановление, разные версии и регрессии HA-зависимостей
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest \
            scripts/operations/test_rolling_update.py \
            scripts/operations/test_nn1_compat.py \
            scripts/operations/test_multi_host.py \
            scripts/operations/test_ha_inventory.py \
            scripts/operations/test_dependency_ha.py -v
      - name: "Проверить неизменность каталога миграций PostgreSQL и версии релиза"
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -c 'import nn1_compat_0516 as n; c, d=n.migration_catalog(); assert len(c) >= 100; print("закреплённый SHA-256 SQL:",d)'
          python3 scripts/version/manage.py check
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Запустить промышленные миграция checker регрессионные проверки
        working-directory: services/api
        run: go test -count=1 ./internal/dbmigrate
