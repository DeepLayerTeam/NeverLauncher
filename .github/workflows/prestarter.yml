name: Нативная начальная загрузка Prestarter (0.23.9)
on:
  push:
    paths:
      - 'prestarter/**'
      - 'runtime/runtime/src/bin/runtime.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/desktop/src/main.tsx'
      - 'scripts/release/build-prestarter.sh'
      - '.github/workflows/prestarter.yml'
  pull_request:
    paths:
      - 'prestarter/**'
      - 'runtime/runtime/src/bin/runtime.rs'
      - 'apps/desktop/src-tauri/src/main.rs'
      - 'apps/desktop/src/main.tsx'
      - 'scripts/release/build-prestarter.sh'
      - '.github/workflows/prestarter.yml'
  workflow_dispatch:
jobs:
  prestarter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: prestarter/go.mod
      - name: нативного тесты
        working-directory: prestarter
        run: go test -count=1 ./...
      - name: нативного начальной загрузки бинарного
        working-directory: prestarter
        run: go build -o prestarter-test${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/prestarter
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: prestarter/go.mod
      - name: Проверить всех шести ОС и архитектуры сборок
        env:
          # Открытый ключ только для тестов. Никогда не публикуйте эти бинарники как доверенные
          # промышленные выпуски.
          LAUNCHER_PRESTARTER_ROOT_PUBLIC_KEY: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        run: bash scripts/release/build-prestarter.sh
