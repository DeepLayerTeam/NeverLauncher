name: Gravit 0.33.2 — оценка совместимости
on:
  push:
    paths:
      - 'services/api/internal/gravitdetector/**'
      - 'services/api/internal/repository/migration_compat*'
      - 'services/api/internal/httpapi/migration_compat*'
      - 'services/api/internal/httpapi/handler.go'
      - 'services/api/internal/dbmigrate/sql/0090_*'
      - 'cli/cmd/launcher/migration_workflow.go'
      - 'cli/cmd/launcher/migration_compat_test.go'
      - 'apps/admin/src/admin/MigrationCenter.tsx'
      - '.github/workflows/gravit-compatibility.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-and-cli:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: disposable_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher_test -d launcher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:disposable_test_only@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Проверить обнаружение Gravit и интеграцию SQL-репозитория
        working-directory: services/api
        run: go test -race -count=1 -timeout 5m ./internal/gravitdetector ./internal/repository ./internal/httpapi -run 'Test.*0332|Test.*0441|TestMigration.*0331'
      - name: "Проверить загрузку CLI, обратную совместимость и базовые тесты"
        working-directory: cli
        run: go test -race -count=1 ./cmd/launcher -run 'TestGravitCompatibilityCLI0332|TestMigrationWorkflowCLI0331'
      - name: Проверить канонический контракт API и версию
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - working-directory: apps/admin
        run: npm ci --ignore-scripts
      - working-directory: apps/admin
        run: npm run build
