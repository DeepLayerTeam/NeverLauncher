name: Launcher 0.52.9 — реальная приёмка Guard, Device Trust и ServerBridge
on:
  push:
    paths:
      - 'services/api/internal/httpapi/guard_shadow*'
      - 'services/api/internal/httpapi/server_bound_guard.go'
      - 'plugins/vanilla-bridge/**'
      - 'scripts/acceptance/guard_device_bridge_real.py'
      - 'scripts/acceptance/test_guard_device_bridge_real.py'
      - 'scripts/acceptance/test_guard_shadow_crosslang.py'
      - 'scripts/acceptance/vanilla_sidecar_live.py'
      - 'scripts/guard_ci/adversarial_pilot.py'
      - 'serverbridge/**'
      - 'device-trust/**'
      - 'guard-ci/**'
      - '.github/workflows/guard-device-bridge-real.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      physical_live_acceptance:
        description: 'Выполнять независимую реальную приёмку на частном физическом хосте (требуется подготовленный собственный агент)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  actual-regressions:
    name: Совместимость журнала Go/HMAC, агент JVM и 14 профилей Java-адаптеров
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: "Проверить реальную совместимость журналов Go и свидетельства враждебных воздействий"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/acceptance -p 'test_guard_shadow_crosslang.py' -v
          python3 -m unittest discover -s scripts/acceptance -p 'test_guard_device_bridge_real.py' -v
          python3 scripts/guard_ci/test_adversarial_pilot.py
      - name: "Выполнить промышленные JVM-тесты политик Java-адаптеров ServerBridge"
        run: bash e2e/scripts/run-serverbridge-adapter-capabilities.sh
      - name: Проверить разрешённые преобразования загрузчика и враждебные изменения JVM в реальных дочерних JVM
        run: |
          set -euo pipefail
          python3 scripts/acceptance/guard_device_bridge_real.py local \
            --only-suite loader-transformations --output "$RUNNER_TEMP/guard-0529-local.json"
          python3 - "$RUNNER_TEMP/guard-0529-local.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['independentGA'] is False
          assert d['status']=='LOCAL_PARTIAL_JVM_REGRESSIONS_NOT_GA'
          assert len(d['guardJvm']['suites'])==1
          assert d['guardJvm']['suites'][0]['status']=='PASS'
          PY
      - name: Проверить метаданные текущей канонической версии и объявленную область действия цели
        run: |
          set -euo pipefail
          python3 scripts/version/manage.py check
          python3 scripts/device_trust/matrix.py validate --targets device-trust/targets.json
          python3 scripts/guard_ci/matrix.py validate --targets guard-ci/targets.json
          python3 scripts/serverbridge/matrix.py validate --targets serverbridge/targets.json
  physical-live-review:
    if: github.event_name == 'workflow_dispatch' && inputs.physical_live_acceptance == true
    name: Реальные нативные узлы, подключения к игре и теневой аудит Guard (без автоматического GA)
    runs-on: [self-hosted, linux, x64, launcher-e2e-0529]
    timeout-minutes: 240
    needs: actual-regressions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Потребовать закрытые защищённые конфигурации и изолированный стенд Minecraft"
        shell: bash
        run: |
          set -euo pipefail
          test -f /etc/launcher/acceptance/guard-device-bridge-0529.json
          test "$(stat -c %a /etc/launcher/acceptance/guard-device-bridge-0529.json)" = 600
          test -d artifacts/plugins
          test "$(cat VERSION)" = 0.52.9
      - name: Проверить реальные подписанные сеансы, полный набор 14 адаптеров, Vanilla RCON и ложные срабатывания
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/launcher-live-0529"
          python3 scripts/acceptance/guard_device_bridge_real.py live \
            --config /etc/launcher/acceptance/guard-device-bridge-0529.json \
            --output "$RUNNER_TEMP/launcher-live-0529/report.json"
          python3 - "$RUNNER_TEMP/launcher-live-0529/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='LIVE_CHECKS_PASSED_REVIEW_REQUIRED'
          assert d['independentGA'] is False
          assert d['deviceTrust']['nativeSecureStorageHardwareCertification'] is False
          PY
      - name: Keep закрытые свидетельства exclusively на приёмка хост
        if: always()
        run: echo 'Закрытые данные Guard, RCON и устройств запрещено публиковать в артефактах CI.'
