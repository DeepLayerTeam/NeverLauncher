name: Нативные итоговые пакеты 0.52.2 — регрессия приёмки (не GA)

on:
  push:
    paths:
      - 'scripts/acceptance/native_packages.py'
      - 'scripts/acceptance/test_native_packages.py'
      - 'scripts/release/build-branded-installers.py'
      - 'scripts/release/test_build_branded_installers.py'
      - '.github/workflows/native-installers.yml'
      - '.github/workflows/native-final-packages.yml'
      - '.github/workflows/native-final-package-regressions.yml'
      - 'docs/operations/native-final-package-acceptance.md'
      - 'VERSION'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  no-false-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: prestarter/go.mod
          cache-dependency-path: prestarter/go.sum
      - name: Установить зависимость для проверки подписей
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Проверить версию исходников и синтаксис
        run: |
          python3 scripts/version/manage.py check
          python3 -m py_compile scripts/acceptance/native_packages.py scripts/release/build-branded-installers.py
      - name: Проверить контрольные суммы, повторное воспроизведение, ложный успех, платформы и сокрытие секретов
        run: python3 -m unittest scripts/acceptance/test_native_packages.py -v
      - name: Проверить настоящий сборщик .deb с подписанными тестовыми исходниками (только неподписанный результат)
        run: python3 scripts/release/test_build_branded_installers.py -v
      - name: Отклонить поддельный запуск для шести нативных платформ на агенте Ubuntu
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          set -euo pipefail
          if python3 scripts/acceptance/native_packages.py run \
             --manifest-url https://example.invalid/release.json --manifest-sha256 "$(printf 'a%.0s' {1..64})" \
             --manifest-size 100 --version "$(cat VERSION)" \
             --commit "$GITHUB_SHA" --project test-project \
             --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
             --disposable-runner --output "$RUNNER_TEMP/fake-native"; then
            echo 'ОШИБКА: неподтверждённый исполнитель принят за окончательный нативный пакет' >&2
            exit 1
          fi
