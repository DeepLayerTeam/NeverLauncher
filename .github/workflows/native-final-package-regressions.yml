name: Нативные итоговые пакеты 0.52.2 — регрессия приёмки (не GA)

on:
  push:
    paths:
      - 'scripts/acceptance/native_packages_0522.py'
      - 'scripts/acceptance/test_native_packages_0522.py'
      - 'scripts/release/build-branded-installers.py'
      - 'scripts/release/test_build_branded_installers.py'
      - '.github/workflows/native-installers.yml'
      - '.github/workflows/native-final-packages-0522.yml'
      - '.github/workflows/native-final-package-regressions-0522.yml'
      - 'docs/operations/native-final-package-acceptance.md'
      - 'VERSION'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  no-false-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: prestarter/go.mod
          cache-dependency-path: prestarter/go.sum
      - name: Установить проверки подписи зависимости
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Проверить реального версии исходников и синтаксиса
        run: |
          python3 scripts/version/manage.py check
          python3 -m py_compile scripts/acceptance/native_packages_0522.py scripts/release/build-branded-installers.py
      - name: Запустить checksum, Воспроизвести, ложного PASS, платформы и обезличивания регрессии
        run: python3 -m unittest scripts/acceptance/test_native_packages_0522.py -v
      - name: Протестировать реального .deb builder с подписанных исходников тестовых данных (unsigned тестировать output только)
        run: python3 scripts/release/test_build_branded_installers.py -v
      - name: Отклонить ложный нативный запуск для шести платформ на исполнителе Ubuntu
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          set -euo pipefail
          if python3 scripts/acceptance/native_packages_0522.py run \
             --manifest-url https://example.invalid/release.json --manifest-sha256 "$(printf 'a%.0s' {1..64})" \
             --manifest-size 100 --version "$(cat VERSION)" \
             --commit "$GITHUB_SHA" --project test-project \
             --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
             --disposable-runner --output "$RUNNER_TEMP/fake-native"; then
            echo 'FAILED: self-proclaimed runner was accepted as final native package' >&2
            exit 1
          fi
