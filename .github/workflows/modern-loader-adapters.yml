name: Адаптеры современных загрузчиков 0.27.2
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/modern-loader-adapters.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/modern-loader-adapters.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  modern-adapter-fixtures:
    name: Обнаружение, закрепление и подготовка загрузчика (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: cli/go.sum
      - name: Проверить форматирование изменённых исходников Go
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cli/cmd/launcher/modern_loader_adapters*.go cli/cmd/launcher/{client_factory,loader_runtime,forge_runtime,vanilla_runtime,compatibility_hardening}.go)"
      - name: Проверить фикстуры интеграции фабрики клиента и современных адаптеров
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestModernLoader0272|TestClientFactory0271|TestForgeAndNeoForgeProcessorMaterializers|TestForgeNeoForgeMavenVersionSelection|TestForgeLatestStableChoosesNumericMaximumIndependentOfMetadataOrder|TestNeoForgePrereleaseOnlyMetadataDoesNotPassAsStable|TestFabricAndQuiltMaterializersProduceConsumableClientTree|TestVanillaMetadataRecoveryExactVersionOnly|TestLoaderResolution'
          -count=1 -timeout=5m
      - name: Сборка CLI
        working-directory: cli
        run: go build ./cmd/launcher
      - name: "Проверить CLI анализатором go vet"
        working-directory: cli
        run: go vet ./cmd/launcher
