name: Нативные брендированные установщики (нотариально заверенная версия 0.52.2)
on:
  pull_request:
    paths:
      - 'prestarter/**'
      - 'scripts/release/build-branded-installers.py'
      - 'scripts/release/test_build_branded_installers.py'
      - 'scripts/release/build-prestarter.sh'
      - 'VERSION'
      - '.github/workflows/native-installers.yml'
  push:
    paths:
      - 'prestarter/**'
      - 'scripts/release/build-branded-installers.py'
      - 'scripts/release/test_build_branded_installers.py'
      - 'scripts/release/build-prestarter.sh'
      - 'VERSION'
      - '.github/workflows/native-installers.yml'
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Собрать и подписать артефакты релиза из утверждённого подписанного запуска начальной загрузки'
        type: boolean
        required: true
        default: false
      source_run_id:
        description: 'Запускать с подписанными артефактами launcher-bootstrap-{platform}-{arch}'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: prestarter/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Проверить нативные жизненный цикл и проверки подписей
        working-directory: prestarter
        run: go test -count=1 ./...
      - name: Выполнить кросс-компиляцию нативного установщика и Prestarter для шести платформ
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nl-branding-cross
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            for app in installer prestarter; do
              (cd prestarter && GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "/tmp/nl-branding-cross/${app}-${os}-${arch}" "./cmd/${app}")
            done
          done
      - name: Провести базовую проверку подписанного пакета .deb
        if: runner.os == 'Linux'
        run: python scripts/release/test_build_branded_installers.py
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.production_release
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
          - {runner: windows-2022, platform: windows, arch: amd64}
          - {runner: windows-11-arm, platform: windows, arch: arm64}
          - {runner: macos-15-intel, platform: darwin, arch: amd64}
          - {runner: macos-15, platform: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    environment: production-release
    steps:
      - name: Потребовать явные утверждённые signed-bootstrap Запустить
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{5,20}$ ]] || { echo 'an explicit numeric source_run_id is required'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: prestarter/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Проверить нативные релиз агент и Выполнить prestarter тесты
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = '${{ matrix.platform }}' || { echo 'wrong production OS'; exit 1; }
          test "$(go env GOARCH)" = '${{ matrix.arch }}' || { echo 'wrong production architecture'; exit 1; }
          (cd prestarter && go test -count=1 ./...)
      - name: Получить утверждённые подписанные первый запуск входные данные
        uses: actions/download-artifact@v4
        with:
          name: launcher-bootstrap-${{ matrix.platform }}-${{ matrix.arch }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: branded-input
      - name: Закрепить root ключ из защищённые релиз окружение
        shell: bash
        env:
          PINNED_ROOT_KEY: ${{ vars.LAUNCHER_RELEASE_ROOT_PUBLIC_KEY }}
        run: |
          test "${#PINNED_ROOT_KEY}" -eq 64
          printf '%s' "$PINNED_ROOT_KEY" > root-public-key.hex
      - name: Подготовить Windows code-signing сертификат
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (!$env:PFX_BASE64 -or !$env:PFX_PASSWORD) { throw 'Windows signing secrets required' }
          [IO.File]::WriteAllBytes('signing.pfx', [Convert]::FromBase64String($env:PFX_BASE64))
          $pass = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath signing.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          if (!$cert.Thumbprint) { throw 'No signing certificate imported' }
          Add-Content $env:GITHUB_ENV "LAUNCHER_WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)"
          Remove-Item signing.pfx
      - name: Импортировать macOS Apple сертификаты
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}
      - name: настроить защищённые Apple нотариальное заверение профиль
        if: runner.os == 'macOS'
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER" && test -n "$NOTARY_PRIVATE_KEY"
          printf '%s' "$NOTARY_PRIVATE_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/native-notary-0522.p8"
          chmod 600 "$RUNNER_TEMP/native-notary-0522.p8"
          xcrun notarytool store-credentials native-package-0522 \
            --key "$RUNNER_TEMP/native-notary-0522.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          printf 'LAUNCHER_MACOS_NOTARY_PROFILE=native-package-0522\n' >> "$GITHUB_ENV"
      - name: Импортировать Linux подписание ключ
        if: runner.os == 'Linux'
        shell: bash
        env:
          GPG_KEY_DATA: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_KEY_DATA"
          printf '%s' "$GPG_KEY_DATA" | gpg --batch --import
      - name: "Сборка нативного артефакта с промышленной подписью"
        shell: bash
        env:
          LAUNCHER_GPG_SIGNING_KEY: ${{ secrets.LINUX_GPG_KEY_ID }}
          LAUNCHER_MACOS_CODESIGN_ID: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          LAUNCHER_MACOS_INSTALLER_ID: ${{ vars.APPLE_DEVELOPER_ID_INSTALLER }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          PRESTARTER="branded-input/prestarter"
          if [ '${{ matrix.platform }}' = windows ]; then PRESTARTER="${PRESTARTER}.exe"; fi
          EXTRA=()
          if [ -d branded-input/offline-source ]; then EXTRA=(--offline-source branded-input/offline-source); fi
          python scripts/release/build-branded-installers.py \
            --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' \
            --project '${{ vars.LAUNCHER_BRANDED_PROJECT_ID }}' --version "$VERSION" \
            --config branded-input/bootstrap.signed.json --prestarter "$PRESTARTER" \
            --root-key-file root-public-key.hex --output dist/native "${EXTRA[@]}"
      - name: Удалить temporary Apple notary ключ файл
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/native-notary-0522.p8"
      - name: "Загрузка подписанных установщиков и подписей"
        uses: actions/upload-artifact@v4
        with:
          name: launcher-installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/native/
          if-no-files-found: error
