name: Desktop accessibility and platform regression 0.35.7
on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-accessibility-0357.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-accessibility-0357.yml'
jobs:
  desktop-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:accessibility
      - run: npm run build
  native-window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Linux WebKitGTK native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Compile native Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml desktop_window_0357_tests --no-default-features
