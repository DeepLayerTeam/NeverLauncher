name: Адаптеры устаревших клиентов 0.27.8
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - '.github/workflows/legacy-client-adapters-0278.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - '.github/workflows/legacy-client-adapters-0278.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  legacy-adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Проверка форматирования gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cli/cmd/launcher/legacy_client_adapters_0278*.go cli/cmd/launcher/client_factory_0271.go)"
      - name: Проверить тестовые сценарии старых адаптеров, фабрики, Forge и Vanilla
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestLegacyAdapters0278|TestClientFactory0271|TestForgeLegacy|TestInstallVanillaPre16AliasAndVirtualAssets'
          -count=1 -timeout=6m
      - name: Статический анализ
        working-directory: cli
        run: go vet ./cmd/launcher
      - name: Сборка CLI
        working-directory: cli
        run: go build ./cmd/launcher
      - name: Проверить гонки прежней реализации фабрики
        if: runner.os == 'Linux'
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestLegacyAdapters0278|TestClientFactory0271' -count=1 -timeout=6m
