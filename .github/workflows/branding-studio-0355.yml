name: 0.35.5 Branding Studio and native trust
on:
  push:
    paths:
      - 'apps/admin/**'
      - 'apps/desktop/**'
      - 'prestarter/**'
      - '.github/workflows/branding-studio-0355.yml'
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/desktop/**'
      - 'prestarter/**'
      - '.github/workflows/branding-studio-0355.yml'
permissions:
  contents: read
jobs:
  signed-branding-and-admin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: prestarter/go.mod
      - run: npm ci
        working-directory: apps/admin
      - name: Browser signer, v1/v2 and cross-language Go verification
        run: npm test
        working-directory: apps/admin
      - name: Admin production bundle
        run: npm run build
        working-directory: apps/admin
      - name: Prestarter full production regression
        run: go test ./... -count=1
        working-directory: prestarter
  desktop-branding-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Linux prerequisites for Tauri 2
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: apps/desktop
      - name: Desktop production assets and React compilation
        run: npm run build
        working-directory: apps/desktop
      - name: Native Ed25519 bootstrap and branding validator unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml signed_first_run_0352 -- --nocapture
