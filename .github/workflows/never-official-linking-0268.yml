name: Never Official Identity Linking 0.26.8
on:
  push:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/official_minecraft_0257.ts'
      - 'apps/desktop/src/OfficialMinecraftPanel0257.tsx'
      - 'apps/desktop/tests/official_minecraft_0257.test.mjs'
      - 'services/api/internal/httpapi/minecraft_link_0268*'
      - 'services/api/internal/repository/official_links_0268*'
      - 'services/api/internal/dbmigrate/sql/0075*'
      - '.github/workflows/never-official-linking-0268.yml'
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/src/official_minecraft_0257.ts'
      - 'services/api/internal/httpapi/minecraft_link_0268*'
      - 'services/api/internal/repository/official_links_0268*'
      - 'services/api/internal/dbmigrate/sql/0075*'
      - '.github/workflows/never-official-linking-0268.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: neverlauncher_link_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d neverlauncher_link_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEVER_TEST_POSTGRES_DSN: postgresql://ci:ci@localhost:5432/neverlauncher_link_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Check Go linking and repository tests
        working-directory: services/api
        run: |
          go vet ./internal/httpapi ./internal/repository
          go test -race ./internal/httpapi -run 'TestOfficialLink' -count=1
          go test -race ./internal/repository -run 'TestOfficialNeverLink' -count=1
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Compile and test native identity manager
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml official_identity_0262::tests
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: TypeScript tests and production bundle
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:official
          npm run build
