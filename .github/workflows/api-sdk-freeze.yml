name: Кандидат на фиксацию API/SDK 0.45.12
on:
  push:
    paths:
      - 'schemas/openapi.yaml'
      - 'scripts/contracts/**'
      - 'scripts/sdk/generate-http-operations.py'
      - 'sdk/api/**'
      - 'sdk/java/http-client/**'
      - 'services/api/internal/httpapi/api_contract*'
      - '.github/workflows/api-sdk-freeze.yml'
  pull_request:
    paths:
      - 'schemas/openapi.yaml'
      - 'scripts/contracts/**'
      - 'scripts/sdk/generate-http-operations.py'
      - 'sdk/api/**'
      - 'sdk/java/http-client/**'
      - 'services/api/internal/httpapi/api_contract*'
      - '.github/workflows/api-sdk-freeze.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/contracts/validate-openapi.py
      - run: python3 scripts/contracts/compatibility.py
      - run: python3 -m unittest discover -s scripts/contracts -p 'test_compatibility.py'
      - run: python3 scripts/sdk/generate-http-operations.py --check
  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: cd sdk/api/go && go test -race ./...
  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Установить закреплённую в файле блокировки версию компилятора Desktop
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "Собрать и проверить HTTP-клиент: JSON, двоичные данные и потоковые ответы"
        run: |
          ./apps/desktop/node_modules/.bin/tsc -p sdk/api/typescript/tsconfig.json
          node --test sdk/api/typescript/test/*.test.mjs
          git diff --exit-code -- apps/desktop/package-lock.json sdk/api/typescript
  java-sdk:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: 'temurin', java-version: '${{ matrix.java }}' }
      - run: sh sdk/java/http-client/build.sh test
