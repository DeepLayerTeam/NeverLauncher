name: Интеграция нативного лаунчера ARM64, Guard, Java и загрузчиков 0.43.13
on:
  pull_request:
    paths:
      - 'cli/**'
      - 'runtime/**'
      - 'apps/desktop/**'
      - '.github/workflows/arm64-game-integration-04313.yml'
  push:
    paths:
      - 'cli/**'
      - 'runtime/**'
      - 'apps/desktop/**'
      - '.github/workflows/arm64-game-integration-04313.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-arm64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {target: windows-arm64, runner: windows-11-arm, os: windows, arch: arm64}
          - {target: macos-arm64, runner: macos-15, os: macos, arch: arm64}
          - {target: linux-x64, runner: ubuntu-24.04, os: linux, arch: amd64}
          - {target: windows-x64, runner: windows-2022, os: windows, arch: amd64}
          - {target: macos-x64, runner: macos-15-intel, os: macos, arch: amd64}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }} native game client components
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: "Нативные зависимости Desktop/Tauri для Linux"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: "Проверка фактической архитектуры исполнителя"
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = "$EXPECTED_OS" || { echo 'FAIL: wrong native operating system'; exit 1; }
          test "$(go env GOARCH)" = "$EXPECTED_ARCH" || { echo 'FAIL: emulated or wrong native architecture'; exit 1; }
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$(python3 -c 'import os; o=os.getenv("EXPECTED_OS"); a=os.getenv("EXPECTED_ARCH"); print(("aarch64" if a=="arm64" else "x86_64") + "-" + ("pc-windows-msvc" if o=="windows" else "unknown-linux-gnu" if o=="linux" else "apple-darwin"))')" || { echo 'FAIL: Rust host is not native target'; exit 1; }
      - name: "Нативные тесты Go для сборки клиента и загрузчиков игры"
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/launcher -run 'TestVanilla|TestLWJGL|TestFlattenLWJGL|TestNativeClassifier|TestModernLoader|TestForgeAndNeoForge|TestLoader' -count=1 -timeout=12m
          mkdir -p ../dist/arm64-native-check
          SUFFIX=''; test '${{ matrix.os }}' != windows || SUFFIX='.exe'
          go build -trimpath -o "../dist/arm64-native-check/launcher${SUFFIX}" ./cmd/launcher
      - name: "Проверка архитектуры Managed Java и разрешения метаданных"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib native_managed_java_machine_checks_cover_all_arm64_targets -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib arm64_native_artifact_resolves_to_natives_not_classpath -- --nocapture
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib unknown_or_foreign_native_classifiers_never_enter_arm64_game -- --nocapture
      - name: "Сборка настоящих нативных Guard и Runtime"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path runtime/runtime/Cargo.toml --bin guard --bin runtime
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib game_guard_lifetime_0438 -- --nocapture
      - name: "Сборка нативного Desktop и веб-интерфейса"
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          npm ci
          npm run build
          cd ../..
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --bin launcher-desktop
      - name: "Отказ при отсутствии нативных двоичных компонентов"
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX=''; test '${{ matrix.os }}' != windows || SUFFIX='.exe'
          test -s "runtime/runtime/target/release/guard${SUFFIX}"
          test -s "runtime/runtime/target/release/runtime${SUFFIX}"
          test -s "dist/arm64-native-check/launcher${SUFFIX}"
