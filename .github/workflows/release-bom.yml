name: BOM выпуска 0.32.14
on:
  push:
    paths:
      - 'VERSION'
      - 'cli/cmd/launcher/release_bom_03214*'
      - 'cli/cmd/launcher/release_distribution_04511*'
      - 'cli/cmd/launcher/release_commands.go'
      - 'cli/cmd/launcher/release_signing.go'
      - 'scripts/release/build-release.sh'
      - 'apps/**/package*.json'
      - 'apps/desktop/src-tauri/**'
      - 'runtime/**/Cargo.toml'
      - 'plugins/**/build.gradle.kts'
      - 'serverbridge/**'
      - 'guard-ci/**'
      - 'services/api/go.mod'
      - '.github/workflows/release-bom-03214.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'cli/cmd/launcher/release_bom_03214*'
      - 'cli/cmd/launcher/release_distribution_04511*'
      - 'cli/cmd/launcher/release_commands.go'
      - 'cli/cmd/launcher/release_signing.go'
      - 'scripts/release/build-release.sh'
      - 'apps/**/package*.json'
      - 'apps/desktop/src-tauri/**'
      - 'runtime/**/Cargo.toml'
      - 'plugins/**/build.gradle.kts'
      - 'serverbridge/**'
      - 'guard-ci/**'
      - 'services/api/go.mod'
      - '.github/workflows/release-bom-03214.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: "Синхронизация версий и проверка исходников релиза"
        run: python3 scripts/version/manage.py check
      - name: реальные Go BOM тесты и проверки гонок
        working-directory: cli
        run: |
          go test -race ./cmd/launcher -run '^TestReleaseBOM03214' -count=1 -v
          go vet ./cmd/launcher
      - name: подписанные распространение пакет привязка и негативные тесты
        working-directory: cli
        run: go test -race ./cmd/launcher -run '^TestReleaseDistribution04511' -count=1 -v
      - name: Проверить bash точка входа
        run: bash -n scripts/release/build-release.sh
