name: Gravit 0.50.0 independent GA (blocked without real infrastructure)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'witness executes 36 live checks + 19 module probes; promote verifies independent approval later'
        required: true
        type: choice
        options: [witness, promote]

permissions:
  contents: read

jobs:
  acceptance-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/migration-ga/go.mod
      - name: Compile and test original signed 36-check migration verifier
        working-directory: tools/migration-ga
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build -o /tmp/gravit-migration-ga .
      - name: Python cryptographic verifier and negative regressions
        run: |
          python3 -m pip install 'cryptography==46.0.4'
          python3 -m unittest discover -s tools/gravit-port -p test_ga_acceptance_0500.py
          python3 -m unittest discover -s scripts/release -p test_ga_gate_0500.py
          python3 scripts/version/manage.py check

  independent-live-acceptance:
    needs: acceptance-code
    runs-on: [self-hosted, linux, x64, migration-ga-isolated]
    timeout-minutes: 220
    environment: migration-ga-certification
    env:
      LAUNCHER_MIGRATION_GA_TOKEN: ${{ secrets.MIGRATION_GA_ADMIN_TOKEN }}
      GA0500_CONFIG: ${{ vars.GA0500_CONFIG }}
      GA0500_EVIDENCE_ROOT: ${{ vars.GA0500_EVIDENCE_ROOT }}
      GA0500_REVIEW_APPROVAL: ${{ vars.GA0500_REVIEW_APPROVAL }}
      GA0500_REVIEW_SIGNATURE: ${{ vars.GA0500_REVIEW_SIGNATURE }}
      GA0500_REVIEW_TRUSTED_KEY: ${{ vars.GA0500_REVIEW_TRUSTED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require external real projects, existing private evidence and protected runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in GA0500_CONFIG GA0500_EVIDENCE_ROOT; do
            value="${!name:-}"
            test "${value#/}" != "$value"
            test -n "$value"
          done
          test -f "$GA0500_CONFIG"
          test -d "$GA0500_EVIDENCE_ROOT"
          test "$(stat -c '%a' "$GA0500_EVIDENCE_ROOT")" = 700
          test -n "$LAUNCHER_MIGRATION_GA_TOKEN"
      - name: Execute actual live 36-check and 19-module witnesses
        if: inputs.stage == 'witness'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gravit-port/ga_acceptance_0500.py \
            --config "$GA0500_CONFIG" --evidence-dir "$GA0500_EVIDENCE_ROOT"
          echo 'External independent reviewer must inspect raw evidence and sign every file before separate promote workflow.'
      - name: Require independent approval provided outside the witness workflow
        if: inputs.stage == 'promote'
        shell: bash
        run: |
          set -euo pipefail
          for name in GA0500_REVIEW_APPROVAL GA0500_REVIEW_SIGNATURE GA0500_REVIEW_TRUSTED_KEY; do
            value="${!name:-}"
            test "${value#/}" != "$value"
            test -f "$value"
          done
          python3 scripts/release/ga_gate_0500.py \
            --config "$GA0500_CONFIG" --evidence-root "$GA0500_EVIDENCE_ROOT" \
            --approval "$GA0500_REVIEW_APPROVAL" --signature "$GA0500_REVIEW_SIGNATURE" \
            --trusted-reviewer-key "$GA0500_REVIEW_TRUSTED_KEY"
      # Private Minecraft logs, UUID rosters, credentials and raw evidence
      # intentionally remain on the isolated runner; no artifact upload.
