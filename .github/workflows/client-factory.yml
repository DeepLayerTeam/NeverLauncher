name: Фабрика клиентов 0.27.1
on:
  push:
    paths:
      - 'cli/**'
      - 'VERSION'
      - '.github/workflows/client-factory.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'VERSION'
      - '.github/workflows/client-factory.yml'
permissions:
  contents: read
jobs:
  install-plan-fixtures:
    name: Подготовка компонентов и план установки (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Проверить форматирование
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cli/cmd/launcher/client_factory*.go)"
      - name: Проверить реальные фикстуры материализатора и повторный запуск фабрики
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestClientFactory0271|TestInstallVanillaMaterializesVerifiedClient|TestFabricAndQuiltMaterializersProduceConsumableClientTree|TestForgeAndNeoForgeProcessorMaterializers'
          -count=1 -timeout=5m
      - name: "Проверить сборку CLI"
        working-directory: cli
        shell: bash
        run: go build ./cmd/launcher
