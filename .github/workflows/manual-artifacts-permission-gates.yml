name: Ручные артефакты и проверки разрешений 0.27.6
on:
  push:
    paths:
      - 'cli/cmd/launcher/**'
      - '.github/workflows/manual-artifacts-permission-gates.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/launcher/**'
      - '.github/workflows/manual-artifacts-permission-gates.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  manual-artifacts-and-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: cli/go.sum
      - name: Проверка форматирования
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cli/cmd/launcher/manual_artifact_gates*.go cli/cmd/launcher/modpack_import.go cli/cmd/launcher/client_factory.go)"
      - name: Запустить функциональные и регрессионные тесты
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/launcher
          -run 'TestManualGates0276|TestModpack0275|TestClientFactory0271|TestMirrorHelper0274|TestModernLoader0272|TestProcessorWorker0273'
          -count=1 -timeout=5m
      - name: Статический анализ
        working-directory: cli
        run: go vet ./cmd/launcher
      - name: "Собрать CLI на Go"
        working-directory: cli
        run: go build -o launcher-test ./cmd/launcher
      - name: Тесты на гонки данных
        if: runner.os == 'Linux'
        working-directory: cli
        run: go test -race ./cmd/launcher -run 'TestManualGates0276|TestModpack0275|TestClientFactory0271' -count=1 -timeout=5m
