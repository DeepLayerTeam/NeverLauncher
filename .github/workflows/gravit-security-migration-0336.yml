name: Gravit Security Migration 0.33.6
on:
  push:
    paths:
      - 'services/api/internal/repository/migration_security_0336*'
      - 'services/api/internal/httpapi/migration_security_0336*'
      - 'services/api/internal/httpapi/handler.go'
      - 'services/api/internal/dbmigrate/sql/0094*'
      - 'cli/cmd/launcher/migration_security_0336*'
      - 'cli/cmd/launcher/migration_workflow_0331.go'
      - 'apps/admin/src/admin/MigrationCenter0331.tsx'
      - 'schemas/openapi*'
      - '.github/workflows/gravit-security-migration-0336.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-security-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher_test -d launcher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:test_only_not_production@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Migration trust reset and real PostgreSQL integration
        working-directory: services/api
        run: |
          go test -race -count=1 -timeout 5m ./internal/repository -run 'TestMigrationSecurityTargetDerivation0336|TestMigrationSecurityTrustResetPostgres0336'
          go test -race -count=1 -timeout 5m ./internal/httpapi -run 'TestMigrationIndependentNeverSigners0336|TestMigrationTargetSteps0331'
      - name: CLI tests
        working-directory: cli
        run: go test -race -count=1 ./cmd/launcher -run 'TestMigrationSecurityCLI0336|TestMigrationWorkflow0331'
  api-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
          node --check services/api/internal/embeddedadmin/site/app.js
      - name: Admin production build
        working-directory: apps/admin
        run: |
          npm ci --ignore-scripts
          npm run build
