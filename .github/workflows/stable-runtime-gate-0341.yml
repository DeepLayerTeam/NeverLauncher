name: Stable runtime gate 0.34.1 regression

on:
  pull_request:
    paths:
      - 'services/api/internal/httpapi/**'
      - 'services/api/internal/repository/**'
      - 'services/api/internal/dbmigrate/**'
      - 'cli/internal/dbmigrate/sql/0101_stable_runtime_gate_0341.sql'
      - 'cli/internal/dbmigrate/sql/0102_staged_runtime_execution_0342.sql'
      - 'e2e/scripts/run-staged-package-0342.py'
      - 'e2e/scripts/test_run_staged_package_0342.py'
      - '.github/workflows/staged-package-runtime-0342.yml'
      - 'apps/admin/**'
      - '.github/workflows/stable-runtime-gate-0341.yml'
  push:
    tags: ['v0.34.1', '0.34.1', 'v0.34.2', '0.34.2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Verify backend runtime-gate, durable publish and migration guards
        working-directory: services/api
        run: |
          go test -count=1 -timeout 25m ./internal/repository ./internal/httpapi ./internal/dbmigrate \
            -run 'TestStaged.*0342|TestStable.*0341|TestRuntimePolicyRequiresSignedExactManifestEvidence0212|TestCanonicalPackageProductUploadValidatePublish|TestRollbackOperationIdempotency0217|TestMigrationCutoverPostgres03311|TestEvaluateAppliedSealedCatalog'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Typecheck production Admin gate UI
        working-directory: apps/admin
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Staged download integrity negative tests
        run: python3 -m unittest e2e/scripts/test_run_staged_package_0342.py -v
