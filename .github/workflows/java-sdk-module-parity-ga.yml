name: Launcher 0.31.0 — публичные артефакты Java SDK и требования соответствия модулей
on:
  push:
    paths:
      - 'services/api/internal/extensionhost/**'
      - 'sdk/java/**'
      - 'examples/extensions/**'
      - 'cli/internal/moduleparity/**'
      - 'cli/internal/devtools/**'
      - 'cli/internal/lanmdns/**'
      - 'cli/internal/discordrpc/**'
      - 'compatibility/gravit/**'
      - 'apps/desktop/**'
      - 'scripts/certification/**'
      - 'scripts/desktop/**'
      - 'scripts/diagnostics/**'
      - 'scripts/ga/**'
      - 'VERSION'
      - '.github/workflows/java-sdk-module-parity-ga.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
            cases: java-publication,java-signed-fixtures,java-sdk,jvm-host-e2e,gravit-e2e,java-lifecycle-e2e,java-runtime-e2e,java-supervisor-go,trusted-agent-e2e,devtools-e2e,lan-security,discord-ipc,devtools-security,sentry-backend,asset-integrity,sentry-release,module-parity
          - os: macos-14
            label: darwin
            cases: java-publication,java-signed-fixtures,java-sdk,jvm-host-e2e,gravit-e2e,java-lifecycle-e2e,java-runtime-e2e,trusted-agent-e2e,devtools-e2e,lan-security,discord-ipc,devtools-security,sentry-backend,asset-integrity,sentry-release,module-parity
          - os: windows-2022
            label: windows
            cases: java-publication,java-signed-fixtures,java-sdk,jvm-host-e2e,gravit-e2e,trusted-agent-e2e,devtools-e2e,discord-ipc,devtools-security,sentry-backend,asset-integrity,sentry-release,module-parity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка версии и правил отклонения при ошибках
        shell: bash
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/certification/test_integration_variant2.py
          python3 scripts/ga/test_verify_java_ga.py
          python3 scripts/ga/test_java_ga.py
      - name: Запуск интеграционных тестов реальных подпроцессов, JAR, Go и платформ
        shell: bash
        env:
          SUITE_CASES: ${{ matrix.cases }}
        run: |
          set -euo pipefail
          ext=''
          if [ "$RUNNER_OS" = Windows ]; then ext='.exe'; fi
          python3 scripts/certification/run_integration_variant2.py \
            --cases "$SUITE_CASES" \
            --cli "$RUNNER_TEMP/nl-0310$ext" \
            --report "$RUNNER_TEMP/integration-0310.json" \
            --timeout 300 --revision "$GITHUB_SHA"
      - name: "Опубликовать проверенные SDK для Java 17 как артефакт CI"
        if: success() && matrix.label == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: java-sdk-maven-0310
          path: ${{ runner.temp }}/integration-0310.maven/maven
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-0310-${{ matrix.label }}
          path: ${{ runner.temp }}/integration-0310.json
          if-no-files-found: error
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Установка нативных зависимостей Tauri для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Сборка JS для выпуска и проверка хешей файлов дистрибутива
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run build
          npm run verify:assets
      - name: Компиляция настоящей нативной среды Tauri
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: cargo check --locked
  review:
    needs: [integration, desktop-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-0310-*
          path: reports
      - name: Проверка полной матрицы ОС и сценариев на одном коммите
        run: |
          python3 scripts/certification/review_integration_variant2.py \
            --evidence reports --revision "$GITHUB_SHA" --output integration-review-0310.json
      - uses: actions/upload-artifact@v4
        with:
          name: integration-review-0310
          path: integration-review-0310.json
