name: NeverLauncher 0.43.9 Linux ARM64 native extension sandbox

on:
  push:
    paths:
      - 'services/api/internal/linuxsandbox/**'
      - 'services/api/internal/extensionhost/**'
      - '.github/workflows/linux-arm64-native-sandbox-0439.yml'
  pull_request:
    paths:
      - 'services/api/internal/linuxsandbox/**'
      - 'services/api/internal/extensionhost/**'
      - '.github/workflows/linux-arm64-native-sandbox-0439.yml'
  workflow_dispatch:
    inputs:
      live_arm64:
        type: boolean
        default: false
        description: 'Require real kernel tests on a provisioned ARM64 sandbox runner'

permissions:
  contents: read

jobs:
  compile-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Compile actual sandbox and host on Linux ARM64
        working-directory: services/api
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go test -c -o "$RUNNER_TEMP/linuxsandbox-arm64.test" ./internal/linuxsandbox
          go build ./internal/extensionhost ./internal/extensionpolicy
          test -s "$RUNNER_TEMP/linuxsandbox-arm64.test"
      - name: Execute Linux AMD64 non-hardware sandbox regressions
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/linuxsandbox ./internal/extensionhost ./internal/extensionpolicy
          go vet ./internal/linuxsandbox

  native-arm64-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_arm64
    runs-on: [self-hosted, linux, ARM64, launcher-sandbox]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - name: Require real unprivileged user namespaces, seccomp, delegated cgroup v2 and cgroup.kill
        working-directory: services/api
        env:
          NL_RUN_LIVE_LINUX_SANDBOX: '1'
        run: |
          test "$(uname -m)" = aarch64
          test "$(id -u)" != 0
          go test -count=1 -v ./internal/linuxsandbox -run 'TestARM64NativeKernelBoundary0439|TestLinuxIsolationLive0319|TestLinuxAdversarialDescendants03114'
      - name: Verify ARM64 native integration regressions
        working-directory: services/api
        run: |
          test "$(uname -m)" = aarch64
          go test -race -count=1 ./internal/linuxsandbox ./internal/extensionhost ./internal/extensionpolicy
