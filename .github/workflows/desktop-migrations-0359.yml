name: Desktop migration and user-content preservation 0.35.9
on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'runtime/runtime/**'
      - '.github/workflows/desktop-migrations-0359.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'runtime/runtime/**'
      - '.github/workflows/desktop-migrations-0359.yml'
jobs:
  renderer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:update-migration
      - run: npm run test:components
      - run: npm run test:downloads
      - run: npm run build
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native requirements
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Conflict archive and fail-closed regression
        run: cargo test --manifest-path runtime/runtime/Cargo.toml _0359 --no-default-features
      - name: Settings migration and durable legacy backup
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml desktop_settings_0359_tests --no-default-features
