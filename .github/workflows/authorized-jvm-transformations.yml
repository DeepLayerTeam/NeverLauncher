name: Guard 0.50.4 — разрешённый Runtime загрузчиков
on:
  push:
    paths:
      - 'sdk/java/trusted-agent/**'
      - 'runtime/runtime/src/guard_compatibility_0502.rs'
      - 'runtime/runtime/src/guarded_trusted_launch_0503.rs'
      - 'cli/cmd/launcher/guard_loader_0504*'
      - 'cli/cmd/launcher/guard_compat_policy_0502*'
      - 'cli/cmd/launcher/trusted_jvm_0306.go'
      - 'scripts/tests/guard_loader_0504.py'
      - '.github/workflows/authorized-jvm-transformations-0504.yml'
  pull_request:
    paths:
      - 'sdk/java/trusted-agent/**'
      - 'runtime/runtime/src/guard_compatibility_0502.rs'
      - 'runtime/runtime/src/guarded_trusted_launch_0503.rs'
      - 'cli/cmd/launcher/guard_loader_0504*'
      - 'cli/cmd/launcher/guard_compat_policy_0502*'
      - 'cli/cmd/launcher/trusted_jvm_0306.go'
      - 'scripts/tests/guard_loader_0504.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-jvm-loader-guard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, name: linux-x64 }
          - { runner: ubuntu-24.04-arm, name: linux-arm64 }
          - { runner: windows-2022, name: windows-x64 }
          - { runner: windows-11-arm, name: windows-arm64 }
          - { runner: macos-15-intel, name: macos-x64 }
          - { runner: macos-15, name: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }} loader authorization
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Проверить источники загрузчиков классов JVM и негативные сценарии (без сквозного теста Minecraft)
        run: python scripts/tests/guard_loader_0504.py
      - name: Проверить интеграцию Go с подписанной политикой и доверенными JVM
        working-directory: cli
        run: go test ./cmd/launcher -run '^(TestGuardLoader0504|TestGuardCompatibility0502|TestTrustedJVM0306)' -count=1 -timeout 12m
      - name: Запустить нативные проверки подписанной политики и доверенных компонентов
        run: |
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib guard_compatibility_0502
          cargo test --manifest-path runtime/runtime/Cargo.toml --lib guarded_trusted_launch_0503
      - name: "Согласованность канонической версии"
        run: python scripts/version/manage.py check
