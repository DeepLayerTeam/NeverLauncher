name: Изолированная репетиция миграции Gravit 0.33.10
on:
  push:
    paths:
      - 'services/api/internal/gravitrehearsal/**'
      - 'services/api/internal/repository/migration_rehearsal*'
      - 'services/api/internal/httpapi/migration_rehearsal*'
      - 'services/api/internal/dbmigrate/sql/0097*'
      - 'cli/cmd/launcher/migration_rehearsal*'
      - 'cli/cmd/launcher/migration_live*'
      - 'cli/cmd/launcher/migration_rehearsal_local_04910*'
      - 'cli/cmd/launcher/migration_workflow_0331.go'
      - 'tools/gravit-port/rehearse_cohort_04910.py'
      - 'tools/gravit-port/test_rehearse_cohort_04910.py'
      - 'docs/migration/gravit-cohort-rehearsal.md'
      - 'docs/migration/gravit-live-rehearsal.md'
      - 'schemas/openapi*'
      - '.github/workflows/gravit-rehearsal-03310.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: launcher_test
          POSTGRES_USER: launcher_test
          POSTGRES_PASSWORD: test_only_not_production
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher_test -d launcher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_test:test_only_not_production@127.0.0.1:5432/launcher_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Выполнить модульные и интеграционные тесты PostgreSQL
        working-directory: services/api
        run: |
          go test -race -count=1 ./internal/gravitrehearsal
          go test -race -count=1 ./internal/repository -run 'TestMigrationRehearsal03310'
          go test -count=1 ./internal/httpapi -run '^$'
      - name: "Проверить исполнение CLI и безопасность реального процесса"
        working-directory: cli
        run: go test -race -count=1 ./cmd/launcher -run 'TestRehearsal|TestRehearseLocal04910'
      - name: Проверить группу из трёх проектов на синтетических данных (без сертификации GA)
        run: python3 -m unittest discover -s tools/gravit-port -p 'test_rehearse_cohort_04910.py' -v
      - name: Проверить контракт и версию
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/contracts/validate-openapi.py
