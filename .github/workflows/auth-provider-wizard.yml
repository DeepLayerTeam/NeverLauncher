name: Мастер провайдера аутентификации 0.29.10
on:
  push:
    paths:
      - 'services/api/**'
      - 'apps/admin/**'
      - 'cli/internal/dbmigrate/**'
      - '.github/workflows/auth-provider-wizard.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'apps/admin/**'
      - 'cli/internal/dbmigrate/**'
      - '.github/workflows/auth-provider-wizard.yml'
permissions:
  contents: read
jobs:
  provider-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: launcher
          POSTGRES_USER: launcher
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher -d launcher" --health-interval 5s --health-timeout 5s --health-retries 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Отформатировать Go-код и собрать Backend"
        working-directory: services/api
        run: |
          test -z "$(gofmt -l internal/repository/*02910*.go internal/federation/*02910*.go internal/httpapi/*02910*.go internal/sqlconnector/connector.go)"
          go build ./cmd/...
      - name: "Применить реальные миграции PostgreSQL"
        working-directory: services/api
        env:
          LAUNCHER_DATABASE_URL: postgres://launcher:integration-only@localhost:5432/launcher?sslmode=disable
        run: |
          # Использовать каталог миграций с той же реализацией репозитория, что и в промышленной системе.
          go test ./internal/dbmigrate -count=1
          psql 'postgres://launcher:integration-only@localhost:5432/launcher?sslmode=disable' -v ON_ERROR_STOP=1 -f internal/dbmigrate/sql/0085_auth_provider_wizard.sql
      - name: Проверить мастер настройки провайдера авторизации, гонки и интеграцию с PostgreSQL
        working-directory: services/api
        env:
          LAUNCHER_PROVIDER_WIZARD_POSTGRES_DSN: postgres://launcher:integration-only@localhost:5432/launcher?sslmode=disable
        run: |
          go test -race -count=1 -timeout=8m ./internal/repository ./internal/federation ./internal/httpapi ./internal/sqlconnector -run '02910|TestProviderRouting|TestAuthenticatePassword'
          go vet ./internal/repository ./internal/federation ./internal/httpapi ./internal/sqlconnector
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Выполнить промышленную сборку и тесты интерфейса Admin
        working-directory: apps/admin
        run: |
          npm ci
          npm test
          npm run build
      - name: "Проверить синхронизацию миграций CLI"
        working-directory: cli
        run: go test ./internal/dbmigrate
