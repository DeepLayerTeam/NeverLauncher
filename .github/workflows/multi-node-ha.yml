name: Проверка исходников HA и объединённого Docker Compose для нескольких узлов (0.45.5)
on:
  push:
    paths:
      - 'services/api/cmd/launcher-api/**'
      - 'services/api/internal/httpapi/durable_control_0213.go'
      - 'deploy/production/**'
      - 'scripts/operations/test_multi_node_ha_0455.py'
      - 'scripts/operations/dr_03512.py'
      - 'scripts/operations/test_multi_node_recovery_0455.py'
      - '.github/workflows/multi-node-ha-0455.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ha:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Скомпилировать и тестировать реального Backend roles, аренды реализации и восстановления
        working-directory: services/api
        run: |
          set -euo pipefail
          go mod download
          go test -race -count=1 ./cmd/launcher-api ./internal/deployment ./internal/repository ./internal/httpapi
          go build -trimpath -o "$RUNNER_TEMP/launcher-api" ./cmd/launcher-api
      - name: Разрешить реального network-ha Docker Compose и Проверить изоляции
        run: |
          set -euo pipefail
          cp deploy/production/env.production.example "$RUNNER_TEMP/ha.env"
          chmod 600 "$RUNNER_TEMP/ha.env"
          cat >> "$RUNNER_TEMP/ha.env" <<'EOF'
          POSTGRES_PASSWORD=ha-ci-only-Postgres
          REDIS_PASSWORD=ha-ci-only-Redis
          LAUNCHER_STORAGE_S3_ENDPOINT=https://s3.example.invalid
          LAUNCHER_STORAGE_S3_BUCKET=ha-ci
          LAUNCHER_STORAGE_S3_REGION=us-east-1
          LAUNCHER_STORAGE_S3_ACCESS_KEY=ha-ci
          LAUNCHER_STORAGE_S3_SECRET_KEY=ha-ci
          EOF
          docker compose --project-name launcher-ha-ci --profile network-ha --env-file "$RUNNER_TEMP/ha.env" \
            -f deploy/production/docker-compose.yml \
            -f deploy/production/docker-compose.network-ha.yml config --format json > "$RUNNER_TEMP/ha-compose.json"
          python3 scripts/operations/test_multi_node_ha_0455.py "$RUNNER_TEMP/ha-compose.json"
      - name: Проверить Nginx HA конфигурации с промышленной image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ha-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/ha-tls/privkey.pem" -out "$RUNNER_TEMP/ha-tls/fullchain.pem"
          # Проверяется фактическая версия образа (Nginx 1.27.3+ с поддержкой resolve).
          docker run --rm \
            -v "$PWD/deploy/production/nginx.network-ha.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/ha-tls:/etc/launcher/tls:ro" \
            nginx:1.28-alpine nginx -t
      - name: Regression-test cold HA Резервная копия и воркера разделения владения
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/operations python3 -m unittest \
            scripts/operations/test_dr_03512.py \
            scripts/operations/test_network_ha_recovery_0454.py \
            scripts/operations/test_multi_node_recovery_0455.py -v
      - name: Проверить каноническую версию
        run: python3 scripts/version/manage.py check
