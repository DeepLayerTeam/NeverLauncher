name: Adapter Lifecycle 0.27.11
on:
  push:
    paths:
      - 'cli/cmd/neverlauncher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/adapter-lifecycle-02711.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'cli/cmd/neverlauncher/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/adapter-lifecycle-02711.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  adapter-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cli/cmd/neverlauncher/{adapter_lifecycle_02711,adapter_lifecycle_cli_02711,adapter_lifecycle_02711_test,client_factory_0271,manual_artifact_gates_0276,mirror_helper_parity_0274}.go)"
      - name: Real Client Factory integration and compatibility fixtures
        working-directory: cli
        shell: bash
        run: >-
          go test ./cmd/neverlauncher -run
          'TestAdapterLifecycle02711|TestClientFactory0271|TestModernLoader0272|TestMirrorHelper0274|TestAuthlibClassloader0279|TestLegacyClientAdapters0278'
          -count=1 -timeout=5m
      - name: CLI compile
        working-directory: cli
        run: go build ./cmd/neverlauncher
      - name: Vet
        working-directory: cli
        run: go vet ./cmd/neverlauncher
      - name: Race verification
        if: runner.os == 'Linux'
        working-directory: cli
        run: go test -race ./cmd/neverlauncher -run 'TestAdapterLifecycle02711|TestClientFactory0271VanillaTransactionReplayAndTampering' -count=1 -timeout=5m
