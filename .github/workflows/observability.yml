name: Launcher 0.45.9 — наблюдаемость
on:
  push:
    paths:
      - 'services/api/internal/httpapi/request_observability_0459*'
      - 'services/api/internal/httpapi/observability.go'
      - 'services/api/internal/httpapi/server.go'
      - 'services/api/cmd/launcher-api/process_role_0455.go'
      - 'scripts/operations/observability_0459.py'
      - 'scripts/operations/test_observability_0459.py'
      - 'deploy/production/monitoring/**'
      - 'deploy/production/docker-compose.observability.yml'
      - '.github/workflows/observability-0459.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить настоящий диагностический ZIP и регрессии вебхуков
        run: |
          set -euo pipefail
          python3 -m unittest scripts/operations/test_observability_0459.py -v
          python3 -m py_compile scripts/operations/observability_0459.py
          python3 scripts/version/manage.py check
      - name: Проверить конфигурацию Prometheus и оповещения через promtool
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/deploy/production/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus-standard.yml
          docker run --rm -v "$PWD/deploy/production/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus-network-ha.yml
          docker run --rm -v "$PWD/deploy/production/monitoring:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v2.55.1 check rules /etc/prometheus/alerts.yml
      - name: "Проверить реальную конфигурацию Alertmanager и конфигурацию Compose"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monitor"
          python3 scripts/operations/observability_0459.py configure --webhook-url https://alerts.example.org/ci --output "$RUNNER_TEMP/monitor/alertmanager.json"
          docker run --rm -v "$RUNNER_TEMP/monitor:/etc/alertmanager:ro" --entrypoint /bin/amtool prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.json
          LAUNCHER_ALERTMANAGER_CONFIG="$RUNNER_TEMP/monitor/alertmanager.json" docker compose -f deploy/production/docker-compose.yml -f deploy/production/docker-compose.observability.yml --env-file deploy/production/env.production.example config --quiet
  go-observability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: "Проверить состояние HTTP, корреляцию запросов и готовность агента"
        working-directory: services/api
        run: |
          set -euo pipefail
          go test -count=1 ./internal/httpapi -run '^TestAccessLog0459'
          go test -count=1 ./cmd/launcher-api -run '^TestWorkerProbe0455$'
