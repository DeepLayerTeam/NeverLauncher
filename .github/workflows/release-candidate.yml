name: Launcher — нативная приёмка исходников кандидата текущей версии
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'VERSION'
      - 'apps/**'
      - 'runtime/**'
      - 'services/api/**'
      - 'scripts/rc/**'
      - 'scripts/operations/**'
      - '.github/workflows/release-candidate-03514.yml'
  push:
    paths:
      - 'VERSION'
      - 'apps/**'
      - 'runtime/**'
      - 'services/api/**'
      - 'scripts/rc/**'
      - 'scripts/operations/**'
      - '.github/workflows/release-candidate-03514.yml'
permissions:
  contents: read
concurrency:
  group: launcher-03514-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rc-regressions:
    name: Version, negative evidence and DR source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Приёмочные тесты исполняемых файлов с запретом при неопределённости
        run: |
          python3 scripts/version/manage.py check
          python3 scripts/acceptance/ux_0351.py audit
          python3 -m unittest discover -s scripts/rc -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/operations -p 'test_dr_03512.py' -v
          python3 -m unittest discover -s scripts/ga -p 'test_runtime_acceptance_0350.py' -v
  runtime-native:
    needs: [rc-regressions]
    name: Real signed download, repair, tamper rejection (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-15
            target: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Скомпилировать реальный нативный исполняемый файл и ограниченный тестовый подписыватель Ed25519
        run: cargo build --release --manifest-path runtime/runtime/Cargo.toml --bin runtime --example cert_sign_fixture
      - name: Проверить подписанную HTTP-установку, восстановление и негативные тесты доверия
        shell: bash
        run: |
          set -euo pipefail
          ext=''
          if [ '${{ matrix.target }}' = 'windows' ]; then ext='.exe'; fi
          mkdir -p rc-out/native
          python scripts/rc/native_03514.py \
            --runtime "runtime/runtime/target/release/runtime${ext}" \
            --signer "runtime/runtime/target/release/examples/cert_sign_fixture${ext}" \
            --commit "$GITHUB_SHA" \
            --output 'rc-out/native/${{ matrix.target }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: rc03514-native-${{ matrix.target }}-${{ github.sha }}
          path: rc-out/native/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
  desktop-native:
    needs: [rc-regressions]
    name: Built Tauri + actual React assets and tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-15
            target: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Установить нативный инструментарий WebView для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev libgtk-3-dev build-essential
      - name: Установить зависимости и собрать действующий интерфейс Desktop
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:downloads
          npm run test:extension-security
          npm run test:offline
          npm run test:update-migration
          npm run test:diagnostics-support
          npm run test:accessibility
      - name: Скомпилировать и модульно протестировать Tauri с текущим Runtime
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features
          cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Вычислить хеши реального исполняемого файла и промышленного интерфейса
        shell: bash
        run: |
          set -euo pipefail
          ext=''
          if [ '${{ matrix.target }}' = 'windows' ]; then ext='.exe'; fi
          mkdir -p rc-out/desktop
          python scripts/rc/platform_03514.py \
            --binary "apps/desktop/src-tauri/target/release/launcher-desktop${ext}" \
            --frontend apps/desktop/dist \
            --commit "$GITHUB_SHA" \
            --output 'rc-out/desktop/${{ matrix.target }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: rc03514-desktop-${{ matrix.target }}-${{ github.sha }}
          path: rc-out/desktop/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
  backend-journey:
    needs: [rc-regressions]
    name: Real PostgreSQL stable gate + disposable Owner/Player HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: launcher_rc
          POSTGRES_PASSWORD: launcher_rc_ci_only
          POSTGRES_DB: launcher_rc
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U launcher_rc -d launcher_rc'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher_rc:launcher_rc_ci_only@127.0.0.1:5432/launcher_rc?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Запустить проверки безопасности Go, отката, согласий и неизменяемого stable-снимка PostgreSQL
        working-directory: services/api
        run: |
          go test -race -count=1 -timeout 25m ./internal/httpapi ./internal/repository -run 'TestRollbackOperationIdempotency0217|TestReleaseWorkspaceDraftOwnershipAndResume0218|TestDurablePublishRechecksAuthorizationBeforeCommit0213|TestCanonicalPackageProductUploadValidatePublish|TestSupportReportSubmitRequiresLoginAndConsent03510|TestSupportReportRejectsUnknownFields03510|TestOperatorDiagnosticsDoesNotLeakInfrastructure03510|TestProductionGateFailClosedWithoutTargets03411|TestProductionGateUnknownEvidenceFieldsRejected03411|TestGAStableSnapshotImmutablePostgres0350|TestStableSQLTriggersRejectAllHeadAndManualStatusWrites0341'
          go build ./cmd/launcher-api
      - name: Реальные изолированные HTTP E2E Backend с авторизацией владельца и игрока
        run: |
          mkdir -p rc-out/backend
          bash scripts/acceptance/run_owner_player_0351.sh "$PWD/rc-out/backend/owner-player.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rc03514-backend-${{ github.sha }}
          path: rc-out/backend/owner-player.json
          if-no-files-found: error
          retention-days: 30
  rc-verification:
    needs: [runtime-native, desktop-native, backend-journey]
    name: Require all three real OS outputs and protected Backend E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rc03514-native-*-${{ github.sha }}
          path: rc-out/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: rc03514-desktop-*-${{ github.sha }}
          path: rc-out/desktop
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: rc03514-backend-${{ github.sha }}
          path: rc-out/backend
      - name: Проверить фактические операции, хеши, область действия и полноту точного коммита
        run: |
          python scripts/rc/gate_03514.py \
            --native-dir rc-out/native --desktop-dir rc-out/desktop \
            --backend rc-out/backend/owner-player.json \
            --commit "$GITHUB_SHA" --output rc03514-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: rc03514-source-checks-${{ github.sha }}
          path: rc03514-verification.json
          if-no-files-found: error
          retention-days: 30
