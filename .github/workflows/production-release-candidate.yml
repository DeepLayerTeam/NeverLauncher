name: NeverLauncher Production Release Candidate

on:
  workflow_dispatch:
    inputs:
      optional_components_ga_evidence_run_id:
        type: string
        required: false
        description: 'Only for historical 0.25.0 GA: approved six signed Optional Components attestations'
      client_factory_ga_evidence_run_id:
        type: string
        required: true
        description: 'Protected Client Factory 0.28.0 run (same commit, five actual JVM launches and matching-server join)'
      official_minecraft_ga_evidence_run_id:
        type: string
        required: true
        description: 'Protected operator run with six independently signed live official Minecraft 0.27.0 attestations'

permissions:
  contents: read
  actions: read

concurrency:
  group: neverlauncher-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Require main branch exact source
    runs-on: ubuntu-24.04
    steps:
      - name: Reject non-main production release dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "production release candidate must be dispatched from refs/heads/main" >&2; exit 2; }

  base-ci:
    name: Exact-commit main certification and full E2E
    needs: [validate-release-ref]
    uses: ./.github/workflows/ci.yml

  windows-production-signed:
    name: Authenticode Windows x64 + ARM64 production delivery
    needs: [base-ci]
    uses: ./.github/workflows/windows-production-delivery.yml
    secrets: inherit

  macos-production-notarized:
    name: Developer ID + notarized macOS x64/ARM64 production delivery
    needs: [base-ci]
    uses: ./.github/workflows/macos-production-delivery.yml
    secrets: inherit

  admin-ga-certification:
    name: Admin 0.22.0 real GA certification (fail closed)
    needs: [base-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NEVERLAUNCHER_GA_SOURCE_SHA: ${{ github.sha }}
      E2E_ADMIN_URL: ${{ vars.NL_E2E_ADMIN_URL }}
      E2E_API_URL: ${{ vars.NL_E2E_API_URL }}
      E2E_PROJECT_ID: ${{ vars.NL_E2E_PROJECT_ID }}
      E2E_FOREIGN_PROJECT_ID: ${{ vars.NL_E2E_FOREIGN_PROJECT_ID }}
      E2E_SERVERBRIDGE_NODE_ID: ${{ vars.NL_E2E_SERVERBRIDGE_NODE_ID }}
      E2E_DESTRUCTIVE_STAGING_ACK: ${{ vars.NL_E2E_DESTRUCTIVE_STAGING_ACK }}
      E2E_ADMIN_TOKEN: ${{ secrets.NL_E2E_ADMIN_TOKEN }}
      E2E_OPERATOR_TOKEN: ${{ secrets.NL_E2E_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser runtime
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Certify candidate with real builds, PostgreSQL and staging
        run: bash scripts/release/certify-admin-ga-0220.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-admin-ga-${{ github.sha }}
          path: dist/ga-certification/admin-0220.json
          if-no-files-found: error
          retention-days: 90

  profile-ga-certification:
    name: Profile/workspace GA E2E (real PostgreSQL, Go race and CLI)
    needs: [base-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neverlauncher_test
          POSTGRES_PASSWORD: neverlauncher_test_ci_only
          POSTGRES_DB: neverlauncher_profile_ga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neverlauncher_test -d neverlauncher_profile_ga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NEVERLAUNCHER_TEST_POSTGRES_DSN: postgres://neverlauncher_test:neverlauncher_test_ci_only@127.0.0.1:5432/neverlauncher_profile_ga?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: |
            services/api/go.sum
            cli/go.sum
      - name: Check real PostgreSQL readiness
        run: |
          python3 - <<'PYREADY'
          import socket
          with socket.create_connection(('127.0.0.1', 5432), timeout=10):
              pass
          PYREADY
      - name: Validate release evidence parser
        run: python3 scripts/release/test_certify_profiles_ga_0230.py
      - name: Run Profile/Manifest and workspace GA certification
        run: python3 scripts/release/certify-profiles-ga-0230.py
      - uses: actions/upload-artifact@v4
        with:
          name: neverlauncher-profiles-ga-${{ github.sha }}
          path: dist/ga-certification/profiles-0230.json
          if-no-files-found: error
          retention-days: 90

  certify-platform-signing:
    name: Require both authenticated Windows and notarized macOS builds
    needs: [base-ci, windows-production-signed, macos-production-notarized]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful platform signing prerequisites
        env:
          WINDOWS: ${{ needs.windows-production-signed.result }}
          MACOS: ${{ needs.macos-production-notarized.result }}
        run: |
          test "$WINDOWS" = success
          test "$MACOS" = success

  release-bundle:
    name: Release candidate bundle
    needs: [base-ci, admin-ga-certification, profile-ga-certification, windows-production-signed, macos-production-notarized, certify-platform-signing]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ed25519 verification dependency
        run: python3 -m pip install 'cryptography>=43,<47'
      - name: Download independently signed live official Minecraft GA evidence
        uses: actions/download-artifact@v4
        with:
          pattern: official-minecraft-ga-0270-*
          run-id: ${{ inputs.official_minecraft_ga_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: official-minecraft-ga-raw
          merge-multiple: false
      - name: Require six exact platform attestations; verify pinned operator signature
        shell: bash
        env:
          APPROVED_OPERATOR_PUBLIC_KEY: ${{ vars.NEVERLAUNCHER_OFFICIAL_GA_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "${APPROVED_OPERATOR_PUBLIC_KEY}" || { echo 'missing protected GA verification key' >&2; exit 2; }
          mkdir -p official-minecraft-ga-0270
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            source="official-minecraft-ga-raw/official-minecraft-ga-0270-${target}"
            test -d "$source"
            cp -a "$source" "official-minecraft-ga-0270/$target"
          done
          python3 scripts/ga/official_minecraft_0270.py \
            --attestations official-minecraft-ga-0270 \
            --public-key "$APPROVED_OPERATOR_PUBLIC_KEY" \
            --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/official-minecraft-ga-0270.json"
      - name: Require approved same-commit protected Client Factory GA workflow
        env:
          GA_RUN_ID: ${{ inputs.client_factory_ga_evidence_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GA_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GA_RUN_ID"             --jq '{commit:.head_sha,conclusion:.conclusion,event:.event,path:.path}' > "$RUNNER_TEMP/client-factory-run.json"
          jq -e --arg commit "$GITHUB_SHA"             '.commit == $commit and .conclusion == "success" and .event == "workflow_dispatch" and (.path | endswith(".github/workflows/client-factory-ga-0280.yml"))'             "$RUNNER_TEMP/client-factory-run.json" >/dev/null
      - name: Retrieve Client Factory protected GA evidence
        uses: actions/download-artifact@v4
        with:
          name: client-factory-ga-0280-${{ github.sha }}
          run-id: ${{ inputs.client_factory_ga_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: client-factory-ga-0280-evidence
      - name: Verify signed Client Factory GA evidence without private keys
        env:
          CLIENT_FACTORY_RUNTIME_PUBLIC_KEY: ${{ vars.NEVERLAUNCHER_FACTORY_RUNTIME_PUBLIC_KEY }}
          CLIENT_FACTORY_JOIN_PUBLIC_KEY: ${{ vars.NEVERLAUNCHER_FACTORY_JOIN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_FACTORY_RUNTIME_PUBLIC_KEY"
          test -n "$CLIENT_FACTORY_JOIN_PUBLIC_KEY"
          python3 scripts/ga/verify_client_factory_0280.py             --evidence client-factory-ga-0280-evidence             --runtime-public-key "$CLIENT_FACTORY_RUNTIME_PUBLIC_KEY"             --join-public-key "$CLIENT_FACTORY_JOIN_PUBLIC_KEY"             --commit "$GITHUB_SHA" --version 0.28.0
      - name: Verify exact-commit Admin GA result
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-admin-ga-${{ github.sha }}
          path: admin-ga-certification
      - name: Reject missing or mismatched Admin GA certification
        run: |
          jq -e --arg commit "$GITHUB_SHA" --arg version "$(cat VERSION)" \
            '.status == "passed" and .commit == $commit and .productVersion == $version and (.adminBundle | length > 0) and (.checks | index("live-playwright-rbac-two-tabs-recovery") != null) and (.checks | index("postgresql-serverbridge-integration") != null) and (.checks | index("live-serverbridge-v3-save-drain-ack") != null)' \
            admin-ga-certification/admin-0220.json >/dev/null
      - name: Download exact-commit Profile GA certification
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-profiles-ga-${{ github.sha }}
          path: profile-ga-certification
      - name: Reject missing, skipped or mismatched Profile GA evidence
        run: |
          jq -e --arg commit "$GITHUB_SHA" --arg version "$(cat VERSION)" \
            '.status == "passed" and .commit == $commit and .productVersion == $version and
              ([.suites[].id] | sort) == (["client-update-and-repair", "profile-v2-gravit-and-file-rules", "workspace-and-channel-cas", "workspace-http-materialize"] | sort) and
              ([.suites[] | select(.status != "passed")] | length) == 0 and
              ([.suites[] | .tests | length] | min) > 0' \
            profile-ga-certification/profiles-0230.json >/dev/null
      - name: Download certified Linux Guard artifacts
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-linux-neverguard-${{ github.sha }}
          path: guard-platform-artifacts/linux
      - name: Download native Linux x64 + ARM64 production artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: neverlauncher-linux-production-*-${{ github.sha }}
          path: linux-production-artifacts
          merge-multiple: true
      - name: Download notarized macOS x64 + ARM64 production artifacts
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-macos-notarized-${{ github.sha }}
          path: macos-production-artifacts
      - name: Download Managed JRE six-target production assets
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-managed-jre-${{ github.sha }}
          path: managed-jre-artifacts
      - name: Download Authenticode Windows x64 + ARM64 production artifacts
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-windows-production-${{ github.sha }}
          path: windows-production-artifacts
      - name: Download certified Windows Guard artifacts
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-windows-neverguard-${{ github.sha }}
          path: guard-platform-artifacts/windows
      - name: Download certified macOS Guard artifacts
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-macos-neverguard-${{ github.sha }}
          path: guard-platform-artifacts/macos
      - name: Download Guard CI matrix
        uses: actions/download-artifact@v4
        with:
          name: neverlauncher-guard-ci-matrix-${{ github.run_id }}
          path: guard-certification
      - name: Download exact-commit Windows adversarial certificate
        uses: actions/download-artifact@v4
        with:
          name: neverguard-windows-adversarial-certificate-${{ github.sha }}
          path: windows-adversarial-certificate
      - name: Wait for exact-commit Compatibility + Device Trust certifications
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/release/fetch-exact-certifications.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --version "$VERSION" \
            --token "$GITHUB_TOKEN" \
            --output-dir external-certifications \
            --timeout-seconds 1200 \
            --poll-seconds 15
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libtss2-dev openssl
      - name: Load approved production release signing identity (never ephemeral)
        shell: bash
        env:
          PRODUCTION_RELEASE_SIGNING_KEY: ${{ secrets.NL_PRODUCTION_RELEASE_PRIVATE_KEY_PEM }}
          PRODUCTION_RELEASE_ROOT_PUBLIC_KEY: ${{ secrets.NL_PRODUCTION_RELEASE_ROOT_PUBLIC_KEY_PEM }}
          PRODUCTION_RELEASE_TRUST_POLICY: ${{ secrets.NL_PRODUCTION_RELEASE_TRUST_POLICY_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRODUCTION_RELEASE_SIGNING_KEY"
          test -n "$PRODUCTION_RELEASE_ROOT_PUBLIC_KEY"
          test -n "$PRODUCTION_RELEASE_TRUST_POLICY"
          printf '%s\n' "$PRODUCTION_RELEASE_SIGNING_KEY" > /tmp/neverlauncher-release-private.pem
          printf '%s\n' "$PRODUCTION_RELEASE_ROOT_PUBLIC_KEY" > /tmp/neverlauncher-release-root-public.pem
          printf '%s\n' "$PRODUCTION_RELEASE_TRUST_POLICY" > /tmp/neverlauncher-release-trust-policy.json
          openssl pkey -in /tmp/neverlauncher-release-private.pem -noout >/dev/null
          openssl pkey -pubin -in /tmp/neverlauncher-release-root-public.pem -noout >/dev/null
          jq -e '.schemaVersion and .trustDomain' /tmp/neverlauncher-release-trust-policy.json >/dev/null
      - name: Download historical 0.25.0 Optional Components GA evidence packages
        if: inputs.optional_components_ga_evidence_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: optional-components-ga-0250-*
          run-id: ${{ inputs.optional_components_ga_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: optional-components-ga-0250-raw
          merge-multiple: false
      - name: Require exactly six historical Optional Components platform folders
        if: inputs.optional_components_ga_evidence_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p optional-components-ga-0250
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            source="optional-components-ga-0250-raw/optional-components-ga-0250-${target}"
            test -d "$source"
            mv "$source" "optional-components-ga-0250/$target"
          done
      - name: Build and cryptographically verify complete release bundle
        env:
          NEVERLAUNCHER_RELEASE_SIGNING_PRIVATE_KEY_FILE: /tmp/neverlauncher-release-private.pem
          NEVERLAUNCHER_RELEASE_ROOT_PUBLIC_KEY_FILE: /tmp/neverlauncher-release-root-public.pem
          NEVERLAUNCHER_RELEASE_TRUST_POLICY_FILE: /tmp/neverlauncher-release-trust-policy.json
          NEVERLAUNCHER_RELEASE_TRUST_STATE_FILE: /tmp/neverlauncher-release-trust-state.json
          NEVERLAUNCHER_COMPATIBILITY_MATRIX_FILE: ${{ github.workspace }}/external-certifications/compatibility/matrix.json
          NEVERLAUNCHER_COMPATIBILITY_TARGETS_FILE: ${{ github.workspace }}/compatibility/targets.json
          NEVERLAUNCHER_DEVICE_TRUST_MATRIX_FILE: ${{ github.workspace }}/external-certifications/device-trust/matrix.json
          NEVERLAUNCHER_DEVICE_TRUST_TARGETS_FILE: ${{ github.workspace }}/device-trust/targets.json
          NEVERLAUNCHER_GUARD_CI_MATRIX_FILE: ${{ github.workspace }}/guard-certification/matrix.json
          NEVERLAUNCHER_GUARD_CI_TARGETS_FILE: ${{ github.workspace }}/guard-certification/targets.json
          NEVERLAUNCHER_GUARD_PLATFORM_ARTIFACTS_DIR: ${{ github.workspace }}/guard-platform-artifacts
          NEVERLAUNCHER_WINDOWS_SIGNED_ARTIFACTS_DIR: ${{ github.workspace }}/windows-production-artifacts
          NEVERLAUNCHER_LINUX_PRODUCTION_ARTIFACTS_DIR: ${{ github.workspace }}/linux-production-artifacts
          NEVERLAUNCHER_MACOS_PRODUCTION_ARTIFACTS_DIR: ${{ github.workspace }}/macos-production-artifacts
          NEVERLAUNCHER_MANAGED_JRE_ARTIFACTS_DIR: ${{ github.workspace }}/managed-jre-artifacts
          NEVERLAUNCHER_WINDOWS_ADVERSARIAL_CERTIFICATE_FILE: ${{ github.workspace }}/windows-adversarial-certificate/WINDOWS_ADVERSARIAL_CERTIFICATE.json
          NEVERLAUNCHER_SOURCE_COMMIT: ${{ github.sha }}
          NEVERLAUNCHER_COMPONENT_GA_ATTESTATIONS_DIR: ${{ github.workspace }}/optional-components-ga-0250
          NEVERLAUNCHER_COMPONENT_GA_PUBLIC_KEY: ${{ vars.NEVERLAUNCHER_COMPONENT_GA_PUBLIC_KEY }}
          NEVERLAUNCHER_OFFICIAL_GA_ATTESTATIONS_DIR: ${{ github.workspace }}/official-minecraft-ga-0270
          NEVERLAUNCHER_OFFICIAL_GA_PUBLIC_KEY: ${{ vars.NEVERLAUNCHER_OFFICIAL_GA_PUBLIC_KEY }}
        run: bash scripts/release/build-release.sh
      - name: Assert required production artifacts
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DIR="dist/release-${VERSION}"
          test -s "${DIR}/SHA256SUMS.sig"
          test -s "${DIR}/OFFICIAL_MINECRAFT_GA_CERTIFICATION.json"
          jq -e --arg commit "$GITHUB_SHA" '.schemaVersion == "neverlauncher.official-minecraft.ga-receipt.v1" and .status == "passed" and .commit == $commit and .productVersion == "0.27.0" and (.targets | length) == 6 and all(.targets[]; .status == "passed")' "${DIR}/OFFICIAL_MINECRAFT_GA_CERTIFICATION.json" >/dev/null
          test -s "${DIR}/PROVENANCE.json.sig"
          test -s "${DIR}/RELEASE_TRUST_POLICY.json"
          test -s "${DIR}/COMPATIBILITY_TARGETS.json"
          test -s "${DIR}/COMPATIBILITY_MATRIX.json"
          test -s "${DIR}/COMPATIBILITY_CERTIFICATION.json"
          test -s "${DIR}/LOADER_COMPATIBILITY_RELEASE_CERTIFICATE.json"
          jq -e '.status == "ga-certified" and .releaseStage == "ga" and .requiredTargetCount == 292 and .passedTargetCount == 292 and .runtimeSupportEntries == 163 and (.runtimeSupportSha256 | length == 64) and (.legacyForgeVersions == ["1.7.10","1.12.2"]) and .invariants.gaRuntimeSupportEnforced == true and .invariants.legacyForgeGA == true and (.certificateId | startswith("sha256:"))' "${DIR}/LOADER_COMPATIBILITY_RELEASE_CERTIFICATE.json" >/dev/null
          jq -e '.loaderCompatibilityReleaseCertified == true and .loaderCompatibilityGA == true and (.loaderCompatibilityReleaseCertificateSha256 | length == 64) and (.loaderCompatibilityGASupportSha256 | length == 64)' "${DIR}/RELEASE_MANIFEST.json" >/dev/null
          jq -e '.schemaVersion == "2.0" and .trustDomain == "neverlauncher.release.v2" and .trustEpoch >= 1' "${DIR}/SHA256SUMS.sig" >/dev/null
          test -s "${DIR}/neverlauncher-desktop-linux-amd64"
          test -s "${DIR}/neverguard-linux-amd64"
          test -s "${DIR}/GUARD_RELEASE_ALLOWLIST_LINUX.json"
          test -s "${DIR}/neverlauncher-cli-linux-x64"
          test -s "${DIR}/neverlauncher-cli-linux-arm64"
          test -s "${DIR}/neverlauncher-api-linux-x64"
          test -s "${DIR}/neverlauncher-api-linux-arm64"
          test -s "${DIR}/neverlauncher-desktop-linux-x64"
          test -s "${DIR}/neverlauncher-desktop-linux-arm64"
          test -s "${DIR}/neverguard-linux-x64"
          test -s "${DIR}/neverguard-linux-arm64"
          test -s "${DIR}/neverruntime-linux-x64"
          test -s "${DIR}/neverruntime-linux-arm64"
          test -s "${DIR}/neverlauncher-linux-x64-${VERSION}.tar.gz"
          test -s "${DIR}/neverlauncher-linux-arm64-${VERSION}.tar.gz"
          test -s "${DIR}/LINUX_PACKAGE_MANIFEST_X64.json"
          test -s "${DIR}/LINUX_PACKAGE_MANIFEST_ARM64.json"
          test -s "${DIR}/LINUX_PRODUCTION_EVIDENCE.json"
          test -s "${DIR}/GUARD_RELEASE_ALLOWLIST_LINUX_DELIVERY.json"
          test -s "${DIR}/neverlauncher-desktop-${VERSION}-windows-amd64.zip"
          test -s "${DIR}/neverguard-windows-amd64.exe"
          test -s "${DIR}/WINDOWS_PACKAGE_MANIFEST.json"
          test -s "${DIR}/neverlauncher-cli-windows-x64.exe"
          test -s "${DIR}/neverlauncher-cli-windows-arm64.exe"
          test -s "${DIR}/neverlauncher-desktop-windows-x64.exe"
          test -s "${DIR}/neverlauncher-desktop-windows-arm64.exe"
          test -s "${DIR}/neverguard-windows-x64.exe"
          test -s "${DIR}/neverguard-windows-arm64.exe"
          test -s "${DIR}/neverguard-sensor-windows-x64.dll"
          test -s "${DIR}/neverguard-sensor-windows-arm64.dll"
          test -s "${DIR}/neverlauncher-desktop-${VERSION}-windows-x64.zip"
          test -s "${DIR}/neverlauncher-desktop-${VERSION}-windows-arm64.zip"
          test -s "${DIR}/WINDOWS_PACKAGE_MANIFEST_X64.json"
          test -s "${DIR}/WINDOWS_PACKAGE_MANIFEST_ARM64.json"
          test -s "${DIR}/GUARD_RELEASE_ALLOWLIST_WINDOWS_DELIVERY.json"
          test -s "${DIR}/WINDOWS_SIGNING_EVIDENCE.json"
          test -s "${DIR}/WINDOWS_ADVERSARIAL_CERTIFICATE.json"
          test -s "${DIR}/WINDOWS_PROTECTION_RELEASE_CERTIFICATE.json"
          jq -e '.status == "windows-protection-release-candidate" and .protectionProfile == "aggressive" and .scenarioExecutions == 55 and (.javaMajors == [8,16,17,21,25]) and (.boundarySha256 | length == 64) and (.certificateId | startswith("sha256:")) and .invariants.publishedWindowsBytesBound == true and .invariants.x64Arm64AuthenticodeCertified == true' "${DIR}/WINDOWS_PROTECTION_RELEASE_CERTIFICATE.json" >/dev/null
          jq -e '.windowsProtectionReleaseCertified == true and (.windowsProtectionReleaseCertificateSha256 | length == 64) and (.windowsAdversarialCertificateSha256 | length == 64)' "${DIR}/RELEASE_MANIFEST.json" >/dev/null
          test -s "${DIR}/WINDOWS_PROTECTION_GA_CERTIFICATE.json"
          jq -e '.status == "windows-protection-ga" and .releaseStage == "ga" and .protectionModel == "user-mode" and .protectionProfile == "aggressive" and .enforcementMode == "fail-closed" and .scenarioExecutions == 55 and (.javaMajors == [8,16,17,21,25]) and (.boundarySha256 | length == 64) and (.certificateId | startswith("sha256:")) and .invariants.kernelDriverAbsent == true and .invariants.userModeProtectionBoundary == true and .invariants.continuousAttestationV2Required == true and .invariants.oneTimeServerJoinTicketRequired == true' "${DIR}/WINDOWS_PROTECTION_GA_CERTIFICATE.json" >/dev/null
          jq -e '.windowsProtectionGACertified == true and (.windowsProtectionGACertificateSha256 | length == 64)' "${DIR}/RELEASE_MANIFEST.json" >/dev/null
          test -s "${DIR}/neverlauncher-desktop-${VERSION}-macos-universal.zip"
          test -s "${DIR}/neverguard-macos-universal"
