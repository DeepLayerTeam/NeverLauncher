name: Развёртывание нескольких узлов 0.51.2 — регрессия
on:
  push:
    paths:
      - 'scripts/operations/multi_host_0512.py'
      - 'scripts/operations/test_multi_host_0512.py'
      - 'scripts/operations/ha_inventory_0511.py'
      - 'scripts/operations/test_ha_inventory_0511.py'
      - 'deploy/production/docker-compose.multi-host.yml'
      - 'deploy/production/nginx.multi-host-0512.conf'
      - '.github/workflows/multi-host-deployment-0512.yml'
  pull_request:
    paths:
      - 'scripts/operations/multi_host_0512.py'
      - 'scripts/operations/test_multi_host_0512.py'
      - 'scripts/operations/ha_inventory_0511.py'
      - 'scripts/operations/test_ha_inventory_0511.py'
      - 'deploy/production/docker-compose.multi-host.yml'
      - 'deploy/production/nginx.multi-host-0512.conf'
      - '.github/workflows/multi-host-deployment-0512.yml'
jobs:
  validate-multi-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Проверить реализацию на Python и регрессии безопасности"
        run: |
          python -m pip install 'PyYAML==6.0.3'
          python -m unittest discover -s scripts/operations -p 'test_ha_inventory_0511.py' -v
          python -m unittest discover -s scripts/operations -p 'test_multi_host_0512.py' -v
      - name: Определить реальную топологию Compose v2 без обращений к внешним службам
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/production
          export TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR" .env' EXIT
          printf 'not-a-real-cert\n' > "$TMPDIR/fullchain.pem"
          printf 'not-a-real-key\n' > "$TMPDIR/privkey.pem"
          chmod 600 "$TMPDIR/privkey.pem"
          cat > .env <<EOF
          LAUNCHER_NODE_ID=ci-node
          LAUNCHER_INGRESS_BIND_IP=10.0.0.10
          LAUNCHER_API_IMAGE=registry.example/launcher-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          LAUNCHER_ADMIN_IMAGE=registry.example/launcher-admin@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          LAUNCHER_NGINX_IMAGE=registry.example/nginx@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          LAUNCHER_INIT_IMAGE=registry.example/alpine@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          LAUNCHER_DATABASE_DSN=postgres://test:test@pg.internal:5432/launcher?sslmode=verify-full
          LAUNCHER_REDIS_URL=rediss://:test@redis.internal:6379/0
          LAUNCHER_STORAGE_S3_ENDPOINT=https://s3.internal
          LAUNCHER_STORAGE_S3_BUCKET=test
          LAUNCHER_STORAGE_S3_REGION=eu-west-1
          LAUNCHER_STORAGE_S3_ACCESS_KEY=test
          LAUNCHER_STORAGE_S3_SECRET_KEY=test
          LAUNCHER_PUBLIC_URL=https://launcher.example
          LAUNCHER_AUTH_TOKEN_SECRET=test-only-not-a-production-secret
          LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY=test
          LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON=[]
          LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON=[]
          LAUNCHER_WEBAUTHN_RP_ID=launcher.example
          LAUNCHER_WEBAUTHN_ORIGINS=https://launcher.example
          LAUNCHER_CORS_ALLOWED_ORIGINS=https://launcher.example
          LAUNCHER_TLS_CERT_PATH=$TMPDIR/fullchain.pem
          LAUNCHER_TLS_KEY_PATH=$TMPDIR/privkey.pem
          EOF
          chmod 600 .env
          docker compose -f docker-compose.multi-host.yml config --quiet
          docker compose -f docker-compose.multi-host.yml config --format json > "$TMPDIR/compose.json"
          python - "$TMPDIR/compose.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert set(d['services']) == {'volume-init','api','worker','admin','ingress'}
          assert d['services']['api']['environment']['LAUNCHER_REPLICA_ID'] == 'ci-node-api'
          assert d['services']['worker']['environment']['LAUNCHER_REPLICA_ID'] == 'ci-node-worker'
          assert not d['services']['api'].get('ports') and not d['services']['worker'].get('ports')
          PY
