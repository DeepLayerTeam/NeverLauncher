name: Инвентаризация приёмки 0.52.1 — регрессия целостности
on:
  push:
    paths:
      - 'scripts/acceptance/**'
      - 'scripts/compatibility/matrix.py'
      - 'scripts/compatibility/test_matrix.py'
      - 'compatibility/targets.json'
      - 'serverbridge/targets.json'
      - 'guard-ci/targets.json'
      - 'device-trust/targets.json'
      - 'e2e/scripts/run-compatibility-case.sh'
      - '.github/workflows/compatibility.yml'
      - '.github/workflows/acceptance-inventory-0521.yml'
      - 'VERSION'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verifier dependency
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Check actual-client script syntax
        run: bash -n e2e/scripts/run-compatibility-case.sh
      - name: Run mandatory 0.52.1 signature, log and tamper regressions
        run: python3 -m unittest discover -s scripts/acceptance -p 'test_*_0521.py' -v
      - name: Check real catalog coverage and fail closed without real execution
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acceptance"
          if python3 scripts/acceptance/inventory_0521.py inventory \
            --results-root "$RUNNER_TEMP/no-live-runs" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/acceptance/inventory.json"; then
            echo 'ERROR: synthetic/no-run acceptance unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/acceptance/inventory.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          assert doc['status']=='BLOCKED'
          assert doc['counts']=={'required':322,'observed':0,'blocked':322,'optional':12}
          PY
