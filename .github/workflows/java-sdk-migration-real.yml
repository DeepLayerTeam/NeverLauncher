name: NeverLauncher 0.52.8 — настоящие E2E-тесты миграции Java SDK
on:
  push:
    paths:
      - 'VERSION'
      - 'sdk/java/**'
      - 'sdk/api/**'
      - 'tools/gravit-port/**'
      - 'scripts/acceptance/*0528.py'
      - '.github/workflows/java-sdk-migration-real-0528.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'sdk/java/**'
      - 'sdk/api/**'
      - 'tools/gravit-port/**'
      - 'scripts/acceptance/*0528.py'
      - '.github/workflows/java-sdk-migration-real-0528.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/api/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Установка зафиксированной версии компилятора TypeScript"
        working-directory: sdk/api/typescript
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund --save-dev-exact typescript@5.8.3
      - name: Run production SDK and five real Java-subprocess regressions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/version/manage.py check
          python3 scripts/acceptance/java_sdk_migration_0528.py local \
            --report "$RUNNER_TEMP/local-0528.json"
          python3 - "$RUNNER_TEMP/local-0528.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['status']=='LOCAL_REGRESSIONS_NOT_GA'
          assert result['gaCertified'] is False and len(result['checks']) == 8
          PY
      # The local report has hashes only; it is NOT published as a GA pass.
  independent-live:
    needs: production-regression
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, migration-ga-isolated, neverlauncher-0528]
    environment: neverlauncher-0528-independent-acceptance
    timeout-minutes: 180
    env:
      NL0528_CONFIG: ${{ vars.NL0528_CONFIG }}
      NL0528_JAVA_HOST_TOKEN: ${{ secrets.NL0528_JAVA_HOST_TOKEN }}
      NL0528_OWNER_TOKEN: ${{ secrets.NL0528_OWNER_TOKEN }}
      NL0528_TEST_PASSWORD: ${{ secrets.NL0528_TEST_PASSWORD }}
      LAUNCHER_MIGRATION_GA_TOKEN: ${{ secrets.LAUNCHER_MIGRATION_GA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require real external host and exact pinned source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${NL0528_CONFIG:-}"
          test "${NL0528_CONFIG#/}" != "$NL0528_CONFIG"
          test -f "$NL0528_CONFIG"
          test -n "${NL0528_JAVA_HOST_TOKEN:-}"
          test -n "${NL0528_OWNER_TOKEN:-}"
          test -n "${NL0528_TEST_PASSWORD:-}"
          test -n "${LAUNCHER_MIGRATION_GA_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - "$NL0528_CONFIG" "$GITHUB_SHA" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1]))
          assert doc.get('sourceCommit') == sys.argv[2]
          PY
      - name: Execute installed JVM Host, 3 live Gravit projects and two historical upgrades
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "$RUNNER_TEMP/nl0528-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/acceptance/java_sdk_migration_0528.py live \
            --config "$NL0528_CONFIG" \
            --report "$RUNNER_TEMP/nl0528-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/live-0528.json"
      # Private migration reports, player UUIDs, source archives and Host tokens
      # remain on the controlled runner. Independent review/signature is separate.
