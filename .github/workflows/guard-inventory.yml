name: Guard 0.50.1 — нативная инвентаризация (диагностика, не сертификация игры)
on:
  push:
    paths:
      - 'runtime/runtime/**'
      - 'scripts/guard_ci/inventory.py'
      - 'scripts/guard_ci/test_inventory.py'
      - '.github/workflows/guard-inventory.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'runtime/runtime/**'
      - 'scripts/guard_ci/inventory.py'
      - 'scripts/guard_ci/test_inventory.py'
      - '.github/workflows/guard-inventory.yml'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"

jobs:
  native-inventory:
    name: '${{ matrix.target }} / реальная диагностика IPC Guard'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-2022 }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: macos-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Сборка настоящих Guard и Runtime (без тестовых подмен)
        run: cargo build --manifest-path runtime/runtime/Cargo.toml --bins
      - name: Запуск локальных тестов инвентаризации Rust
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --lib guard_inventory_0501
      - name: Тест настоящего дочернего процесса Guard в Linux и аутентифицированного IPC
        if: runner.os == 'Linux'
        run: cargo test --manifest-path runtime/runtime/Cargo.toml --test guard_inventory_0501 -- --nocapture
      - name: Проверка принципа запрета при ошибке при обработке матрицы
        run: python scripts/guard_ci/test_inventory.py
      - name: Проверка аутентифицированного IPC Guard и экспорт фактического результата
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python scripts/guard_ci/inventory.py local \
            --runtime "runtime/runtime/target/debug/runtime${suffix}" \
            --guard "runtime/runtime/target/debug/guard${suffix}" \
            --output "guard-inventory-${{ matrix.target }}.json"
      - name: Загрузка фактической локальной диагностики (заблокировано не означает успешную проверку)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-inventory-${{ matrix.target }}
          path: guard-inventory-${{ matrix.target }}.json
          if-no-files-found: warn
  combine-observations:
    runs-on: ubuntu-24.04
    needs: native-inventory
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: guard-inventory-*
          path: guard-inventory-native
          merge-multiple: true
        continue-on-error: true
      - name: Объединение реальных отчётов ОС и ЦП (отсутствующие помечаются заблокировано)
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          reports = sorted(Path('guard-inventory-native').glob('guard-inventory-*.json'))
          sys.exit(subprocess.call([sys.executable, 'scripts/guard_ci/inventory.py', 'matrix', '--output', 'guard-inventory-matrix-0501.json', *map(str, reports)]))
          PY
      - name: Публикация матрицы без статуса сертификации
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-inventory-matrix-0501
          path: guard-inventory-matrix-0501.json
          if-no-files-found: warn
