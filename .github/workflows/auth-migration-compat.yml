name: Миграция авторизации и совместимость 0.29.11
on:
  push:
    paths:
      - 'cli/**'
      - 'services/api/internal/dbmigrate/**'
      - '.github/workflows/auth-migration-compat.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'services/api/internal/dbmigrate/**'
      - '.github/workflows/auth-migration-compat.yml'
permissions:
  contents: read
jobs:
  auth-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: launcher
          POSTGRES_USER: launcher
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U launcher -d launcher" --health-interval 5s --health-timeout 5s --health-retries 25
    env:
      LAUNCHER_DATABASE_DSN: postgres://launcher:integration-only@localhost:5432/launcher?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: "Проверить встроенный каталог и тесты обновления"
        working-directory: cli
        run: |
          go test -race ./internal/authupgrade ./internal/dbmigrate
          go vet ./internal/authupgrade ./internal/dbmigrate
          go build -o /tmp/nl-upgrade ./cmd/launcher
      - name: "Воспроизвести обновление из точного каталога миграций 0.29.10"
        run: |
          # Историческая база должна содержать только миграции до 0086,
          # с исходными именами и неизменёнными байтами встроенного каталога.
          cp -a cli /tmp/nl-cli-prior
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          path = Path('/tmp/nl-cli-prior/internal/dbmigrate/catalog.zip')
          temp = path.with_suffix('.tmp')
          with zipfile.ZipFile(path) as source, zipfile.ZipFile(temp, 'w') as target:
              entries = [i for i in source.infolist() if int(i.filename.split('/')[1].split('_')[0]) < 86]
              assert entries and len(entries) < len(source.infolist())
              assert any(i.filename.startswith('sql/0085_') for i in entries)
              for entry in entries:
                  target.writestr(entry, source.read(entry))
          temp.replace(path)
          PYCODE
          (cd /tmp/nl-cli-prior && go build -o /tmp/nl-prior ./cmd/launcher)
          /tmp/nl-prior db migrate apply
      - name: "Создать данные двух изолированных издателей до обновления"
        run: |
          psql "$LAUNCHER_DATABASE_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO users(id,email,display_name,role_id,password_hash)
          VALUES ('migration-a','migration-a@example.invalid','Migration_A','player',''),('migration-b','migration-b@example.invalid','Migration_B','player','');
          INSERT INTO auth_identities(id,user_id,provider,issuer,subject,email,username,display_name,claims)
          VALUES
            ('migration-id-a','migration-a','oidc-smoke','https://issuer-a.example.invalid','shared-subject','shared@example.invalid','Migration_A','Migration_A','{}'::jsonb),
            ('migration-id-b','migration-b','oidc-smoke','https://issuer-b.example.invalid','shared-subject','shared@example.invalid','Migration_B','Migration_B','{}'::jsonb);
          INSERT INTO minecraft_profiles(user_id,uuid,name,issuer,realm,subject,identity_version)
          VALUES ('migration-a','7e58de9e-6dde-40ea-bfe6-16c85ae32971','Migration_A','launcher','local','7e58de9e-6dde-40ea-bfe6-16c85ae32971','legacy-migration'),
                 ('migration-b','7e58de9e-6dde-40ea-bfe6-16c85ae32972','Migration_B','launcher','local','7e58de9e-6dde-40ea-bfe6-16c85ae32972','legacy-migration');
          COMMIT;
          SQL
      - name: "Проверить контрольную точку, применение и верификацию PostgreSQL"
        run: |
          /tmp/nl-upgrade db auth-upgrade preflight --snapshot /tmp/nl-identity.json --allow-provider oidc-smoke
          /tmp/nl-upgrade db auth-upgrade apply --snapshot /tmp/nl-identity.json --backup-confirmed --maintenance-confirmed
          /tmp/nl-upgrade db auth-upgrade verify --snapshot /tmp/nl-identity.json
          # Даже привилегированный UPDATE не должен переназначать существующий субъект или UUID GameProfile.
          if psql "$LAUNCHER_DATABASE_DSN" -v ON_ERROR_STOP=1 -c "UPDATE auth_identities SET issuer='https://malicious.invalid' WHERE id='migration-id-a'"; then exit 1; fi
          if psql "$LAUNCHER_DATABASE_DSN" -v ON_ERROR_STOP=1 -c "UPDATE minecraft_profiles SET uuid='7e58de9e-6dde-40ea-bfe6-16c85ae32973' WHERE user_id='migration-a'"; then exit 1; fi
          # Локальный дрейф данных должен выявляться автономной контрольной точкой.
          psql "$LAUNCHER_DATABASE_DSN" -v ON_ERROR_STOP=1 -c "UPDATE users SET display_name='Changed' WHERE id='migration-a'"
          if /tmp/nl-upgrade db auth-upgrade verify --snapshot /tmp/nl-identity.json; then exit 1; fi
      - name: "Проверить побайтовое соответствие каталогов Backend и CLI"
        run: |
          python3 scripts/build/embedded_cli_assets.py --check
