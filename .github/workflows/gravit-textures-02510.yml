name: Gravit TextureProvider migration 0.25.10
on:
  push:
    paths:
      - 'services/api/internal/texturegravit/**'
      - 'services/api/internal/repository/textures_gravit_02510.go'
      - 'services/api/internal/repository/textures_0252.go'
      - 'services/api/internal/storage/gravit_source_02510.go'
      - 'services/api/cmd/gravit-textures-import-02510/**'
      - 'services/api/internal/dbmigrate/sql/0073_texture_gravit_import_02510.sql'
      - '.github/workflows/gravit-textures-02510.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texture-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/api/go.sum
      - name: Compile migration CLI and run texture regression tests
        working-directory: services/api
        run: |
          go test -race ./internal/texturegravit ./internal/texturepng ./internal/storage ./internal/dbmigrate ./internal/repository
          go vet ./internal/texturegravit ./cmd/gravit-textures-import-02510 ./internal/repository
          go build ./cmd/gravit-textures-import-02510
