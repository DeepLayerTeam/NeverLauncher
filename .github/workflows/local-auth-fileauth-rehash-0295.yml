name: Local Auth FileAuth Rehash 0.29.5
on:
  push:
    paths:
      - 'services/api/internal/fileauth/**'
      - 'services/api/internal/fileauthlive/**'
      - 'services/api/internal/httpapi/fileauth_live_0426_test.go'
      - 'services/api/internal/localpassword/**'
      - 'services/api/internal/httpapi/federation_112.go'
      - 'services/api/internal/httpapi/auth.go'
      - 'services/api/internal/repository/local_auth_0295*'
      - 'services/api/cmd/local-auth-0295/**'
      - '.github/workflows/local-auth-fileauth-rehash-0295.yml'
      - 'services/api/go.*'
  pull_request:
    paths:
      - 'services/api/internal/fileauth/**'
      - 'services/api/internal/fileauthlive/**'
      - 'services/api/internal/httpapi/fileauth_live_0426_test.go'
      - 'services/api/internal/localpassword/**'
      - 'services/api/internal/httpapi/federation_112.go'
      - 'services/api/internal/httpapi/auth.go'
      - 'services/api/internal/repository/local_auth_0295*'
      - 'services/api/cmd/local-auth-0295/**'
      - '.github/workflows/local-auth-fileauth-rehash-0295.yml'
      - 'services/api/go.*'
permissions:
  contents: read
jobs:
  real-local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: launcher_auth0295
          POSTGRES_USER: launcher
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launcher -d launcher_auth0295" --health-interval 5s --health-timeout 5s --health-retries 25
    defaults:
      run:
        working-directory: services/api
    env:
      LAUNCHER_TEST_POSTGRES_DSN: postgres://launcher:integration-only@localhost:5432/launcher_auth0295?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Verify Go formatting
        run: test -z "$(gofmt -l internal/fileauth internal/fileauthlive internal/localpassword internal/repository/local_auth_0295* internal/httpapi/local_auth_0295_test.go internal/httpapi/federation_112.go internal/httpapi/auth.go cmd/local-auth-0295)"
      - name: Real FileAuth parser / hash vectors and legacy password login
        run: go test -race -count=1 -timeout=8m ./internal/fileauth ./internal/localpassword ./internal/httpapi -run '(0295|0426)$'
      - name: Live FileAuth provider and HTTP federation integration
        run: go test -race -count=1 -timeout=8m ./internal/fileauth ./internal/fileauthlive ./internal/httpapi -run '0426$'
      - name: PostgreSQL atomic import, UUID, collision and CAS integration
        run: go test -count=1 -timeout=8m ./internal/repository -run '^TestFileAuthImportPostgres0295$' -v
      - name: Compile CLI and Backend
        run: go build ./cmd/local-auth-0295 ./cmd/launcher-api
      - name: Core regression tests
        run: go test -count=1 -timeout=8m ./internal/federation ./internal/repository ./internal/httpapi
