    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    ports:
      - "25578:25565"
    volumes:
      - ./runtime/plugins/forge:/mods:ro
      - ./runtime/node-identities/forge:/data/.launcher-identity
      - forge-data:/data

  neoforge:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.251"
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: neoforge-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /data/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    ports:
      - "25579:25565"
    volumes:
      - ./runtime/plugins/neoforge:/mods:ro
      - ./runtime/node-identities/neoforge:/data/.launcher-identity
      - neoforge-data:/data

  loader-native:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: ${LAUNCHER_E2E_NATIVE_SERVER_TYPE:-VANILLA}
      VERSION: ${LAUNCHER_E2E_NATIVE_MINECRAFT_VERSION:-1.21.1}
      FABRIC_LOADER_VERSION: ${LAUNCHER_E2E_NATIVE_LOADER_VERSION:-}
      QUILT_LOADER_VERSION: ${LAUNCHER_E2E_NATIVE_LOADER_VERSION:-}
      FORGE_VERSION: ${LAUNCHER_E2E_NATIVE_LOADER_VERSION:-}
      NEOFORGE_VERSION: ${LAUNCHER_E2E_NATIVE_LOADER_VERSION:-}
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      ENABLE_AUTOPAUSE: "false"
      ENABLE_AUTOSTOP: "false"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      MOTD: "Launcher loader-native E2E"
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 150s
    ports:
      - "25580:25565"
    volumes:
      - ./runtime/loader-native-server:/data

volumes:
  e2e-postgres: {}
  e2e-storage: {}
  e2e-backups: {}
  velocity-data: {}
  bungeecord-data: {}
  waterfall-data: {}
  spigot-data: {}
  paper-data: {}
  purpur-data: {}
  folia-data: {}
  fabric-data: {}
  forge-data: {}
  neoforge-data: {}
