services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launcher
      POSTGRES_USER: launcher
      POSTGRES_PASSWORD: launcher
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launcher -d launcher"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - e2e-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${LAUNCHER_E2E_REDIS_PASSWORD}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-volume-init:
    image: alpine:3.20
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /storage/current /backups
        find /storage -mindepth 1 -maxdepth 1 ! -name current -exec sh -c 'for p do mv "$$p" /storage/current/; done' sh {} +
        chown -R 10001:10001 /storage /backups
        chmod 0750 /storage /storage/current /backups
    volumes:
      - e2e-storage:/storage
      - e2e-backups:/backups

  launcher-api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      args:
        LAUNCHER_VERSION: ${LAUNCHER_E2E_VERSION:-dev}
    environment:
      LAUNCHER_ENV: e2e-production
      LAUNCHER_HTTP_ADDR: 0.0.0.0:8080
      LAUNCHER_REPOSITORY_DRIVER: postgres
      LAUNCHER_SQL_DRIVER: pgx
      LAUNCHER_DATABASE_DSN: postgres://launcher:launcher@postgres:5432/launcher?sslmode=disable
      LAUNCHER_DATABASE_AUTO_MIGRATE: "false"
      LAUNCHER_PUBLIC_URL: http://127.0.0.1:18080
      LAUNCHER_STORAGE_DRIVER: local
      LAUNCHER_STORAGE_LOCAL_PATH: /var/lib/launcher/storage/current
      LAUNCHER_BACKUP_ROOT: /var/lib/launcher/backups
      LAUNCHER_CORS_ALLOWED_ORIGINS: https://e2e.invalid
      LAUNCHER_AUTH_TOKEN_SECRET: ${LAUNCHER_E2E_AUTH_SECRET}
      LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: '{"schemaVersion":"2.0","releases":{"0.14.0":{"protocolVersion":4,"platforms":{"windows":{"signingMode":"authenticode","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","requireAuthenticode":true}]},"linux":{"signingMode":"integrity-only","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]},"macos":{"signingMode":"developer-id-notarized","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]}}}}}'
      LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: ${LAUNCHER_E2E_BRIDGE_RELEASE_ALLOWLIST_JSON}
      LAUNCHER_BOOTSTRAP_TOKEN: ${LAUNCHER_E2E_BOOTSTRAP_TOKEN}
      LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: ${LAUNCHER_E2E_SIGNING_SEED}
      LAUNCHER_REDIS_URL: redis://:${LAUNCHER_E2E_REDIS_PASSWORD}@redis:6379/0
      LAUNCHER_RATE_LIMIT_ENABLED: "true"
      LAUNCHER_RATE_LIMIT_FAIL_CLOSED: "true"
      LAUNCHER_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      LAUNCHER_PERSISTENT_SESSIONS: "true"
      LAUNCHER_REQUIRE_PERSISTENT_STORE_IN_PRODUCTION: "true"
    ports:
      - "18080:8080"
    depends_on:
      api-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - e2e-storage:/var/lib/launcher/storage
      - e2e-backups:/var/lib/launcher/backups

  velocity:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: "3.4.0"
      MEMORY: 384m
      PUID: ${LAUNCHER_E2E_HOST_UID:-1000}
      PGID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: velocity-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /server/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/health.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - "25570:25577"
    volumes:
      - ./runtime/plugins/velocity:/plugins:ro
      - ./runtime/node-identities/velocity:/server/.launcher-identity
      - velocity-data:/server

  bungeecord:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: BUNGEECORD
      MEMORY: 384m
      PUID: ${LAUNCHER_E2E_HOST_UID:-1000}
      PGID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: bungeecord-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /server/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/health.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - "25575:25577"
    volumes:
      - ./runtime/plugins/bungeecord:/plugins:ro
      - ./runtime/node-identities/bungeecord:/server/.launcher-identity
      - bungeecord-data:/server

  waterfall:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: WATERFALL
      MEMORY: 384m
      PUID: ${LAUNCHER_E2E_HOST_UID:-1000}
      PGID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: waterfall-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /server/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/health.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - "25576:25577"
    volumes:
      - ./runtime/plugins/waterfall:/plugins:ro
      - ./runtime/node-identities/waterfall:/server/.launcher-identity
      - waterfall-data:/server

  spigot:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: SPIGOT
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: spigot-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /data/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
    ports:
      - "25573:25565"
    volumes:
      - ./runtime/plugins/spigot:/plugins:ro
      - ./runtime/node-identities/spigot:/data/.launcher-identity
      - spigot-data:/data

  paper:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "true"
      # Internal E2E console only; no host RCON port exposure. The world GA
      # test must request `save-all flush` and `stop`, never trust SIGTERM alone.
      RCON_PASSWORD: ${LAUNCHER_E2E_RCON_PASSWORD:?E2E private RCON password required}
      SPAWN_PROTECTION: "0"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: paper-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /data/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "25571:25565"
    volumes:
      - ./runtime/plugins/paper:/plugins:ro
      - ./runtime/node-identities/paper:/data/.launcher-identity
      - paper-data:/data

  purpur:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: PURPUR
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: purpur-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /data/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "25572:25565"
    volumes:
      - ./runtime/plugins/purpur:/plugins:ro
      - ./runtime/node-identities/purpur:/data/.launcher-identity
      - purpur-data:/data

  folia:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: FOLIA
      VERSION: "1.21.1"
      PAPER_CUSTOM_JAR: /folia-runtime/folia-1.21.1-2e7bc0721af9-paperclip.jar
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: folia-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /data/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
      LAUNCHER_RETRIES: "2"
    depends_on:
      - launcher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
    ports:
      - "25574:25565"
    volumes:
      - ./runtime/plugins/folia:/plugins:ro
      - ./runtime/node-identities/folia:/data/.launcher-identity
      - ./runtime/folia-runtime:/folia-runtime:ro
      - folia-data:/data

  fabric:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.16.14"
      MODRINTH_PROJECTS: fabric-api
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      UID: ${LAUNCHER_E2E_HOST_UID:-1000}
      GID: ${LAUNCHER_E2E_HOST_GID:-1000}
      LAUNCHER_BACKEND_URL: http://launcher-api:8080
      LAUNCHER_CONTROL_BACKEND_PUBLIC_KEY: ${LAUNCHER_E2E_CONTROL_PUBLIC_KEY:?E2E control signing key is required}
      LAUNCHER_SERVER_ID: fabric-e2e-p3
      LAUNCHER_NODE_IDENTITY_FILE: /data/.launcher-identity/node-identity.properties
      LAUNCHER_PROJECT_ID: e2e-project
      LAUNCHER_PROFILE_ID: ${LAUNCHER_E2E_PROFILE_ID:-vanilla}
      LAUNCHER_CHANNEL: stable
      LAUNCHER_FAIL_MODE: closed
      LAUNCHER_REQUIRE_SESSION: "true"
      LAUNCHER_TIMEOUT_MS: "5000"
