services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neverlauncher
      POSTGRES_USER: neverlauncher
      POSTGRES_PASSWORD: neverlauncher
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neverlauncher -d neverlauncher"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - e2e-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${NEVERLAUNCHER_E2E_REDIS_PASSWORD}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-volume-init:
    image: alpine:3.20
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /storage/current /backups
        find /storage -mindepth 1 -maxdepth 1 ! -name current -exec sh -c 'for p do mv "$$p" /storage/current/; done' sh {} +
        chown -R 10001:10001 /storage /backups
        chmod 0750 /storage /storage/current /backups
    volumes:
      - e2e-storage:/storage
      - e2e-backups:/backups

  neverlauncher-api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      NEVERLAUNCHER_ENV: e2e-production
      NEVERLAUNCHER_HTTP_ADDR: 0.0.0.0:8080
      NEVERLAUNCHER_REPOSITORY_DRIVER: postgres
      NEVERLAUNCHER_SQL_DRIVER: pgx
      NEVERLAUNCHER_DATABASE_DSN: postgres://neverlauncher:neverlauncher@postgres:5432/neverlauncher?sslmode=disable
      NEVERLAUNCHER_DATABASE_AUTO_MIGRATE: "false"
      NEVERLAUNCHER_PUBLIC_URL: http://127.0.0.1:18080
      NEVERLAUNCHER_STORAGE_DRIVER: local
      NEVERLAUNCHER_STORAGE_LOCAL_PATH: /var/lib/neverlauncher/storage/current
      NEVERLAUNCHER_BACKUP_ROOT: /var/lib/neverlauncher/backups
      NEVERLAUNCHER_CORS_ALLOWED_ORIGINS: https://e2e.invalid
      NEVERLAUNCHER_AUTH_TOKEN_SECRET: ${NEVERLAUNCHER_E2E_AUTH_SECRET}
      NEVERLAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: '{"schemaVersion":"2.0","releases":{"0.14.0":{"protocolVersion":4,"platforms":{"windows":{"signingMode":"authenticode","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","requireAuthenticode":true}]},"linux":{"signingMode":"integrity-only","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]},"macos":{"signingMode":"developer-id-notarized","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]}}}}}'
      NEVERLAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: ${NEVERLAUNCHER_E2E_BRIDGE_RELEASE_ALLOWLIST_JSON}
      NEVERLAUNCHER_BOOTSTRAP_TOKEN: ${NEVERLAUNCHER_E2E_BOOTSTRAP_TOKEN}
      NEVERLAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: ${NEVERLAUNCHER_E2E_SIGNING_SEED}
      NEVERLAUNCHER_REDIS_URL: redis://:${NEVERLAUNCHER_E2E_REDIS_PASSWORD}@redis:6379/0
      NEVERLAUNCHER_RATE_LIMIT_ENABLED: "true"
      NEVERLAUNCHER_RATE_LIMIT_FAIL_CLOSED: "true"
      NEVERLAUNCHER_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      NEVERLAUNCHER_PERSISTENT_SESSIONS: "true"
      NEVERLAUNCHER_REQUIRE_PERSISTENT_STORE_IN_PRODUCTION: "true"
    ports:
      - "18080:8080"
    depends_on:
      api-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - e2e-storage:/var/lib/neverlauncher/storage
      - e2e-backups:/var/lib/neverlauncher/backups

  velocity:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: "3.4.0"
      MEMORY: 384m
      NEVERLAUNCHER_BACKEND_URL: http://neverlauncher-api:8080
      NEVERLAUNCHER_SERVER_ID: velocity-e2e-p3
      NEVERLAUNCHER_SERVER_TOKEN: ${VELOCITY_SERVER_TOKEN:-token-not-initialized}
      NEVERLAUNCHER_PROJECT_ID: e2e-project
      NEVERLAUNCHER_PROFILE_ID: ${NEVERLAUNCHER_E2E_PROFILE_ID:-vanilla}
      NEVERLAUNCHER_CHANNEL: stable
      NEVERLAUNCHER_FAIL_MODE: closed
      NEVERLAUNCHER_REQUIRE_SESSION: "true"
      NEVERLAUNCHER_TIMEOUT_MS: "5000"
      NEVERLAUNCHER_RETRIES: "2"
    depends_on:
      - neverlauncher-api
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/health.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - "25570:25565"
    volumes:
      - ./runtime/plugins/velocity:/plugins:ro
      - velocity-data:/server

  paper:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      NEVERLAUNCHER_BACKEND_URL: http://neverlauncher-api:8080
      NEVERLAUNCHER_SERVER_ID: paper-e2e-p3
      NEVERLAUNCHER_SERVER_TOKEN: ${PAPER_SERVER_TOKEN:-token-not-initialized}
      NEVERLAUNCHER_PROJECT_ID: e2e-project
      NEVERLAUNCHER_PROFILE_ID: ${NEVERLAUNCHER_E2E_PROFILE_ID:-vanilla}
      NEVERLAUNCHER_CHANNEL: stable
      NEVERLAUNCHER_FAIL_MODE: closed
      NEVERLAUNCHER_REQUIRE_SESSION: "true"
      NEVERLAUNCHER_TIMEOUT_MS: "5000"
      NEVERLAUNCHER_RETRIES: "2"
    depends_on:
      - neverlauncher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "25571:25565"
    volumes:
      - ./runtime/plugins/paper:/plugins:ro
      - paper-data:/data

  purpur:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: PURPUR
      VERSION: "1.21.1"
      ONLINE_MODE: "FALSE"
      MEMORY: 768M
      ENABLE_RCON: "false"
      SPAWN_PROTECTION: "0"
      NEVERLAUNCHER_BACKEND_URL: http://neverlauncher-api:8080
      NEVERLAUNCHER_SERVER_ID: purpur-e2e-p3
      NEVERLAUNCHER_SERVER_TOKEN: ${PURPUR_SERVER_TOKEN:-token-not-initialized}
      NEVERLAUNCHER_PROJECT_ID: e2e-project
      NEVERLAUNCHER_PROFILE_ID: ${NEVERLAUNCHER_E2E_PROFILE_ID:-vanilla}
      NEVERLAUNCHER_CHANNEL: stable
      NEVERLAUNCHER_FAIL_MODE: closed
      NEVERLAUNCHER_REQUIRE_SESSION: "true"
      NEVERLAUNCHER_TIMEOUT_MS: "5000"
      NEVERLAUNCHER_RETRIES: "2"
    depends_on:
      - neverlauncher-api
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "25572:25565"
    volumes:
      - ./runtime/plugins/purpur:/plugins:ro
      - purpur-data:/data

volumes:
  e2e-postgres: {}
  e2e-storage: {}
  e2e-backups: {}
  velocity-data: {}
  paper-data: {}
  purpur-data: {}
