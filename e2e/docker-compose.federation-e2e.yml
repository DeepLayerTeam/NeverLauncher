x-api-env: &api-env
  LAUNCHER_ENV: e2e-production
  LAUNCHER_REPOSITORY_DRIVER: postgres
  LAUNCHER_SQL_DRIVER: pgx
  LAUNCHER_DATABASE_DSN: postgres://launcher:launcher@postgres:5432/launcher?sslmode=disable
  LAUNCHER_DATABASE_AUTO_MIGRATE: "false"
  LAUNCHER_PUBLIC_URL: http://127.0.0.1:18081
  LAUNCHER_STORAGE_DRIVER: local
  LAUNCHER_STORAGE_LOCAL_PATH: /var/lib/launcher/storage/current
  LAUNCHER_BACKUP_ROOT: /var/lib/launcher/backups
  LAUNCHER_CORS_ALLOWED_ORIGINS: https://e2e.invalid
  LAUNCHER_AUTH_TOKEN_SECRET: ${LAUNCHER_E2E_AUTH_SECRET}
  LAUNCHER_GUARD_RELEASE_ALLOWLIST_JSON: '{"schemaVersion":"2.0","releases":{"0.14.0":{"protocolVersion":4,"platforms":{"windows":{"signingMode":"authenticode","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","requireAuthenticode":true}]},"linux":{"signingMode":"integrity-only","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]},"macos":{"signingMode":"developer-id-notarized","artifacts":[{"guardSha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","launcherSha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]}}}}}'
  LAUNCHER_BRIDGE_RELEASE_ALLOWLIST_JSON: '{"0.13.5":{"velocitySha256":["cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"],"paperSha256":["dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"],"purpurSha256":["eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"]}}'
  LAUNCHER_BOOTSTRAP_TOKEN: ${LAUNCHER_E2E_BOOTSTRAP_TOKEN}
  LAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: ${LAUNCHER_E2E_SIGNING_SEED}
  LAUNCHER_REDIS_URL: redis://:${LAUNCHER_E2E_REDIS_PASSWORD}@redis:6379/0
  LAUNCHER_RATE_LIMIT_ENABLED: "true"
  LAUNCHER_RATE_LIMIT_FAIL_CLOSED: "true"
  LAUNCHER_PERSISTENT_SESSIONS: "true"
  LAUNCHER_REQUIRE_PERSISTENT_STORE_IN_PRODUCTION: "true"
  LAUNCHER_WEBAUTHN_RP_ID: 127.0.0.1
  LAUNCHER_WEBAUTHN_RP_NAME: Launcher E2E
  LAUNCHER_WEBAUTHN_ORIGINS: http://127.0.0.1:18081

x-api-common: &api-common
  build:
    context: ..
    dockerfile: services/api/Dockerfile
    args:
      LAUNCHER_VERSION: ${LAUNCHER_E2E_VERSION:-dev}
  depends_on:
    volume-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - federation-storage:/var/lib/launcher/storage
    - federation-backups:/var/lib/launcher/backups

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launcher
      POSTGRES_USER: launcher
      POSTGRES_PASSWORD: launcher
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launcher -d launcher"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - federation-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${LAUNCHER_E2E_REDIS_PASSWORD}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  volume-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /storage/current /backups && chown -R 10001:10001 /storage /backups && chmod 0750 /storage /storage/current /backups"]
    volumes:
      - federation-storage:/storage
      - federation-backups:/backups

  api-a:
    <<: *api-common
    environment:
      <<: *api-env
      LAUNCHER_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "18081:8080"

  api-b:
    <<: *api-common
    environment:
      <<: *api-env
      LAUNCHER_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "18082:8080"

  api-c:
    <<: *api-common
    environment:
      <<: *api-env
      LAUNCHER_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "18083:8080"

volumes:
  federation-postgres: {}
  federation-storage: {}
  federation-backups: {}
