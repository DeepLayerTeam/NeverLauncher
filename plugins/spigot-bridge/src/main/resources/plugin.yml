name: NeverLauncherSpigotBridge
main: ru.neverlauncher.bridge.spigot.NeverLauncherSpigotBridge
version: ${version}
api-version: '1.21'
author: SkiF4er
description: NeverLauncher ServerBridge/AuthBridge интеграционный для Spigot серверы.

commands:
  nlbridge:
    description: NeverLauncher мост диагностика и команда управления
    usage: /nlbridge <status|test|reload|diagnostics>
    permission: neverlauncher.bridge.status
permissions:
  neverlauncher.bridge.admin:
    description: Trigger NeverLauncher мост сеть диагностика
    default: op
  neverlauncher.bridge.status:
    description: Чтение NeverLauncher мост состояние
    default: op
  neverlauncher.bridge.reload:
    description: Перезагрузка NeverLauncher мост конфигурация
    default: op
  neverlauncher.bridge.diagnostics:
    description: Чтение NeverLauncher мост диагностика
    default: op
