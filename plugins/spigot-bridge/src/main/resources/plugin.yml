name: LauncherSpigotBridge
main: ru.launcher.bridge.spigot.LauncherSpigotBridge
version: ${version}
api-version: '1.21'
author: SkiF4er
description: Интеграция Launcher ServerBridge/AuthBridge для серверов Spigot.

commands:
  nlbridge:
    description: Команда диагностики и управления мостом Launcher
    usage: /nlbridge <status|test|reload|diagnostics>
    permission: launcher.bridge.status
permissions:
  launcher.bridge.admin:
    description: Запустить сетевую диагностику моста Launcher
    default: op
  launcher.bridge.status:
    description: Получить состояние моста Launcher
    default: op
  launcher.bridge.reload:
    description: Перезагрузить конфигурацию моста Launcher
    default: op
  launcher.bridge.diagnostics:
    description: Получить диагностику моста Launcher
    default: op
