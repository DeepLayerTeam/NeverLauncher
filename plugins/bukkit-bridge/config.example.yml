backend:
  url: "https://launcher.example.com"
  # Упорядоченные конечные точки HA; url остаётся резервным вариантом для одного адреса.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
  timeoutMs: 5000
  retries: 2
  heartbeatIntervalSeconds: 30
server:
  id: "bukkit-main"
identity:
  file: "node-identity.properties"
security:
  failMode: "closed"
  requireLauncherSession: true
  requireIntegrity: true
profile:
  projectId: "default"
  profileId: "vanilla"
  channel: "stable"

telemetry:
  sampleIntervalSeconds: 10
  samplingBudgetMs: 20
