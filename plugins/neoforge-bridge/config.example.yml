backend:
  url: "https://launcher.example.invalid"
  # Упорядоченные конечные точки HA. Одиночный url выше используется, только когда urls пуст.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
  timeoutMs: 5000
  retries: 2
server:
  id: "neoforge-main"
  projectId: "default"
  profileId: "neoforge"
  channel: "stable"
security:
  failMode: "closed"
  requireLauncherSession: true
  requireIntegrity: true
  identityFile: "config/launcher-neoforge-bridge/node-identity.properties"
heartbeat:
  intervalSeconds: 30

telemetry:
  sampleIntervalSeconds: 10
  samplingBudgetMs: 20
