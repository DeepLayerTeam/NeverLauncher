backend:
  url: "https://launcher.example.invalid"
  timeoutMs: 5000
  retries: 2
server:
  id: "neoforge-main"
  projectId: "default"
  profileId: "neoforge"
  channel: "stable"
security:
  failMode: "closed"
  requireLauncherSession: true
  requireIntegrity: true
  identityFile: "config/neverlauncher-neoforge-bridge/node-identity.properties"
heartbeat:
  intervalSeconds: 30
