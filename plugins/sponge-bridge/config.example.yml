backend:
  url: http://127.0.0.1:8080
  # Упорядоченный HA эндпоинты. единый URL выше является используется только когда URL является пустой.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
server:
  id: sponge-main
identity:
  file: node-identity.properties
security:
  failMode: closed
  requireLauncherSession: true
  requireIntegrity: true
control:
  backendPublicKey: ""
