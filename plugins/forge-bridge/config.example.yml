backend:
  url: "https://launcher.example.invalid"
  # Упорядоченный HA эндпоинты. единый URL выше является используется только когда URL является пустой.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
  timeoutMs: 5000
  retries: 2
server:
  id: "forge-main"
  projectId: "default"
  profileId: "forge"
  channel: "stable"
security:
  failMode: "closed"
  requireLauncherSession: true
  requireIntegrity: true
  identityFile: "config/neverlauncher-forge-bridge/node-identity.properties"
heartbeat:
  intervalSeconds: 30

telemetry:
  sampleIntervalSeconds: 10
  samplingBudgetMs: 20
