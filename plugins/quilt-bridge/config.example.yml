backend:
  url: "https://launcher.example.com"
  timeoutMs: 5000
  retries: 2
  heartbeatIntervalSeconds: 30
server:
  id: "quilt-main"
identity:
  file: "node-identity.properties"
profile:
  projectId: "default"
  profileId: "quilt"
  channel: "stable"
security:
  failMode: "closed"
  requireLauncherSession: true
  requireIntegrity: true

telemetry:
  sampleIntervalSeconds: 10
  samplingBudgetMs: 20
