# NeverLauncher Vanilla вспомогательный процесс адаптер. Сохранять RCON привязанный к loopback/firewalled.
backend:
  url: http://127.0.0.1:8080
  # Упорядоченный HA эндпоинты. единый URL выше является используется только когда URL является пустой.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
server:
  id: vanilla-main
identity:
  file: node-identity.properties
security:
  failMode: closed
  requireLauncherSession: true
  requireIntegrity: true
control:
  # Серверная часть подписание открытый ключ является обязательный для Управление API команда выполнение.
  backendPublicKey: ""
  consoleAllowlist: "say,list,whitelist,ban,ban-ip,pardon,pardon-ip,save-all,save-off,save-on,kick,time,weather,difficulty,gamerule,title,tellraw"
