# Vanilla-sidecar адаптер Launcher. Ограничивайте RCON loopback-интерфейсом и брандмауэром.
backend:
  url: http://127.0.0.1:8080
  # Упорядоченные конечные точки HA. Одиночный url выше используется, только когда urls пуст.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
server:
  id: vanilla-main
identity:
  file: node-identity.properties
security:
  failMode: closed
  requireLauncherSession: true
  requireIntegrity: true
control:
  # Для исполнения команд Control API обязателен открытый ключ подписи бэкенда.
  backendPublicKey: ""
  consoleAllowlist: "say,list,whitelist,ban,ban-ip,pardon,pardon-ip,save-all,save-off,save-on,kick,time,weather,difficulty,gamerule,title,tellraw"
