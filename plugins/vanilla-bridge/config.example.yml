# NeverLauncher Vanilla sidecar adapter. Keep RCON bound to loopback/firewalled.
backend:
  url: http://127.0.0.1:8080
  # Ordered HA endpoints. The single url above is used only when urls is empty.
  urls: "https://launcher-a.example.com,https://launcher-b.example.com"
  failoverCooldownMs: 5000
server:
  id: vanilla-main
identity:
  file: node-identity.properties
security:
  failMode: closed
  requireLauncherSession: true
  requireIntegrity: true
control:
  # Backend signing public key is required for Control API command execution.
  backendPublicKey: ""
  consoleAllowlist: "say,list,whitelist,ban,ban-ip,pardon,pardon-ip,save-all,save-off,save-on,kick,time,weather,difficulty,gamerule,title,tellraw"
