name: LauncherPurpurBridge
main: ru.launcher.bridge.purpur.LauncherPurpurBridge
version: ${version}
api-version: '1.21'
author: SkiF4er
description: Launcher ServerBridge/AuthBridge integration for Purpur servers.

commands:
  nlbridge:
    description: Launcher bridge diagnostics and control command
    usage: /nlbridge <status|test|reload|diagnostics>
    permission: launcher.bridge.status
permissions:
  launcher.bridge.admin:
    description: Trigger Launcher bridge network diagnostics
    default: op
  launcher.bridge.status:
    description: Read Launcher bridge status
    default: op
  launcher.bridge.reload:
    description: Reload Launcher bridge configuration
    default: op
  launcher.bridge.diagnostics:
    description: Read Launcher bridge diagnostics
    default: op
