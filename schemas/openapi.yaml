      "ValidateJoinRequest": {
        "type": "object",
        "required": [
          "protocolVersion",
          "serverId",
          "username",
          "pluginVersion",
          "pluginSha256"
        ],
        "properties": {
          "protocolVersion": {
            "type": "integer",
            "const": 2
          },
          "serverId": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "uuid": {
            "type": "string"
          },
          "serverHash": {
            "type": "string"
          },
          "ip": {
            "type": "string"
          },
          "projectId": {
            "type": "string"
          },
          "profileId": {
            "type": "string"
          },
          "channel": {
            "type": "string"
          },
          "pluginVersion": {
            "type": "string"
          },
          "pluginSha256": {
            "type": "string",
            "pattern": "^[0-9a-fA-F]{64}$",
            "description": "Current ServerBridge JAR SHA-256; must match the accepted heartbeat measurement"
          }
        },
        "additionalProperties": false
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Authentication required, node signature invalid, or signed request outside the accepted timestamp window",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Conflict": {
        "description": "The signed node request nonce or one-time join ticket has already been consumed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "PayloadTooLarge": {
        "description": "The signed request body exceeds the ServerBridge authentication limit",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "ServiceUnavailable": {
        "description": "Required ServerBridge persistence or nonce replay protection is unavailable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "UpgradeRequired": {
        "description": "ServerBridge Protocol v2 is required",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
