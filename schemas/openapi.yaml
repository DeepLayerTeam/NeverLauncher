          "challenge": {
            "type": "string",
            "minLength": 1
          },
          "challengeExpiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "launcherVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "attestation": {
            "type": "object",
            "additionalProperties": true
          },
          "signature": {
            "type": "string",
            "minLength": 1
          }
        },
        "additionalProperties": false
      },
      "MinecraftSessionRequest": {
        "type": "object",
        "properties": {
          "clientToken": {
            "type": "string"
