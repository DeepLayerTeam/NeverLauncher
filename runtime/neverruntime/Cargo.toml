[package]
name = "neverruntime"
version = "0.10.3"
description = "NeverRuntime core library for NeverLauncher"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "neverruntime"
path = "src/lib.rs"

[[bin]]
name = "neverruntime"
path = "src/bin/neverruntime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
ed25519-dalek = "2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }
