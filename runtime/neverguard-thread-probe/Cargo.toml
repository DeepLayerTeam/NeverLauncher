[package]
name = "guard-thread-probe"
version = "0.42.12"
description = "Windows-only Guard Thread Integrity adversarial integration fixture"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "guard_thread_probe"
