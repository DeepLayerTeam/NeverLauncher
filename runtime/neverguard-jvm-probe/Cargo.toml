[package]
name = "neverguard-jvm-probe"
version = "0.18.11"
description = "Windows-only NeverGuard JVM-Aware Protection adversarial integration fixture"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "neverguard_jvm_probe"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
strip = "symbols"
lto = "thin"
codegen-units = 1
