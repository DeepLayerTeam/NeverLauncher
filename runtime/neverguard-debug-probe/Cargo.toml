[package]
name = "neverguard-debug-probe"
version = "0.20.6"
description = "NeverGuard Windows debugger-attach adversarial integration probe"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "neverguard-debug-probe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug"] }
