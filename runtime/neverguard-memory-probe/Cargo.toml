[package]
name = "neverguard-memory-probe"
version = "0.21.4"
description = "Windows-only NeverGuard Memory Integrity adversarial integration fixture"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "neverguard_memory_probe"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
strip = "symbols"
lto = "thin"
codegen-units = 1
