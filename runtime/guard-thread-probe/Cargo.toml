[package]
name = "guard-thread-probe"
version = "0.53.0"
description = "Тестовый модуль для атакующих проверок целостности потоков Guard в Windows"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "guard_thread_probe"
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
strip = "symbols"
lto = "thin"
codegen-units = 1
