<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Пример инструмента рабочего стола</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 0;
        padding: 16px;
      }
      button {
        margin: 0 0 12px;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>Пример инструмента рабочего стола</h2>
    <button id="platform">Платформа</button>
    <script>
      document.getElementById("platform").onclick = () =>
        rpc("tauri.platform", {})
          .then(
            (v) =>
              (document.getElementById("out").textContent = JSON.stringify(
                v,
                null,
                2,
              )),
          )
          .catch(
            (e) => (document.getElementById("out").textContent = String(e)),
          );
    </script>
    <pre id="out">Ожидание хоста Launcher…</pre>
    <script>
      const P = "extensions.desktop-rpc.v1";
      let seq = 0;
      const pending = new Map();
      const out = document.getElementById("out");
      addEventListener("message", (e) => {
        if (e.source !== parent || !e.data || e.data.protocol !== P) return;
        const m = e.data;
        if (m.type === "rpc.response") {
          const p = pending.get(m.id);
          if (!p) return;
          pending.delete(m.id);
          m.error ? p.reject(new Error(m.error)) : p.resolve(m.result);
        }
        if (m.type === "host.context")
          out.textContent = JSON.stringify(m.context, null, 2);
      });
      function rpc(method, params) {
        const id = "rpc-" + Date.now() + "-" + ++seq;
        parent.postMessage(
          { protocol: P, type: "rpc.request", id, method, params },
          "*",
        );
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          setTimeout(() => {
            if (pending.delete(id)) reject(new Error("Истекло время ожидания RPC"));
          }, 10000);
        });
      }
      rpc("context.get", {})
        .then((v) => (out.textContent = JSON.stringify(v, null, 2)))
        .catch((e) => (out.textContent = String(e)));
    </script>
  </body>
</html>
