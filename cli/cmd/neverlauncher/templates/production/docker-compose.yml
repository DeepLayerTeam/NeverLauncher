services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neverlauncher}
      POSTGRES_USER: ${POSTGRES_USER:-neverlauncher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - neverlauncher_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [neverlauncher]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - neverlauncher_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [neverlauncher]

  api-volume-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        mkdir -p /storage/current /backups
        find /storage -mindepth 1 -maxdepth 1 ! -name current -exec sh -c 'for p do mv "$$p" /storage/current/; done' sh {} +
        chown -R 10001:10001 /storage /backups
        chmod 0750 /storage /storage/current /backups
    volumes:
      - neverlauncher_storage:/storage
      - neverlauncher_backups:/backups
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: neverlauncher-api:${NEVERLAUNCHER_IMAGE_TAG:-0.10.7}
    restart: unless-stopped
    depends_on:
      api-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEVERLAUNCHER_ENV: production
      NEVERLAUNCHER_HTTP_ADDR: :8080
      NEVERLAUNCHER_REPOSITORY_DRIVER: postgres
      NEVERLAUNCHER_SQL_DRIVER: pgx
      NEVERLAUNCHER_DATABASE_AUTO_MIGRATE: ${NEVERLAUNCHER_DATABASE_AUTO_MIGRATE:-true}
      NEVERLAUNCHER_BOOTSTRAP_TOKEN: ${NEVERLAUNCHER_BOOTSTRAP_TOKEN:-}
      NEVERLAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY: ${NEVERLAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY:?NEVERLAUNCHER_MANIFEST_SIGNING_PRIVATE_KEY is required}
      NEVERLAUNCHER_DATABASE_DSN: postgres://${POSTGRES_USER:-neverlauncher}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neverlauncher}?sslmode=disable
      NEVERLAUNCHER_STORAGE_DRIVER: ${NEVERLAUNCHER_STORAGE_DRIVER:-local}
      NEVERLAUNCHER_STORAGE_LOCAL_PATH: /var/lib/neverlauncher/storage/current
      NEVERLAUNCHER_BACKUP_ROOT: /var/lib/neverlauncher/backups
      NEVERLAUNCHER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEVERLAUNCHER_RATE_LIMIT_ENABLED: "true"
      NEVERLAUNCHER_RATE_LIMIT_GLOBAL_PER_MINUTE: ${NEVERLAUNCHER_RATE_LIMIT_GLOBAL_PER_MINUTE:-1200}
      NEVERLAUNCHER_RATE_LIMIT_AUTH_PER_MINUTE: ${NEVERLAUNCHER_RATE_LIMIT_AUTH_PER_MINUTE:-20}
      NEVERLAUNCHER_RATE_LIMIT_FAIL_CLOSED: "true"
      NEVERLAUNCHER_TRUSTED_PROXY_CIDRS: 172.30.10.0/24
      NEVERLAUNCHER_PUBLIC_URL: ${NEVERLAUNCHER_PUBLIC_URL:?NEVERLAUNCHER_PUBLIC_URL is required}
      NEVERLAUNCHER_AUTH_TOKEN_SECRET: ${NEVERLAUNCHER_AUTH_TOKEN_SECRET:?NEVERLAUNCHER_AUTH_TOKEN_SECRET is required}
      NEVERLAUNCHER_CORS_ALLOWED_ORIGINS: ${NEVERLAUNCHER_CORS_ALLOWED_ORIGINS:?NEVERLAUNCHER_CORS_ALLOWED_ORIGINS is required}
    volumes:
      - neverlauncher_storage:/var/lib/neverlauncher/storage
      - neverlauncher_backups:/var/lib/neverlauncher/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    networks: [neverlauncher]

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    image: neverlauncher-admin:${NEVERLAUNCHER_IMAGE_TAG:-0.10.7}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [neverlauncher]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "${NEVERLAUNCHER_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - neverlauncher_storage:/var/lib/neverlauncher/storage:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [neverlauncher]

volumes:
  neverlauncher_postgres:
  neverlauncher_redis:
  neverlauncher_storage:
  neverlauncher_backups:

networks:
  neverlauncher:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
