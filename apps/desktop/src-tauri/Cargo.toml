[package]
name = "neverlauncher-desktop"
version = "0.14.9"
description = "Desktop-клиент NeverLauncher"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "rt"] }
neverruntime = { path = "../../../runtime/neverruntime" }
keyring = "4.2.0"
sha2 = "0.10"
hex = "0.4"

ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
base64 = "0.22"
zeroize = "1"

# Hardware-bound device identity. Exact version is pinned because backend
# selection/fallback semantics are security-sensitive.
hardware-enclave = { version = "=0.2.10", default-features = false, features = ["signing", "linux-tpm"] }
p256 = { version = "0.13", features = ["ecdsa"] }
