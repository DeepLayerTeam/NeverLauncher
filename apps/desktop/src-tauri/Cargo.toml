[package]
name = "neverlauncher-desktop"
version = "0.27.0"
description = "Desktop-клиент NeverLauncher"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "rt", "sync", "net", "io-util", "time", "macros"] }
neverruntime = { path = "../../../runtime/neverruntime" }
keyring = "4.2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
sha2 = "0.10"
hex = "0.4"

ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
base64 = "0.23"
zeroize = "1"

# Аппаратно привязанная идентификация устройства. Точная версия закреплена,
# поскольку выбор бэкенда и поведение резервного режима влияют на безопасность.
hardware-enclave = { version = "=0.2.10", default-features = false, features = ["signing", "encryption", "linux-tpm"] }
p256 = { version = "0.13", features = ["ecdsa"] }
