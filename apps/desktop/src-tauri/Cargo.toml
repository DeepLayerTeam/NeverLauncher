[package]
name = "launcher-desktop"
version = "1.2.1"
description = "Desktop-клиент Launcher"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"

# Tauri CLI enables this feature for production builds; direct Cargo CI builds
# must explicitly request it to embed frontendDist instead of loading devUrl.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
base64 = "0.22"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.14.1"
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "rt", "sync", "net", "io-util", "time", "macros"] }
runtime = { path = "../../../runtime/runtime" }
keyring = "4.2.0"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["parsing"] }

ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
base64 = "0.22"
zeroize = "1"

# Аппаратно привязанная идентификация устройства. Точная версия закреплена,
# поскольку выбор бэкенда и поведение резервного режима влияют на безопасность.
hardware-enclave = { version = "=0.2.10", default-features = false, features = ["signing", "encryption", "linux-tpm"] }
p256 = { version = "0.13", features = ["ecdsa"] }

# Нативный генератор TPM для Linux: защитить чтение блоков TPM проверками O_NOFOLLOW и UID.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
