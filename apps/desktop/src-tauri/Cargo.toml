[package]
name = "neverlauncher-desktop"
version = "0.11.6"
description = "Desktop-клиент NeverLauncher"
authors = ["Дмитрий \"SkiF4er\" Ефимов"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "rt"] }
neverruntime = { path = "../../../runtime/neverruntime" }
keyring = "4.2.0"
sha2 = "0.10"
hex = "0.4"
